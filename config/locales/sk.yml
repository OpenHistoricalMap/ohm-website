    welcome:
      title: Vitajte!
      introduction: Vitajte na OpenHistoricalMap, slobodnej a upravovateľnej mape
        sveta. Teraz, keď ste zaregistrovaný, môžete začať mapovať. Tu je stručný
        prehľad najdôležitejších, ktoré potrebujete vedieť.
      whats_on_the_map:
        title: Čo patrí do mapy
        on_the_map_ohm_html: |-
          OpenHistoricalMap sleduje zmeny v prírodnej a ľudskej geografii po celom svete.
          Máme milióny záznamov z %{past_and_present}, od ríš a ľadovcov až po domy a reštaurácie. Mapovať môžete akékoľvek skutočné prvky, ktoré vás zaujímajú.
        past_and_present: minulosti aj súčasnosti
        off_the_map_html: |-
          OpenHistoricalMap %{doesnt} fiktívne alternatívne dejiny,
          známe chyby zo starých máp ani údaje zo zdrojov chránených autorským právom. Pokiaľ nemáte osobitné povolenie, nekopírujte z moderných máp minulosti, ktoré nájdete online alebo v tlači.
        doesnt: neobsahuje
      basic_terms:
        title: Základné pojmy pre mapovanie
        paragraph_1: OpenHistoricalMap má svoj vlastný žargón. Tu je niekoľko kľúčových
          slov, ktoré vám prídu vhod.
        an_editor_html: '%{editor} je program alebo webová stránka, ktorú môžete použiť
          na úpravu mapy.'
        a_node_html: '%{node} je bod na mape, napríklad jedna reštaurácia alebo strom.'
        a_way_html: '%{way} je čiara alebo oblasť, ako je cesta, potok, jazero alebo
          budova.'
        a_tag_html: '%{tag} je údaj o uzle alebo ceste, napríklad názov reštaurácie
          alebo rok postavenia mosta.'
        editor: Editor
        node: Uzol
        way: Cesta
        tag: Značka
      rules:
        title: Pravidlá!
        para_1_html: OpenHistoricalMap má len niekoľko formálnych pravidiel, ale očakávame,
          že všetci účastníci budú spolupracovať s komunitou a komunikovať s ňou.
          Ak zvažujete akékoľvek iné aktivity ako ručné úpravy, prečítajte si a dodržiavajte
          pokyny na %{imports_link} a %{automated_edits_link}.
        imports: Importy (hromadné zadávanie)
        imports_url: https://wiki.openstreetmap.org/wiki/Import/Guidelines
        automated_edits: Automatické úpravy
        automated_edits_url: https://wiki.openstreetmap.org/wiki/Automated_Edits_code_of_conduct
      start_mapping: Začať mapovať
      continue_authorization: Pokračovať v autorizácii
    add_a_note:
      title: Nie je čas upravovať? Pridajte poznámku!
      para_1: Pokiaľ chcete len opraviť nejakú drobnosť a nemáte čas sa registrovať
        a učiť sa upravovať, môžete jednoducho pridať poznámku.
      para_2_html: |-
        Stačí kliknúť na %{note_icon} alebo na rovnakú ikonu na %{map_link}.
        Tým sa na mapu pridá značka, ktorú môžete presúvať ťahaním.
        Pridajte svoju správu, potom kliknite na uložiť a ostatní mapujúci to preskúmajú.
      the_map: Mapa
    communities:
      title: Komunity
      lede_text: Ľudia z celého sveta prispievajú do alebo používajú OpenHistoricalMap.
        Zatiaľ čo mnohí sa zúčastňujú ako jednotlivci, iní vytvorili komunity. Tieto
        skupiny majú rôznu veľkosť a predstavujú geografické oblasti od malých miest
        až po veľké regióny s viacerými krajinami. Môžu byť aj formálne alebo neformálne.
      local_chapters:
        title: Miestne zastúpenia
        about_text: Miestne zastúpenia sú skupiny na úrovni krajiny alebo regiónu,
          ktoré podnikli formálny krok založenia neziskových právnických osôb. Predstavujú
          mapu oblasti a mapovateľov pri rokovaní s miestnou samosprávou, firmami
          a médiami. Vytvorili tiež pridruženie k OpenStreetMap Foundation (OSMF),
          čím získali prepojenie na právny a autorský riadiaci orgán.
        list_text: 'Nasledujúce komunity sú formálne založené ako miestne zastúpenie:'
      other_groups:
        title: Iné skupiny
        other_groups_html: Nie je potrebné formálne zakladať skupinu v rovnakom rozsahu
          ako miestne zastúpenia. V skutočnosti mnohé skupiny veľmi úspešne existujú
          ako neformálne zoskupenie ľudí alebo ako komunitná skupina. Ktokoľvek ich
          môže zostaviť alebo sa k nim pripojiť. Prečítajte si viac na %{communities_wiki_link}.
        communities_wiki: Wiki stránke o komunitách
        communities_wiki_url: https://wiki.openstreetmap.org/wiki/User_group
