  site:
    about:
      used_by_html: Taiscéal an domhan in aon tréimhse ama le %{name}.
      lede_text: Is tionscadal uaillmhianach, faoi stiúir an phobail é OpenHistoricalMap
        chun athruithe ar an tíreolaíocht nádúrtha agus dhaonna ar fud an domhain…
        tríd na haoiseanna a mhapáil.
    about_section:
      scope_title: Mór agus Beag, Ansin agus Anois
      scope_html: |-
        Éiríonn agus titeann impireachtaí. Imíonn oighearshruthanna. Scaipeann teangacha agus reiligiúin ó réigiún amháin go réigiún eile.
        Éiríonn cosáin shimplí salacha ina mhórbhealaí agus ina n-iarnróid ghnóthacha. Tugann foirgnimh mheasartha bealach do spéirlingí arda.
        Agus cuimhníonn tú ar an gcuma a bhíodh ar do chomharsanacht.
        Baineann sé ar fad le OpenHistoricalMap.
      contribute_title: Is Féidir Leat Cabhrú
      contribute_1_ohm_html: |-
        I measc ár bpobal atá ag fás de rannpháirtithe deonacha tá staraithe amaitéaracha agus gairmiúla, rannpháirtithe OpenStreetMap agus Wikipedia, speisialtóirí GIS, agus gnáthdhaoine a bhfuil eolas acu ar a dtimpeallacht.
        Táimid paiseanta faoi dhoiciméadú an domhain agus faoi chabhrú le pobail an tsaoil mhóir a gcuid scéalta a insint.
        Chun tuilleadh a fhoghlaim faoin bpobal, téigh i gcomhairle le %{wiki_link}, tabhair cuairt ar %{forum_link}, léigh an %{user_diaries_link}, agus lean ár gcuntas %{mastodon_link} nó %{bluesky_link}.
      contribute_1_bluesky: Bluesky
      contribute_1_forum: ár bhfóram plé
      contribute_1_mastodon: Mastodon
      contribute_1_user_diaries: dialann úsáideoirí
      contribute_1_wiki: ár ndoiciméadacht fairsing vicí
      contribute_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap
      contribute_2_html: |-
        Is féidir leat tosú ag cur leis an léarscáil inniu trí %{create_account_link}.
        Déanaimid %{donations_link} freisin trí %{osmus_link}, eagraíocht neamhbhrabúis 501(c)(3) a bhfuil stádas díolmhaithe ó cháin aici.
        Rachaidh do shíntiús flaithiúil go díreach i dtreo OpenHistoricalMap a choinneáil ag rith go réidh do gach duine.
      contribute_2_create_account: cuntas saor in aisce a chruthú
      contribute_2_donations: glacadh le síntiúis charthanachta
      contribute_2_osmus: OpenStreetMap SAM
      open_data_title: Sonraí Oscailte
      open_data_1_1_html: |-
        Níl sa léarscáil ar ár leathanach baile ach ceann amháin de go leor bealaí chun an fhaisnéis stairiúil atá bailithe againn a fheiceáil.
        Is féidir na sonraí bunúsacha a íoslódáil %{reuse_link} nó a úsáid trí APIanna éagsúla saor in aisce atá comhoiriúnach le bogearraí foinse oscailte.
      open_data_1_1_reuse: ar fáil lena athúsáid
      open_data_1_1_reuse_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Reuse
      open_data_2_html: |-
        Tá na sonraí i réimse an phobail mura luaitear a mhalairt.
        Tá cead agat iad a úsáid chun aon chríche, gan aon srianta.
        Mar sin féin, táimid an-bhuíoch as aon chreidmheas nó lua a sholáthraíonn tú do OpenHistoricalMap.
        Le haghaidh tuilleadh sonraí agus aitheantais, féach %{copyright_license_link}.
      open_data_2_copyright_license: Cóipcheart agus Admhálacha
      legal_title: Dlíthiúil
      legal_1_html: |-
        Tá an suíomh seo agus seirbhísí gaolmhara á n-oibriú ag %{group_link} atá cleamhnaithe le OpenStreetMap U.S. thar ceann an phobail.
        Tá úsáid gach seirbhís OpenHistoricalMap faoi réir ár %{terms_of_use_link}, %{aup_link}, agus %{privacy_policy_link}.
      legal_1_group: grúpa neamhfhoirmiúil
      legal_1_group_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Governance
      legal_1_terms_of_use: Téarmaí Úsáide
      legal_1_terms_of_use_url: https://osmfoundation.org/wiki/Terms_of_Use
      legal_1_aup: Polasaithe Úsáide Inghlactha
      legal_1_aup_url: https://wiki.openstreetmap.org/wiki/Acceptable_Use_Policy
      legal_1_privacy_policy: Polasaí Príobháideachais
      legal_1_privacy_policy_url: https://osmfoundation.org/wiki/Privacy_Policy
      legal_2_html: Le do thoil, %{contact_team_link} a úsáid le haon cheisteanna
        ceadúnaithe, cóipchirt nó dlíthiúla eile.
      legal_2_contact_team: déan teagmháil leis an bhfoireann OpenHistoricalMap
      legal_3_html: |-
        Is trádmharc cláraithe é OpenHistoricalMap® (Uimhir Chláraithe SAM 90,019,364).
        Is le %{osmf_trademarks_link} OpenStreetMap agus lógó an ghloine formhéadúcháin.
      legal_3_osmf_trademarks: trádmharcanna cláraithe de chuid Fhondúireacht OpenStreetMap
      legal_3_osmf_trademarks_url: https://osmfoundation.org/wiki/Trademark_Policy
      partners_title: Comhpháirtithe
    copyright:
      title: Cóipcheart agus Admhálacha
      foreign:
        title: Maidir leis an aistriúchán seo
        html: Sa chás nach mbeidh an leathanach aistrithe seo agus an %{english_original_link}
          ag teacht le chéile, tabharfar tús áite don leathanach Béarla
        english_link: Leagan bunaidh Béarla
      native:
        title: Maidir leis an leathanach seo
        html: Tá tú ag breathnú ar an leagan Béarla den leathanach cóipchirt. Is féidir
          leat dul ar ais chuig an %{native_link} den leathanach seo nó is féidir
          leat éirí as a bheith ag léamh faoi chúrsaí cóipchirt agus %{mapping_link}.
        native_link: Leagan THIS_LANGUAGE_NAME_HERE
        mapping_link: dul i mbun léarscáilithe
      legal_babble:
        introduction_1_ohm_html: |-
          Is bailiúchán sonraí geospásúla oscailte é OpenHistoricalMap.
          Ach amháin mar a luaitear a mhalairt, tá sonraí OpenHistoricalMap tiomnaithe don fhearann ​​poiblí faoi thiomantas %{cc0_link}.
          A mhéid a bhfuil an rud a úsáideann tú sa fhearann ​​poiblí, tá cead agat é a chóipeáil, a dháileadh, a tharchur agus a oiriúnú chun aon chríche, gan aon srianta.
        introduction_1_cc0: Creative Commons CC0
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/
        introduction_2_ohm_html: |-
          Tá roinnt gnéithe léarscáile aonair faoi chóipcheart ionchorpraithe sa bhunachar sonraí OpenHistoricalMap.
          Tá na gnéithe seo ar fáil faoi cheadúnas oscailte, amhail %{cc_by_link} (CC&nbsp;BY) nó %{cc_by_sa_link} (CC&nbsp;BY-SA), mar a luaitear sna clibeanna %{license_key_link} ar eilimintí aonair.
          A mhéid a úsáideann tú aon chuid shuntasach den bhunachar sonraí atá clúdaithe ag ceadúnas “roinn go comhionann”, ba cheart duit téarmaí an cheadúnais seo a urramú i do chuid oiriúnaithe féin.
        introduction_2_cc_by: Attribution Creative Commons
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/
        introduction_2_cc_by_sa: Creative Commons Attribution-ShareAlike
        introduction_2_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/4.0/
        introduction_2_license_key_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Tags/Key/license
        introduction_3_ohm_html: Tá na stíleanna léarscáile atá le feiceáil ar ár
          leathanach baile tiomnaithe don fhearann ​​poiblí faoi thiomantas CC0. Tá
          cead agat iad a chóipeáil, a dháileadh, a tharchur agus a oiriúnú chun aon
          chríche, gan aon srianta.
        introduction_4_ohm_html: Tá ár ndoiciméadacht ceadúnaithe faoin gceadúnas
