    welcome:
      title: Fáilte!
      introduction: Fáilte go OpenHistoricalMap, léarscáil den Domhan atá saor in
        aisce agus ar féidir eagarthóireacht a dhéanamh uirthi. Anois agus tú cláraithe,
        tá tú réidh chun léarscáiliú a dhéanamh. Seo treoir tosaigh leis an mbuneolas
        a bheidh ag teastáil uait.
      whats_on_the_map:
        title: Cad atá ar an léarscáil
        on_the_map_ohm_html: |-
          Rianaíonn OpenHistoricalMap athruithe ar gheografaíocht nádúrtha agus dhaonna ar fud an domhain.
          Tá na milliúin iontrálacha againn ó %{past_and_present}, ó impireachtaí agus oighearshruthanna go tithe agus bialanna. Is féidir leat cibé gnéithe den saol fíor a bhfuil suim agat iontu a mhapáil.
        past_and_present: an am atá thart agus an lá inniu araon
        off_the_map_html: I measc na rudaí %{doesnt} bhfuil ann tá sonraí bunaithe
          ar thuairimí cosúil le rátálacha, gnéithe stairiúla nó teoiriciúla, agus
          sonraí ó fhoinsí faoi chóipcheart. Mura bhfuil cead speisialta agat, ná
          cóipeáil as léarscáileanna ar líne nó páipéir.
        doesnt: nach
      basic_terms:
        title: Téarmaí Bunúsacha a bhaineann le Léarscáiliú
        paragraph_1: Tá roinnt béarlagair dá chuid féin ag baint le OpenHistoricalMap.
          Seo roinnt den na focail is tábhachtaí a bheidh úsáideach duit.
        an_editor_html: Is clár nó suíomh gréasáin é %{editor} ar féidir leat a úsáid
          chun an léarscáil a chur in eagar.
        a_node_html: Is pointe ar an léarscáil é %{node}, cosúil le bialann aonair
          nó crann.
        a_way_html: Is líne nó limistéar é %{way}, cosúil le bóthar, sruthán, loch
          nó foirgneamh.
        a_tag_html: Is píosa sonraí faoi nód nó bealach é %{tag}, amhail ainm bialainne
          nó an bhliain a tógadh droichead.
        editor: eagarthóir
        node: nód
        way: bealach
        tag: clib
      rules:
        title: Rialacha!
        para_1_html: Is beag riail fhoirmiúil atá ag OpenHistoricalMap ach bímid ag
          súil leis go mbeidh rannpháirtithe ag comhoibriú leis an bpobal agus go
          rachaidh siad i mbun cumarsáide leis. Má tá tú ag smaoineamh ar aon ghníomhaíocht
          eile a dhéanamh seachas eagarthóireacht a dhéanamh de láimh, léigh agus
          lean na treoirlínte maidir le h%{imports_link} agus %{automated_edits_link}.
        imports: Iompórtálacha
        imports_url: https://wiki.openstreetmap.org/wiki/Import/Guidelines
        automated_edits: Eagarthóireacht Uathoibrithe
        automated_edits_url: https://wiki.openstreetmap.org/wiki/Automated_Edits_code_of_conduct
      start_mapping: Téigh i mbun Léarscáilithe
      continue_authorization: Lean ar aghaidh leis an Údarú
    add_a_note:
      title: Easpa Ama chun Eagarthóireacht a Dhéanamh? Fág Nóta!
      para_1: Mura bhfuil tú ag iarraidh ach go ndéanfaí rud beag a cheartú agus gan
        an t-am agat clárú agus foghlaim conas eagarthóireacht a dhéanamh, tá sé an-éasca
        nóta a scríobh.
      para_2_html: |-
        Cliceáil %{note_icon} nó an deilbhín céanna ar %{map_link}.
        Cuirfidh sé seo marcóir leis an léarscáil, ar féidir leat a bhogadh trí tharraingt.
        Cuir do theachtaireacht leis, ansin cliceáil sábháil, agus déanfaidh mapálaithe eile imscrúdú.
      the_map: an léarscáil
    communities:
      title: Pobail
      lede_text: |-
        Cuireann daoine ó gach cearn den domhan le OpenHistoricalMap nó úsáideann siad é.
        Cé go nglacann go leor páirt mar dhaoine aonair, tá pobail bunaithe ag daoine eile.
        Tagann na grúpaí seo i raon méideanna agus léiríonn siad geografaíochtaí ó bhailte beaga go réigiúin mhóra iltíre. Is féidir leo a bheith foirmiúil nó neamhfhoirmiúil freisin.
      local_chapters:
        title: Caibidlí Áitiúla
        about_text: Is grúpaí ar leibhéal na tíre nó an réigiúin iad Caibidlí Áitiúla
          a bhfuil an chéim fhoirmiúil glactha acu chun eintitis dhlíthiúla neamhbhrabúis
          a bhunú. Is ionann iad agus léarscáileanna agus mapálaithe na ceantair agus
          iad ag plé le rialtas áitiúil, gnólachtaí agus na meáin. Tá cleamhnas déanta
          acu freisin leis an OpenStreetMap Foundation (OSMF), rud a thugann nasc
          dóibh leis an gcomhlacht rialaithe dlí agus cóipchirt.
        list_text: 'Tá na pobail seo a leanas bunaithe go foirmiúil mar Chaibidlí
          Áitiúla:'
      other_groups:
        title: Grúpaí Eile
        other_groups_html: |-
          Níl aon ghá grúpa a bhunú go foirmiúil ar an gcaoi chéanna leis na Caibidlí Áitiúla.
          Go deimhin, maireann go leor grúpaí go han-rathúil mar chruinniú neamhfhoirmiúil daoine nó mar ghrúpa pobail. Is féidir le duine ar bith iad seo a bhunú nó páirt a ghlacadh iontu. Léigh tuilleadh ar an %{communities_wiki_link}.
        communities_wiki: Leathanach vicí na bpobal
        communities_wiki_url: https://wiki.openstreetmap.org/wiki/User_group
