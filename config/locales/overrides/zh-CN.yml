  site:
    about:
      lede_text: OpenHistoricalMap 是一个由地图制作爱好者组成的社区。这些爱好者提供并维护世界各地关于道路、小道、咖啡馆、铁路车站等各种各样的数据。
    about_section:
      contribute_1_user_diaries: 用户日记
      legal_1_aup: 可接受的使用政策
      legal_1_html: 此网站和很多其他相关服务已由%{group_link}正式代表社群运营。使用所有由OSMF运营的服务均需符合我们的%{terms_of_use_link}、%{aup_link}和我们的%{privacy_policy_link}。
      legal_1_privacy_policy: 隐私政策
      legal_1_terms_of_use: 使用条款
      legal_2_html: |-
        若您有许可证、著作权或其他法律上的问题，请%{contact_team_link}
        。
    communities:
      lede_text: |-
        来自世界各地的人们都在贡献或使用 OpenHistoricalMap。
        虽然许多人以个人身份参与，但其他人则组成了社群。
        这些团体的规模各不相同，代表了小到城镇大到大型多国地区的地域。
        它们也可以是正式的或非正式的。
    copyright:
      legal_babble:
        contributors_footer_2_html: OpenHistoricalMap 纳入数据并不意味着原始数据提供者认可 OpenHistoricalMap、提供任何担保或担负任何法律责任。
        credit_1_html: 当您使用 OpenHistoricalMap 的数据，您会被要求遵循两件事：
        credit_2_this_copyright_page: 该版权页
        credit_title_html: 如何表明作者是 OpenHistoricalMap
        infringement_1_html: OHM 的贡献者会被提醒，绝不要在没有著作权人的明确许可时添加来自任何有著作权的来源的数据(如谷歌地图或印刷地图)。
        introduction_4_creative_commons: 知识共享署名-相同方式共享 2.0
        more_2_1_api_usage_policy: API 使用政策
        more_2_1_html: 尽管 OpenHistoricalMap 是开放数据，但我们无法为第三方提供免费的地图 API。请参阅我们的 %{api_usage_policy_link}、%{tile_usage_policy_link} 和 %{nominatim_usage_policy_link}。
        more_2_1_nominatim_usage_policy: Nominatim使用政策
        more_2_1_tile_usage_policy: 瓦片使用政策
        more_title_html: 了解更多
    export:
      too_large:
        body: 该区域过大，不能导出为 OpenHistoricalMap XML 数据。请放大地图或选择一个更小的区域，或使用以下大量数据下载来源之一：
        overpass:
          description: 从 OpenHistoricalMap 数据库的一个镜像下载此限定边框
        planet:
          description: 定期更新的完整 OpenHistoricalMap 数据库副本
          title: OHM星球
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: 只需点击%{note_icon}或地图上显示的相同图标。这会在地图上添加标记，您可以拖动它来改变位置。添加您所知信息后点击保存，其他绘图者将进行核查。
        join_the_community:
          explanation_html: 如果您发现我们的地图数据有问题，例如缺少某条道路或者您的地址，最好的处理方法就是加入 OpenHistoricalMap 社区，然后您自己添加或者改进数据。
    help:
      introduction: OpenHistoricalMap 有若干资源用于学习该项目，提问和回答问题，以及讨论与制作地图相关的话题并且撰写相关文档。
      slack:
        title: IRC
      welcome:
        description: 本快速指南涵盖了快速入门 OpenHistoricalMap 的基本知识。
        title: 欢迎访问OpenHistoricalMap
      wiki:
        description: 浏览 wiki 深入了解 OHM 文档。
    index:
      js_2: OpenHistoricalMap 使用 JavaScript 让地图更平滑。
      remote_failed: 编辑失败 - 请确保已加载 JOSM 或 Merkaartor 并启用了远程控制
    potlatch:
      removed: 您的默认OpenHistoricalMap编辑器设置为Potlatch。由于Adobe Flash Player已停止支持，因此Potlatch不再可在Web浏览器中使用。
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap 有一些自己的术语。这里是一些常用的关键词。
      introduction: 欢迎访问 OpenHistoricalMap，自由且可编辑的世界地图。您已经登录，可以开始绘制地图。这里是含有您需要知道的最重要的信息的快速指南。
      rules:
        para_1_html: |-
          OpenHistoricalMap 几乎没有正式规则，但我们希望所有参与者都能与社群合作并与之沟通。如果您正在考虑
          除手动编辑之外的任何活动，请阅读并遵循
          %{imports_link} 和 %{automated_edits_link} 上的指南。
      whats_on_the_map:
        off_the_map_html: OpenHistoricalMap %{doesnt} 包含虚构的架空历史、古代地图上的已知错误以及来自受版权保护来源的数据。除非获得特别许可，否则请勿复制您在网上或印刷品中找到的现代古代地图。
        on_the_map_ohm_html: OpenHistoricalMap 追踪世界各地自然和人文地理的变化。我们拥有来自 %{past_and_present} 的数百万条来自过去和现在的记录，涵盖帝国、冰川、房屋和餐馆等各个方面。您可以绘制任何您感兴趣的现实世界特征。
