      lede_text: Mae OpenHistoricalMap yn cael ei greu gan gymuned o fapwyr sy'n cyfrannu ac yn cynnal a chadw data am ffyrdd, llwybrau, caffis, gorsafoedd trenau, a llawer mwy ledled y byd.
    about_section:
      contribute_1_user_diaries: dyddiaduron defnyddwyr
      legal_1_aup: Polisïau Defnydd Derbyniol
      legal_1_privacy_policy: Polisi Preifatrwydd
      legal_1_terms_of_use: Telerau Gwasanaeth
      legal_2_html: "%{contact_team_link} os oes gennych gwestiynau am drwydded, hawlfraint neu gwestiynau cyfreithiol eraill."
    communities:
      lede_text: Mae pobl ym mhob cwr o'r byd yn cyfrannu at neu'n ddefnyddio OpenHistoricalMap. Er bod llawer yn cymryd rhan fel unigolion, mae rhai eraill wedi creu cymunedau. Ceir grwpiau gwahanol sy'n cynrychioli trefi bach neu ardaloedd aml-wlad mawr. Gall grwpiau fod yn ffurfiol neu'n anffurfiol.
    copyright:
      legal_babble:
        contributors_footer_2_html: Nid yw cynnwys data yn OpenHistoricalMap yn awgrymu bod y darparwr data gwreiddiol yn cefnogi OpenHistoricalMap, yn darparu unrhyw warant, neu yn derbyn unrhyw atebolrwydd.
        credit_1_html: 'Pan fyddwch yn defnyddio data OpenHistoricalMap, mae rhaid i chi wneud y ddau beth canlynol:'
        credit_2_this_copyright_page: dudalen hawlfraint hon
        credit_title_html: Sut i gydnabod OpenHistoricalMap
        infringement_1_html: Hoffem atgofio cyfranwyr OHM i beidio ag ychwanegu data o unrhyw ffynonellau hawlfreintiedig (e.e. Google Maps neu fapiau print) heb ganiatâd penodol gan ddeiliaid yr hawlfraint.
        introduction_4_creative_commons: Creative Commons Attribution-ShareAlike 2.0
        more_2_1_api_usage_policy: Polisi Defnydd API
        more_2_1_html: Er mai data agored yw OpenHistoricalMap, ni allwn ddarparu API map am ddim ar gyfer defnyddwyr trydydd parti. Gweler ein %{api_usage_policy_link}, %{tile_usage_policy_link} a %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Polisi Defnydd Nominatim
        more_2_1_tile_usage_policy: Polisi Defnydd Teils
        more_title_html: Dysgu rhagor
