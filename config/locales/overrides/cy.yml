    welcome:
      basic_terms:
        paragraph_1: Mae gan OpenHistoricalMap rywfaint o dafodiaith ei hun. Dyma ychydig o eiriau allweddol a fydd yn ddefnyddiol ichi.
      introduction: Croeso i OpenHistoricalMap, map y byd rhydd ac agored. Nawr eich bod wedi cofrestru, rydych chi'n barod i ddechrau mapio. Dyma ganllaw gyflym gyda'r hyn pwysicaf i wybod cyn ichi ddechrau arni.
      rules:
        para_1_html: Nid oes llawer o reolau safonol ar OpenHistoricalMap ond rydym yn disgwyl i bawb gydweithio a chyfathrebu â'r gymuned. Os ydych chi'n bwriadu gwneud unrhyw weithgareddau yn wahanol i olygu â llaw, darllenwch a dilynwch y canllawiau ar %{imports_link} a %{automated_edits_link}.
