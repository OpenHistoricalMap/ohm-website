        description: OHM 계정으로 더 자세한 토론과 비공식 채팅방에 참여하세요.
        title: 포럼
      github:
        description: 버그를 보고하거나 새로운 기능을 요청하려면 GitHub 저장소에 문제를 제출하세요.
        title: 기능 요청 및 버그
      introduction: 오픈히스토리컬맵에는 프로젝트에 대해 배우고, 질문하고 답변하고, 매핑 주제에 대해 공동으로 토론하고 문서화할 수 있는 수단이 많이 있습니다.
      mailing_list:
        description: 소소한 메일링 리스트를 구독해 보세요.
        title: 메일링 리스트
      slack:
        description: '오픈스트리트맵 US 슬랙 워크스페이스에 스스로를 초대해 #openhistoricalmap 채널에 참여하세요.'
        title: IRC
      welcome:
        description: 오픈히스토리컬맵의 기본 사항을 다루는 빠른 길라잡이와 함께 시작하세요.
        title: 오픈히스토리컬맵에 오신 것을 환영합니다
      welcomemat:
        description: 오픈히스토리컬맵 관련 계획을 세우고 계신 기관이신가요? 환영판에서 알아야 할 것을 찾아보세요.
      wiki:
        description: 커뮤니티에서 관리하는 OHM 사용 설명서와 프로젝트 참여 가이드라인입니다.
        title: 위키
    index:
      js_2: 오픈히스토리컬맵은 매끄러운 지도를 위해 자바스크립트를 사용합니다.
      license:
        copyright: 오픈히스토리컬맵은 별도 명시된 경우를 제외하고 퍼블릭 도메인에 속합니다.
      remote_failed: 편집을 실패했습니다 - JOSM이나 Merkaartor를 불러왔고 원격 제어 설정이 활성화되어 있는지 확인하세요
    potlatch:
      removed: 당신의 오픈히스토리컬맵 기본 편집기가 Potlatch로 설정되어 있습니다. 어도비 플래시의 지원이 중단된 관계로 Potlatch는 더 이상 웹 브라우저에서 사용할 수 없습니다.
    welcome:
      basic_terms:
        paragraph_1: 오픈히스토리컬맵에는 고유한 용어가 몇 가지 있습니다. 다음은 유용한 몇 가지 핵심 개념입니다.
      introduction: 누구나 편집 가능한 세계 지도, 오픈히스토리컬맵에 오신 것을 환영합니다. 이제 가입을 하셨으니 지도 제작에 나설 차례가 되었습니다. 다음은 여러분이 알아야 할 주요 사항을 담은 '빠른 길라잡이'입니다.
      rules:
        para_1_html: 오픈히스토리컬맵에는 공식적인 규칙이 거의 없지만, 모든 참가자가 공동체와 협력하고 소통하기를 기대합니다. 수동 편집 외의 다른 수단을 찾고 있다면 %{imports_link}와 %{automated_edits_link}의 지침을 읽고 준수해 주세요.
      whats_on_the_map:
        off_the_map_html: 오픈히스토리컬맵은 허구의 대체 역사, 옛 지도의 큰 오류, 저작권이 있는 출처의 데이터를 %{doesnt}. 별도 허가를 받지 않은 한, 온라인이나 인쇄물에서 찾은 최신 역사 지도를 복사하지 마십시오.
        on_the_map_ohm_html: 오픈히스토리컬맵은 전세계의 자연, 인문지리의 변화를 추적합니다. 제국과 빙하부터 집과 식당에 이르기까지 %{past_and_present}의 수백만 개에 달하는 항목이 있습니다. 여러분이 관심을 둔 현실의 지형지물이라면 무엇이든 지도에 나타낼 수 있습니다.
        past_and_present: 과거와 현재 모두
