        contributors_2_ohm_html: 홈페이지에 소개되어 있는 지도 스타일에는 오픈히스토리컬맵 데이터와 다음 소스가 포함되어 있습니다.
        contributors_anr_communes_campop: 케임브리지 인구 사회 구조사 연구진
        contributors_anr_communes_html: 이 데이터는 %{anr_communes_link} 프로젝트와 %{campop_link}의 협력으로 생성되었습니다.
        contributors_footer_2_html: |-
          오픈히스토리컬맵에 포함된 데이터는 해당 데이터 제공자가
          오픈히스토리컬맵을 보증하거나, 보증을 제공하거나,
          책임을 진다는 것을 의미하지 않습니다.
        contributors_globcover: GlobCover
        contributors_globcover_html: "%{globcover_link}의 토지피복도, © ESA 2010 and UCLouvain, 출처를 명시하는 조건으로 교육 및/또는 과학적 목적으로 재사용 가능합니다."
        contributors_gmted: 전 세계 다중 해상도 지형 고도 데이터 2010
        contributors_gmted_html: '지형 고도 데이터는 Danielson, J.J., and Gesch, D.B., 2011, %{gmted_link} (GMTED2010): U.S. Geological Survey Open-File Report 2011–1073, 26 p.에서 가져왔습니다. 공개 도메인입니다.'
        contributors_intro_html: 오픈히스토리컬맵은 수천 명의 개인과 단체의 협력으로 만들어졌으며, 방대한 학술 연구, 언론 보도, 문헌 자료를 활용하였습니다. 대표적인 자료 출처와 기여자는 다음과 같습니다.
        contributors_more_sources_html: "%{sources_link}는 오픈스트리트맵 위키에서 확인할 수 있습니다."
        contributors_more_sources_page: 추가 출처 및 기여자
        contributors_more_sources_page_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Sources
        contributors_natural_earth: 내추럴 어스
        contributors_natural_earth_html: "%{natural_earth_link} 데이터집합은 퍼블릭 도메인입니다."
        contributors_newberry: 뉴베리 라이브러리
        contributors_newberry_ahcb: 역사적인 카운티 경계 지도
        contributors_newberry_ahcb_html: 이 데이터는 %{newberry_link}에 있는 윌리엄 M. 스콜 미국사 문화센터의 프로젝트인 %{ahcb_link}에서 가져온 것으로, 제한 없이 재사용할 수 있습니다.
        contributors_osm: 오픈스트리트맵 기여자
        contributors_osm_cc_by_sa: 크리에이티브 커먼즈 저작자표시-동일조건변경허락 2.0
        contributors_osm_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/2.0/
        contributors_osm_html: 해안선, 수역, 하천 관련 데이터 © %{osm_link}, %{cc_by_sa_link}.
        contributors_title_html: 감사의 말씀
        credit_1_html: 공개된 콘텐츠의 사용에 관해 저작권법에서 제한이나 조건을 두지 않지만, 저희 지도나 데이터를 재사용, 수정 또는 기타 방식으로 사용하실 때 오픈히스토리컬맵 (OpenHistoricalMap)을 출처로 명시해 주시면 대단히 감사하겠습니다.
        credit_2_home: 저희 홈페이지
        credit_2_ohm_html: 여러분께서는 어떤 방식이든 적절하게 저작자 표기를 하실 수 있습니다. 가령, 디지털 지도에서는 모서리의 작은 글씨로 OpenHistoricalMap (오픈히스토리컬맵)이라 써두고 %{this_copyright_page_link} 또는 %{home_link}로 링크를 달 수 있습니다.
        credit_2_this_copyright_page: 이 저작권 페이지
        credit_3_credit_html: 지도 데이터는 %{project_link} 프로젝트에서 제공받았으며, 별도 명시되지 않는 한 퍼블릭 도메인입니다.
        credit_3_ohm_html: 아니면 다른 출처를 밝혀두는 별도의 크레딧 페이지에 다음과 같은 방식으로 출처 표기를 더 명확히 할 수도 있습니다.
        credit_4_ohm_html: 인쇄형 지도에서는 범례에 감사의 글을 넣을 수 있습니다. 책에서는 각주, 참고문헌 또는 판권 정보에 OpenHistoricalMap (오픈히스토리컬맵)을 활용했다는 사실을 명시할 수 있습니다. 학술 논문에서는 사용한 자료에 따라 다양한 방식으로 인용할 수 있습니다.
        credit_title_html: 오픈히스토리컬맵이라는 출처를 밝히는 방법
        infringement_1_html: |-
          OHM 기여자는 저작권 소유자의 명시적 허가 없이
          저작권이 있는 자료(예를 들어 Google 지도 또는 인쇄된 지도)에서
          데이터를 반입하지 않도록 주의하여야 합니다.
        infringement_2_ohm_contact_team: 제목에 "TAKEDOWN REQUEST"라고 적어서 오픈히스토리컬맵 팀에게 문의
        infringement_2_ohm_html: 오픈히스토리컬맵의 데이터베이스나 본 사이트에 저작권으로 보호되는 자료가 부적절하게 추가되었다고 생각되면 %{contact_team_link}로 연락해 주세요.
        introduction_1_cc0: 크리에이티브 커먼즈 CC0
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/
        introduction_1_ohm_html: 오픈히스토리컬맵은 공개된 지리 공간 데이터 모음입니다. 별도 명시된 경우를 제외하고, 오픈히스토리컬맵의 데이터는 %{cc0_link} 라이선스에 따라 퍼블릭 도메인에 제공됩니다. 사용자가 사용하는 데이터가 퍼블릭 도메인에 속하는 경우, 어떠한 제한 없이 어떤 목적으로든 복사, 배포, 전송 및 수정할 수 있습니다.
        introduction_2_cc_by: 크리에이티브 커먼즈 저작자표시
        introduction_2_cc_by_sa: 크리에이티브 커먼즈 저작자표시-동일조건변경허락
        introduction_2_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/4.0/
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/
        introduction_2_license_key_url: |-
          https
          ://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Tags/Key/license
        introduction_2_ohm_html: 오픈히스토리컬맵의 데이터베이스에는 저작권이 있는 일부 개별 지도 요소가 포함되어 있습니다. 이러한 요소는 개별 요소의 %{license_key_link} 태그에 명시된 %{cc_by_link}(CC BY) 또는 %{cc_by_sa_link}(CC BY-SA)와 같은 오픈 라이선스에 따라 사용할 수 있습니다. '동일 조건 공유' 라이선스가 적용되는 데이터베이스의 상당 부분을 사용하는 경우, 자체 수정 시 해당 라이선스의 조건을 준수해야 합니다.
        introduction_3_ohm_html: 저희 홈페이지에 소개된 지도 스타일은 CC0 라이선스 하에 누구나 자유롭게 사용할 수 있습니다. 어떠한 제한 없이 복사, 배포, 전송 및 수정하여 사용하실 수 있습니다.
        introduction_4_creative_commons: 크리에이티브 커먼즈 저작자표시-동일조건변경허락 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/
        introduction_4_ohm_html: 본 문서는 %{creative_commons_link} 라이선스 (CC BY-SA 2.0)에 따라 제공됩니다.
        more_1_ohm_html: "%{wiki_link}에서 저희 데이터를 사용할 때 고려해야 할 법적 사항과 출처 표기 방법에 대해 자세히 알아보세요."
        more_1_wiki: 오픈스트리트맵 위키
        more_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/License
        more_2_1_api_usage_policy: API 사용 정책
        more_2_1_api_usage_policy_url: https://operations.osmfoundation.org/policies/api/
        more_2_1_html: |-
          OpenHistoricalMap은 공개 데이터이지만 제3자에게 지도 API를 무료로 제공할 수 없습니다.
          %{api_usage_policy_link}, %{tile_usage_policy_link}, %{nominatim_usage_policy_link}를 참조하세요.
        more_2_1_nominatim_usage_policy: 지명 사용 정책
        more_2_1_nominatim_usage_policy_url: https://operations.osmfoundation.org/policies/nominatim/
