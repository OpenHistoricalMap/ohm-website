        body: 이 지역은 OpenHistoricalMap XML 데이터로 내보내기엔 너무 넓습니다. 화면을 확대하거나, 더 좁은 지역을 선택해 주세요. 대량 다운로드는 아래 나열된 소스들을 사용해 주세요.
        other:
          url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Reuse
        overpass:
