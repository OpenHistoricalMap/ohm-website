          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            %{note_icon}나 지도에 표시되는 같은 아이콘을 클릭하세요.
            끌어서 움직일 수 있는, 지도에 표시를 추가할 것입니다.
            메시지를 추가하고 나서, 저장을 클릭하면, 다른 매퍼가 조사할 것입니다.
        join_the_community:
          explanation_html: 우리의 지도 데이터에, 예를 들어 도로가 없거나 여러분의 주소에 문제가 있음을 보았다면, 진행하는 가장 좋은 방법은 OpenHistoricalMap 공동체에 가입하고 스스로 데이터를 추가하거나 고치는 것입니다.
      other_concerns:
        concerns_ohm_html: |-
          저희 데이터의 활용이나 콘텐츠와 관련해 우려 사항이 있는 경우, 자세한 법적 정보는 저희
          %{contact_link}를 참조하거나 %{copyright_link}에 문의하세요.
        contact: 문의하기
    help:
      discord:
        description: '오픈스트리트맵 월드 디스코드 서버에 가입하고 #openhistoricalmap 채널에서 도움을 받으세요.'
