        more_title_html: 자세히 찾기
        trademarks_1_ohm_contact_team: 오픈히스토리컬맵 팀에 문의
        trademarks_1_ohm_html: 오픈히스토리컬맵 (OpenHistoricalMap)의 명칭 사용과 관련하여 질문이 있으시면 %{contact_team_link}로 문의해 주세요.
      title: 저작권과 저작자 표시
