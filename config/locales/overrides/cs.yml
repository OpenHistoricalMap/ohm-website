  site:
    about:
      lede_text: OpenHistoricalMap tvoří komunita uživatelů, kteří přidávají a udržují data o silnicích, cestách, kavárnách, železničních stanicích a mnohém dalším po celém světě.
    about_section:
      contribute_1_user_diaries: deníky uživatelů
      legal_1_aup: Pravidlům přijatelného užití
      legal_1_html: Tento web a mnoho dalších souvisejících služeb za komunitu oficiálně provozuje %{group_link}. Použití všech služeb provozovaných OSMF podléhá našim %{terms_of_use_link}, %{aup_link} a našim %{privacy_policy_link}.
      legal_1_privacy_policy: Pravidlům ochrany osobních údajů
      legal_1_terms_of_use: Podmínkám užití
      legal_2_html: Pokud máte dotazy týkající se licencování, autorských práv či jiných právních záležitostí, %{contact_team_link}.
    communities:
      lede_text: |-
        Do OpenHistoricalMap přispívají a OpenHistoricalMap používají lidé z celého světa. Zatímco mnoho jich přispívá jako jednotlivci, někteří utvořili komunity. Tyto skupiny existují v mnoha velikostech a zastupují území od malých městeček po velké regiony zahrnující několik zemí.
        Mohou být formální i neformální.
    copyright:
      legal_babble:
        contributors_footer_2_html: Zahrnutí dat do OpenHistoricalMap neznamená, že původní poskytovatel dat podporuje OpenHistoricalMap, nabízí jakoukoli záruku nebo přijímá jakoukoli zodpovědnost.
        credit_1_html: 'Pokud používáte data OpenHistoricalMap, máte povinnost učinit následující dvě věci:'
        credit_2_this_copyright_page: tuto stránku k autorským právům
        credit_title_html: Jak uvádět OpenHistoricalMap
        infringement_1_html: Přispěvatelům OHM připomínáme, že by nikdy neměli přidávat data ze zdrojů chráněných autorským právem (např. Google Maps či tištěné mapy) bez výslovného svolení držitelů práv.
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/deed.cs
        introduction_4_creative_commons: Creative Commons Uveďte autora-Zachovejte licenci 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/deed.cs
        more_2_1_api_usage_policy: Pravidla použití API
        more_2_1_html: |-
          Přestože jsou OpenHistoricalMap otevřená data, nemůžeme třetím stranám poskytovat
          bezplatné mapové API. Vizte naše %{api_usage_policy_link}, %{tile_usage_policy_link} a %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Pravidla použití Nominatimu
        more_2_1_tile_usage_policy: Pravidla použití dlaždic
        more_title_html: Další informace
    export:
      too_large:
        body: 'Tato oblast je pro export do XML formátu OpenHistoricalMap příliš velká. Přejděte na větší měřítko, zvolte menší oblast, nebo použijte jeden z následujících zdrojů pro stahování velkého množství dat:'
        overpass:
          description: Stažení této oblasti z databázového zrcadla OpenHistoricalMap
        planet:
          description: Pravidelně aktualizované kopie kompletní databáze OpenHistoricalMap
          title: Planeta OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Stačí kliknout na %{note_icon} nebo na stejnou ikonku na zobrazené mapě.
            Tím do mapy přidáte značku, kterou můžete přesunout tažením myší. Přidejte svou zprávu a klikněte na uložit a ostatní uživatelé se na to podívají.
        join_the_community:
          explanation_html: Pokud jste si všimli nějakého nedostatku našich mapových dat, např. chybějící silnice nebo vaše adresa, nejlepším řešením je připojit se ke komunitě OpenHistoricalMap a přidat nebo opravit data vlastnoručně.
    help:
      introduction: OpenHistoricalMap nabízí několik zdrojů pro informace o projektu, otázky a odpovědi a kolaborativní diskuse a dokumentace mapových témat.
      slack:
        title: IRC
      welcome:
        description: Začněte tímto rychlým průvodcem zahrnujícím základy OpenHistoricalMap.
        title: Vítejte v OpenHistoricalMap
      wiki:
        description: Podrobnou dokumentaci OHM najdete na wiki.
    index:
      js_2: OpenHistoricalMap používá pro svou interaktivní mapu JavaScript.
      remote_failed: Editace se nezdařila – ujistěte se, že JOSM nebo Merkaartor běží a je zapnuto dálkové ovládání
    potlatch:
      removed: Jako preferovaný editor pro OpenHistoricalMap máte nastaven Potlatch. Protože byl ale Adobe Flash Player ukončen, Potlatch již pro použití ve webovém prohlížeči není dostupný.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap používá trochu vlastního žargonu. Tady je několik klíčových slov, která se vám budou hodit.
      introduction: Vítejte v OpenHistoricalMap, svobodné a editovatelné mapě světa. Teď, když jste se zaregistrovali, můžete začít mapovat. Tady je rychlý přehled nejdůležitějších věcí, které budete potřebovat znát.
      rules:
        para_1_html: |-
          OpenHistoricalMap má jen málo formálních pravidel, ale očekáváme, že všichni účastníci budou spolupracovat
          s komunitou a komunikovat s ní. Pokud zvažujete jakékoli jiné činnosti než ruční úpravy, přečtěte si a dodržujte pokyny pro
          %{imports_link} a %{automated_edits_link}.
