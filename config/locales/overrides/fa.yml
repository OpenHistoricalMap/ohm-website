  site:
    about:
      lede_text: OpenHistoricalMap را جامعه‌ای از نقشه‌کشان ساخته‌اند که در ایجاد
        و نگهداری داده‌های مربوط به جاده‌ها، مسیرهای تریل، کافه‌ها، ایستگاه‌های راه‌آهن
        و بسیاری موارد دیگر در سرتاسر جهان نقش ایفا می‌کنند.
      used_by_html: '%{name} برای هزاران وبگاه، کارهٔ تلفن همراه و افزارهٔ سخت‌افزاری
        دادهٔ نقشه فراهم می‌کند.'
    about_section:
      contribute_1_user_diaries: روزنوشت‌های کاربران
      legal_1_privacy_policy: سیاست محرمانگی
      legal_1_terms_of_use: شرایط استفاده
    add_a_note:
      para_1: |-
        اگر فقط می‌خواهید چیز کوچکی را درست کنید و وقت  کافی برای نام‌نویسی و یادگیری ویرایش ندارید، خیلی راحت
        یک یادداشت بنویسید.
    any_questions:
      ohm_paragraph_1_html: در پروژهٔ OpenHistoricalMap برای آموختن، پرسیدن و پاسخ‌دادنِ
        سوالات، بحث و همفکری دربارهٔ موضوعات نقشه‌کشی و ثبت آن‌ها منابع زیادی وجود
        دارد.  %{help_link}.
    copyright:
      legal_babble:
        attribution_example:
          title: مثال انتساب
        contributors_footer_2_html: ورود داده در OpenHistoricalMap به این معنی نیست
          که فراهم‌کنندهٔ اصلی داده OpenHistoricalMap را تأیید می‌کند، ضمانتی می‌دهد،
          یا مسئولیتی می‌پذیرد.
        contributors_intro_html: 'مشارکت‌کنندگانی که با ما همکاری می‌کنند هزاران شخص
          هستند. داده‌هایی با پروانهٔ آزاد از سازمان‌های نقشه‌برداری ملی و دیگر منابع
          را نیز در کنار آن‌ها داریم، از جمله:'
        contributors_title_html: همکاران ما
        credit_1_html: 'جایی که دارید از داده‌های اوپن‌استریت‌مپ استفاده می‌کنید،
          لازم است دو کار زیر را انجام دهید:'
        credit_title_html: چگونه از OpenHistoricalMap یاد کنیم
        infringement_1_html: به مشارکت‌کنندگان OHM یادآوری شده است که هرگز از منابع
          دارای حق نشر داده اضافه نکنند (مثلاً نقشه‌های گوگل یا نقشه‌های چاپی)، مگر
          با اجازهٔ صریح و آشکار از صاحبان حق نشر.
        more_title_html: کسب اطلاعات بیشتر
      title: حق‌نشر و پروانه
    export:
      too_large:
        body: این محدوده برای برون‌ریزی در قالب OpenHistoricalMap XML خیلی بزرگ است.
          لطفاً بزرگ‌نمایی کنید یا منطقهٔ کوچک‌تری را انتخاب کنید، یا برای دریافت
          داده‌های انبوه یکی از منابع فهرست زیر را استفاده کنید.
        overpass:
          description: بارگیری این محدوده از یکی از آینه‌های پایگاه دادهٔ OpenHistoricalMap
        planet:
          description: رونوشت‌های پایگاه دادهٔ کامل OpenHistoricalMap که به‌طور منظم
            روزآمد می‌شوند
          title: سیارهٔ OHM
    fixthemap:
      how_to_help:
        join_the_community:
          explanation_html: اگر در دادهٔ نقشه مشکلی یافتید، مثلاً جاده‌ای یا نشانی
            شما در نقشه نیامده، بهترین راه برای حل مشکل این است که به جامعهٔ اُپن‌استریت‌مپ
            بپیوندید و خودتان داده را اضافه یا اصلاح کنید.
    help:
      forum:
        title: انجمن
      introduction: در پروژهٔ OpenHistoricalMap برای آموختن، پرسیدن و پاسخ‌دادنِ سوالات،
        بحث و همفکری دربارهٔ موضوعات نقشه‌کشی و ثبت آن‌ها منابع زیادی وجود دارد.
      slack:
        title: IRC
      welcome:
        description: از این راهنمای ساده و سریع که دربرگیرندهٔ مبانی OpenHistoricalMap
          است آغاز کنید.
        title: به اوپن‌استریت‌مپ خوش آمدید
      welcomemat:
        title: برای سازمان‌ها
      wiki:
        description: مستندات پرجزئیات را در ویکی OHM مرور کنید.
        title: ویکی
    index:
      js_2: OpenHistoricalMap برای نقشهٔ لغزان از جاوااسکریپت استفاده می‌کند.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap اصطلاحات ویژهٔ خودش را دارد. در اینجا چند کلیدواژهٔ
          مفید ذکر شده است.
      introduction: به OpenHistoricalMap، نقشهٔ آزاد و قابل ویرایش جهان، خوش آمدید.
        اکنون که نام‌نویسی‌تان کامل شده، می‌توانید یکراست نقشه‌کشی را آغاز کنید. این
        راهنمای سریع دربارهٔ مهم‌ترین چیزهایی است که به دانستنشان نیاز دارید.
      rules:
        para_1_html: قوانین رسمی OpenHistoricalMap تنها چند مورد است، اما از همهٔ
          مشارکت‌کنندگان انتظار داریم با جامعه همکاری کنند و ارتباط داشته باشند. اگر
          می‌خواهید هرگونه فعالیتی به غیر از ویرایش دستی انجام دهید، لطفاً رهنمودهای
          مربوط به %{imports_link} و %{automated_edits_link} را بخوانید و از آن‌ها
          پیروی کنید.
      whats_on_the_map:
        off_the_map_html: چیزهایی که در نقشه %{doesnt} عبارت‌اند از دادهٔ سلیقه‌ای
          مانند رتبه‌بندی‌ها، عارضه‌های تاریخی یا فرضی و داده‌ای که از منابع دارای
          حق‌نشر به‌دست می‌آوریم. از نقشه‌های آنلاین یا کاغذی کپی نکنید، مگر اینکه
          اجازهٔ ویژه برای این کار داشته باشید.
