      legal_babble:
        contributors_footer_2_html: ورود داده در OpenHistoricalMap به این معنی نیست که فراهم‌کنندهٔ اصلی داده OpenHistoricalMap را تأیید می‌کند، ضمانتی می‌دهد، یا مسئولیتی می‌پذیرد.
        credit_title_html: چگونه از OpenHistoricalMap یاد کنیم
        infringement_1_html: به مشارکت‌کنندگان OHM یادآوری شده است که هرگز از منابع دارای حق نشر داده اضافه نکنند (مثلاً نقشه‌های گوگل یا نقشه‌های چاپی)، مگر با اجازهٔ صریح و آشکار از صاحبان حق نشر.
        more_title_html: کسب اطلاعات بیشتر
      title: حق‌نشر و پروانه
    export:
      too_large:
        body: این محدوده برای برون‌ریزی در قالب OpenHistoricalMap XML خیلی بزرگ است. لطفاً بزرگ‌نمایی کنید یا منطقهٔ کوچک‌تری را انتخاب کنید، یا برای دریافت داده‌های انبوه یکی از منابع فهرست زیر را استفاده کنید.
        overpass:
          description: بارگیری این محدوده از یکی از آینه‌های پایگاه دادهٔ OpenHistoricalMap
        planet:
          description: رونوشت‌های پایگاه دادهٔ کامل OpenHistoricalMap که به‌طور منظم روزآمد می‌شوند
          title: سیارهٔ OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            کافی است روی %{note_icon} یا آیکون مشابه در صفحهٔ نقشه کلیک کنید.
            با این کار یک نشانگر به نقشه اضافه خواهد شد که می‌توانید با کشیدن جابه‌جایش کنید. پیام خود را بنویسید و سپس روی ذخیره کلیک کنید. سایر نقشه‌کش‌ها آن را بررسی خواهند‌ کرد.
    help:
      forum:
        title: انجمن
      introduction: در پروژهٔ OpenHistoricalMap برای آموختن، پرسیدن و پاسخ‌دادنِ سوالات، بحث و همفکری دربارهٔ موضوعات نقشه‌کشی و ثبت آن‌ها منابع زیادی وجود دارد.
      slack:
        title: IRC
      welcome:
        description: از این راهنمای ساده و سریع که دربرگیرندهٔ مبانی OpenHistoricalMap است آغاز کنید.
      wiki:
        description: مستندات پرجزئیات را در ویکی OHM مرور کنید.
        title: ویکی
    index:
      js_2: OpenHistoricalMap برای نقشهٔ لغزان از جاوااسکریپت استفاده می‌کند.
      remote_failed: ویرایش انجام نشد - مطمئن شوید JOSM یا Merkaartor باز و گزینهٔ کنترل از دور فعال باشد
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap اصطلاحات ویژهٔ خودش را دارد. در اینجا چند کلیدواژهٔ مفید ذکر شده است.
      introduction: به OpenHistoricalMap، نقشهٔ آزاد و قابل ویرایش جهان، خوش آمدید. اکنون که نام‌نویسی‌تان کامل شده، می‌توانید یکراست نقشه‌کشی را آغاز کنید. این راهنمای سریع دربارهٔ مهم‌ترین چیزهایی است که به دانستنشان نیاز دارید.
      rules:
        para_1_html: قوانین رسمی OpenHistoricalMap تنها چند مورد است، اما از همهٔ مشارکت‌کنندگان انتظار داریم با جامعه همکاری کنند و ارتباط داشته باشند. اگر می‌خواهید هرگونه فعالیتی به غیر از ویرایش دستی انجام دهید، لطفاً رهنمودهای مربوط به %{imports_link} و %{automated_edits_link} را بخوانید و از آن‌ها پیروی کنید.
      whats_on_the_map:
        off_the_map_html: چیزهایی که در نقشه %{doesnt} عبارت‌اند از دادهٔ سلیقه‌ای مانند رتبه‌بندی‌ها، عارضه‌های تاریخی یا فرضی و داده‌ای که از منابع دارای حق‌نشر به‌دست می‌آوریم. از نقشه‌های آنلاین یا کاغذی کپی نکنید، مگر اینکه اجازهٔ ویژه برای این کار داشته باشید.
