    welcome:
      basic_terms:
        paragraph_1: למיזם OpenHistoricalMap יש עגה משלו. הינה כמה מילות מפתח שיהיו שימושיות.
      introduction: ברוך בואך ל־OpenHistoricalMap, מפה חופשית שאפשר לערוך של ההיסטוריה של העולם. עכשיו שנרשמת, הכול מוכן ואפשר להתחיל לצייר מפות. הינה מדריך קצת שייתן לך את הדברים החשובים שכדאי לך לדעת.
      rules:
        para_1_html: |-
          ל־OpenHistoricalMap יש מעט כללים רשמיים אך אנו מצפים לכך שכל המשתתפים יעבדו
          ויתקשרו עם הקהילה. אם שקלת
          פעילויות כלשהן חוץ מעריכה ידנית, נא לקרוא ולעקוב אחר הקווים המנחים בדפים
          %{imports_link} ו%{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: |-
          מה ש%{doesnt} ב־OpenHistoricalMap הוא היסטוריות חלופיות בדיוניות,
          שגיאות ידועות ממפות עתיקות ונתונים ממקורות שמגובלים בזכויות יוצרים. אלא אם יש לך אישור מיוחד,
          אין להעתיק ממפות מודרניות של העבר שמצאת באינטרנט או בדפוס.
