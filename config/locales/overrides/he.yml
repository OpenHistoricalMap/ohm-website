  site:
    about:
      lede_text: OpenHistoricalMap הוא מיזם שאפתני, בהובלת הקהילה, למיפוי שינויים
        בגאוגרפיה הטבעית והאנושית ברחבי העולם... לאורך הדורות.
      used_by_html: גלו את העולם בכל תקופה היסטורית באמצעות %{name}.
    about_section:
      contribute_1_bluesky: בלוסקיי
      contribute_1_forum: פורום הדיונים שלנו
      contribute_1_mastodon: מסטודון
      contribute_1_ohm_html: |-
        קהילת התורמים המתנדבים שלנו הולכת וגדלה, והיא כוללת היסטוריונים חובבים ומקצועיים, תורמים ל־OpenStreetMap ולוויקיפדיה, מומחים למערכות מידע גאוגרפיות (GIS), ואנשים מן השורה שמכירים היטב את סביבתם.

        אנחנו נלהבים לתעד את העולם ולסייע לקהילות בשטח לספר את סיפוריהן.

        למידע נוסף על הקהילה, אפשר לעיין ב־%{wiki_link}, לבקר ב־%{forum_link}, לקרוא את %{user_diaries_link} ולעקוב אחר החשבון שלנו ב־%{mastodon_link} או ב־%{bluesky_link}.
      contribute_1_user_diaries: יומני משתמשים
      contribute_1_wiki: התיעוד המקיף שלנו בוויקי
      contribute_2_create_account: יצירת חשבון בחינם
      contribute_2_donations: מקבלים תרומות
      contribute_2_html: |-
        אפשר להתחיל לתרום למפה כבר היום באמצעות %{create_account_link}.

        אנחנו גם %{donations_link} באמצעות %{osmus_link}, ארגון ללא מטרות רווח בעל מעמד של פטור ממס לפי סעיף 501(c)(3).

        התרומה הנדיבה שלך תסייע ישירות להבטיח ש־OpenHistoricalMap ימשיך לפעול בצורה תקינה לטובת כולם.
      contribute_title: איך אפשר לעזור?
      legal_1_aup: מדיניות שימוש מקובל
      legal_1_group: קבוצה בלתי פורמלית
      legal_1_html: האתר הזה ושירותים רבים אחרים מופעלים על־ידי %{group_link}&rlm;
        בשם הקהילה. השימוש בכל השירותים שמפעילה OSMF כפוף ל%{terms_of_use_link}, ל%{aup_link},
        ול%{privacy_policy_link}
      legal_1_privacy_policy: מדיניות פרטיות
      legal_1_terms_of_use: תנאי שימוש
      legal_2_contact_team: לפנות לצוות OpenHistoricalMap
      legal_2_html: |-
        נא %{contact_team_link}
        אם יש לך שאלות על רישוי, זכויות יוצרים או נושאים משפטיים אחרים.
      legal_3_html: |-
        OpenHistoricalMap® הוא סימן מסחר רשום (מספר רישום בארצות הברית: 90,019,364).
        OpenStreetMap והלוגו בצורת זכוכית מגדלת הם %{osmf_trademarks_link}.
      legal_3_osmf_trademarks: סימני מסחר רשומים של קרן OpenStreetMap
      open_data_1_1_html: |-
        המפה שבדף הבית שלנו היא רק אחת מהדרכים הרבות לחקור את המידע ההיסטורי שאספנו.
        הנתונים שעליהם מבוססת המפה %{reuse_link}: אפשר להוריד אותם או לגשת אליהם באמצעות מגוון ממשקי API חינמיים התואמים לתוכנות קוד פתוח.
      open_data_1_1_reuse: זמינים לשימוש חוזר
      open_data_2_copyright_license: זכויות יוצרים והוקרה
    add_a_note:
      para_1: אם רק רצית לתקן משהו קטן ואין לך זמן להירשם וללמוד איך לערוך, קל להוסיף
        הערה.
    any_questions:
      ohm_paragraph_1_html: |-
        ל־OpenHistoricalMap יש כמה משאבים ללימוד על הפרויקט, לשאלות ותשובות, ולדיון ותיעוד משותפים של נושאי מיפוי.
        %{help_link}.
    copyright:
      legal_babble:
        contributors_footer_2_html: |-
          הכללה של נתונים ב־OpenHistoricalMap אינה אומרת שהספק המקורי
          של הנתונים תומך ב־OpenHistoricalMap, לוקח על עצמו אחריות כלשהי, או
          מקבל חבות כלשהי.
        credit_1_html: אף שחוק זכויות היוצרים אינו מגביל או מציב תנאים כלשהם לשימוש
          שלך בתוכן שנמצא בנחלת הכלל, אנו מעריכים מאוד כל קרדיט שיש לך אפשרות לתת
          ל־OpenHistoricalMap בעת שימוש חוזר, התאמה או שימוש אחר במפות או בנתונים
          שלנו.
        credit_2_this_copyright_page: דף זכויות היוצרים הזה
        credit_title_html: איך לתת ייחוס ל־OpenHistoricalMap
        infringement_1_html: |-
          אנו מזכירים לתורמים ל־OHM לעולם לא להוסיף נתונים משום מקור
          שמוגבל בזכויות יוצרים (למשל מפות גוגל או מפות מודפסות) ללא
          אישור מפורש מבעלי הזכויות.
        introduction_4_creative_commons: קריאייטיב קומונז–ייחוס–שיתוף זהה 2.0
        more_title_html: איך למצוא מידע נוסף
