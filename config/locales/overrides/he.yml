        נא %{contact_team_link}
        אם יש לך שאלות על רישוי, זכויות יוצרים או נושאים משפטיים אחרים.
    communities:
      lede_text: אנשים מכל רחבי העולם תורמים או משתמשים ב־ OpenHistoricalMap. בעוד שרבים משתתפים כיחידים, אחרים יצרו קהילות. הקבוצות האלו מגיעות במגוון גדלים ומייצגות אזורים גאוגרפיים מעיירות קטנות ועד אזורים גדולים מרובי מדינות. הן יכולות להיות רשמיות או לא רשמיות.
    copyright:
      legal_babble:
        contributors_footer_2_html: |-
          הכללה של נתונים ב־OpenHistoricalMap אינה אומרת שהספק המקורי
          של הנתונים תומך ב־OpenHistoricalMap, לוקח על עצמו אחריות כלשהי, או
          מקבל חבות כלשהי.
        credit_1_html: אף שחוק זכויות היוצרים אינו מגביל או מציב תנאים כלשהם לשימוש שלך בתוכן שנמצא בנחלת הכלל, אנו מעריכים מאוד כל קרדיט שיש לך אפשרות לתת ל־OpenHistoricalMap בעת שימוש חוזר, התאמה או שימוש אחר במפות או בנתונים שלנו.
        credit_2_this_copyright_page: דף זכויות היוצרים הזה
        credit_title_html: איך לתת ייחוס ל־OpenHistoricalMap
        infringement_1_html: |-
          אנו מזכירים לתורמים ל־OHM לעולם לא להוסיף נתונים משום מקור
          שמוגבל בזכויות יוצרים (למשל מפות גוגל או מפות מודפסות) ללא
          אישור מפורש מבעלי הזכויות.
        introduction_4_creative_commons: קריאייטיב קומונז–ייחוס–שיתוף זהה 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/deed.he
        more_2_1_api_usage_policy: מדינית השימוש ב־API
        more_2_1_html: |-
          אף ש־OpenHistoricalMap היא נתונים פתוחים, איננו יכולים לספק
          API של מפות ללא תשלום עבור צדדים שלישיים.
          נא לעיין ב%{api_usage_policy_link}, ב%{tile_usage_policy_link} וב%{nominatim_usage_policy_link} שלנו.
        more_2_1_nominatim_usage_policy: מדיניות השימוש בנומינטים
        more_2_1_tile_usage_policy: מדיניות השימוש באריחים
        more_title_html: איך למצוא מידע נוסף
