      remote_failed: Η επεξεργασία απέτυχε - βεβαιωθείτε ότι ο JOSM ή ο Merkaartor έχουν φορτωθεί και η επιλογή τηλεχειρισμού είναι ενεργή
    potlatch:
      removed: Ο προεπιλεγμένος σας επεξεργαστής του OpenHistoricalMap έχει τεθεί ως Potlatch. Επειδή το Adobe Flash Player έχει αποσυρθεί, ο Potlatch δεν είναι πια διαθέσιμος για χρήση σε πρόγραμμα περιήγησης ιστού.
    welcome:
      basic_terms:
        a_tag_html: Η %{tag} είναι δεδομένα που σχετίζονται με κόμβους ή γραμμές, όπως το όνομα ενός εστιατορίου ή το όριο ταχύτητας του δρόμου.
        paragraph_1: Η κοινότητα OpenHistoricalMap έχει δικό της γλωσσάρι. Παρακάτω είναι μερικές λέξεις που μπορεί να σας φανούν χρήσιμες.
      introduction: Σας καλωσορίζουμε στο OpenHistoricalMap, τον ελεύθερο και επεξεργάσιμο χάρτη του κόσμου. Τώρα που έχετε εγγραφεί, είστε πανέτοιμοι να αρχίσετε τη χαρτογράφηση. Εδώ είναι ένας γρήγορος οδηγός με τα πιο σημαντικά πράγματα που πρέπει να ξέρετε.
      rules:
        para_1_html: Το OpenHistoricalMap έχει λίγους επίσημους κανόνες, αλλά αναμένουμε από όλους τους συμμετέχοντες να συνεργαστούν με και να επικοινωνήσουν με την κοινότητα. Εάν σκέφτεστε οποιεσδήποτε άλλες δραστηριότητες εκτός από την επεξεργασία με το χέρι, παρακαλούμε διαβάστε και ακολουθήστε τις οδηγίες για %{imports_link} και %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Αυτό που %{doesnt} περιλαμβάνει είναι δεδομένα με γνώμη όπως αξιολογήσεις, ιστορικά ή υποθετικά χαρακτηριστικά, καθώς και δεδομένα από πηγές που προστατεύονται από πνευματικά δικαιώματα. Εκτός αν έχετε ειδική άδεια, μην αντιγράφετε από διαδικτυακούς ή έντυπους χάρτες.
        past_and_present: τόσο το παρελθόν όσο και το παρόν
