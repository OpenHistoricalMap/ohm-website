          explanation_html: Αν έχετε παρατηρήσει ένα πρόβλημα με τα δεδομένα του χάρτη μας, παραδείγματος χάριν ένας δρόμος που λείπει στη διεύθυνσή σας, ο καλύτερος τρόπος να προχωρήσετε είναι να ενταχθείτε στην κοινότητα του OpenHistoricalMap και να προσθέσετε ή να επισκευάσετε τα δεδομένα από μόνοι σας.
