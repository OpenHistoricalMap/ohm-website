      duplicate_social_email: Εάν έχετε ήδη λογαριασμό OpenHistoricalMap και επιθυμείτε να χρησιμοποιείτε έναν πάροχο ταυτότητας τρίτου μέρους, παρακαλούμε να συνδεθείτε χρησιμοποιώντας τον κωδικό πρόσβασής σας και να τροποποιήσετε τις ρυθμίσεις του λογαριασμού σας.
      please_contact_support_html: Παρακαλώ επικοινωνήστε με %{support_link} για να κανονίσετε τη δημιουργία λογαριασμού - θα προσπαθήσουμε να αντιμετωπίσουμε το αίτημα το συντομότερο δυνατό.
