      lede_text: "Άνθρωποι από όλο τον κόσμο συνεισφέρουν ή χρησιμοποιούν το OpenHistoricalMap. Ενώ πολλοί συμμετέχουν ως μεμονωμένα άτομα, άλλοι έχουν σχηματίσει κοινότητες. Αυτές οι ομάδες έχουν διάφορα μεγέθη και αντιπροσωπεύουν γεωγραφίες από μικρές πόλεις έως μεγάλες περιοχές πολλών χωρών. \nΜπορούν επίσης να είναι επίσημες ή ανεπίσημες."
