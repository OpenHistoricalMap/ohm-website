    logout: నిష్క్రమించండి
    tag_line: స్వేచ్ఛా వికీ ప్రపంచ పటం
  site:
    about:
      lede_text: OpenHistoricalMap ను మ్యాపర్ల సముదాయం నిర్మిస్తోంది. ఈ సముదాయ సభ్యులు ప్రపంచ వ్యాప్తంగా రోడ్లు, రెస్టారెంట్లు, రైల్వే స్టేషన్లు లాంటి ఎన్నో అంశాల గురించి డేటాను చేర్చడం, నిర్వహించడం చేస్తున్నారు.
