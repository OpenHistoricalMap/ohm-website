      legal_babble:
        credit_1_html: |-
          మీరు &ldquo;&copy; OpenHistoricalMap
          contributors&rdquo; అనే క్రిడిట్ వాడాలి.
        credit_2_this_copyright_page: ఈ కాపీరైట్ పేజీ
        credit_title_html: OpenHistoricalMap కు శ్రేయస్సు నివ్వడం ఎలా
        more_2_1_api_usage_policy: API వినియోగ విధానం
        more_title_html: మరింత తెలుసుకోవడం
    export:
      too_large:
        body: ఈ ప్రాంతాన్ని OpenHistoricalMap XML డేటాగా ఎగుమతి చెయ్యగలిగిన దాని కంటే పెద్దదిగా ఉంది. జూమిన్ చెయ్యండి, లేదా మరింత చిన్న ప్రాంతాన్ని ఎంచుకోండి, లేదా కింద ఉన్న, టోకున దించుకునేందుకు వీలైన మూలాల జాబితా నుండి ఒకదాన్ని వాడండి.
        planet:
          description: ఎప్పటికప్పుడూ తాజాకరిస్తూ ఉన్న OpenHistoricalMap సంపూర్ణ డేటాబేసుకు చెందిన కాపీలు
          title: Planet OHM
    fixthemap:
      how_to_help:
        join_the_community:
          explanation_html: మా మ్యాపు డేటాలో మీకేదైనా సమస్య కనిపిస్తే - ఉదాహరణకు మీ అడ్రసు లేకపోవడమో, ఏదైనా రోడ్డు లేకపోవడమో లాంటివి - OpenHistoricalMap సముదాయంలో చేరి ఆ డేటాను మీరే బాగుచెయ్యడమో లేదా అవసరమైన చేర్పులు చెయ్యడమో ఉత్తమమైన పద్ధతి.
    help:
