        title: IRC
      welcome:
        description: OpenHistoricalMap ప్రాథమికాంశాలను వివరించే ఈ సత్వర మార్గదర్శినితో మొదలు పెట్టండి.
      wiki:
        description: లోతైన OHM డాక్యుమెంటేషను కోసం వికీలో శోధించండి
        title: వికీ
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap కు స్వంత పరిభాష ఉంది. మీకు పనికొచ్చే కొన్ని కీలకమైన పదాలు ఇక్కడున్నాయి చూడండి.
