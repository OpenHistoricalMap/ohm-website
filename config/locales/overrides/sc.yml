  layouts:
    intro_header: Bene bènnidu in OpenHistoricalMap!
    intro_text: OpenHistoricalMap est una mapa de su mundu, creada dae persones che a tie e de impreu lìberu suta de una litzèntzia aberta.
    logo:
      alt_text: Logotipu de OpenHistoricalMap
    logout: Essi
  oauth:
    scopes:
      openid: Intra impreende OpenHistoricalMap
  sessions:
    destroy:
      heading: Essi dae OpenHistoricalMap
  site:
    about:
      lede_text: OpenHistoricalMap est fraigadu dae una comunidade de mapadores chi frunint e agiornant datos subra de caminos, camineras, cafeterias, istatziones de ferrovia e meda de prus in totu su mundu.
    about_section:
      contribute_1_user_diaries: diàrios de sos utentes
      legal_1_aup: Polìticas de impreu atzetàbile
      legal_1_html: |-
        Custu situ web e medas àteros servìtzios relatzionados sunt operados, in manera formale, dae sa
        %{group_link}
        on behalf of the community. in nùmene de sa comunidade. S'impreu de totu sos servìtzios operados dae s'OSMF est sugetu
        a sas %{terms_of_use_link}, a sas %{aup_link} e a sa %{privacy_policy_link} nostras.
      legal_1_privacy_policy: Polìtica de riservadesa
      legal_1_terms_of_use: Cunditziones de impreu
      legal_2_html: Pro praghere %{contact_team_link} si tenes dimandas in contu de sa litzèntzia, de su deretu de autore o de àteras chistiones legales.
    communities:
      lede_text: Gente dae totu su mundu contribuit a o impreat OpenHistoricalMap. Cando chi medas bi pigant parte comente indivìduos, àteros ant formadu comunidades. Custos grupos sunt de mannàrias diferentes e rapresentant zonas geogràficas dae sas biddigheddas minores a regiones mannas de prus istados. Podes fintzas èssere formales o informales.
    copyright:
      legal_babble:
        contributors_footer_2_html: S'inclusione de datos in OpenHistoricalMap no ìmplicat chi su frunidore originale de sos datos diat suportu a OpenHistoricalMap, frunat cale si siat garantzia o atzetet cale si siat responsabilidade.
        credit_1_html: 'Cando impreas sos datos de OpenHistoricalMap, depes fàghere custas duas cosas:'
        credit_2_this_copyright_page: custa pàgina subra de su deretu de autore
        credit_title_html: Comente dare s'atributzione de sos contributos a OpenHistoricalMap
        infringement_1_html: |-
          Ammentamus a sos collaboradores de OHM chi non depent annànghere mai datos dae cale si siat fonte cun deretos de autore registrados (a es. Google Maps o mapas imprentadas) chene
          tènnere un'autorizatzione esplìtzita de sos titulares de sos deretos de autore.
        introduction_4_creative_commons: Creative Commons Atributzione - Cumpartzi in sa matessi manera 2.0
        more_2_1_api_usage_policy: Polìtica de impreu de s'API
        more_2_1_html: Mancari chi OpenHistoricalMap tèngiat datos abertos, non podimus frunire un'API de badas a sas mapas esternas. Càstia sa %{api_usage_policy_link}, %{tile_usage_policy_link} e %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Polìtica de impreu de Nominatim
        more_2_1_tile_usage_policy: Polìtica de impreu de sos tasseddos
        more_title_html: Pro nd'ischire de prus
    export:
      too_large:
        body: Custa àrea est tropu manna pro l'esportare comente datos XML de OpenHistoricalMap. Ismànnia sa mapa o seletziona un'àrea prus minore, o imprea una de sas fontes allistadas inoghe in suta pro sos iscarrigamentos de massa de datos.
        overpass:
          description: Iscàrriga custu ricuadru de seletzione dae un'ispigru de sa base de datos de OpenHistoricalMap
        planet:
          description: Còpias atualizadas in manera regulare de sa base de datos intrea de OpenHistoricalMap
          title: Praneta OHM
    fixthemap:
      how_to_help:
        join_the_community:
          explanation_html: Si as notadu unu problema cun sos datos de mapa nostros, a esempru unu caminu chi mancat o s'indiritzu tuo, sa manera mègius de l'acontzare est aunende·ti a sa comunidade de OpenHistoricalMap e annanghende o curregende sos datos tue matessi.
    help:
      introduction: |-
        OpenHistoricalMap tenet medas risorsas pro imparare cosa subra de su progetu, pro fàghere preguntas e rispòndere,
        e pro arresonare e documentare in manera collaborativa de temas de mapadura.
      welcome:
        description: Incumintza cun custa ghia lestra subra de sos aspetos fundamentales de OpenHistoricalMap.
        title: Bene bènnidos in OpenHistoricalMap
      wiki:
        description: Esplora sa wiki pro agatare documentatzione a sa minuda subra de OHM.
    index:
      js_2: OpenHistoricalMap impreat JavaScript pro sa mapa dinàmica sua.
      remote_failed: Modìfica fallida - assegura·ti chi JOSM o Merkaartor siat aviadu e chi s'optzione de controllu remotu siat abilitada
    potlatch:
      removed: S'editore predefinidu tuo de OpenHistoricalMap est Potlatch. Dae chi s'Adobe Flash Player l'ant ritiradu, su Potlach no est prus a disponimentu pro s'impreu dae unu navigadore web.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap tenet unu limbàgiu suo. Inoghe tenes unas cantas paràulas crae chi t'ant a pòdere èssere de giudu.
      introduction: Bene bènnidu in OpenHistoricalMap, sa mapa lìbera e modificàbile de su mundu. Como chi ti ses registradu, ses prontu pro incumintzare a mapare. Custa est una ghia lestra cun sas cosas de importu prus mannu chi depes ischire.
      rules:
        para_1_html: |-
          OpenHistoricalMap tenet pagas règulas formales, ma nos isetamus chi totu sos partetzipantes collàborent e comùnichent cun sa comunidade. Si ses cunsiderende
          cale si siat àtera atividade chi non siat sa modìfica manuale, leghe e sighi sas lìnias de ghia subra de sas
          %{imports_link} e  de sas %{automated_edits_link}.
