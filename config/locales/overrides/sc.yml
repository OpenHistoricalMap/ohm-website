  site:
    about:
      lede_text: OpenHistoricalMap est fraigadu dae una comunidade de mapadores chi
        frunint e agiornant datos subra de caminos, camineras, cafeterias, istatziones
        de ferrovia e meda de prus in totu su mundu.
      used_by_html: '%{name} frunit datos cartogràficos a mìgias de sitos web, aplicatziones
        pro telefoneddos e dispositivos fìsicos'
    about_section:
      contribute_1_user_diaries: diàrios de sos utentes
      legal_1_aup: Polìticas de impreu atzetàbile
      legal_1_html: |-
        Custu situ web e medas àteros servìtzios relatzionados sunt operados, in manera formale, dae sa
        %{group_link}
        on behalf of the community. in nùmene de sa comunidade. S'impreu de totu sos servìtzios operados dae s'OSMF est sugetu
        a sas %{terms_of_use_link}, a sas %{aup_link} e a sa %{privacy_policy_link} nostras.
      legal_1_privacy_policy: Polìtica de riservadesa
      legal_1_terms_of_use: Cunditziones de impreu
      legal_2_html: Pro praghere %{contact_team_link} si tenes dimandas in contu de
        sa litzèntzia, de su deretu de autore o de àteras chistiones legales.
    add_a_note:
      para_1: Si boles petzi una curretzione minore, e non tenes su tempus pro ti
        registrare e imparare comente fàghere modìficas, est fàtzile a annànghere
        una nota.
    any_questions:
      ohm_paragraph_1_html: |-
        OpenHistoricalMap tenet medas risorsas pro imparare subra de su progetu, pedende e torrende risposta
        a dimandas medas, arresonende in manera collaborativa de temas chi pertocant a sa mapadura e documentende·los.
        %{help_link}.
    copyright:
      legal_babble:
        attribution_example:
          title: Esempru de atributzione
        contributors_footer_2_html: S'inclusione de datos in OpenHistoricalMap no
          ìmplicat chi su frunidore originale de sos datos diat suportu a OpenHistoricalMap,
          frunat cale si siat garantzia o atzetet cale si siat responsabilidade.
        contributors_intro_html: |-
          Sos contribuidores nostros sunt mìgias de persones. Includimus fintzas
          datos cun litzèntzias abertas de sas agèntzias pùblicas de cartografia e de àteras fontes, che a:
        contributors_title_html: Sos collaboradores nostros
        credit_1_html: 'Cando impreas sos datos de OpenHistoricalMap, depes fàghere
          custas duas cosas:'
        credit_2_this_copyright_page: custa pàgina subra de su deretu de autore
        credit_title_html: Comente dare s'atributzione de sos contributos a OpenHistoricalMap
        infringement_1_html: |-
          Ammentamus a sos collaboradores de OHM chi non depent annànghere mai datos dae cale si siat fonte cun deretos de autore registrados (a es. Google Maps o mapas imprentadas) chene
          tènnere un'autorizatzione esplìtzita de sos titulares de sos deretos de autore.
        introduction_4_creative_commons: Creative Commons Atributzione - Cumpartzi
          in sa matessi manera 2.0
        more_title_html: Pro nd'ischire de prus
    export:
      too_large:
        body: Custa àrea est tropu manna pro l'esportare comente datos XML de OpenHistoricalMap.
          Ismànnia sa mapa o seletziona un'àrea prus minore, o imprea una de sas fontes
          allistadas inoghe in suta pro sos iscarrigamentos de massa de datos.
        overpass:
          description: Iscàrriga custu ricuadru de seletzione dae un'ispigru de sa
            base de datos de OpenHistoricalMap
        planet:
          description: Còpias atualizadas in manera regulare de sa base de datos intrea
            de OpenHistoricalMap
          title: Praneta OHM
    fixthemap:
      how_to_help:
        join_the_community:
          explanation_html: Si as notadu unu problema cun sos datos de mapa nostros,
            a esempru unu caminu chi mancat o s'indiritzu tuo, sa manera mègius de
            l'acontzare est aunende·ti a sa comunidade de OpenHistoricalMap e annanghende
            o curregende sos datos tue matessi.
    help:
      introduction: |-
        OpenHistoricalMap tenet medas risorsas pro imparare cosa subra de su progetu, pro fàghere preguntas e rispòndere,
        e pro arresonare e documentare in manera collaborativa de temas de mapadura.
      welcome:
        description: Incumintza cun custa ghia lestra subra de sos aspetos fundamentales
          de OpenHistoricalMap.
        title: Bene bènnidos in OpenHistoricalMap
      welcomemat:
        title: Pro organizatziones
      wiki:
        description: Esplora sa wiki pro agatare documentatzione a sa minuda subra
          de OHM.
    index:
      js_2: OpenHistoricalMap impreat JavaScript pro sa mapa dinàmica sua.
    potlatch:
      removed: S'editore predefinidu tuo de OpenHistoricalMap est Potlatch. Dae chi
        s'Adobe Flash Player l'ant ritiradu, su Potlach no est prus a disponimentu
        pro s'impreu dae unu navigadore web.
    welcome:
      basic_terms:
        a_tag_html: |-
          Un'%{tag} est unu annantu minore de datos subra de unu nodu o una lìnia, che a
          su nùmene de unu ristorante o su lìmite de lestresa de unu caminu.
        paragraph_1: OpenHistoricalMap tenet unu limbàgiu suo. Inoghe tenes unas cantas
          paràulas crae chi t'ant a pòdere èssere de giudu.
      introduction: Bene bènnidu in OpenHistoricalMap, sa mapa lìbera e modificàbile
        de su mundu. Como chi ti ses registradu, ses prontu pro incumintzare a mapare.
        Custa est una ghia lestra cun sas cosas de importu prus mannu chi depes ischire.
      rules:
        para_1_html: |-
          OpenHistoricalMap tenet pagas règulas formales, ma nos isetamus chi totu sos partetzipantes collàborent e comùnichent cun sa comunidade. Si ses cunsiderende
          cale si siat àtera atividade chi non siat sa modìfica manuale, leghe e sighi sas lìnias de ghia subra de sas
          %{imports_link} e  de sas %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: |-
          Ite %{doesnt} incluit sunt datos sugetivos che a sas valutatziones, caraterìsticas istòricas o
          ipotèticas, e datos dae fontes cun deretu de autore. Francu chi apas permissos
          ispetziales non còpies dae mapas in lìnia o de paperi.
