  site:
    about:
      lede_text: OpenHistoricalMap er bygget af et fællesskab af kortlæggere, der bidrager og vedligeholder data om veje, stier, caféer, jernbanestationer og meget mere, over hele verden.
    about_section:
      contribute_1_user_diaries: brugerblogs
      legal_1_aup: Politikker for acceptabel brug
      legal_1_html: Dette websted og mange andre relaterede tjenester er formelt drevet af %{group_link} på vegne af fællesskabet. Brug af samtlige OSMF-drevne tjenester er underlagt vores %{terms_of_use_link}, %{aup_link} og vores %{privacy_policy_link}.
      legal_1_privacy_policy: Privatlivs-poltik
      legal_1_terms_of_use: Brugsvilkår
      legal_2_html: Du bedes %{contact_team_link} hvis du har spørgsmål om licensering, ophavsret eller andre juridiske spørgsmål og problemstillinger.
    communities:
      lede_text: |-
        Mennesker fra hele verden bidrager til og bruger OpenHistoricalMap. Mens mange deltager individuelt, har andre dannet fællesskaber. Disse grupper findes i mange størrelser, og repræsenterer brugere lige fra små byer til store regioner der spænder over flere lande.
        De kan også både være formelle og mere uformelle.
    copyright:
      legal_babble:
        contributors_footer_2_html: |-
          Optagelse af data i OpenHistoricalMap indebærer ikke at den oprindelige
          dataudbyder siger god for OpenHistoricalMap, giver nogen garanti eller
          accepterer nogen form for erstatningspligt.
        credit_1_html: 'Når du bruger OpenHistoricalMap-data, er du forpligtet til at gøre følgende to ting:'
        credit_2_this_copyright_page: denne copyright-side
        credit_title_html: Kildeangivelse og OpenHistoricalMap
        infringement_1_html: |-
          OHM-bidragsydere bliver mindet om aldrig at tilføje data fra nogen
          ophavsretligt beskyttede kilder (f.eks. Google Maps eller trykte kort) uden
          eksplicit tilladelse fra ophavsret-indehaverne.
        introduction_4_creative_commons: Creative Commons Kreditering-Deling på samme vilkår 2.0
        more_2_1_api_usage_policy: Politik for brug af API
        more_2_1_html: |-
          Selvom OpenHistoricalMap er åbne data, kan vi ikke levere et gratis kort-API til tredjeparter.
          Se vores %{api_usage_policy_link}, %{tile_usage_policy_link} og %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Politik for brug af Nominatim
        more_2_1_tile_usage_policy: Politik for brug af kort-fliser
        more_title_html: Læs mere
    export:
      too_large:
        body: 'Dette område er for stort til at blive eksporteret som OpenHistoricalMap XML-data. Zoom ind eller vælg et mindre område, eller brug en af de følgende kilder til bulk data-downloads:'
        overpass:
          description: Download dette afgrænsede område fra et spejl af OpenHistoricalMap-databasen
        planet:
          description: Regelmæssigt opdaterede kopier af den komplette OpenHistoricalMap database
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Bare klik på %{note_icon} eller det samme ikon på kortvisningen.
            Dette vil tilføje en markør som du kan trække rundt på kortet. Tilføj din besked, klik på gem og andre brugere vil undersøge sagen.
        join_the_community:
          explanation_html: Hvis du har opdaget et problem med vores kortdata, for eksempel en vej der mangler eller din adresse, er den bedste måde at gøre noget ved det, at deltage i OpenHistoricalMap-fællesskabet, og tilføje eller reparere data selv.
    help:
      discord:
        description: 'Tilmeld dig OpenStreetMap World Discord-serveren og få hjælp i #openhistoricalmap-kanalen.'
      forum:
        description: Deltag i længere diskussioner og uformelle chatrum ved hjælp af din OHM-konto.
        title: Forum
      github:
        description: Indsend et problem på vores GitHub for at rapportere en fejl eller anmode om en ny funktion.
        title: Funktionsanmodninger og fejl
      introduction: OpenHistoricalMap har flere ressourcer til at lære om projektet, stille og besvare spørgsmål og i fællesskab diskutere og dokumentere emner omkring kortlægning.
      mailing_list:
        description: Abonnér på vores postliste med lavt volumen.
        title: Postliste
      slack:
        description: 'Inviter dig selv til OpenStreetMap U.S. Slack-arbejdsområdet og deltag på #openhistoricalmap-kanalen.'
        title: IRC
      welcome:
        description: Start med denne hurtige guide der dækker det grundlæggende i OpenHistoricalMap.
        title: Velkommen til OpenHistoricalMap
      wiki:
        description: Gennemse wikien for dybdegående OHM dokumentation.
    index:
      js_2: OpenHistoricalMap bruger JavaScript til det interaktive kort.
      remote_failed: Redigering mislykkede - tjek at JOSM eller Merkaartor er startet og at ekstern betjening er aktiveret
    potlatch:
      removed: Din foretrukne OpenHistoricalMap-editor er sat til Potlatch. Da Adobe Flash Player er blevet trukket tilbage, er Potlatch ikke længere tilgængelig i browseren.
    welcome:
      basic_terms:
        paragraph_1: Her er nogen få begreber som er nyttige at forstå for at bidrage til OpenHistoricalMap.
      introduction: Velkommen til OpenHistoricalMap, det frie brugerredigerede verdenskort. Nu hvor du er oprettet som bruger er du klar til at tilføje og ændre kortinformationer. Her er en guide med de vigtigste informationer til at komme hurtigt i gang.
      rules:
        para_1_html: OpenHistoricalMap har få formelle regler men vi forventer at alle deltagere samarbejder med, og kommunikerer med, fællesskabet. Hvis du overvejer andre aktiviteter end manuel redigering, så vær venlig at læse og følge retningslinjerne for %{imports_link} og %{automated_edits_link}.
