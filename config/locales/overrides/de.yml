      heading: Deine ID ist noch nicht mit einem OpenHistoricalMap-Konto verknüpft.
      option_1: Falls du neu auf OpenHistoricalMap bist, erstelle bitte mithilfe des unten stehenden Formulars ein neues Benutzerkonto.
    new:
      about:
        paragraph_1: Im Gegensatz zu anderen Karten wird OpenHistoricalMap vollständig von Leuten wie dir erstellt und kann von jedem kostenlos repariert, aktualisiert, heruntergeladen und verwendet werden.
        welcome: Willkommen bei OpenHistoricalMap
      duplicate_social_email: Wenn du bereits ein OpenHistoricalMap-Konto hast und einen Identitätsanbieter eines Drittanbieters verwenden möchtest, melde dich bitte mit deinem Passwort an und ändere die Einstellungen deines Kontos.
