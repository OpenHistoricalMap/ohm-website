      login_to_authorize_html: Melden Sie sich bei OpenHistoricalMap an, um auf %{client_app_name} zuzugreifen.
  site:
    about:
      lede_text: |-
        OpenHistoricalMap wird von einer Vielzahl von Mappern erstellt, die Daten zu
        Wegen, Gebäuden und allerlei Weiterem weltweit erfassen und pflegen.
    about_section:
      contribute_1_user_diaries: Benutzertagebücher
      legal_1_aup: Richtlinien für die akzeptable Nutzung
      legal_1_html: |-
        Diese Website und viele andere damit zusammenhängende Dienste werden formell von der
        %{group_link}
        im Namen der Gemeinschaft betrieben. Die Nutzung aller von der OSMF betriebenen Dienste unterliegt
        unseren %{terms_of_use_link}, %{aup_link} und unserer %{privacy_policy_link}.
      legal_1_privacy_policy: Datenschutzrichtlinie
      legal_1_terms_of_use: Nutzungsbedingungen
      legal_2_html: Bitte kontaktiere %{contact_team_link}, wenn du Lizenz-, Urheberrechts- oder andere rechtliche Fragen hast.
    communities:
      lede_text: |-
        Menschen aus aller Welt tragen zu OpenHistoricalMap bei oder nutzen es.
        Viele nehmen als Einzelpersonen teil, andere haben Gemeinschaften gebildet.
        Diese Gruppen gibt es in unterschiedlichen Größen und sie repräsentieren geografische Gebiete von Kleinstädten bis hin zu großen Regionen mit mehreren Ländern.
        Sie können auch formell oder informell sein.
    copyright:
      legal_babble:
        contributors_footer_2_html: Die Einbeziehung von Daten bei OpenHistoricalMap bedeutet nicht, dass der ursprüngliche Datenlieferant OpenHistoricalMap unterstützt, Gewährleistung dafür gibt oder die Haftung dafür übernimmt.
        credit_1_html: 'Wenn du OpenHistoricalMap-Daten verwendest, musst du die folgenden zwei Bedingungen erfüllen:'
        credit_2_this_copyright_page: diese Copyright-Seite
        credit_title_html: Wie auf die Urheberschaft von OpenHistoricalMap hinzuweisen ist
        infringement_1_html: Die Mitwirkenden von OHM weisen wir darauf hin, dass keinesfalls Daten aus urheberrechtlich geschützten Quellen verwendet werden dürfen (z. B. Google Maps oder gedruckte Kartenwerke), ohne vorher die ausdrückliche Erlaubnis des Rechteinhabers erhalten zu haben.
        introduction_4_creative_commons: Creative Commons Namensnennung – Weitergabe unter gleichen Bedingungen 2.0
        more_2_1_api_usage_policy: API-Nutzungsrichtlinie
        more_2_1_html: Obwohl es sich bei OpenHistoricalMap um offene Daten handelt, können wir keine kostenlose Karten-API für Dritte bereitstellen. Siehe unsere %{api_usage_policy_link}, %{tile_usage_policy_link} und %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Nominatim-Nutzungsrichtlinie
        more_2_1_tile_usage_policy: Nutzungsrichtlinie für Kacheln
        more_title_html: Weitere Informationen
    export:
      too_large:
        body: Dieser Bereich ist zu groß, um als OpenHistoricalMap-XML-Daten exportiert zu werden. Bitte heranzoomen, einen kleineren Bereich wählen oder eine der folgenden Quellen für Massendatendownloads nutzen.
        overpass:
          description: Diese Bounding Box von einem Mirror der OpenHistoricalMap-Datenbank herunterladen
        planet:
          description: Regelmäßig aktualisierte Kopien der kompletten OpenHistoricalMap-Datenbank
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Klicke einfach auf %{note_icon} oder auf das gleiche Symbol in der Kartenanzeige.
            Dies fügt eine Markierung der Karte hinzu, die du durch Ziehen verschieben kannst.
            Schreibe deine Nachricht, klicke auf „Speichern“ und andere Mapper werden den Fehler untersuchen.
        join_the_community:
          explanation_html: |-
            Falls du bei unseren Kartendaten ein Problem bemerkt hast wie das Fehlen einer Straße oder deiner Adresse,
            ist der beste Weg zum Weitermachen der Beitritt zur OpenHistoricalMap-Gemeinschaft und das Beheben der Daten durch dich selbst.
    help:
      discord:
        description: 'Tritt dem OpenStreetMap-World-Discord-Server bei und erhalte Hilfe im #openhistoricalmap-Kanal.'
      forum:
        description: Nimm mit deinem OHM-Konto an längeren Diskussionen und informellen Chatrooms teil.
        title: Forum
      introduction: |-
        OpenHistoricalMap hat mehrere Quellen zum Lernen, Stellen und Beantworten von Fragen über das Projekt
        und zum gemeinsamen Diskutieren und Dokumentieren von Kartierungsthemen.
      mailing_list:
        description: Abonniere unsere Mailingliste mit geringem Aufkommen.
        title: Mailingliste
      slack:
        description: 'Lade dich selbst zum OpenStreetMap US-Slack-Arbeitsbereich ein und tritt dem Kanal #openhistoricalmap bei.'
        title: IRC
      welcome:
        description: Beginne mit dieser Kurzanleitung zu den Grundlagen von OpenHistoricalMap.
        title: Willkommen bei OpenHistoricalMap
      wiki:
        description: Durchsuche das Wiki für eine ausführliche OHM-Dokumentation.
    index:
      js_2: OpenHistoricalMap nutzt JavaScript für die Kartendarstellung.
      remote_failed: Der Aufruf des Editors ist fehlgeschlagen. Stelle sicher, dass JOSM oder Merkaartor gestartet ist und die Remote-Control-Option aktiviert ist.
    potlatch:
      removed: Ihr Standard-OpenHistoricalMap-Editor ist Potlatch. Da Adobe Flash Player zurückgezogen wurde, ist Potlatch nicht mehr für die Verwendung in Webbrowsern verfügbar.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap nutzt ein paar spezifische Begriffe. Hier sind ein paar davon, die nützlich sein dürften.
      introduction: |-
        Willkommen bei OpenHistoricalMap, der weltweiten freien und editierbaren Karte. Mit deiner Anmeldung ist alles so weit, dass du anfangen kannst die Karte zu bearbeiten.
        Hier sind noch eine paar nützliche zusätzliche Informationen.
      rules:
        para_1_html: OpenHistoricalMap hat nur wenige formale Regeln, wir erwarten jedoch von allen Teilnehmern, dass sie mit der Community zusammenarbeiten und kommunizieren. Wenn Sie andere Aktivitäten als die manuelle Bearbeitung in Erwägung ziehen, lesen und befolgen Sie bitte die Richtlinien zu %{imports_link} und %{automated_edits_link}.
      whats_on_the_map:
        on_the_map_ohm_html: |-
          OpenHistoricalMap verfolgt Veränderungen der natürlichen und menschlichen Geographie auf der ganzen Welt.
          Wir haben Millionen von Einträgen aus %{past_and_present}, von Imperien und Gletschern bis hin zu Häusern und Restaurants.
          Du kannst alle realen Merkmale kartieren, die dich interessieren.
        past_and_present: sowohl die Vergangenheit als auch die Gegenwart
