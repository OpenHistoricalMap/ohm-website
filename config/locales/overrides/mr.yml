      lede_text: OpenHistoricalMap हा मानचित्रकारांनी उभारलेला एक प्रकल्प आहे ज्यात
        जगभरातील रस्ते, पायवाट, कॅफे, रेल्वे स्थानक व इतर बऱ्याच गोष्टींचा डेटा योगदानातून
        तयार व व्यवस्थापित केला जातो.
      used_by_html: '%{name} हजारो संकेतस्थळे, मोबाइल अॅप्स आणि हार्डवेअर उपकरणांसाठी
        नकाशा डेटा प्रदान करते'
    add_a_note:
      para_1: |-
        जर आपणास काही छोटेसेच ठिक करुन हवे आहे व आपल्यापाशी प्रवेशाचा व संपादन शिकण्यास वेळ नाही

        तर एक टिप्पणी जोडणे सोपे आहे.
    copyright:
      legal_babble:
        contributors_intro_html: 'आमचे योगदानकर्ते हे हजारोंच्या संख्येतील व्यक्ति
          आहेत.आम्ही मुक्त परवान्यांतर्गत असलेला डाटा हा राष्ट्रीय नकाशा संस्थेंकडून
          व त्यातील इतर स्रोतांतून घेऊन त्याचा अंतर्भाव करतो:'
        contributors_title_html: आमचे योगदाते
        credit_1_html: |-
          &ldquo;&copy; OpenHistoricalMap
          contributors&rdquo; असे श्रेय तुम्हाला दर्शवणे आवश्यक आहे.
        credit_title_html: ओपनस्ट्रीटमॅपला श्रेय कसे द्यावे
        infringement_1_html: OHM योगदानकर्त्यांना कोणत्याही प्रतीलीपी अधिकार राखवलेल्या
          (उदा. Google नकाशे किंवा मुद्रित नकाशे अश्या) स्त्रोतांमधून कोणतीही माहिती
          प्रतीलिपी अधिकार धारकांच्या स्पष्ट परवानगीशिवाय जोडू नये याची आठवण करून
          दिली जाते.
