            dengan bergabung dengan komunitas OpenHistoricalMap dan menambahkan atau
            memperbaiki data tersebut sendiri.
    help:
      introduction: "OpenHistoricalMap memiliki beberapa sumber daya untuk belajar
        tentang proyek, bertanya dan menjawab pertanyaan, \ndan bersama-sama mendiskusikan
        dan mendokumentasikan topik pemetaan."
      slack:
