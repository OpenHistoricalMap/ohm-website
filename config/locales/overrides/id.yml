      legal_1_aup: Aturan Penggunaan yang Diizinkan
      legal_1_html: Situs ini beserta layanan terkait secara resmi dioperasikan oleh
        %{group_link} atas nama komunitas kontributor. Pemanfaatan semua layanan OSMF
        wajib mematuhi %{terms_of_use_link}, %{aup_link}, dan %{privacy_policy_link}
        kami.
      legal_1_privacy_policy: Kebijakan Privasi
      legal_1_terms_of_use: Ketentuan Penggunaan
      legal_2_html: Hubungi %{contact_team_link} bila Anda ingin tahu soal lisensi,
        hak cipta, atau persoalan hukum lainnya.
    add_a_note:
      para_1: Jika Anda ingin memberi perbaikan kecil dan tidak mau mendaftar ataupun
        mempelajari cara penyuntingan, Anda cukup memberi catatan.
    any_questions:
      ohm_paragraph_1_html: OpenHistoricalMap punya banyak materi untuk mendalami
        proyek ini, tanya jawab, dan saling bahas soal perpetaan. %{help_link}.
    copyright:
      legal_babble:
        attribution_example:
          title: Contoh atribusi
        contributors_footer_2_html: Penyertaan data dalam OpenHistoricalMap tidak
          menyiratkan bahwa penyedia data yang asli mendukung OpenHistoricalMap, menyediakan
          jaminan, atau menerima tanggung jawab apa pun.
        contributors_intro_html: 'Kontributor kami terdiri dari ribuan orang. Kami
          juga memasukkan data dengan lisensi terbuka yang didapat dari badan-badan
          pemetaan nasional dan sumber lainnya, diantaranya:'
        contributors_title_html: Kontributor kami
        credit_1_html: Meski hukum hak cipta tidak membatasi atau menempatkan syarat
          apa pun pada penggunaan konten domain publik, kami sangat menghargai setiap
          pengakuan yang Anda berikan kepada OpenHistoricalMap saat menggunakan kembali,
          menyesuaikan, atau memanfaatkan peta atau data kami.
        credit_2_this_copyright_page: laman hak cipta ini
        credit_title_html: Cara memberikan kredit pada OpenHistoricalMap
        infringement_1_html: Kontributor OHM diingatkan untuk tidak menambahkan sembarang
          data dari sumber berhak cipta (misalnya, Google Maps atau peta cetak) tanpa
          izin jelas dari pemegang hak cipta.
        introduction_4_creative_commons: Creative Commons Atribusi-BerbagiSerupa 2.0
        more_title_html: Mengetahui lebih lanjut
      title: Hak Cipta & Lisensi
