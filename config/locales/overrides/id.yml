        title: Selamat datang di OpenHistoricalMap
      welcomemat:
        title: Selamat datang di OHM
      wiki:
        description: Petunjuk yang dikelola komunitas untuk menggunakan OHM dan pedoman
          untuk bersumbangsih ke pada proyek.
    index:
      js_2: OpenHistoricalMap menggunakan JavaScript untuk peta selipnya.
    potlatch:
      removed: Alat sunting OpenHistoricalMap bawaan Anda disetel sebagai Potlatch.
        Karena Adobe Flash Player telah ditarik, Potlatch tidak lagi tersedia untuk
        digunakan di peramban web.
    welcome:
      basic_terms:
        a_tag_html: '%{tag} adalah data yang memperjelas titik atau garis, misalnya
          nama restoran atau batas kecepatan jalan.'
        paragraph_1: OpenHistoricalMap punya beberapa istilah tersendiri. Berikut
          ini beberapa kata kunci yang dapat digunakan.
      introduction: Selamat datang di OpenHistoricalMap, peta sejarah dunia yang gratis
        dan dapat disunting. Sekarang setelah Anda mendaftar, Anda siap untuk mulai
        memetakan. Berikut panduan singkat dengan hal-hal terpenting yang perlu Anda
        ketahui.
      rules:
        para_1_html: OpenHistoricalMap punya aturan-aturan resmi. Namun, kami berharap
          para kontributor bisa bekerja sama dan saling berkomunikasi. Bila Anda tidak
          ingin menyunting peta secara manual, baca dan simak panduan tentang %{imports_link}
          dan %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: OpenHistoricalMap %{doesnt} mencakup sejarah alternatif
          fiksi, kesalahan yang diketahui dari peta kuno, dan data dari sumber yang
          dilindungi hak cipta. Kecuali Anda memiliki izin khusus, jangan menyalin
          dari peta modern masa lalu yang Anda temui secara daring atau cetak.
