  layouts:
    intro_2_create_account: Buat Akun
    intro_header: Selamat datang di OpenHistoricalMap!
    intro_text: OpenHistoricalMap adalah peta interaktif dunia sepanjang sejarah, dibuat oleh orang-orang seperti Anda dan didedikasikan untuk domain publik.
    logo:
      alt_text: logo OpenHistoricalMap
    logout: Keluar Log
    tag_line: Peta Dunia Wiki Gratis
  oauth:
    scopes:
      openid: Daftar masuk menggunakan OpenHistoricalMap
  sessions:
    destroy:
      heading: Keluar log dari OpenHistoricalMap
  site:
    about:
      lede_text: OpenHistoricalMap adalah proyek bercita-cita tinggi yang dipimpin oleh komunitas untuk memetakan perubahan geografi alam dan manusia di seluruh dunia… sepanjang zaman.
    about_section:
      contribute_1_user_diaries: artikel pengguna
      legal_1_aup: Aturan Penggunaan yang Diizinkan
      legal_1_html: Situs ini beserta layanan terkait secara resmi dioperasikan oleh %{group_link} atas nama komunitas kontributor. Pemanfaatan semua layanan OSMF wajib mematuhi %{terms_of_use_link}, %{aup_link}, dan %{privacy_policy_link} kami.
      legal_1_privacy_policy: Kebijakan Privasi
      legal_1_terms_of_use: Ketentuan Penggunaan
      legal_2_html: Hubungi %{contact_team_link} bila Anda ingin tahu soal lisensi, hak cipta, atau persoalan hukum lainnya.
    communities:
      lede_text: Banyak orang dari berbagai negara turut memperkaya atau memanfaatkan OpenHistoricalMap. Ada yang sendiri-sendiri dan ada pula yang bersatu-padu membentuk kelompok. Kelompok ini beragam ukurannya, mulai dari kota kecil hingga daerah lintas negara; bentuknya formal atau informal.
    copyright:
      legal_babble:
        contributors_footer_2_html: Penyertaan data dalam OpenHistoricalMap tidak menyiratkan bahwa penyedia data yang asli mendukung OpenHistoricalMap, menyediakan jaminan, atau menerima tanggung jawab apa pun.
        credit_1_html: Meski hukum hak cipta tidak membatasi atau menempatkan syarat apa pun pada penggunaan konten domain publik, kami sangat menghargai setiap pengakuan yang Anda berikan kepada OpenHistoricalMap saat menggunakan kembali, menyesuaikan, atau memanfaatkan peta atau data kami.
        credit_2_this_copyright_page: laman hak cipta ini
        credit_title_html: Cara memberikan kredit pada OpenHistoricalMap
        infringement_1_html: Kontributor OHM diingatkan untuk tidak menambahkan sembarang data dari sumber berhak cipta (misalnya, Google Maps atau peta cetak) tanpa izin jelas dari pemegang hak cipta.
        introduction_4_creative_commons: Creative Commons Atribusi-BerbagiSerupa 2.0
        more_2_1_api_usage_policy: Aturan Penggunaan API
        more_2_1_html: Meski data OpenHistoricalMap bersifat terbuka, kami tidak bisa menyediakan API peta gratis untuk pihak ketiga. Simak %{api_usage_policy_link}, %{tile_usage_policy_link}, dan %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Aturan Penggunaan Nominatim
        more_2_1_tile_usage_policy: Aturan Penggunaan Kotak Peta
        more_title_html: Mengetahui lebih lanjut
    export:
      too_large:
        body: Kawasan ini terlalu besar untuk diekspor sebagai data XML OpenHistoricalMap. Silakan perbesar atau pilih kawasan yang lebih kecil, atau gunakan salah satu sumber di bawah ini untuk mengunduh data besar-besaran.
        overpass:
          description: Unduh kotak pembatas ini dari cermin pangkalan data OpenHistoricalMap
        planet:
          description: Salinan lengkap pangkalan data OpenHistoricalMap yang dimutakhiran secara teratur
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: "Hanya klik %{note_icon} atau ikon yang sama pada layar peta. \nIni akan menambahkan penanda ke peta, yang dapat Anda bergerak \ndengan menyeret. Tambahkan pesan Anda, lalu klik simpan, dan pembuat peta lainnya akan menyelidiki."
        join_the_community:
          explanation_html: Jika Anda melihat masalah dengan data peta kami, misal jalan yang hilang atau alamat Anda, cara terbaik untuk menanganinya adalah dengan bergabung dengan komunitas OpenHistoricalMap dan menambahkan atau memperbaiki data tersebut sendiri.
    help:
      introduction: "OpenHistoricalMap memiliki beberapa sumber daya untuk belajar tentang proyek, bertanya dan menjawab pertanyaan, \ndan bersama-sama mendiskusikan dan mendokumentasikan topik pemetaan."
      slack:
        title: IRC
      welcome:
        description: Mulai dengan panduan cepat meliputi dasar-dasar OpenHistoricalMap.
        title: Selamat datang di OpenHistoricalMap
      wiki:
        description: Petunjuk yang dikelola komunitas untuk menggunakan OHM dan pedoman untuk bersumbangsih ke pada proyek.
    index:
      js_2: OpenHistoricalMap menggunakan JavaScript untuk peta selipnya.
      remote_failed: Gagal melakukan edit - pastikan JOSM atau Merkaartor telah termuat dan opsi remote control telah diaktifkan
    potlatch:
      removed: Alat sunting OpenHistoricalMap bawaan Anda disetel sebagai Potlatch. Karena Adobe Flash Player telah ditarik, Potlatch tidak lagi tersedia untuk digunakan di peramban web.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap punya beberapa istilah tersendiri. Berikut ini beberapa kata kunci yang dapat digunakan.
      introduction: Selamat datang di OpenHistoricalMap, peta sejarah dunia yang gratis dan dapat disunting. Sekarang setelah Anda mendaftar, Anda siap untuk mulai memetakan. Berikut panduan singkat dengan hal-hal terpenting yang perlu Anda ketahui.
      rules:
        para_1_html: OpenHistoricalMap punya aturan-aturan resmi. Namun, kami berharap para kontributor bisa bekerja sama dan saling berkomunikasi. Bila Anda tidak ingin menyunting peta secara manual, baca dan simak panduan tentang %{imports_link} dan %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: OpenHistoricalMap %{doesnt} mencakup sejarah alternatif fiksi, kesalahan yang diketahui dari peta kuno, dan data dari sumber yang dilindungi hak cipta. Kecuali Anda memiliki izin khusus, jangan menyalin dari peta modern masa lalu yang Anda temui secara daring atau cetak.
