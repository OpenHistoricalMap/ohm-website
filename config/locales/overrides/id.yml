      option_1: Jika Anda baru di OpenHistoricalMap, silakan buat akun baru menggunakan formulir di bawah.
    new:
      about:
        paragraph_1: Tidak seperti peta lain, OpenHistoricalMap sepenuhnya dibangun oleh orang-orang seperti Anda. Siapa saja boleh memperbaiki, memperbarui, mengunduh, dan menggunakannya.
        paragraph_2: Silakan mendaftar untuk berkontribusi. Kami akan kirimkan surat elektronik untuk konfirmasi akun Anda.
      please_contact_support_html: Hubungi %{support_link} bila Anda ingin kami buatkan akun. Kami akan menanggapi permintaan Anda sesegera mungkin.
