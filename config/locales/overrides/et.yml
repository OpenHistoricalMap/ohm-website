  site:
    about:
      lede_text: OpenHistoricalMapi koostab kaardistajate kogukond, mis täiendab ja haldab andmeid teede, radade, kohvikute, raudteejaamade ja paljude teiste objektide kohta üle kogu maailma.
    about_section:
      contribute_1_user_diaries: kasutajate päevikuid
      legal_1_aup: kasutamisreeglid
      legal_1_html: |-
        Seda saiti ja paljusid teisi seotud teenuseid haldab ametlikult
        %{group_link}
        kogukonna nimel. Kõigis OSMF-i hallatavates teenustes kehtivad
        meie %{terms_of_use_link}, %{aup_link} ja %{privacy_policy_link}.
      legal_1_privacy_policy: andmekaitsereeglid
      legal_1_terms_of_use: kasutustingimused
      legal_2_html: |-
        Palun %{contact_team_link},
        kui sul on küsimusi litsentsimise, autoriõiguse või muude õiguslike teemade kohta.
    communities:
      lede_text: OpenHistoricalMapile teevad kaastööd inimesed üle maailma. Paljud neist osalevad üksikisikutena, teised on moodustanud kogukondi. Need on eri suuruses alates rühmadest, mis esindavad väikseid asulaid, kuni rühmadeni, mis esindavad riikideüleseid piirkondi. Need võivad olla nii ametlikud kui ka mitteametlikud.
    copyright:
      legal_babble:
        contributors_footer_2_html: |-
          Andmete kasutamine OpenHistoricalMapi koosseisus ei tähenda, et
          algsete andmete pakkuja toetab OpenHistoricalMapi, pakub mingit tagatist või
          võtab endale mingeid kohustusi.
        credit_1_html: 'Seal, kus kasutad OpenHistoricalMapi andmeid, tuleb sul teha kaht järgmist asja:'
        credit_2_this_copyright_page: sellele autoriõiguse leheküljele
        credit_title_html: OpenHistoricalMapile viitamine
        infringement_1_html: |-
          OHM-i kaastöölistele on öeldud, et nad ei lisaks kunagi andmeid,
          mis pärinevad autoriõigusega kaitstud allikatest (nt Google Maps või trükikaardid),
          kui neil puudub autoriõiguse valdaja selgesõnaline luba.
        introduction_4_creative_commons: Autorile viitamine + jagamine samadel tingimustel 2.0
        more_2_1_api_usage_policy: API kasutusreegleid
        more_2_1_html: Kuigi OpenHistoricalMapi andmed on avaandmed, ei saa me pakkuda kaardi juures tasuta API-t kolmandatele osapooltele. Vaata meie %{api_usage_policy_link}, %{tile_usage_policy_link} ja %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Nominatimi kasutusreegleid
        more_2_1_tile_usage_policy: kaardipaanide kasutusreegleid
        more_title_html: Lisateave
    export:
      too_large:
        body: See ala on liiga suur, et eksportida OpenHistoricalMapi andmeid XML-kujul. Palun suurenda või vali väiksem ala või kasuta üht allpool loetletud allikatest, et laadida alla suuri andmehulki.
        overpass:
          description: Laadi alla piiritletud ala OpenHistoricalMapi andmebaasi peegelserverist.
        planet:
          description: Regulaarselt uuendatavad koopiad tervest OpenHistoricalMapi andmebaasist.
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Kliki %{note_icon} või samale ikoonile kaardivaates.
            See lisab kaardile markeri, mida sa saad liigutada seda hiirega lohistades. Lisa oma sõnum, seejärel kliki "Salvesta" ja teised kaardistajad näevad seda.
        join_the_community:
          explanation_html: Kui oled märganud probleemi meie kaardi andmetes, näiteks puuduvat teed või enda aadressi, siis parim viis selle lahendamiseks on liituda OpenHistoricalMapi kogukonnaga ja muuta või parandada andmed ise.
    help:
      introduction: OpenHistoricalMap pakub erinevaid võimalusi projekti tundmaõppimiseks, küsimuste esitamiseks ja vastamiseks ning kaardistamise teemade üle üheskoos arupidamiseks ja dokumenteerimiseks.
      slack:
        title: IRC
      welcome:
        description: Alusta selle kiirjuhendiga, mis hõlmab OpenHistoricalMapi põhitõdesid.
        title: Tere tulemast OpenHistoricalMapi
      wiki:
        description: Sirvi vikis OHMi põhjalikumat dokumentatsiooni.
        title: Viki
    index:
      js_2: OpenHistoricalMap kasutab JavaScripti kaartide laadimiseks.
      remote_failed: Redigeerimise ebaõnnestus - veendu, et  JOSM või Merkaartor töötab ning kaugjuhtimine on lubatud
    potlatch:
      removed: Sa oled OpenHistoricalMapi jaoks vaikeredaktoriks määranud Potlatchi. Kuna Adobe Flash Player ei ole enam kasutusel, siis pole ka Potlatchi enam veebibrauseris võimalik kasutada.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMapil on omad erialased mõisted. Siin on mõned peamised mõisted, mida tasub meelde jätta.
      introduction: Tere tulemast OpenHistoricalMapi, vabasse ja muudetavasse maailmakaarti. Registreerumine on nüüd tehtud ja võid alustada kaardistamist. Siin on lühiülevaade kõige olulisematest asjadest, mida peaksid teadma.
      rules:
        para_1_html: |-
          OpenHistoricalMapil on vähe formaalseid reegleid, kuid me eeldame, et kõik osavõtjad teevad koostööd
          ja suhtlevad kogukonnaga. Kui plaanid tegevusi, mis ei ole käsitsi redigeerimine, siis loe
          %{imports_link} ja %{automated_edits_link} juhendeid.
