    intro_header: OpenHistoricalMap へようこそ!
    intro_text: OpenHistoricalMap は、あなたのような人々が作成した世界地図であり、オープン ライセンスの下で自由に利用できます。
    logo:
      alt_text: OpenHistoricalMap ロゴ
