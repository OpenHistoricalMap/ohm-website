      heading: あなたのIDはまだOpenHistoricalMapアカウントと関連付けが済んでいません。
      option_1: OpenHistoricalMapを初めてお使いの方は、以下のフォームを使用して新しいアカウントを作成してください。
    new:
      about:
        paragraph_1: 他の地図とは異なり、OpenHistoricalMapは完全に皆さんのような人によって作成されており、誰でも自由に修正・更新・ダウンロード・利用ができます。
        welcome: OpenHistoricalMap へようこそ。
      duplicate_social_email: すでに OpenHistoricalMap アカウントをお持ちで第三者認証プロバイダーを使用したい場合は、パスワードを使用してログインしたうえでアカウントの設定を変更してください。
