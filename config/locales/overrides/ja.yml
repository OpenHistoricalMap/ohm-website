    new:
      login_to_authorize_html: "%{client_app_name} へのアクセスにはOpenHistoricalMapへのログインが必要です。"
  site:
    about:
      lede_text: OpenHistoricalMap は野心的でコミュニティ主導のプロジェクトとして、自然ならびに人工の地理の変化を全世界で……時代を超えて地図に記録しようとしています。
      used_by_html: "%{name} を使って世界史のいずれの時期も探検できます。"
    about_section:
      contribute_1_user_diaries: 利用者の日記
      legal_1_aup: 利用規定
      legal_1_html: このサイトおよび関連サービスはコミュニティを代表し、OpenStreetMap U.S.財団の提携団体である%{group_link}が運営しています。OpenHistoricalMap のいずれのサービスの利用も、私たちの定める%{terms_of_use_link}、%{aup_link}ならびに当財団の%{privacy_policy_link}の対象となります。
      legal_1_privacy_policy: プライバシー・ポリシー
      legal_1_terms_of_use: 利用規約
      legal_2_html: |-
        ライセンス、著作権、その他の法的な問題については、%{contact_team_link}
        までお問い合わせください。
      open_data_1_1_html: |-
        私たちが収集した歴史情報を体験する方法は、ホームページの地図の他にもたくさんあります。
        基盤のデータは保管先 %{reuse_link} からダウンロードしたり、世の中にたくさんある無料 API のうちオープンソース・ソフトウェアと互換性のあるものを介して入手できます。
      open_data_2_html: データは特記する場合を除きパブリックドメインです。その使用には規制や制約はありません。しかしながら、可能でしたら OpenHistoricalMap に言及もしくは引用していただけると大変ありがたいです。詳細と承認の説明は %{copyright_license_link}をご参照ください。
      scope_html: |-
        帝国は興亡を繰り返します。氷河は消滅します。言語や宗教は地域から地域へと広がっていくものです。土がむきだしの小道はやがて幹線道路になり鉄道が開通したりして賑わいを集めたり、平屋の建物は減って高層ビルに置き換えられます。
        やがて、ふと思い出すのです、自分自身が過ごした昔の近所の様子を。これらをすべて記録するのが、OpenHistoricalMap（オープンストリートマップ）。
    communities:
      lede_text: |-
        世界中の人びとが OpenHistoricalMap に貢献し、OpenHistoricalMap を使用しています。
        多くは個人として参加していますが、コミュニティをつくる人たちもいます。
        コミュニティにはさまざまなサイズがあり、小さな町から複数の国からなる大規模な地域まで多岐に渡る地理的範囲を表示しています。
        コミュニティには公式のものも、非公式のものもあります。
    copyright:
      legal_babble:
        attribution_example:
          alt: "「OHM」というラベル付きのリンクは、ウェブページの右下隅、日付スライダー下に表示。"
          title: 特定のウェブサイトで OpenHistoricalMap の権利表示をする例
        contributors_footer_2_html: OpenHistoricalMapのデータに含めることは、元データの提供者がOpenHistoricalMapを支持したり、何かしらの保証を行ったり、何かしらの責任を負ったりすることを意味するものではありません。
        contributors_gmted_html: 海抜データの出典は右のとおり。 Danielson, J.J. および Gesch, D.B. " %{gmted_link}"（GMTED2010） ''U.S. Geological Survey Open-File Report''、26ページ（U.S. Geological Survey、2011年）。ISSN:2011–1073。パブリックドメイン。
        contributors_intro_html: OpenHistoricalMapには、数千人もの個人協力者や組織の共同作業が注がれ、その人々には膨大な学術研究、ジャーナリズム、保存記録の成果が役立っています。これまでの主な情報源と貢献者は以下の通りです。
        contributors_natural_earth_html: "%{natural_earth_link} データセットはパブリックドメインです。"
        contributors_title_html: 謝辞
        credit_1_html: 公共財のコンテンツ利用には、著作権法のしばりもしくは条件付与を受けることはありませんが、私たちの地図やデータを再利用し改変し、またはその他の方法で使用する際には、クレジットを OpenHistoricalMap としてくだされば誠に幸いです。
        credit_2_this_copyright_page: この著作権ページ
        credit_3_credit_html: 地図データは %{project_link} プロジェクトの提供で、突起する場合を除きパブリックドメインです。
        credit_title_html: OpenHistoricalMap のクレジット表記の仕方
        infringement_1_html: 'OHMの協力者は、著作権者から明確な許諾を得ずに、著作権のある情報源 (例: Google マップや印刷された地図) から決してデータを持ち込まないよう注意するものとします。'
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/
        introduction_1_ohm_html: |-
          OpenHistoricalMap とは公開の地理空間データ集です。特に明記しない限り、OpenHistoricalMap データは %{cc0_link} の指定に準じてパブリックドメインに提供してあります。
          パブリックドメインにあるものに限り、その目的を問わず、制限も一切なく、自由に複製や配布、送信や改変ができます。
        introduction_3_ohm_html: 私たちのホームページに載せた地図の様式は、CC0 指定によりパブリックドメインです。献呈は無条件で、目的を問わず制限も一切なく、自由に複製や配布、送信や改変ができます。
        introduction_4_creative_commons: Creative Commons Attribution-ShareAlike 2.0
        more_2_1_api_usage_policy: API利用ポリシー
        more_2_1_html: OpenHistoricalMapはオープンデータですが、第三者に対して地図利用APIもしくは地図タイルを無償で提供することはできません。詳しくは %{api_usage_policy_link}、%{tile_usage_policy_link}および%{nominatim_usage_policy_link}をご参照ください。
        more_2_1_nominatim_usage_policy: Nominatim利用規約
        more_2_1_tile_usage_policy: タイル利用規約
        more_title_html: 詳細を見る
      title: 著作権と謝辞
    export:
      cc0_url: https://creativecommons.org/publicdomain/zero/1.0/
      licence_details_ohm_html: 特記する場合を除き、OpenHistoricalMap のデータは %{cc0_link} によりパブリックドメインです。詳細は %{copyright_page_link} ページを参照してください。
      too_large:
        body: 領域が大きすぎて OpenHistoricalMap XML データとしてエクスポートできません。拡大するか、領域を小さくするか、以下に列挙したソースから一括データダウンロードを使用するかしてください。
        overpass:
          description: OpenHistoricalMapデータベースのミラーからこの範囲をダウンロード
        planet:
          description: 定期的に更新される、OpenHistoricalMap データベースの完全な複製
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            %{note_icon}をクリックするか、または地図上の同じアイコンをクリックしてください。
            地図にマーカーが追加されます。マーカーはドラッグで移動できます。
            メッセージを追加して保存をクリックすると、他のマッパーたちが調査します。
        join_the_community:
          explanation_html: 道路やあなたの住所が抜けているなど地図データの問題を見つけた場合、OpenHistoricalMapのコミュニティに参加して自分でデータの修正や追加をすることが最善の方法です。
    help:
      introduction: OpenHistoricalMapにはプロジェクトについて学んだり、質疑応答したり、協議したり、マッピングについての知識を文書化したりするさまざまなリソースがあります。
      slack:
        title: IRC
      welcome:
        description: OpenHistoricalMap の基礎が網羅してありますから、このクイック ガイドから始めましょう。
        title: OpenHistoricalMap へようこそ
      wiki:
        description: 詳細な OHM の説明が書かれたウィキを参照します。
    index:
      js_2: OpenHistoricalMap は地図の表示に JavaScript を使用します。
      license:
        copyright: OpenHistoricalMapは特筆する場合を除きパブリックドメインです。
      remote_failed: 編集に失敗しました - JOSM または Merkaartor を起動し、リモート制御オプションが有効になっていることを確認してください
    potlatch:
      removed: お使いの既定の OpenHistoricalMap エディタは Potlatch が選択されています。 Adobe Flash Player の撤退により、 Potlatch はウェブブラウザ上でもう利用できません。
    welcome:
      basic_terms:
        a_tag_html: "%{tag}はノードやウェイについて補足するデータです。レストランの名称や、橋が建てられた年などを意味します。"
        paragraph_1: OpenHistoricalMap には独自の用語がいくつかあります。ここでは手早く、いくつかのキーワードを紹介しましょう。
      introduction: フリーで編集可能な世界地図、OpenHistoricalMapへようこそ。サインアップが完了し、マッピングの準備はすべて整いました。知っておかなければならない重要事項を簡単に説明します。
      rules:
        para_1_html: OpenHistoricalMapに公式なルールはほとんどありませんが、参加者がコミュニティと協力し、コミュニケーションを取ることを期待していいます。手作業ではない編集活動を検討している場合は%{imports_link}および%{automated_edits_link}のガイドラインを読み、それらに従ってください。
      whats_on_the_map:
        off_the_map_html: OpenHistoricalMap %{doesnt} は、架空の代替歴史、古い地図に見られる既知の誤り、そして著作権で保護された情報源からのデータなどです。特別な許可が得られている場合を除いて、オンライン地図や紙地図からの情報をコピーしてはいけません。
