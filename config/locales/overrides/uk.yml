  layouts:
    intro_2_create_account: Створіть обліковий запис
    intro_header: Ласкаво просимо до OpenHistoricalMap!
    intro_text: OpenHistoricalMap — мапа світу, створена такими ж людьми, як і ви, для вільного використання під відкритою ліцензією.
    logo:
      alt_text: Логотип OpenHistoricalMap
    logout: Вийти
    tag_line: Вільна Вікі-мапа Світу
  oauth:
    scopes:
      openid: Вхід за допомогою OpenHistoricalMap
  sessions:
    destroy:
      heading: Вийти з OpenHistoricalMap
    new:
      login_to_authorize_html: Увійдіть до OpenHistoricalMap, щоб отримати доступ до %{client_app_name}.
  site:
    about:
      lede_text: OpenHistoricalMap створений спільнотою маперів, які вносять і підтримують дані про дороги, стежки, кав’ярні, вокзали і багато чого іншого по всьому світу.
      used_by_html: Досліджуйте світ у будь-який період часу з %{name}.
    about_section:
      contribute_1_user_diaries: щоденники учасників
      legal_1_aup: Правил щодо прийнятного використання
      legal_1_html: "Цей сайт та багато інших повʼязаних сервісів офіційно керуються \n%{group_link} від імені спільноти. Використання усіх сервісів, підконтрольних OSMF, здійснюється на основі %{terms_of_use_link}, %{aup_link} та нашій %{privacy_policy_link}."
      legal_1_privacy_policy: Політиці конфіденційності
      legal_1_terms_of_use: Умов використання
      legal_2_html: |-
        Будь ласка, %{contact_team_link}
        якщо у вас є питання щодо ліцензування, авторського права чи інші юридичні питання.
    communities:
      lede_text: Люди з усього світу роблять свій внесок в OpenHistoricalMap. Хоча багато хто бере участь самостійно, інші створили спільноти. Ці групи бувають різних розмірів і представляють географію від невеликих міст до великих регіонів, що включають кілька країн. Ці групи також можуть бути офіційними чи ні.
    copyright:
      legal_babble:
        attribution_example:
          title: Приклад того, як треба посилатись на OpenStreetMap на веб-сторінці
        contributors_footer_2_html: Включення даних до OpenHistoricalMap не означає, що постачальник цих даних якимось чином підтримує OpenHistoricalMap, надає які-небудь гарантії чи бере на себе якусь  відповідальність.
        contributors_intro_html: 'OpenHistoricalMap – це спільна робота тисяч людей та організацій, які, своєю чергою, використовують великий масив наукових, журналістських та документальних праць. Серед наших найважливіших джерел та учасників:'
        contributors_title_html: Подяки
        credit_1_html: 'У разі використання даних OpenHistoricalMap, вам потрібно зробити дві речі:'
        credit_2_this_copyright_page: сторінку з роз’ясненням ліцензійних вимог
        credit_title_html: Як посилатись на OpenHistoricalMap
        infringement_1_html: Члени спільноти OHM повинні завжди пам’ятати про те, що забороняється додавати дані з будь-яких захищених авторським правом джерел (наприклад, з Google Maps чи з друкованих мап) без отримання попереднього дозволу правовласників.
        introduction_4_creative_commons: Creative Commons Attribution-ShareAlike 2.0
        more_2_1_api_usage_policy: Правилами використання API
        more_2_1_html: |-
          Хоча OpenHistoricalMap є відкритими даними, ми не можемо надати безплатний API для мап для всіх.
          Ознайомтесь з нашими %{api_usage_policy_link}, %{tile_usage_policy_link} і %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Правилами використання сервісу Nominatim
        more_2_1_tile_usage_policy: Правилами використання тайлів
        more_title_html: Дізнатися більше
      title: Авторське право та подяки
    export:
      too_large:
        body: 'Ця ділянка дуже велика для експорту у вигляді XML-даних OpenHistoricalMap. Будь ласка, наблизьтесь або виберіть меншу ділянку, або скористайтеся одним з наступних джерел для завантаження великого обсягу даних:'
        overpass:
          description: Завантажити цю рамку межі з поточного вигляду мапи з дзеркала бази даних OpenHistoricalMap
        planet:
          description: Регулярно оновлювана копія усієї бази даних OpenHistoricalMap
          title: Планета OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Просто натисніть %{note_icon} або подібну піктограму на мапі.
            У результаті, на мапі з'явиться маркер, який Ви зможете перетягувати на мапі. Додайте Ваше повідомлення, а потім натисніть кнопку Зберегти, і інші учасники матимуть змогу з цим розібратись.
        join_the_community:
          explanation_html: Якщо ви помітили, неточності в наших даних, наприклад відсутня дорога або ваша адреса, найкращий спосіб це виправити — приєднатись до спільноти OpenHistoricalMap і додати або виправити дані самостійно.
    help:
      introduction: OpenHistoricalMap має різні ресурси для отримання інформації про проєкт, щоб поставити питання та отримати відповідь, для спільного обговорення і створення документації з мапінгу.
      slack:
        title: IRC
      welcome:
        description: Розпочніть з цього короткого посібника, що охоплює основи OpenHistoricalMap.
        title: Ласкаво просимо до OpenHistoricalMap
      wiki:
        description: Повна документація знаходиться у Вікі OHM.
    index:
      js_2: OpenHistoricalMap використовує JavaScript для мапи.
      remote_failed: Редагування не вдалося — переконайтеся, що JOSM або Merkaartor завантажений та втулок дистанційного керування увімкнений.
    potlatch:
      removed: Вашим типовим OpenHistoricalMap редактором зазначено Potlatch. Через припинення роботи Adobe Flash Player він більше не доступний для використання у вебоглядачі.
    welcome:
      basic_terms:
        a_tag_html: "%{tag} — це невелика кількість даних про вузол або лінію, наприклад, назва ресторану або рік будівництва мосту."
        paragraph_1: OpenHistoricalMap має власну термінологію. Ось кілька важливих слів, які можуть знадобитися.
      introduction: Ласкаво просимо до OpenHistoricalMap, вільної мапи світу, покращувати яку може кожен. Тепер, коли ви увійшли, все готово для початку редагування. Ось короткий посібник з інформацією про найважливіші речі, про які ви повинні знати.
      rules:
        para_1_html: |-
          OpenHistoricalMap має кілька формальних правил, але ми очікуємо, що всі учасники співпрацюватимуть
          зі спільнотою та спілкуватимуться з нею. Якщо ви маєте наміри робити внесок, окрім редагування вручну, прочитайте та дотримуйтеся вказівок щодо
          %{imports_link} та %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: OpenHistoricalMap %{doesnt} містить вигадані альтернативні історії, відомі помилки зі старовинних карт та дані з джерел, захищених авторським правом. Якщо у вас немає спеціального дозволу, не копіюйте сучасні карти минулого, які ви знайдете в Інтернеті або в друкованому вигляді.
