      about:
        paragraph_1: На відміну від інших мап, OpenHistoricalMap повністю створено людьми, такими ж як ви, і кожен може вільно виправляти, оновлювати, завантажувати та використовувати дані OpenHistoricalMap.
        welcome: Ласкаво просимо до OpenHistoricalMap
      duplicate_social_email: Якщо у вас вже є обліковий запис OpenHistoricalMap і ви хочете використовувати стороннього постачальника ідентифікаційних даних, будь ласка, увійдіть, використовуючи свій пароль, і змініть налаштування свого облікового запису.
