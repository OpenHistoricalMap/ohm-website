  site:
    about:
      lede_text: OpenHistoricalMap ji alî civata nexşesazên ku ji seransera dinyayê der barê kolanan, kafeyan, stasyonên trênan û zêdetirê wan de daneyan tevlî vir dike û diparêze.
    communities:
      lede_text: |-
        Ji temamê dinyayê însan beşdariya OpenHistoricalMapê dikin an wê bi kar tînin.
        Hinek kes wek şexsî tevlî dibin, hinek kes jî civatan ava kirine. Ev kom ji mezinehiyên cuda pêk tên û ji qezayên biçûk heya herêmên pir-welatî cografyayên mezin û biçûk temsîl dikin. Herwiha mimkin e ku fermî an nefermî bin.
    copyright:
      legal_babble:
        contributors_footer_2_html: Daxilbûna daneyan a di OpenHistoricalMapê de nayê maneya ku peydakera daneyan yê eslî OpenHistoricalMapê teswîb dike, garantiyekî temîn dike an jî berpirsîyariyekê qebûl dike.
        credit_1_html: 'Li cihê ku daneya OpenHistoricalMapê bi kar bînî, divê van du tiştan bikî:'
        credit_title_html: Em çawan wekî çavkaniyekê behsa OpenHistoricalMapê bikin
        infringement_1_html: Kesên ku tevkariyên OHMê dikin bila ti carî ji bîr nekin daneyên ji çavkaniyên ku mafên wan ên daneriyê parastî be (wekî nimûne Google Maps an jî nexşeyên çapkirî) bêyî destûra eşkere yê xwediyê wan, ji van çavkaniyan ti daneyek wernegrin.
        more_title_html: Zêdetir hîn bibe
    export:
      too_large:
        body: Ev der ji bo ku wekî Daneya XML a OpenHistoricalMapê were eksportkirin zahf mezin e. Xêra xwe hinek jî nêzîk bike an jî qadekî biçûktir bibijêre an jî ji bo daxistina daneyên mezin yek ji van çavkaniyên lîstekirî yên li jêr biemilîne.
        overpass:
          description: Vê qutiya sînorkar ji eyneyekî daneya OpenHistoricalMapê daxîne
        planet:
          description: Kopiyên daneyên OpenHistoricalMapê yê ku bi awayekî binîzam têne nûkirin
          title: Seyareya OHMê
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: Tenê bitikîne ser %{note_icon} an jî ji ser ekrana xerîteyê bitikîne ser eynî îkonê. Wê ev, ji nexşeyê re nîşankerek deyne ku tu karî bi kaşkirinê cihê vê nîşankerê biguherînî. Peyama xwe binivîse, pişt re bitikîne ser qeyd bike'yê, wê nexşesazên din lê bikolin.
        join_the_community:
          explanation_html: Heke te di daneyên nexşeya me de pirsgirêkek ferq kiribe, wekî mînak kolanek an jî adrêsa te kêm be, riya herî baş a dewamkirinê beşdarî civata me ya OpenHistoricalMapê bibe û tu bixwe rast bike an jî îlawe bike.
    help:
      introduction: OpenHistoricalMap ji bo hînbûna projeyê, pirskirin û cewabdana pirsan, û ji bo nîqaşên ku bi hevkarî têne kirin û ji bo belgekirina mijarên nexşeyê xwediyê çend çavkaniyan e.
      slack:
        title: IRC
      welcome:
        description: Bi vê rêbernameya kurt ê ku tê de esasên OpenHistoricalMapê heye dest pê bike.
        title: Bi xêr hatî OpenHistoricalMapê
      wiki:
        description: Ji bo belgeyên OHMyê yên bi berfirehî binêrin wîkiyê.
        title: Wîkî
    index:
      js_2: OpenHistoricalMap ji bo nîşandana nexşeya xwe ya şemetok JavaScriptê bi kar tîne.
      remote_failed: Sererastkirin bi ser neket - jê piştrast be ku JOSM an jî Merkaartor hatiye sazkirin û vebijêrka jidûrve kontrolê hatiye aktîvkirin
    potlatch:
      removed: Edîtora te ya OpenHistoricalMapê ya standard wek Potlatch hate bijartin. Ji ber ku Adobe Flash Player vekişiya, Potlatch êdî di gerokeke webê de ne berdest e.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap xwediyê argoya xwe (zimanê xwe yê taybet) ye. Vaye li vir çend peyvên ku wê bi kêrên we bên heye.
      introduction: Tu bi xêr hatî OpenHistoricalMapê, nexşeya dinyayê yê azad û yê ku bi rehetî dikare were sererastkirin. Niha te xwe qeyd kiriye û tu dikarî dest bi nexşekirinê bikî. Va ye li vir rêbernameyek bilez yê tiştên muhîm heye ku divê tu van bizanibî.
      rules:
        para_1_html: 'Her çiqas qaîdeyen fermî yên OpenHistoricalMapê hindik bin jî em ji hemû kesên tevkariya me dikin hêvî dikin ku bi civatê re bi hevkarî bixebitin û di têkiliyê de bin. Eger tu bifikirî ku xebatên xwe ne bi destê xwe bi rê ve bibî, xêra xwe ji jêr rêziknameyê bixwîne û bi ya rêziknameyê bike: %{imports_link} û %{automated_edits_link}.'
      whats_on_the_map:
        off_the_map_html: Çi tê de %{doesnt}? Daneyên qenaetî yên wek nirxandin, xisûsiyetên dîrokî an jî ferazî û daneyên ji çavkaniyên mafên wan ên daneriyê parastî wergirtî. Eger destûrekî we yê xisûsî tine be, ji nexşeyên onlayn an jî ji nexşeyên ser kaxizan kopî nekin.
