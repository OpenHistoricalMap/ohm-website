    intro_text: OpenHistoricalMap เป็นแผนที่โลกที่สร้างโดยผู้คนเช่นท่าน และใช้งานได้ไม่เสียค่าใช้จ่ายภายใต้สัญญาอนุญาตแบบเปิด
    logo:
      alt_text: ตราสัญลักษณ์ OpenHistoricalMap
    logout: ออกจากระบบ
    tag_line: แผนที่โลกวิกิ ใช้งานได้ไม่เสียค่าใช้จ่าย
  sessions:
    destroy:
      heading: ออกจากระบบ OpenHistoricalMap
  site:
    about:
      lede_text: OpenHistoricalMap เป็นโครงการซึ่งสร้างสรรค์ขึ้นจากชุมชนของผู้ใช้และผู้สนใจ ที่ได้ทำการสำรวจ ปรับปรุง แบ่งปันข้อมูลแผนที่ถนน ทางหลวง ทางเดินป่า, ร้านกาแฟ, สถานีรถไฟ, และอื่นๆ อีกมากมายจากทั่วทุกมุมโลก
      used_by_html: "%{name} ให้ข้อมูลแผนที่แก่เว็บไซต์ แอปพลิเคชั่นมือถือ และอุปกรณ์นับพัน"
    copyright:
      legal_babble:
        contributors_footer_2_html: การรวมข้อมูลใน OpenHistoricalMap ไม่ได้หมายความว่าผู้ให้บริการข้อมูลดั้งเดิม จะรับรอง OpenHistoricalMap รับประกัน หรือรับผิดชอบใด ๆ
        contributors_intro_html: |-
          ผู้มีส่วนร่วมของเราคือบุคคลนับพัน เรายังมีข้อมูลที่ใช้สัญญาอนุญาตแบบเปิดเผย
          จากตัวแทนการทำแผนที่ของชาติต่าง ๆ และแหล่งข้อมูลอื่น ๆ ต่อไปนี้:
        contributors_title_html: ผู้ร่วมสร้างสรรค์ของเรา
        credit_1_html: |-
          เราจำเป็นต้องให้ท่านแสดงที่มาหรือคำขอบคุณแก่ &ldquo;&copy; ผู้ร่วมสร้างสรรค์ OpenHistoricalMap
          &rdquo;.
        credit_title_html: วิธีการแสดงที่มาหรือคำขอบคุณ OpenHistoricalMap
        infringement_1_html: |-
          ผู้มีส่วนร่วม OHM จะถูกเตือนไม่ให้เพิ่มข้อมูลจากแหล่งข้อมูลที่มีลิขสิทธิ์
          (เช่น Google Maps หรือแผนที่แบบพิมพ์) โดยไม่ได้รับอนุญาตอย่าง
          ชัดเจนจากเจ้าของลิขสิทธิ์
        more_title_html: ค้นหาเพิ่มเติม
    export:
      too_large:
        body: พื้นที่ใหญ่เกินกว่าที่จะส่งออกเป็นข้อมูล XML ของ OpenHistoricalMap โปรดขยายเข้าหรือเลือกพื้นที่ที่เล็กลง หรืออาจจะใช้แหล่งข้อมูลข้างล่างในการดาวน์โหลดแฟ้มข้อมูลจำนวนมาก
        overpass:
          description: ดาวน์โหลดกล่องแบบมีขอบเขตจากมิเรอร์ของฐานข้อมูล OpenHistoricalMap
        planet:
          description: สำเนาของฐานข้อมูล OpenHistoricalMap ซึ่งปรับปรุงอย่างสม่ำเสมอ
          title: Planet OHM
    fixthemap:
      how_to_help:
        join_the_community:
          explanation_html: หากท่านประสบปัญหาเกี่ยวกับข้อมูลแผนที่ของเรา หรือพบข้อผิดพลาด เช่น ถนนหายไป หรือมีข้อผิดพลาดด้านที่อยู่ วิธีที่ดีที่สุดคือสมัครเป็นสมาชิก OpenHistoricalMap เพื่อดำเนินการแก้ไขด้วยตัวท่านเอง
    help:
      slack:
        title: ไออาร์ซี
      welcome:
        title: ยินดีต้อนรับสู่ OpenHistoricalMap
    index:
      js_2: OpenHistoricalMap ใช้จาวาสคริปต์ในการแสดงแผนที่
      remote_failed: การแก้ไขล้มเหลว - ตรวจสอบให้แน่ใจว่าได้โหลด JOSM หรือ Merkaartor และได้เปิดใช้งานตัวเลือกการควบคุมระยะไกลแล้ว
    welcome:
      basic_terms:
        paragraph_1: 'เมื่อคุณเข้ามาทำแผนที่ใน OpenHistoricalMap, คุณจะพบกับศัพท์เฉพาะหลายคำ ซึ่งความหมายจะอธิบายไว้เบื้องต้นที่ด้านล่างนี้:'
      introduction: 'ยินดิต้อนรับสู่ OpenHistoricalMap, แผนที่โลกแบบเสรีที่ทุกคนสามารถแก้ไขได้ ซึ่งตอนนี้คุณได้ลงทะเบียนมาแล้ว ก่อนจะไปลุยกัน ด้านล่างมีสิ่งสำคัญที่คุณควรจะรู้ไว้ตลอดการทำแผนที่ของคุณ:'
      whats_on_the_map:
        off_the_map_html: แต่ที่นี่จะ%{doesnt}ข้อมูลที่มาจากข้อคิดเห็น เช่นคะแนนเรตติ้ง สถานที่ที่เคยมีอยู่แต่ในอดีต (ปัจจุบันไม่มีแล้ว) รวมทั้งสถานที่ที่คาดว่าจะมีในอนาคต, และจะไม่รับข้อมูลจากแหล่งที่มีลิขสิทธิ์อื่นๆ, ฉะนั้นอย่าได้คัดลอกข้อมูลจากแผนที่ออนไลน์หรือแผนที่กระดาษมาใส่ (เว้นแต่คุณได้รับอนุญาตจากเจ้าของลิขสิทธิ์แล้ว)
