    auth_association:
      heading: Twój identyfikator nie jest jeszcze powiązany z kontem OpenHistoricalMap.
      option_1: Jeśli jesteś po raz pierwszy na OpenHistoricalMap, utwórz nowe konto za pomocą formularza poniżej.
    new:
      about:
        paragraph_1: W przeciwieństwie do innych map, OpenHistoricalMap jest w całości tworzona przez ludzi takich jak ty i każdy może ją bezpłatnie poprawiać, aktualizować, pobierać i używać.
        welcome: Witamy w OpenHistoricalMap
      duplicate_social_email: Jeśli posiadasz już konto OpenHistoricalMap i chcesz skorzystać z usług zewnętrznego dostawcy tożsamości, zaloguj się, podając swoje hasło, i zmień ustawienia swojego konta.
      please_contact_support_html: Skontaktuj się z %{support_link} w celu umówienia się na założenie konta – postaramy się rozpatrzyć prośbę jak najszybciej.
      signup_to_authorize_html: Zaloguj się do OpenHistoricalMap, aby uzyskać dostęp do %{client_app_name}.
