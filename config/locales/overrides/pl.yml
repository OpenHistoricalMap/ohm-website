    new:
      login_to_authorize_html: Zaloguj się do OpenHistoricalMap, aby uzyskać dostęp do %{client_app_name}.
  site:
    about:
      lede_text: OpenHistoricalMap jest tworzony przez społeczność dodającą dane o drogach, ścieżkach, kawiarniach, dworcach i wielu innych, na całym świecie.
    about_section:
      contribute_1_user_diaries: dzienniki użytkowników
      legal_1_aup: Zasadom dopuszczalnego użytkowania
      legal_1_html: Ta strona i wiele innych powiązanych usług są formalnie obsługiwane przez %{group_link} w imieniu społeczności. Korzystanie ze wszystkich usług obsługiwanych przez OSMF podlega naszym %{terms_of_use_link}, %{aup_link} i naszej %{privacy_policy_link}.
      legal_1_privacy_policy: Polityce prywatności
      legal_1_terms_of_use: Warunkom użytkowania
      legal_2_html: W przypadku pytań dotyczących licencji, praw autorskich lub innych kwestii prawnych prosimy o %{contact_team_link}.
    communities:
      lede_text: Ludzie z całego świata tworzą lub używają OpenHistoricalMap. Podczas gdy niektórzy działają sami, inni utworzyli społeczności. Grupy te są różnej wielkości i reprezentują obszary geograficzne od małych miast do dużych regionów. Mogą być również formalne lub nieformalne.
    copyright:
      legal_babble:
        contributors_footer_2_html: Włączenie danych do OpenHistoricalMap nie musi oznaczać, że udostępniający je podmiot popiera OpenHistoricalMap, udziela jakiejkolwiek gwarancji lub ponosi jakąkolwiek odpowiedzialność.
        credit_1_html: 'W przypadku korzystania z danych OpenHistoricalMap należy:'
        credit_2_this_copyright_page: tej strony licencyjnej
        infringement_1_html: Autorzy OHM powinni pamiętać, aby nigdy nie dodawać danych z żadnych źródeł chronionych prawami autorskimi (jak np. Google Maps i&nbsp;większość map drukowanych) bez wyraźnego pozwolenia właściciela praw autorskich.
        introduction_4_creative_commons: Uznanie autorstwa na tych samych warunkach 2.0
        more_2_1_api_usage_policy: Polityką korzystania z API
        more_2_1_html: Chociaż dane OpenHistoricalMap są otwarte, nie jesteśmy w stanie zapewnić nieograniczonego dostępu do naszego API wszystkim chętnym. Zapoznaj się z naszą %{api_usage_policy_link}, %{tile_usage_policy_link} oraz %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Polityką korzystania z Nominatima
        more_2_1_tile_usage_policy: Polityką korzystania z kafelków
        more_title_html: Dowiedz się więcej
      title: Prawa autorskie i&nbsp;licencja
    export:
      too_large:
        body: 'Ten obszar jest zbyt duży, aby go wyeksportować jako dane XML OpenHistoricalMap. Proszę przybliżyć widok, wybrać  mniejszy obszar lub użyć jednego z następujących zasobów, aby pobrać większą ilość danych:'
        overpass:
          description: Pobierz ten obszar z serwera lustrzanego przechowującego bazę danych OpenHistoricalMap
        planet:
          description: Regularnie aktualizowane kopie całej bazy danych OpenHistoricalMap
          title: Planeta OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: 'Wystarczy, że klikniesz tutaj: %{note_icon} lub na taką samą ikonkę przeglądając mapę na głównej stronie. Pojawi się wtedy pinezka, którą możesz przesunąć, przeciągając. Wpisz wiadomość, kliknij Zapisz, a inni mapujący zajmą się opisanym problemem.'
        join_the_community:
          explanation_html: Jeśli zauważyłeś problem z mapą, na przykład brakującą ulicę lub adres, najlepszym sposobem na dodanie lub naprawę takich danych jest dołączenie do społeczności OpenHistoricalMap i dokonanie edycji lub naprawy własnoręcznie.
    help:
      introduction: OpenHistoricalMap ma wiele zasobów pomocnych w poznawaniu projektu, pozwalających na otrzymywanie odpowiedzi na pytania oraz dyskutowanie i dokumentowanie tematów związanych z mapowaniem.
      slack:
        title: IRC
      welcome:
        description: Zacznij od tego krótkiego przewodnika, obejmującego podstawy OpenHistoricalMap.
        title: Witamy w OpenHistoricalMap
      wiki:
        description: Zapoznaj się z Wiki, aby uzyskać szczegółową dokumentację OHM.
    index:
      js_2: OpenHistoricalMap używa JavaScriptu do wyświetlania tej mapy.
      remote_failed: Nieudane edytowanie – proszę sprawdzić, czy program JOSM lub Merkaartor jest uruchomiony i funkcja Remote Control jest włączona
    potlatch:
      removed: Twój domyślny edytor OpenHistoricalMap to Potlatch. Ponieważ Adobe Flash Player został wycofany, Potlatch nie jest już dostępny w przeglądarce.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap ma własny slang. Oto kilka słów, które ci się przydadzą.
      introduction: Witamy w OpenHistoricalMap, wolnej mapie świata. Teraz, gdy masz już konto, możesz przystąpić do mapowania. Oto krótki przewodnik z najważniejszymi rzeczami, o których musisz wiedzieć.
      rules:
        para_1_html: W OpenHistoricalMap jest kilka formalnych zasad, ale oczekujemy, że wszyscy uczestnicy będą współpracować i komunikować się ze społecznością. Jeśli planujesz jakieś działania inne niż same edycje manualne, proszę przeczytaj i dostosuj się do zaleceń dotyczących %{imports_link} oraz %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Nie wprowadzamy obiektów nieistniejących, hipotetycznych oraz danych ze źródeł objętych prawami autorskimi. Jeśli nie masz pozwolenia, nie kopiuj z innych map (zarówno tych papierowych, jak i online).%{doesnt}
