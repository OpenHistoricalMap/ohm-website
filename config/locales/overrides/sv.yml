  site:
    about:
      lede_text: OpenHistoricalMap är byggt av en gemenskap av kartografer som bidrar och underhåller data om vägar, stigar, caféer, järnvägsstationer och mycket mer, över hela världen.
      used_by_html: Utforska världen i vilken tidsperiod som helst med %{name}.
    about_section:
      contribute_1_user_diaries: användardagböcker
      legal_1_aup: Riktlinjer för tillåten användning
      legal_1_html: Denna webbplats och relaterade tjänster drivs av %{group_link} som är anslutna till OpenStreetMap US på uppdrag av gemenskapen. Användning av alla OpenHistoricalMap-tjänster omfattas av våra %{terms_of_use_link}, %{aup_link} och %{privacy_policy_link}.
      legal_1_privacy_policy: Integritetspolicy
      legal_1_terms_of_use: Användarvillkor
      legal_2_html: |-
        Vänligen %{contact_team_link}
        om du har frågor om licensiering, upphovsrätt eller andra juridiska frågor.
    communities:
      lede_text: Människor från hela världen bidrar till eller använder OpenHistoricalMap. Medan många deltar som individer har andra bildat gemenskaper. Dessa grupper finns i en mängd olika storlekar och representerar geografier från små städer till stora regioner med flera länder. De kan också vara formella eller informella.
    copyright:
      legal_babble:
        attribution_example:
          title: Exempel på hur en webbsida kan ange OpenStreetMap som källa
        contributors_footer_2_html: Införandet av uppgifter i OpenHistoricalMap innebär inte att den ursprungliga datagivaren stödjer OpenHistoricalMap, ger någon som helst garanti eller tar på sig något ansvar.
        contributors_intro_html: 'OpenHistoricalMap är ett samarbete mellan tusentals individer och organisationer, som i sin tur drar nytta av en stor mängd forskning, journalistik och dokumentation. Våra viktigaste källor och bidragsgivare inkluderar:'
        contributors_title_html: Erkännanden
        credit_1_html: 'När du använder OpenHistoricalMap-data, måste du göra dessa två saker:'
        credit_2_this_copyright_page: denna upphovsrättssida
        credit_title_html: Hur man erkännder OpenHistoricalMap
        infringement_1_html: Bidragsgivare till OHM påminns om att aldrig lägga till data från upphovsrättsskyddade källor (t.ex. Google Maps och tryckta kartor) utan uttryckligt tillstånd från upphovsrättsinnehavarna.
        introduction_4_creative_commons: Creative Commons Erkännande-DelaLika 2.0
        more_2_1_api_usage_policy: API-användningspolicy
        more_2_1_html: Även om OpenHistoricalMap är öppen data kan vi inte tillhandahålla ett gratis kart-API för tredje part. Se våra %{api_usage_policy_link}, %{tile_usage_policy_link} och %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Nominativ användningspolicy
        more_2_1_tile_usage_policy: Användningspolicy för Brickor
        more_title_html: Mer information
      title: Upphovsrätt och erkännanden
    export:
      too_large:
        body: 'Detta område är för stort för att exporteras som OpenHistoricalMap XML-data. Vänligen zooma in eller välj ett mindre område, eller använd en av följande källor för nedladdningar av bulkdata:'
        overpass:
          description: Hämta denna avgränsningsram från en spegel av OpenHistoricalMap-databasen
        planet:
          description: Regelbundet uppdaterade kopior av den kompletta OpenHistoricalMap-databasen
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Klicka bara på %{note_icon} eller samma ikon i kartrutan.
            Detta lägger till en markör på kartan som du kan flytta
            genom att dra. Skriv ditt meddelande och klicka sedan på spara, så kommer andra kartritare att undersöka.
        join_the_community:
          explanation_html: Om du har hittat ett problem med vår kartdata, till exempel att en väg eller din adress saknas, är den bästa lösningen att gå med i OpenHistoricalMap-gemenskapen och själv lägga till eller reparera datan.
    help:
      introduction: OpenHistoricalMap har flera resurser som hjälper dig att lära dig om projektet, för att ställa och svara på frågor, och tillsammans diskutera och dokumentera frågor gällande kartering.
      slack:
        title: IRC
      welcome:
        description: Börja med den här snabbguiden som täcker grunderna i OpenHistoricalMap.
        title: Välkommen till OpenHistoricalMap
      wiki:
        description: Sök i wikin för ingående dokumentation av OHM.
    index:
      remote_failed: Redigering misslyckades - kontrollera att JOSM eller Merkaartor är startad och fjärrkontrollsalternativet är aktiverat
    potlatch:
      removed: Din standardredigerare på OpenHistoricalMap är Potlatch. På grund av att Adobe Flash Player har dragits tillbaka, kan inte Potlatch längre användas i webbläsaren.
    welcome:
      basic_terms:
        a_tag_html: En %{tag} är lite data om en nod eller väg, som en restaurangs namn eller året då en bro byggdes.
        paragraph_1: OpenHistoricalMap har en del egen jargong. Här är några begrepp som kan vara bra att förstå.
      introduction: Välkommen till OpenHistoricalMap, den fria och redigerbara kartan över världen. Nu när du har registrerat dig är du klar för att börja kartlägga saker. Här är en snabb genomgång av de viktigaste sakerna du behöver veta.
      rules:
        para_1_html: |-
          OpenHistoricalMap har få formella regler men vi förväntar oss att alla deltagare samarbetar
          med, och kommunicerar med, gemenskapen. Om du funderar på några andra aktiviteter än att redigera för hand, läs och följ riktlinjerna på
          %{imports_link} och %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: "OpenHistoricalMap %{doesnt} inkluderar fiktiva alternativa historier, \nkända fel från antika kartor, och data från upphovsrättsskyddade källor. Om du inte har särskilt tillstånd, kopiera inte från moderna kartor från det förflutna som du hittar online eller i tryck."
