    about_section:
      contribute_1_user_diaries: wužiwarske dźeniki
      legal_1_privacy_policy: Prawidła priwatnosće
      legal_1_terms_of_use: Wužiwanske wuměnjenja
    copyright:
      legal_babble:
        attribution_example:
          title: Přikład, kak so ma OpenHistoricalMap na webstronje pokazać
        contributors_footer_2_html: Zapřijimanje datow do OpenHistoricalMap njerěka, zo poskićowar originalnych datow OpenHistoricalMap připóznawa, někajku garantiju dodawa abo rukowanje přewozmje.
        contributors_intro_html: |-
          OpenHistoricalMap je zhromadna próca tysacow ludźi a organizacijow, kotřiž ze swojeje strony z wulkeho poola wučenosće, žurnalizma a zastawanja pismowstwa.

          Naše najbóle substancielne žórła a sobuskutkowarjo su:
        contributors_title_html: Dźakprajenja
        credit_1_html: 'Hdyž daty OpenHistoricalMap wužiwaš, dyrbiš slědowacej dwě wěcy činić:'
        credit_title_html: Kak ma so awtorstwo OpenHistoricalMap pokazać
        infringement_1_html: Sobuskutkowacych OHM namołwjamy, zo ženje daty ze žórłow, kotrež su přez awtorske prawo škitane (na př. z Google Maps abo z wućišćanych kartow) bjez wurazneje dowolnosće awtorow  njepřidawaja.
        more_title_html: Dalše informacije
      title: Awtorske prawo a připóznaća
    export:
      too_large:
        body: 'Tutón wobłuk je přewulki za eksportowanje jako XML-daty OpenHistoricalMap. Prošu powjetš abo wubjer mjeńši wobłuk abo wužij jedne ze slědowacych žórłow za sćehnjenje wulkich mnóstwow datow:'
        overpass:
          description: Tutón wobłuk ze špiheloweho serwera datoweje banki OpenHistoricalMap sćahnyć
        planet:
          description: Prawidłownje zaktualizowane kopije dospołneje datoweje banki OpenHistoricalMap
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Klikń prosće na %{note_icon} abo na samsny symbol w zwobraznjenju karty.
            To přida karće marku, kotruž móžeš přez ćehnjenje přesunyć.
            Přidaj swoju powěsć, klikń potom na Składować a druzy kartěrowarjo to přeslědźa.
        join_the_community:
          explanation_html: Jeli sy problem z našimi kartowymi datami pytnył, na přikład dróha abo twoja adresa faluje, je najlěpše wašnje, z tym pokročować, so zhromadźenstwu OpenHistoricalMap přiidružić a sam daty přidać abo korigować.
    help:
      introduction: OpenHistoricalMap ma wšelake resursy za zeznaće projekta, prašenja a wotmołwy wo něčim a zhromadnu diskusiju a dokumentowanje kartěrowanskich temow.
      slack:
        title: IRC
      welcome:
        description: Započń z tutym spěšnym nawodom, kotryž zakłady OpenHistoricalMap wobsahuje.
        title: Witaj k OpenHistoricalMap
      wiki:
        description: Přepytaj wiki za nadrobnej dokumentaciju OHM
    index:
      js_2: OpenHistoricalMap JavaScript za slippy map wužiwa.
      remote_failed: Wobdźěłowanje je so njeporadźiło - zawěsć, zo JOSM abo Merkaartor je začitany a dalokowodźenska opcija je zmóžnjena
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap někotre wosebite zapřijeća wužiwa. Tu su někotre z nich, kotrež móhli ći wužitne być.
      introduction: Witaj k OpenHistoricalMap, swobodnej a wobdźěłujomnej karće swěta. Nětko, po tym zo sy so zregistrował, móžeš so do kartěrowanja dać. Tu je krótki nawod z najwažnišimi informacijemi, kotrež dyrbiš wědźeć.
      rules:
        para_1_html: OpenHistoricalMap ma jenož mało formelnych prawidłow, ale wočakujemy wot wšěch wobdźělnikow, zo bychu ze zhromadźenstwom hromadźe dźěłali a komunikowali. Planuješ-li druhe činitosće hač wobdźěłanje z ruku, prošu přečitaj prawidła wo %{imports_link} a %{automated_edits_link} a měj so po nim.
      whats_on_the_map:
        off_the_map_html: Štož %{doesnt}ma wobsahować, su subjektiwne daty kaž pohódnoćenja, historiske abo hypotetiske funkcije a daty z přez awtorske prawo škitanych žórłow. Njekopěruju z online- abo papjernych kartow, chibazo maš wosebitu dowolnosć.
