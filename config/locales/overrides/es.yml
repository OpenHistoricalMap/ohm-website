    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Simplemente haz clic en %{note_icon} o en el mismo icono en la visualización del mapa.
            Esto agregará un marcador al mapa que puedes mover arrastrándolo. Agrega tu mensaje, luego haz clic en guardar, y otros mapeadores lo investigarán.
        join_the_community:
          explanation_html: Si ha notado un problema con los datos de nuestros mapas, por ejemplo, falta una carretera o su dirección, la mejor manera de continuar es unirse a la comunidad OpenHistoricalMap y agregar o reparar los datos usted mismo.
      other_concerns:
        concerns_ohm_html: |-
          Si tienes inquietudes sobre cómo se utilizan nuestros datos o sobre el contenido, consulta nuestro
          %{copyright_link} para obtener más información legal, o %{contact_link}.
