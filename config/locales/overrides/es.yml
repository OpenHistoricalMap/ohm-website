  site:
    about:
      lede_text: OpenHistoricalMap es un ambicioso proyecto liderado por la comunidad para mapear los cambios en la geografía natural y humana en todo el mundo… a lo largo de los siglos.
      used_by_html: Explora el mundo en cualquier período de tiempo con %{name}.
    about_section:
      contribute_1_forum: nuestro foro de discusión
      contribute_1_ohm_html: Nuestra creciente comunidad de colaboradores voluntarios incluye historiadores aficionados y profesionales, colaboradores de OpenStreetMap y Wikipedia, especialistas en SIG y personas comunes conocedoras de su entorno. Nos apasiona documentar el mundo y ayudar a las comunidades del mundo real a contar sus historias. Para obtener más información sobre nuestra comunidad, consulte %{wiki_link}, visite %{forum_link}, lea %{user_diaries_link} y siga nuestra cuenta de %{mastodon_link} o %{bluesky_link}.
      contribute_1_user_diaries: diarios de usuario
      contribute_1_wiki: nuestra extensa documentación en la wiki
      contribute_1_wiki_url: https://wiki.openstreetmap.org/wiki/ES:OpenHistoricalMap
      contribute_2_create_account: crear una cuenta gratuita
      contribute_2_donations: aceptamos donaciones caritativas
      contribute_2_html: |-
        Puede comenzar a contribuir al mapa hoy mismo por %{create_account_link}.
        También %{donations_link} a través de %{osmus_link}, una organización sin fines de lucro 501(c)(3) con estatus exento de impuestos.
        Su generosa donación se destinará directamente a mantener OpenHistoricalMap funcionando sin problemas para todos.
      contribute_2_osmus: OpenStreetMap EE.UU.
      contribute_title: Tú puedes ayudar
      legal_1_aup: Normativas de uso aceptable
      legal_1_group: un grupo informal
      legal_1_html: Este sitio y los otros servicios relacionados son operados por %{group_link} afiliado a OpenStreetMap EE.UU. en nombre de la comunidad. El uso de todos los servicios de OpenHistoricalMap está sujeto a nuestros %{terms_of_use_link}, %{aup_link} y %{privacy_policy_link}.
      legal_1_privacy_policy: Normativa de privacidad
      legal_1_terms_of_use: Términos de Uso
      legal_2_contact_team: contactar con el equipo de OpenHistoricalMap
      legal_2_html: Sí tienes alguna pregunta sobre licencias, derechos de autor u otras cuestiones legales, por favor %{contact_team_link}.
      legal_3_html: OpenHistoricalMap® es una marca registrada (N.º de registro de EE.UU. 90&nbsp;019&nbsp;364). OpenStreetMap y el logotipo de la lupa son %{osmf_trademarks_link}.
      legal_3_osmf_trademarks: marcas registradas de la Fundación OpenStreetMap
      open_data_1_1_html: El mapa en nuestra página de inicio es sólo una de las muchas maneras de experimentar la información histórica que hemos recopilado. Los datos subyacentes están %{reuse_link} como descarga o a través de varias API gratuitas compatibles con software de código abierto.
      open_data_1_1_reuse: disponible para reutilización
      open_data_2_copyright_license: Derechos de autor y agradecimientos
      open_data_2_html: |-
        Los datos son de dominio público salvo indicación contraria.
        Usted es libre de usarlos para cualquier propósito, sin ninguna restricción.
        Sin embargo, agradecemos enormemente cualquier crédito o cita que proporcione a OpenHistoricalMap.
        Para obtener más detalles y agradecimientos, véase %{copyright_license_link}.
      scope_html: Los imperios surgen y caen. Los glaciares desaparecen. Las lenguas y las religiones se propagan de una región a otra. Los sencillos caminos de tierra se convierten en carreteras y ferrocarriles concurridos. Los edificios modestos dan paso a imponentes rascacielos. Y recuerdas cómo era tu barrio. Todo esto pertenece a OpenHistoricalMap.
      scope_title: Grande y pequeño, entonces y ahora
    add_a_note:
      para_1: Si sólo deseas corregir algo pequeño y no tienes tiempo para registrarte y aprender a editar, añadir una nota es fácil.
    communities:
      lede_text: |-
        Personas de todo el mundo contribuyen o utilizan OpenHistoricalMap.
        Aunque muchos participan a título individual, otros han formado comunidades.
        Estos grupos son de distintos tamaños y representan geografías que van desde pequeñas ciudades a grandes regiones multinacionales.
        También pueden ser formales o informales.
    copyright:
      legal_babble:
        attribution_example:
          alt: Un enlace etiquetado como OHM en la esquina inferior derecha de una página web, debajo de un control deslizante de tiempo.
          title: Ejemplo de cómo dar reconocimiento a OpenHistoricalMap en una página web
        contributors_2_ohm_html: 'Los estilos de mapas que aparecen en la página de inicio contienen datos de OpenHistoricalMap y las siguientes fuentes:'
        contributors_anr_communes_campop: Grupo de Cambridge para la Historia de la Población y la Estructura Social
        contributors_anr_communes_html: Datos creados por el proyecto %{anr_communes_link} en colaboración con %{campop_link}.
        contributors_anr_communes_project: ANR COMMUNES
        contributors_footer_2_html: La inclusión de datos en OpenHistoricalMap no implica que el proveedor de la información original apoya a OpenHistoricalMap, proporciona alguna garantía, o acepta cualquier responsabilidad.
        contributors_globcover: GlobCover
        contributors_globcover_html: Cobertura terrestre de %{globcover_link}, © Agencia Espacial Europea 2010 y Universidad Católica de Lovaina, disponible para su reutilización con fines educativos y/o científicos con atribución.
        contributors_gmted: Datos globales de elevación del terreno en múltiples resoluciones 2010
        contributors_gmted_html: 'Datos de elevación del terreno de Danielson, J.J., y Gesch, D.B., 2011, %{gmted_link} (GMTED2010): Informe de archivo abierto del Servicio Geológico de Estados Unidos 2011–1073, 26 p. Dominio público.'
        contributors_intro_html: |-
          OpenHistoricalMap es el resultado de un esfuerzo colaborativo de miles de personas y organizaciones que, a su vez, basan sus contribuciones en un amplio corpus de investigaciones académicas, periodísticas y registros.
          Entre nuestras fuentes y colaboradores más importantes se incluyen:
        contributors_more_sources_html: "%{sources_link} están disponibles en la wiki de OpenStreetMap."
        contributors_more_sources_page: Fuentes adicionales y colaboradores
        contributors_natural_earth: Natural Earth
        contributors_natural_earth_html: Los conjuntos de datos de %{natural_earth_link} en el dominio público.
        contributors_newberry: biblioteca Newberry
        contributors_newberry_ahcb: Atlas de límites históricos de los condados
        contributors_newberry_ahcb_html: Los datos del %{ahcb_link}, un proyecto del Centro William M. Scholl para la Historia y la Cultura Estadounidenses en la %{newberry_link}, reutilizable ilimitadamente.
        contributors_osm: Colaboradores de OpenStreetMap
        contributors_osm_cc_by_sa: CC BY-SA 2.0
        contributors_osm_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/2.0/deed.es
        contributors_osm_html: Datos sobre las costas, los cuerpos de agua y los arroyos © %{osm_link}, %{cc_by_sa_link}.
        contributors_title_html: Reconocimientos
        credit_1_html: Si bien la ley de derechos de autor no restringe ni impone condiciones al uso de contenido de dominio público, agradecemos enormemente cualquier crédito que proporcione a OpenHistoricalMap al reutilizar, adaptar o utilizar de alguna otra forma nuestros mapas o datos.
        credit_2_home: nuestra página de inicio
        credit_2_ohm_html: |-
          Puede presentar este reconocimiento de cualquier manera razonable.
          Por ejemplo, en un mapa digital, puede mencionar OpenHistoricalMap en letra pequeña en la esquina, vinculando a %{this_copyright_page_link} o %{home_link}:
        credit_2_this_copyright_page: esta página de derechos de autor
        credit_3_credit_html: Datos del mapa cortesía del proyecto %{project_link}, en el dominio público a menos que se indique lo contrario.
        credit_3_ohm_html: 'O puede incluir un reconocimiento más claro en una página de créditos separada donde mencione otras fuentes:'
        credit_4_ohm_html: En un mapa impreso, puede colocar el reconocimiento en la leyenda. En un libro, puede describir su uso de OpenHistoricalMap en una nota al pie de página, una bibliografía o un colofón. En un artículo académico, puede citarnos de varias maneras según lo que haya utilizado.
        credit_title_html: Cómo dar reconocimiento a OpenHistoricalMap
        infringement_1_html: Se le recuerda a los colaboradores de OHM que no deben añadir información procedente de alguna fuente con derechos de autor reservados (p. ej. Google Maps o mapas impresos) sin el consentimiento explícito de los poseedores de los derechos de autor.
        infringement_2_ohm_contact_team: contactar con el equipo de OpenHistoricalMap con el asunto “SOLICITUD DE RETIRADA”.
        infringement_2_ohm_html: Si cree que se ha añadido material protegido por derechos de autor de forma inapropiada a la base de datos de OpenHistoricalMap o a este sitio, por favor %{contact_team_link}.
        introduction_1_cc0: Creative Commons CC0
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/deed.es
        introduction_1_ohm_html: |-
          OpenHistoricalMap es una colección de datos geoespaciales abiertos.
          Salvo que se indique lo contrario, los datos de OpenHistoricalMap están dedicados al dominio público bajo una dedicación %{cc0_link}.
          En la medida en que lo que use sea de dominio público, usted es libre de copiarlo, distribuirlo, transmitirlo y adaptarlo para cualquier propósito, sin ninguna restricción.
        introduction_2_cc_by: Creative Commons Atribución
        introduction_2_cc_by_sa: Creative Commons Atribución-CompartirIgual
        introduction_2_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/4.0/deed.es
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/deed.es
        introduction_2_ohm_html: |-
          La base de datos OpenHistoricalMap incorpora algunas características de mapas individuales bajo derechos de autor. Estas características están disponibles bajo una licencia abierta, como %{cc_by_link} (CC&nbsp;BY) o %{cc_by_sa_link} (CC&nbsp;BY-SA), como se indica en las etiquetas %{license_key_link} en elementos individuales.
          En la medida en que utilice cualquier parte significativa de la base de datos que esté cubierta por una licencia de “compartir por igual”, debe respetar los términos de esta licencia en su propia adaptación.
        introduction_3_ohm_html: Los estilos de mapas que aparecen en nuestra página de inicio son dedicados al dominio público bajo una dedicación CC0. Puedes copiarlos, distribuirlos, transmitirlos y adaptarlos para cualquier propósito, sin restricciones.
        introduction_4_creative_commons: Creative Commons Atribución-CompartirIgual 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/deed.es
        introduction_4_ohm_html: Nuestra documentación está licenciada bajo los términos de %{creative_commons_link} (CC BY-SA 2.0).
        more_1_ohm_html: Obtenga más información sobre las consideraciones legales al utilizar nuestros datos y cómo darnos crédito %{wiki_link}.
        more_1_wiki: en la wiki de OpenStreetMap
        more_2_1_api_usage_policy: Normativa de uso de la API
        more_2_1_html: "Aunque OpenHistoricalMap es un sistema de datos abiertos, no podemos proporcionar una API de mapas gratuita ni teselas de mapas gratuitas para terceros. \nMira nuestra %{api_usage_policy_link}, %{tile_usage_policy_link} y %{nominatim_usage_policy_link}."
        more_2_1_nominatim_usage_policy: Normativa de uso de Nominatim
        more_2_1_tile_usage_policy: Política de uso de teselas
        more_title_html: Para saber más
