    welcome:
      basic_terms:
        a_tag_html: Una %{tag} es un poco de información acerca de un nodo o vía, como un nombre de restaurante o el año en que se construyó un puente.
        paragraph_1: OpenHistoricalMap tiene su propia jerga. Estas son algunas palabras clave que le pueden ser útiles.
      introduction: Bienvenido a OpenHistoricalMap, el mapa gratuito y editable de la historia mundial. Ahora que te has registrado, estás listo para empezar a mapear. Aquí tienes una guía rápida con lo más importante que debes saber.
      rules:
        para_1_html: OpenHistoricalMap tiene pocas reglas, pero esperamos que todos los participantes colaboren y se comuniquen entre ellos. Si estás pensando en realizar otras actividades diferentes a la edición a mano, por favor, lee y sigue las instrucciones en %{imports_link} y %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: OpenHistoricalMap %{doesnt} incluye las historias alternativas ficticias, los errores conocidos de mapas antiguos y los datos de fuentes protegidas por derechos de autor. A menos que tengas un permiso especial, no copies los mapas modernos del pasado que encuentre en línea o en papel.
        on_the_map_ohm_html: OpenHistoricalMap rastrea los cambios en la geografía natural y humana en todo el mundo. Tenemos millones de entradas de %{past_and_present}, desde imperios y glaciares hasta casas y restaurantes. Puedes mapear cualquier característica del mundo real que te resulte interesante.
        past_and_present: tanto el pasado como el presente
