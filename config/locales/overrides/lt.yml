      heading: Atsijungti nuo OpenHistoricalMap
    new:
      login_to_authorize_html: Prisijunkite prie OpenHistoricalMap, kad pasiektumėte %{client_app_name}.
  site:
    about:
      lede_text: OpenHistoricalMap kuria bendruomenė žymėtojų, kuriančių ir prižiūrinčių kelių, takų, kavinių, stočių ir kitokius pasaulio duomenis.
    about_section:
      contribute_1_user_diaries: naudotojų dienoraščiai
      legal_1_aup: Priimtino naudojimo politika
      legal_1_html: |-
        Ši svetainė ir daugelis susijusių paslaugų formaliai valdomi
        %{group_link}
        bendruomenės vardu. Visų OSMF valdovų paslaugų naudojimui taikoma
        %{terms_of_use_link}, %{aup_link} ir mūsų %{privacy_policy_link}.
      legal_1_privacy_policy: Privatumo politika
      legal_1_terms_of_use: Naudojimo sąlygos
      legal_2_html: |-
        Prašome %{contact_team_link}
        Jei turite licencijų, autorių teisių ar kitų teisinių klausimų.
    copyright:
      legal_babble:
        contributors_footer_2_html: Duomenų įtraukimas į OpenHistoricalMap nereiškia, kad originalių duomenų tiekėjas remia OpenHistoricalMap. Nenumatomos jokios garantijos ir neprisiimama jokia atsakomybė.
        credit_1_html: 'Naudodami OpenHistoricalMap duomenis, privalote atlikti šiuos du dalykus:'
        credit_2_this_copyright_page: šį autorių teisių puslapį
        credit_title_html: Kaip paminėti OpenHistoricalMap
        infringement_1_html: OHM pildytojai primenami niekada nesinaudoti autorių teisėmis apsaugotų šaltinių (pvz. Google Maps ar spausdintų žemėlapių) be leidimo naudoti.
        introduction_4_creative_commons: Creative Commons Attribution-ShareAlike 2.0
        more_title_html: Papildoma informacija
    export:
      too_large:
        body: Ši sritis per didelė, kad būtų galima eksportuoti OpenHistoricalMap XML duomenis. Padidinkite, parinkite mažesnę sritį arba naudokite vieną iš didelio duomenų kiekio atsiuntimo šaltinių.
        overpass:
          description: Atsisiųsti šią apimtį iš OpenHistoricalMap duombazės kopijos
        planet:
          description: Periodiškai atnaujinamos pilnos OpenHistoricalMap duomenų bazės kopijos
          title: OHM planeta
    fixthemap:
      how_to_help:
        join_the_community:
          explanation_html: Jei pastebėjote žemėlapio duomenų problemą, pavyzdžiui radote trūkstamą kelią ar adresą, geriausias variantas yra prisijungti prie OpenHistoricalMap bendruomenės ir pridėti ar pataisyti duomenis patiems.
    help:
      discord:
        description: 'Prisijunkite prie OpenStreetMap World Discord serverio ir gaukite pagalbą #openhistoricalmap kanale.'
      forum:
        description: Dalyvaukite ilgesnėse diskusijose ir neoficialiuose pokalbių kambariuose naudodami savo OHM paskyrą.
        title: Forumas
      introduction: Yra kelios vietos, kur galima rasti informacijos apie OpenHistoricalMap, užduoti klausimus, diskutuoti ir dokumentuoti žymėjimo temas.
      mailing_list:
        description: Prenumeruokite mūsų nedidelės apimties naujienlaiškį.
        title: Naujienlaiškis
      slack:
        description: 'Pakvieskite save į OpenStreetMap US Slack darbo sritį ir prisijunkite prie #openhistoricalmap kanalo.'
        title: IRC
      welcome:
        description: Pradėkite šiuo greitu vadovu apie OpenHistoricalMap pagrindus.
        title: Sveiki atvykę į OpenHistoricalMap
      wiki:
        description: Daugiau detalios informacijos apie OHM rasite wiki.
    index:
      js_2: OpenHistoricalMap naudoja JavaScript savo 'slidžiam' žemėlapiui
    potlatch:
      removed: Jūsų numatytasis OpenHistoricalMap redaktorius yra "Potlatch". Kadangi "Adobe Flash Player" įskiepis nebenaudojamas, "Potlatch" nebegalima naudoti naršyklėje.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap turi savo žodyną. Čia keli pagrindiniai naudojami terminai/žodžiai.
      introduction: Sveikiname prisijungus prie OpenHistoricalMap - laisvo ir redaguojamo pasaulio žemėlapio. Dabar, kai prisijungėte, galite pradėti žymėti. Čia trumpa instrukcija su svarbiausiais dalykais, kuriuos turėtumėte žinoti.
      rules:
        para_1_html: |-
          OpenHistoricalMap turi nedaug formalių taisyklių, bet mes tikimės, kad visi dalyviai bendradarbiaus ir bendraus su bendruomene. Jei svarstote bet kokius veiksmus, išskyrus rankinį redagavimą, perskaitykite ir laikykitės rekomendacijų apie
          %{imports_link} ir %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Kas tikrai %{doesnt}, tai subjektyvūs duomenys, tokie kaip įvertinimai, istoriniai arba hipotetiniai objektai, taipogi duomenys iš autorinių teisių saugomų duomenų šaltinių. Jei negavote specialaus leidimo - nekopijuokite iš internetinių ar popierinių žemėlapių.
