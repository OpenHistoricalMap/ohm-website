        paragraph_1: Skirtingai nuo kitų žemėlapių, OpenHistoricalMap žemėlapį visiškai sukūrė žmonės, tokie kaip tu, ir jį nemokamai gali taisyti, atnaujinti, atsisiųsti ir naudoti kiekvienas.
        welcome: Sveiki atvykę į OpenHistoricalMap
      duplicate_social_email: Jei jau turite OpenHistoricalMap paskyrą ir norite naudoti trečiosios šalies tapatybės teikėją, prisijunkite naudodami slaptažodį ir pakeiskite paskyros nustatymus.
