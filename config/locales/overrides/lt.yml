  layouts:
    intro_header: Sveiki atvykę į OpenHistoricalMap!
    intro_text: OpenHistoricalMap yra pasaulio žemėlapis, kuriamas žmonių, tokių kaip jūs. Jis atviras ir laisvas - naudojamas pagal atvirą licenciją.
    logo:
      alt_text: OpenHistoricalMap logotipas
  oauth:
    scopes:
      openid: Prisijungti su OpenHistoricalMap
  sessions:
