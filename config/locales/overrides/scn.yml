    intro_2_create_account: Crìa un cuntu di l'utenti
    intro_header: Bimminuti nta OpenHistoricalMap!
    intro_text: OpenHistoricalMap è na cartina dû munnu, criata di genti comu a tìa e lìbbira a adupirari secunnu na licenza graputa.
    logo:
      alt_text: Logu d'OpenHistoricalMap
    logout: Nesci
    tag_line: La cartina-wiki dû munnu lìbbira
  sessions:
    destroy:
      heading: Nesci d'OpenHistoricalMap
  site:
    about:
      lede_text: OpenHistoricalMap veni custruutu di na cumunità di mappatura chi cuntribbuìscinu e mantèninu dati c'arriguàrdanu strati, trazzeri, bar, stazzioni dî treni, e tanti àutri cosi, nta tuttu lu munnu.
    copyright:
      legal_babble:
        contributors_footer_2_html: La nclusioni dî dati nta OpenHistoricalMap nun ìmplica ca lu sò furnituri origginali susteni OpenHistoricalMap, furnisci na quarchi garanzìa, o accetta na quarchi rispunzabbilità.
        credit_1_html: Addumannamu chi s'usa l'attribbuzzioni &laquo;&copy; li cuntribbutura d'OpenHistoricalMap&raquo;.
        credit_title_html: Comu s'attribbuisci a OpenHistoricalMap
        infringement_1_html: Ê cuntribbutura d'OHM s'arricorda di nun agghiùnciri mai dati chi vèninu di fonti prutetti dû drittu d'auturi (ad esempiu Google Maps o puru li carti stampati) senza aviri n'auturizzazzioni splìcita dû titulari dû drittu d'auturi.
        more_title_html: Pi sapìrinni cchiossai
    export:
      too_large:
        body: St'ària è troppu granni pi spurtàrila comu Dati XML di OpenHistoricalMap. Pi favuri zumma, o scegghî n'ària cchiù piccidda, o puru pû scarricamentu massizzu di dati adòpira una dî fonti ccassutta.
        overpass:
          description: Scàrrica stu riquatru dûn mirror dâ basi di dati d'OpenHistoricalMap
        planet:
          description: Copî dâ basi di dati cumpreta di OpenHistoricalMap ca vèninu aggiurnati rigularmenti
          title: Pianeta OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Abbasta chi clicchi %{note_icon} o puru la stissa cona ntâ carta.
            Facennu accussì si piazza un signali supra â carta, chi si pò spustari strascinànnulu.
            S'agghiunci nu propiu missaggiu, appoi si clicca «sarva», e l'àutri mappatura talìanu la situazzioni.
        join_the_community:
          explanation_html: Si t'addunasti chi c'è quarchi prubblema ntê dati dâ nostra cartina, p'esempiu c'ammanca na strata o puru ca lu tò nnirizzu è sbagghiatu, la megghiu cosa di fari è di scrivìriti ntâ cumunità d'OpenHistoricalMap e d'agghiùnciri o cunzari li dati tu stissu.
    help:
      introduction: |-
        OpenHistoricalMap havi tanti risorsi pi nzignàrisi comu funziona lu pruggettu, pi fari addumannati e dari arrispunnuti,
        e pi discùtiri d'argumenti c'arriguàrdanu la mappatura e ducumintàrili n cullabburazzioni.
      slack:
        title: IRC
      welcome:
        description: Accumenza cu sta guida ràpida chi nzigna li funnamenti d'OpenHistoricalMap.
        title: Bimminuti nta OpenHistoricalMap
      wiki:
        description: Sfogghia lu wiki p'attruvari la ducumintazzioni apprufunnuta d'OHM.
    index:
      js_2: OpenHistoricalMap adòpira lu JavaScript pâ sò cartina scurritura.
      remote_failed: 'Lu canciamentu nun arriniscìu: assicùrati chi JOSM o Merkaartor sunnu graputi e hannu l''opzioni telecumannu attivata'
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap havi nu sò linguaggiu particulari. Ccà ci sù na para di palori chi ti ponnu aggiuvari.
      introduction: Bimminuti nta OpenHistoricalMap, la cartina dû munnu lìbbira e canciàbbili. Ora chi siti scritti, siti pronti p'accuminzari a mappari. Ccà c'è na guida chi spiega li cosi cchiù mpurtanti c'aviti a sapiri.
      rules:
        para_1_html: OpenHistoricalMap havi picca règuli furmali, pirò n'aspittamu chi tutti li participanti cullàbburanu e cumùnicanu câ cumunità. Si stai pigghiannu a cunziddirazzioni di canciari la carta di quarchi manera àutra rispettu a fàrilu a manu, pi favuri leggi e rispetta li lìnii guida ca poi attruvari nta %{imports_link} e %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Chiddu chi mmeci %{doesnt} sunnu li dati d'opinioni comu p'esempiu li giudizzî, l'elimenti chi nun esìstinu cchiù o chi sunnu iputètici, e li dati chi vèninu di fonti prutetti dû drittu d'auturi. A menu chi nun hai n'auturizzazzioni spiciali, nun cupiari mai di mappi n lìnia o di carta.
