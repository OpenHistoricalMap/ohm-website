      legal_1_aup: Erabilera-politika onargarriak
      legal_1_privacy_policy: Pribatutasun politika
      legal_1_terms_of_use: Erabilera-baldintzak
    copyright:
      legal_babble:
        contributors_footer_2_html: |-
          OpenHistoricalMap-en datuak sartzeak ez du beharrez jatorrizko
          datu-hornitzaileak OpenHistoricalMap onartzea baieztatzen, edozein berme ematen, edota inolako erantzukizunik onartzen.
        credit_1_html: 'OpenHistoricalMap datuak erabiltzen dituzun lekuetan, bi gauza hauek egin behar dituzu:'
        credit_2_this_copyright_page: copyright orri hau
        credit_title_html: OpenHistoricalMap nola kreditatu
        infringement_1_html: |-
          OHMren laguntzaileek ez dute inolako daturik gehitu behar
          copyright iturrietatik (adibidez, Google Maps edo inprimatutako mapak) copyright-jabeen baimen espliziturik gabe.
        introduction_4_creative_commons: Creative Commons Aitortu-PartekatuBerdin 2.0
        more_2_1_api_usage_policy: APIaren erabilera-politika
        more_title_html: Jakin ezazu gehiago
    export:
      too_large:
        body: Area hau oso handia da OpenHistoricalMap XML datu bezala esportatzeko. Zooma handitu edo eremu txikiagoa hautatu edo behean zerrendatutako iturrietako bat erabili datuak bulkatze-deskargak egiteko mesedez.
        overpass:
          description: Deskargatu muga kutxa hau OpenHistoricalMap datu-basearen ispilu batetik
        planet:
          description: OpenHistoricalMap datu-base osoko aldizkako kopia eguneratuak
          title: OHM Planeta
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Egin klik %{note_icon} edo ikono berean maparen pantailan.
            Honek markatzailea gehituko dio mapari, arrastatuz mugitu ahal izateko. Gehitu zure mezua, ondoren sakatu gorde eta beste erabiltzaileek ikertu egingo dute.
        join_the_community:
          explanation_html: Arazoren bat nabaritu baduzu maparen datuekin, adibidez, errepide edo zure helbidea faltan daudela, jarraitzeko modurik onena OpenHistoricalMap komunitatean sartzea da datuak berreskuratu edo konpontzeko.
    help:
      introduction: OpenHistoricalMap-ek proiektuari buruz ikasteko hainbat baliabide ditu, galderak egin eta erantzun, edota mapping gaiak eztabaidatu eta dokumentazeko elkarlana.
      slack:
        title: IRC
      welcome:
        description: OpenHistoricalMap-en oinarrizkoak betetzen dituen gida azkar honekin hasi.
        title: Ongi etorri OpenHistoricalMapra
      wiki:
        description: Arakatu wikia informazio zehatzeko OHM dokumentaziorako.
    index:
      js_2: OpenHistoricalMap-ek Javascript erabiltzen du bere mapa irriztagarrirako.
      remote_failed: Editatzeak huts egin du - Ziurtatu JOSM edo Merkaartor kargatu dela eta urruneko kontrolaren aukera gaituta dagoela
    potlatch:
      removed: Zure OpenHistoricalMap editore lehenetsia gisa Potlatch dago ezarrita. Adobe Flash Player baztertu denez, Potlatch jada ez dago erabilgarri web-arakatzaile batean erabiltzeko.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap-ek bere parekatze propioa du. Hemen daude erabilgarriak diren zenbait hitz gako.
      introduction: Ongi etorri OpenHistoricalMapera, edonork alda dezakeen munduko mapa askera. Orain izena eman duzula, mapak editatzen has zaitezke. Hona hemen gida laburra jakin behar dituzun gauzarik garrantzitsuenak dituena.
      rules:
        para_1_html: |-
          OpenHistoricalMap-ek arau formal gutxi ditu, baina parte-hartzaile guztiek elkarlanean aritzea espero dugu
          komunitatearekin eta harekin komunikatzea. Eskuz editatzeaz gain beste edozein jarduera kontuan hartzen ari bazara, irakurri eta jarraitu
          %{imports_link} eta %{automated_edits_link} ataleko jarraibideak.
      whats_on_the_map:
        off_the_map_html: Zer %{doesnt} baditu balorazio bezalako datu iritziak ematen, historiko edo ezaugarri hipotetikoak eta copyright-iturrietatik datozen datuak. Ez baduzu baimen berezia, ez kopiatu lineako edo papereko mapetatik.
