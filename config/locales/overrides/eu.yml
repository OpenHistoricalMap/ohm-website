    about:
      lede_text: OpenHistoricalMap mundu osoan zehar errepideak, bideak, kafetegiak, tren geltokiak eta askoz gehiago mapatzaileen komunitate batek eskeinitako datuen eta haien mantentzearen laguntzaz eraiki ditu.
