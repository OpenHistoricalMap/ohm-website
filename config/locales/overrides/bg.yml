  site:
    about:
      lede_text: OpenHistoricalMap е създадена от общност от картографи, които предоставят и поддържат данни за пътища, пътеки, кафенета, железопътни гари и много други по целия свят.
    about_section:
      contribute_1_user_diaries: потребителските дневници
      legal_1_privacy_policy: Политика за поверителност
      legal_2_html: Моля, %{contact_team_link} ако имате въпроси, свързани с лицензирането, авторските права или други правни въпроси.
    communities:
      lede_text: Хора от цял свят допринасят за OpenHistoricalMap или я използват. Много от тях участват индивидуално, а други са създали общности. Тези групи са с различна големина и представляват географски райони от малки градове до големи региони с много държави. Те също така могат да бъдат официални или неофициални.
    copyright:
      legal_babble:
        credit_1_html: 'Когато използвате данни от OpenHistoricalMap, от вас се изисква да направите следните две неща:'
        credit_title_html: Как да кредитирате OpenHistoricalMap
        infringement_1_html: Напомняме на сътрудниците на OHM никога да не добавят данни от източници, защитени с авторски права (например Google Maps или печатни карти), без изрично разрешение от притежателите на авторските права.
        more_title_html: Открийте повече
    export:
      too_large:
        planet:
          title: Planet OHM
    fixthemap:
      how_to_help:
        join_the_community:
          explanation_html: Ако сте забелязали проблем с нашите картографски данни, например липсва път или вашият адрес, най-добрият начин да продължите е да се присъедините към общността на OpenHistoricalMap и да добавите или поправите данните сами.
    help:
      introduction: OpenHistoricalMap разполага с няколко ресурса за запознаване с проекта, задаване и отговаряне на въпроси, както и за съвместно обсъждане и документиране на теми, свързани с картографирането.
      slack:
        title: IRC
      welcome:
        description: Започнете с това кратко ръководство, обхващащо основите на OpenHistoricalMap.
        title: Добре дошли в OpenHistoricalMap
      wiki:
        description: Разгледайте уикито за подробна документация за OHM.
        title: Уики
    index:
      js_2: OpenHistoricalMap използва JavaScript за своята статична карта.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap има свой собствен жаргон. Ето няколко ключови думи, които ще Ви бъдат полезни.
      introduction: Добре дошли в OpenHistoricalMap, безплатната и редактируема карта на света. Сега, след като сте се регистрирали, сте готови да започнете да картографирате. Предлагаме ви кратко ръководство с най-важните неща, които трябва да знаете.
      rules:
        para_1_html: |-
          OpenHistoricalMap има малко официални правила, но очакваме всички участници да си сътрудничат и да комуникират с общността. Ако обмисляте някакви дейности,
          различни от ръчно редактиране, моля, прочетете и следвайте указанията на
          %{imports_link} и %{automated_edits_link}.
