  site:
    about:
      lede_text: OpenHistoricalMap est un projet ambitieux mené par une communauté pour cartographier les changements naturels et articifiels de la géographie à travers le monde… à travers les âges.
      used_by_html: Explorez le monde à n’importe quelle époque avec %{name}.
    about_section:
      contribute_1_bluesky: Bluesky
      contribute_1_forum: notre forum de discussion
      contribute_1_mastodon: Mastodon
      contribute_1_ohm_html: |-
        Notre communauté croissante de contributeurs bénévoles comprend des historiens amateurs et professionnels, des contributeurs OpenStreetMap et Wikipédia, des spécialistes de SIG et des personnes ordinaires qui connaissant bien leur environnement.
        Nous sommes passionnés par la documentation du monde et nous aidons les communautés du monde réel à partager leurs histoires.
        Pour en savoir plus sur la communauté, consultez %{wiki_link}, visitez %{forum_link}, lisez les %{user_diaries_link} et suivez notre compte %{mastodon_link} ou %{bluesky_link}.
      contribute_1_user_diaries: journaux d’utilisateurs
      contribute_1_wiki: notre vaste documentation wiki
      contribute_1_wiki_url: https://wiki.openstreetmap.org/wiki/FR:OpenHistoricalMap
      contribute_2_create_account: créant un compte gratuit
      contribute_2_donations: dons de charité
      contribute_2_html: |-
        Vous pouvez commencer à contribuer à la carte dès aujourd’hui en %{create_account_link}.
        Nous acceptons également des %{donations_link} via %{osmus_link}, une organisation à but non lucratif 501(c)(3) avec un statut d’exonération fiscale.
        Votre généreux don contribuera directement au bon fonctionnement d’OpenHistoricalMap pour tous.
      contribute_2_osmus: OpenStreetMap États-Unis
      contribute_title: Vous pouvez aider
      legal_1_aup: politique des usages acceptés
      legal_1_aup_url: https://wiki.openstreetmap.org/wiki/Acceptable_Use_Policy
      legal_1_group: groupe informel
      legal_1_group_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Governance
      legal_1_html: |-
        Ce site et de nombreux autres services connexes sont formellement exploités par un %{group_link} affilié à OpenStreetMap États-Unis au nom de la communauté.
        L’utilisation de tous les services offerts par OpenHistoricalMap est sujette à nos %{terms_of_use_link}, à notre %{aup_link} et à notre %{privacy_policy_link}.
      legal_1_privacy_policy: politique de confidentialité
      legal_1_privacy_policy_url: https://osmfoundation.org/wiki/Privacy_Policy
      legal_1_terms_of_use: conditions d’utilisation
      legal_1_terms_of_use_url: https://osmfoundation.org/wiki/Terms_of_Use
      legal_2_contact_team: contacter l’équipe OpenHistoricalMap
      legal_2_html: |-
        Veuillez %{contact_team_link}
        si vous avez des questions sur les conditions de licence, les droits d’auteur ou d’autres questions juridiques.
      legal_3_html: |-
        OpenHistoricalMap® est une marque déposée (U.S. Reg. No. 90,019,364).
        OpenStreetMap et le logo en forme de loupe sont des %{osmf_trademarks_link}.
      legal_3_osmf_trademarks: marques déposées de la Fondation OpenStreetMap
      legal_3_osmf_trademarks_url: https://osmfoundation.org/wiki/Trademark_Policy
      open_data_1_1_html: |-
        La carte sur notre page d’accueil n’est qu’une des nombreuses façons de découvrir les informations historiques que nous avons collectées.
        Les données sous-jacentes sont %{reuse_link} sous téléchargement ou via diverses API gratuites compatibles avec les logiciels open source.
      open_data_1_1_reuse: disponibles
      open_data_1_1_reuse_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Reuse
      open_data_2_copyright_license: Droits d’auteur et remerciements
      open_data_2_html: |-
        Les données sont dans le domaine public, sauf indication contraire.
        Vous êtes libre de les utiliser à toutes fins, sans aucune restriction.
        Néanmoins, nous apprécions grandement tout crédit ou citation envers OpenHistoricalMap.
        Pour plus de détails et de remerciements, voir %{copyright_license_link}.
      scope_html: Les empires s’élèvent et s’effondrent. Les glaciers disparaissent. Les langues et religions se propagent d’une région à l’autre. De simples chemins de terre se transforment en autoroutes très fréquentées et voies ferrées. De modestes bâtiments cèdent la place à d’imposants gratte-ciel. Et vous vous souvenez d’à quoi ressemblait votre quartier. Tout cela a sa place sur OpenHistoricalMap.
      scope_title: Grand et petit, hier et aujourd’hui
    communities:
      lede_text: |-
        Des personnes du monde entier contribuent ou utilisent OpenHistoricalMap. Alors que beaucoup participent de manière individuelle, d’autres ont formé des communautés.
        Ces groupes sont de tailles diverses et rassemblent des zones géographiques allant de petites villes à de grands territoires multi pays.
        Ils peuvent aussi être officiels ou non.
    copyright:
      legal_babble:
        attribution_example:
          alt: Un lien intitulé “OHM” dans le coin inférieur droit d'une page Web, sous un curseur de temps.
          title: Exemple de comment attribuer les mentions à OpenHistoricaMap, sur une page Web
        contributors_2_ohm_html: 'Les styles de carte présentés sur la page d’accueil contiennent des données OpenHistoricalMap et les sources suivantes :'
        contributors_anr_communes_campop: Cambridge Group for the History of Population and Social Structures
        contributors_anr_communes_html: Des données créées par le projet %{anr_communes_link} en collaboration avec le %{campop_link}.
        contributors_anr_communes_project: ANR COMMUNES
        contributors_footer_2_html: L’inclusion de données dans OpenHistoricalMap n’implique pas que les fournisseurs d’origine du contenu approuvent OpenHistoricalMap, ni qu’ils garantissent ou acceptent quelque responsabilité que ce soit.
        contributors_globcover: GlobCover
        contributors_globcover_html: La couverture du sol de %{globcover_link}, © ESA 2010 et UCLouvain, disponible pour réutilisation à des fins éducatives et/ou scientifiques avec attribution.
        contributors_gmted: Les données mondiales 2010 en multi-résolution de l’élévation du terrain
        contributors_gmted_html: 'Les données d’élévation du terrain de Danielson, J.J., et Gesch, D.B., 2011, %{gmted_link} (GMTED2010) : US Geological Survey Open-File Report 2011–1073, 26 p. Domaine public.'
        contributors_intro_html: 'OpenHistoricalMap est le fruit de la collaboration entre des milliers d’individus et d’organisations, qui puisent à leur tour dans un vaste corpus de connaissances, de journalisme et de documentation. Nos sources et contributeurs les plus importants sont :'
        contributors_more_sources_html: "%{sources_link} sont disponibles sur le wiki OpenStreetMap."
        contributors_more_sources_page: Les contributeurs et sources additionnelles
        contributors_more_sources_page_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Sources
        contributors_natural_earth: Natural Earth
        contributors_natural_earth_html: Des jeux de données %{natural_earth_link} dans le domaine public.
        contributors_newberry: Newberry Library
        contributors_newberry_ahcb: Atlas des Frontières Historiques du Comté
        contributors_newberry_ahcb_html: Des données du %{ahcb_link}, un projet du William M. Scholl Center for American History and Culture à l’%{newberry_link}, qui est disponible pour la réutilisation sans restrictions.
        contributors_osm: Contributeurs OpenStreetMap
        contributors_osm_cc_by_sa: CC BY-SA 2.0
        contributors_osm_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/2.0/deed.fr
        contributors_osm_html: Des données à propos des littoraux, plans d’eau et cours d’eau © %{osm_link}, %{cc_by_sa_link}
        contributors_title_html: Remerciements
        credit_1_html: Bien que la loi sur le droit d'auteur ne restreint ni n'impose aucune condition de votre utilisation du contenu du domaine public, nous apprécions grandement toute mérite que vous accordez à OpenHistoricalMap lors de la réutilisation, adaptation ou de toute simplement l'utilisation de nos cartes ou données.
        credit_2_home: notre page d'accueil
        credit_2_ohm_html: |-
          Vous pouvez présenter cette reconnaissance de toute manière raisonnable.
          Par exemple, sur une carte numérique, vous pouvez mentionner OpenHistoricalMap en petits caractères dans le coin, en créant un lien vers %{this_copyright_page_link} ou %{home_link} :
        credit_2_this_copyright_page: cette page de copyright
        credit_3_credit_html: Données cartographiques fournies par le projet %{project_link}, dans le domaine public, sauf toute mention contraire.
        credit_3_ohm_html: 'Ou, vous pouvez inclure un reconnaissance sur une page de mentions séparé où vous attribuez le mérite d''autres sources :'
        credit_4_ohm_html: |-
          Sur une carte imprimée, vous pouvez placer les remerciements dans la légende.
          Dans un livre, vous pouvez décrire votre utilisation d'OpenHistoricalMap dans une note de bas de page, bibliographie ou colophon.
          Dans un article universitaire, vous pouvez nous citer de différentes manières dépendant du contenu que vous avez utilisé.
        credit_title_html: Comment créditer OpenHistoricalMap
        infringement_1_html: Nous rappelons aux contributeurs d’OHM qu’ils ne doivent jamais ajouter de données provenant de sources protégées par le droit d’auteur (copyright) ou des droits voisins (par ex. Google Maps ou des cartes imprimées) sans autorisation explicite de la part des détenteurs de ces droits.
        infringement_2_ohm_contact_team: contacter l’équipe OpenHistoricalMap avec « TAKEDOWN REQUEST » en objet
        infringement_2_ohm_html: Si vous pensez que du contenu protégé par le droit d’auteur a été ajouté de manière inappropriée à la base de données OpenHistoricalMap ou à ce site, veuillez %{contact_team_link}.
        introduction_1_cc0: Creative Commons CC0
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/deed.fr
        introduction_1_ohm_html: |-
          OpenHistoricalMap est une collection de données ouvertes géospatiales.
          Sauf indication contraire, les données OpenHistoricalMap sont dans le domaine public sous une dédicace %{cc0_link}.
          Dans la mesure où ce que vous utilisez est dans le domaine public, vous êtes libre de le copier, distribuer, transmettre et adapter à n’importe quelle fin, sans aucune restriction.
        introduction_2_cc_by: Attribution Creative Commons
        introduction_2_cc_by_sa: Creative Commons Attribution-ShareAlike
        introduction_2_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/4.0/deed.fr
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/deed.fr
        introduction_2_license_key_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Tags/Key/license
        introduction_2_ohm_html: |-
          La base de données OpenHistoricalMap intègre certaines fonctionnalités cartographiques individuelles sous copyright.
          Ces fonctionnalités sont disponibles sous une licence ouverte, telle que %{cc_by_link} (CC&nbsp;BY) ou %{cc_by_sa_link} (CC&nbsp;BY-SA), comme indiqué dans les balises %{license_key_link} sur les éléments individuels.
          Dans la mesure où vous utilisez une partie importante de la base de données couverte par une licence « partage similaire », vous devez respecter les termes de cette licence de votre propre adaptation.
        introduction_3_ohm_html: Les styles de cartes présentés sur notre page d'accueil sont dans le domaine public sous licence CC0. Vous êtes libre de les copier, distribuer, transmettre et adapter à toutes fins, sans aucune restriction.
        introduction_4_creative_commons: Licence Creative Commons Attribution – Partage à l’identique v2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/deed.fr
        introduction_4_ohm_html: Notre documentation est titulaire d'une licence sous la licence %{creative_commons_link} (CC BY-SA 2.0)
        more_1_ohm_html: Apprenez-en davantage sur les considérations juridiques liées à l'utilisation de nos données ainsi que la manière de nous créditer, %{wiki_link}.
        more_1_wiki: sur le wiki OpenStreetMap
        more_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Licence
        more_2_1_api_usage_policy: politique d’utilisation de l’API
        more_2_1_api_usage_policy_url: https://operations.osmfoundation.org/policies/api/
        more_2_1_html: |-
          Bien qu’OpenHistoricalMap soit des données ouvertes, nous ne pouvons pas fournir une
          API cartographique ou des carreaux de cartes gratuit·e·s pour des tiers.
          Consultez notre %{api_usage_policy_link}, celle des %{tile_usage_policy_link} et celle de %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Nominatim
        more_2_1_nominatim_usage_policy_url: https://operations.osmfoundation.org/policies/nominatim/
        more_2_1_tile_usage_policy: tuiles graphiques
        more_2_1_tile_usage_policy_url: https://operations.osmfoundation.org/policies/tiles/
        more_title_html: Pour trouver plus d’informations
