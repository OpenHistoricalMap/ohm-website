    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: Cliquez tout simplement sur %{note_icon} ou le même icône sur affiché sur la carte. Cela ajoutera un point de repère sur la carte, que vous pouvez déplacer par la glissant. Ajoutez votre messages, puis cliquez “Enregistrer”, et les autres cartographes iront enquêter.
        join_the_community:
          explanation_html: Si vous avez remarqué un problème avec nos données de carte, par exemple s’il manque une route ou votre adresse, le meilleur moyen de faire est de rejoindre la communauté OpenHistoricalMap et d’ajouter ou réparer les données vous-même.
      other_concerns:
        concerns_ohm_html: Si vous avez des inquiétudes dont la manière nos données sont utilisés, ou à propos de notre contenu, veuillez consulter %{copyright_link} pour plus d'informations juridiques ou contacter %{contact_link}.
