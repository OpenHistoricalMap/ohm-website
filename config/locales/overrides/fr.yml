      heading: Votre identifiant n’est pas encore associé à un compte OpenHistoricalMap.
      option_1: Si vous êtes nouveau sur OpenHistoricalMap, veuillez créer un nouveau compte à l’aide du formulaire ci-dessous.
    new:
      about:
        paragraph_1: Contrairement à d’autres cartes, OpenHistoricalMap est entièrement créé par des personnes comme vous et il permet à quiconque de librement la réparer, la mettre à jour, la télécharger et l’utiliser.
        welcome: Bienvenue dans OpenHistoricalMap
      duplicate_social_email: Si vous possédez déjà un compte OpenHistoricalMap et souhaitez utiliser un fournisseur d’identité tiers, veuillez vous connecter en utilisant votre mot de passe et modifier les paramètres de votre compte.
      please_contact_support_html: Veuillez contacter l’%{support_link} pour organiser la création d’un compte — nous essaierons de traiter la demande le plus rapidement possible.
