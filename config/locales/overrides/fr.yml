        contact_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Communication
    help:
      discord:
        description: 'Rejoignez le serveur Discord d''OpenStreetMap World et obtenez de l''aide sur le salon #openhistoricalmap.'
      forum:
        description: Participez à des discussions plus longues et à des forums de discussion en utilisant votre compte OHM.
        title: Forum
      github:
        description: Déposez un problème dans nos dépôts GitHub pour signaler un dysfonctionnement ou demander une nouvelle fonctionnalité.
        title: Demandes de fonctionnalités et bogues
      introduction: OpenHistoricalMap propose plusieurs ressources pour en savoir plus sur le projet, pour poser des questions et y répondre et pour discuter ou documenter les sujets de cartographie en collaboration avec d’autres utilisateurs.
      mailing_list:
        description: Abonnez-vous à notre liste de diffusion à faible volume.
        title: Liste de diffusion
      slack:
        description: 'Invitez-vous au serveur Slack d''OpenStreetMap US et rejoignez le canal #openhistoricalmap.'
        title: Slack
      welcome:
        description: Commencer avec ce guide rapide couvrant les bases d’OpenHistoricalMap.
        title: Bienvenue dans OpenHistoricalMap
      wiki:
        description: Parcourez le wiki pour la documentation approfondie d’OHM.
    index:
      js_2: OpenHistoricalMap utilise Javascript pour ses cartes glissantes.
      license:
        copyright: OpenHistoricalMap est dans le domaine public, sauf indication contraire.
      remote_failed: Échec de la modification — vérifiez que l’éditeur externe JOSM ou Merkaartor est ouvert et que l’option de contrôle à distance de l’application est activée.
    potlatch:
      removed: Votre éditeur OpenHistoricalMap par défaut est fixé à Potlatch. Comme Adobe Flash Player a été retiré, Potlatch n’est plus disponible à l’utilisation dans un navigateur web.
    welcome:
      basic_terms:
        a_tag_html: Une %{tag} est un élément de données sur un nœud ou une voie, comme le nom d’un restaurant ou l’année de construction d’un pont.
        paragraph_1: OpenHistoricalMap a son propre jargon. Voici quelques mots-clefs qui vous seront utiles.
      introduction: Bienvenue sur OpenHistoricalMap, la carte gratuite et modifiable de l’histoire du monde. Maintenant que vous êtes inscrit(e), vous êtes prêt(e) à commencer à cartographier. Voici un guide rapide avec les choses les plus importantes que vous devez savoir.
      rules:
        para_1_html: |-
          OpenHistoricalMap a peu de règles formelles mais nous attendons de tous les participants
          qu’ils collaborent et communiquent avec la communauté. Si vous envisagez
          toute activité autre que les modifications manuelles, veuillez lire et suivre les consignes sur
          %{imports_link} et %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: OpenHistoricalMap %{doesnt} d’histoires fictives alternatives, d’erreurs connues de cartes anciennes ou de données venant de sources protégées par le droit d’auteur ou des droits voisins. À moins d’avoir une permission spéciale, ne copiez rien depuis une carte moderne du passé trouvée en ligne ou sur papier.
        on_the_map_ohm_html: |-
          OpenHistoricalMap retrace les changements de la géographie naturelle et articifielle à travers le monde.
          Nous avons des millions d’informations %{past_and_present}, des empires et glaciers aux maisons et restaurants.
          Vous pouvez cartographier n’importe quel élément du monde réel qui vous intéresse.
        past_and_present: passées et actuelles
