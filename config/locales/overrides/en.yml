        link: https://osmfoundation.org/wiki/Licence/Contributor_Terms
        link text: what is this?
    terms:
      show:
        read and accept with tou: Please read the contributor agreement and the terms of use, check both checkboxes when done and then press the continue button.
        tou_explain:
          html: These %{tou_link} govern the use of the website and other infrastructure provided by OpenHistoricalMap. Please click on the link, read and agree to the text.
