      description: The operation you requested on the OpenHistoricalMap server is not valid (HTTP 400)
    contact:
      contact_the_community_html: Feel free to %{contact_link} the OpenHistoricalMap community if you have found a broken link / bug. Make a note of the exact URL of your request.
      contact_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Communication
    forbidden:
      description: The operation you requested on the OpenHistoricalMap server is only available to administrators (HTTP 403)
    internal_server_error:
      description: The OpenHistoricalMap server encountered an unexpected condition that prevented it from fulfilling the request (HTTP 500)
    not_found:
      description: Couldn't find a file/directory/API operation by that name on the OpenHistoricalMap server (HTTP 404)
