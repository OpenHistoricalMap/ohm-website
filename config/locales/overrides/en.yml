    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: 'Just click %{note_icon} or the same icon on the map display. This will add a marker to the map, which you can move by dragging. Add your message, then click save, and other mappers will investigate.

            '
        join_the_community:
          explanation_html: 'If you have noticed a problem with our map data, for example a road is missing or your address, the best way to proceed is to join the OpenHistoricalMap community and add or repair the data yourself.

            '
      other_concerns:
        concerns_ohm_html: 'If you have concerns about how our data is being used or about the contents please consult our %{copyright_link} for more legal information, or %{contact_link}.

          '
        contact: contact us
        contact_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Communication
