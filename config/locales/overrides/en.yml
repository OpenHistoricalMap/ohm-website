  site:
    about:
      lede_text: 'OpenHistoricalMap is an ambitious, community-led project to map changes to natural and human geography throughout the world… throughout the ages.

        '
      used_by_html: Explore the world in any time period with %{name}.
    about_section:
      contribute_1_bluesky: Bluesky
      contribute_1_forum: our discussion forum
      contribute_1_mastodon: Mastodon
      contribute_1_ohm_html: |
        Our growing community of volunteer contributors includes amateur and professional historians, OpenStreetMap and Wikipedia contributors, GIS specialists, and ordinary people knowledgeable about their surroundings.
        We are passionate about documenting the world and helping real-world communities tell their stories.
        To learn more about the community, consult %{wiki_link}, visit %{forum_link}, read the %{user_diaries_link}, and follow our %{mastodon_link} or %{bluesky_link} account.
      contribute_1_user_diaries: user diaries
      contribute_1_wiki: our extensive wiki documentation
      contribute_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap
      contribute_2_create_account: creating a free account
      contribute_2_donations: accept charitable donations
      contribute_2_html: |
        You can start contributing to the map today by %{create_account_link}.
        We also %{donations_link} through %{osmus_link}, a 501(c)(3) nonprofit organization with tax-exempt status.
        Your generous donation will go directly toward keeping OpenHistoricalMap running smoothly for everyone.
      contribute_2_osmus: OpenStreetMap U.S.
      contribute_title: You Can Help
      legal_1_1_terms_of_use_url: https://wiki.osmfoundation.org/wiki/Licence/Contributor_Terms
      legal_1_aup: Acceptable Use Policies
      legal_1_aup_url: https://wiki.openstreetmap.org/wiki/Acceptable_Use_Policy
      legal_1_group: an informal group
      legal_1_group_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Governance
      legal_1_html: |
        This site and related services are operated by %{group_link} affiliated with OpenStreetMap U.S. on behalf of the community.
        Use of all OpenHistoricalMap services is subject to our %{terms_of_use_link}, %{aup_link}, and %{privacy_policy_link}.
      legal_1_privacy_policy: Privacy Policy
      legal_1_privacy_policy_url: https://osmfoundation.org/wiki/Privacy_Policy
      legal_1_terms_of_use: Terms of Use
      legal_1_terms_of_use_url: https://osmfoundation.org/wiki/Terms_of_Use
      legal_2_contact_team: contact the OpenHistoricalMap team
      legal_2_html: 'Please %{contact_team_link} with any licensing, copyright, or other legal questions.

        '
      legal_3_html: |
        OpenHistoricalMap® is a registered trademark (U.S. Reg. No. 90,019,364).
        OpenStreetMap and the magnifying glass logo are %{osmf_trademarks_link}.
      legal_3_osmf_trademarks: registered trademarks of the OpenStreetMap Foundation
      legal_3_osmf_trademarks_url: https://osmfoundation.org/wiki/Trademark_Policy
      open_data_1_1_html: |
        The map on our homepage is just one of many ways to experience the historical information we’ve collected.
        The underlying data is %{reuse_link} as a download or through various free APIs compatible with open source software.
      open_data_1_1_reuse: available for reuse
      open_data_1_1_reuse_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Reuse
      open_data_2_copyright_license: Copyright and Acknowledgements
      open_data_2_html: |
        The data is in the public domain unless noted otherwise.
        You are free to use it for any purpose, without any restrictions.
        Nonetheless, we greatly appreciate any credit or citation you provide to OpenHistoricalMap.
        For more details and acknowledgments, see %{copyright_license_link}.
      scope_html: |
        Empires rise and fall. Glaciers disappear. Languages and religions spread from one region to another.
        Simple dirt paths become busy highways and railways. Modest buildings give way to soaring skyscrapers.
        And you remember what your neighborhood used to look like.
        All of it belongs on OpenHistoricalMap.
      scope_title: Big and Small, Then and Now
    add_a_note:
      para_1: 'If you just want something small fixed and don''t have the time to sign up and learn how to edit, it''s easy to add a note.

        '
    any_questions:
      ohm_paragraph_1_html: OpenHistoricalMap has several resources for learning about the project, asking and answering questions, and collaboratively discussing and documenting mapping topics. %{help_link}.
    communities:
      lede_text: |
        People from all over the world contribute to or use OpenHistoricalMap.
        While many participate as individuals, others have formed communities.
        These groups come in a range of sizes and represent geographies from small towns to large multi-country regions. They can also be formal or informal.
    copyright:
      legal_babble:
        attribution_example:
          alt: A link labeled OHM in the lower-right corner of a webpage, below a time slider.
          title: Example of how to attribute OpenHistoricalMap on a webpage
        contributors_2_ohm_html: 'The map styles featured on the homepage contain OpenHistoricalMap data and the following sources:

          '
        contributors_anr_communes_campop: The Cambridge Group for the History of Population and Social Structures
        contributors_anr_communes_campop_url: https://www.campop.geog.cam.ac.uk/research/projects/internationaloccupations/enchpopgos/france/
        contributors_anr_communes_html: 'Data created by the %{anr_communes_link} project in collaboration with %{campop_link}.

          '
        contributors_anr_communes_project: ANR COMMUNES
        contributors_footer_2_html: |
          Inclusion of data in OpenHistoricalMap does not imply that the original
          data provider endorses OpenHistoricalMap, provides any warranty, or
          accepts any liability.
        contributors_globcover: GlobCover
        contributors_globcover_html: 'Land cover from %{globcover_link}, © ESA 2010 and UCLouvain, available for reuse for educational and/or scientific purposes with attribution.

          '
        contributors_gmted: Global multi-resolution terrain elevation data 2010
        contributors_gmted_html: 'Terrain elevation data from Danielson, J.J., and Gesch, D.B., 2011, %{gmted_link} (GMTED2010): U.S. Geological Survey Open-File Report 2011–1073, 26 p. Public domain.

          '
        contributors_intro_html: |
          OpenHistoricalMap is the collaborative effort of thousands of individuals and organizations, who in turn draw from a large body of scholarship, journalism, and recordkeeping.
          Our most substantial sources and contributors include:
        contributors_more_sources_html: "%{sources_link} are available on the OpenStreetMap Wiki.\n"
        contributors_more_sources_page: Additional sources and contributors
        contributors_more_sources_page_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Sources
        contributors_natural_earth: Natural Earth
        contributors_natural_earth_html: "%{natural_earth_link} datasets in the public domain.\n"
        contributors_newberry: The Newberry Library
        contributors_newberry_ahcb: Atlas of Historical County Boundaries
        contributors_newberry_ahcb_html: 'Data from the %{ahcb_link}, a project of the William M. Scholl Center for American History and Culture at %{newberry_link}, which is available for reuse without restriction.

          '
        contributors_osm: OpenStreetMap contributors
        contributors_osm_cc_by_sa: CC BY-SA 2.0
        contributors_osm_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/2.0/
        contributors_osm_html: 'Data about coastlines, bodies of water, and streams © %{osm_link}, %{cc_by_sa_link}.

          '
        contributors_title_html: Acknowledgements
        credit_1_html: 'Although copyright law does not restrict or place any conditions on your use of public domain content, we greatly appreciate any credit you provide to OpenHistoricalMap when reusing, adapting, or otherwise using our maps or data.

          '
        credit_2_home: our homepage
        credit_2_ohm_html: |
          You may present this acknowledgment in any reasonable manner.
          For example, on a digital map, you can mention OpenHistoricalMap in fine print in the corner, linking to %{this_copyright_page_link} or %{home_link}:
        credit_2_this_copyright_page: this copyright page
        credit_3_credit_html: Map data courtesy of the %{project_link} project, in the public domain unless otherwise noted.
        credit_3_ohm_html: 'Or you can include a clearer acknowledgment on a separate credits page where you credit other sources:

          '
        credit_3_project: OpenHistoricalMap
        credit_4_ohm_html: |
          On a print map, you can place the acknowledgement in the legend.
          In a book, you can describe your use of OpenHistoricalMap in a footnote, bibliography, or colophon.
          In an academic paper, you can cite us in various manners depending on what you used.
        credit_title_html: How to credit OpenHistoricalMap
        infringement_1_html: 'OHM contributors are reminded never to add data from any copyrighted sources (e.g. Google Maps or printed maps) without explicit permission from the copyright holders.

          '
        infringement_2_ohm_contact_team: contact the OpenHistoricalMap team with "TAKEDOWN REQUEST" in the subject line
        infringement_2_ohm_html: |
          If you believe that copyrighted material has been inappropriately
          added to the OpenHistoricalMap database or this site, please %{contact_team_link}.
        introduction_1_cc0: Creative Commons CC0
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/
        introduction_1_ohm_html: |
          OpenHistoricalMap is a collection of open geospatial data.
          Except where otherwise noted, OpenHistoricalMap data is dedicated to the public domain under a %{cc0_link} dedication.
          To the extent that what you use is in the public domain, you are free to copy, distribute, transmit, and adapt it for any purpose, without any restrictions.
        introduction_2_cc_by: Creative Commons Attribution
        introduction_2_cc_by_sa: Creative Commons Attribution-ShareAlike
        introduction_2_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/4.0/
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/
        introduction_2_license_key_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Tags/Key/license
        introduction_2_ohm_html: |
          The OpenHistoricalMap database incorporates some individual map features under copyright.
          These features are available under an open license, such as %{cc_by_link} (CC&nbsp;BY) or %{cc_by_sa_link} (CC&nbsp;BY-SA), as noted in %{license_key_link} tags on individual elements.
          To the extent that you use any significant portion of the database that is covered by a “share alike” license, you should respect the terms of this license in your own adaptation.
        introduction_3_ohm_html: 'The map styles featured on our homepage are dedicated to the public domain under a CC0 dedication. You are free to copy, distribute, transmit, and adapt them for any purpose, without any restrictions.

          '
        introduction_4_creative_commons: Creative Commons Attribution-ShareAlike 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/
        introduction_4_ohm_html: 'Our documentation is licensed under the %{creative_commons_link} license (CC BY-SA 2.0).

          '
        more_1_ohm_html: 'Learn more about the legal considerations when using our data, and how to credit us, %{wiki_link}.

          '
        more_1_wiki: on the OpenStreetMap Wiki
        more_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/License
        more_2_1_api_usage_policy: API Usage Policy
        more_2_1_api_usage_policy_url: https://operations.osmfoundation.org/policies/api/
        more_2_1_html: |
          Although OpenHistoricalMap is open data, we cannot provide a
          free-of-charge map API or map tiles for third-parties.
          See our %{api_usage_policy_link}, %{tile_usage_policy_link} and %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Nominatim Usage Policy
        more_2_1_nominatim_usage_policy_url: https://operations.osmfoundation.org/policies/nominatim/
        more_2_1_tile_usage_policy: Tile Usage Policy
        more_2_1_tile_usage_policy_url: https://operations.osmfoundation.org/policies/tiles/
        more_title_html: Finding out more
        trademarks_1_ohm_contact_team: contact the OpenHistoricalMap team
        trademarks_1_ohm_html: 'If you have questions about your use of the OpenHistoricalMap name, please %{contact_team_link}.

          '
      title: Copyright and Acknowledgements
    export:
      cc0: Creative Commons CC0
      cc0_url: https://creativecommons.org/publicdomain/zero/1.0/
      copyright_page: Copyright and Acknowledgements
