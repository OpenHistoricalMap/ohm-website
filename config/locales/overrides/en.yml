    potlatch:
      removed: Your default OpenHistoricalMap editor is set as Potlatch. Because Adobe Flash Player has been withdrawn, Potlatch is no longer available to use in a web browser.
    welcome:
      basic_terms:
        a_tag_html: A %{tag} is a bit of data about a node or way, like a restaurant's name or the year a bridge was built.
        paragraph_1: 'OpenHistoricalMap has some of its own lingo. Here are a few key words that''ll come in handy.

          '
      introduction: 'Welcome to OpenHistoricalMap, the free and editable map of world history. Now that you''re signed up, you''re all set to get started mapping. Here''s a quick guide with the most important things you need to know.

        '
      rules:
        para_1_html: |
          OpenHistoricalMap has few formal rules but we expect all participants to collaborate
          with, and communicate with, the community. If you are considering
          any activities other than editing by hand, please read and follow the guidelines on
          %{imports_link} and %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: |
          OpenHistoricalMap %{doesnt} include fictional alternative histories,
          known errors from antique maps, and data from copyrighted sources. Unless you have special permission, don't copy from modern maps of the past that you find online or in print.
        on_the_map_ohm_html: |
          OpenHistoricalMap tracks changes to natural and human geography throughout the world.
          We have millions of entries from %{past_and_present}, from empires and glaciers to houses and restaurants. You can map whatever real-world features are interesting to you.
        past_and_present: both the past and present
