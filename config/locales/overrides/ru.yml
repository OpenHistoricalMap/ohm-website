    map:
      base:
        railway: Железная дорога
  layouts:
    intro_header: Добро пожаловать на OpenHistoricalMap!
    intro_text: OpenHistoricalMap является картой мира, созданной такими же людьми,
      как и вы, и может свободно использоваться под открытой лицензией.
    logo:
      alt_text: Логотип OpenHistoricalMap
  notes:
    new:
      advice: Ваша заметка является общедоступной и может использоваться для обновления
        карты, поэтому не вводите личную информацию, информацию из защищённых авторскими
        правами карт или справочников.
  sessions:
    destroy:
      heading: Выйти из OpenHistoricalMap
  site:
    about:
      lede_text: OpenHistoricalMap создан сообществом картографов, которые добавляют
        и поддерживают данные о дорогах, тропах, кафе, вокзалах и о многих других
        объектах по всему миру.
      used_by_html: '%{name} предоставляет данные для тысяч сайтов, мобильных приложений
        и устройств'
    about_section:
      contribute_1_user_diaries: дневники пользователей
      legal_1_aup: Политики приемлемого использования
      legal_1_html: |-
        Этот сайт и многие другие связанные службы официально управляются
        %{group_link}
        от имени сообщества. Использование всех сервисов OSMF регулируется
        нашими %{terms_of_use_link}, %{aup_link} и %{privacy_policy_link}.
      legal_1_privacy_policy: Политикой конфиденциальности
      legal_1_terms_of_use: Условиями использования
      legal_2_html: |-
        Пожалуйста, %{contact_team_link}
        если у вас есть вопросы по лицензированию, авторскому праву или другие юридические вопросы.
    add_a_note:
      para_1: Если нужно сделать небольшое уточнение, ради которого слишком долго
        регистрироваться и изучать правила правки, можно просто добавить заметку на
        карту.
    any_questions:
      ohm_paragraph_1_html: |-
        В OpenHistoricalMap имеется несколько ресурсов для изучения проекта, вопросов и ответов на них, а также для совместного обсуждения и документирования тем, относящихся к картографированию.
        %{help_link}.
    copyright:
      legal_babble:
        attribution_example:
          title: Пример указания авторства
        contributors_footer_2_html: Включение данных в OpenHistoricalMap не означает,
          что поставщик первичных данных каким-либо образом поддерживает OpenHistoricalMap,
          предоставляет гарантии или принимает на себя какую-любую ответственность.
        contributors_intro_html: 'Участниками проекта являются тысячи отдельных людей.
          Проект также включает данные под свободными лицензиями от национальных картографических
          агентств и от других источников, среди которых:'
        contributors_title_html: Кто вносит вклад в наш проект
        credit_1_html: 'Если вы используете данные OpenHistoricalMap, вы должны выполнить
          следующие два условия:'
        credit_2_this_copyright_page: эту страницу об авторских правах
        credit_title_html: Как сослаться на OpenHistoricalMap
        infringement_1_html: Напоминаем участникам сообщества OHM, что добавление
          данных из любых защищённых авторским правом источников (например, с Google
          Maps или печатных карт) не должно проводиться без явного предварительного
          согласия правообладателей.
        introduction_4_creative_commons: Creative Commons Attribution-ShareAlike 2.0
        more_title_html: Узнайте больше
      title: Авторские права и лицензирование
    export:
      too_large:
        body: 'Эта область слишком велика для экспорта в качестве данных в формате
          OpenHistoricalMap XML. Пожалуйста, увеличьте масштаб, выберите меньшую область
          или используйте один из перечисленных ниже других источников:'
        overpass:
          description: Скачать ограниченную этим прямоугольником область с зеркала
            базы данных OpenHistoricalMap
        planet:
          description: Регулярно обновляемые копии полной базы данных OpenHistoricalMap
          title: Планета OHM
    fixthemap:
      how_to_help:
        join_the_community:
          explanation_html: Если вы заметили проблему в данных нашей карты, например,
            отсутствие дороги или вашего адреса, лучший способ для дальнейших действий
            — вступить в сообщество OpenHistoricalMap и добавить или восстановить
            данные самостоятельно.
    help:
      forum:
        title: Форум
      introduction: На OpenHistoricalMap есть несколько ресурсов, где можно узнать
        о проекте, задать вопросы или ответить на них и совместно обсудить темы, касающиеся
        картографии.
      mailing_list:
        title: Список рассылки
      slack:
        title: IRC
      welcome:
        description: Начните с этого краткого руководства, охватывающего основы OpenHistoricalMap.
        title: Добро пожаловать в OpenHistoricalMap
      welcomemat:
        title: Для организаций
      wiki:
        description: Посмотреть вики с подробной документацией по OHM.
        title: Вики
    index:
      js_2: OpenHistoricalMap использует JavaScript для отображения карт.
    potlatch:
      removed: Ваш редактор OpenHistoricalMap по умолчанию - Potlach. Поскольку поддержка
        Adobe Flash Player была приостановлена, Potlatch больше не доступен для использования
        в веб-браузере.
    welcome:
      basic_terms:
        a_tag_html: '%{tag} — это часть данных о точке (узле) или пути, например название
          ресторана или ограничение скорости на дороге.'
        paragraph_1: У OpenHistoricalMap выработался локальный сленг. Вот несколько
          понятий, которые стоит иметь в виду.
      introduction: Добро пожаловать на OpenHistoricalMap, открытую и свободную карту
        мира. Теперь, когда регистрация завершена, можно начинать картографировать.
        Вот небольшая инструкция по самым важным вещам, которые необходимо знать.
      rules:
        para_1_html: |-
          В OpenHistoricalMap несколько формальных правил, но мы ожидаем, что все участники будут сотрудничать
          с сообществом и общаться с ним. Если вы планируете
          какие-либо действия, кроме редактирования вручную, прочтите и следуйте инструкциям:
          %{imports_link} и %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Чего здесь %{doesnt}, так это субъективных данных, таких
          как рейтинги, исторические или гипотетические характеристики, а также данных
          из источников, защищённых авторским правом. Не копируйте карты с онлайн-
          или бумажных карт, если у вас нет специального разрешения.
