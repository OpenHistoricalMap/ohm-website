      description: Операция, которую вы запросили на сервере OpenHistoricalMap, некорректна (HTTP 400)
    contact:
      contact_the_community_html: Не стесняйтесь %{contact_link} к сообществу OpenHistoricalMap, если вы нашли неработающую ссылку/ошибку. Запишите точный URL вашего запроса.
    forbidden:
      description: Запрашиваемая вами операция на сервере OpenHistoricalMap доступна только администраторам (HTTP 403).
    internal_server_error:
      description: Сервер OpenHistoricalMap столкнулся с непредвиденной ситуацией, из-за которой он не смог выполнить запрос (HTTP 500).
