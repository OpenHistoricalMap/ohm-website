  users:
    auth_association:
      heading: Ваш ID пока ещё не связан с учётной записью OpenHistoricalMap.
      option_1: Если вы впервые на OpenHistoricalMap, пожалуйста, создайте новую учётную запись, используя форму ниже.
    new:
      about:
        paragraph_1: В отличие от других карт, OpenHistoricalMap полностью создана такими же людьми, как и вы, и каждый может бесплатно исправлять, обновлять, загружать и использовать ее.
        welcome: Добро пожаловать в OpenHistoricalMap
    show:
      delete_user: Удалить этого пользователя
      hide_user: Скрыть этого пользователя
      unhide_user: Отобразить этого пользователя
