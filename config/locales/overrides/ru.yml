      rss:
        title: Заметки OpenHistoricalMap
  application:
    setup_user_auth:
      blocked_zero_hour: У вас есть срочное сообщение на сайте OpenHistoricalMap.
        Вам нужно прочитать сообщение, прежде чем вы сможете сохранить ваши изменения.
  changeset_comments:
    feeds:
      show:
        title_all: Обсуждение пакета правок OpenHistoricalMap
        title_particular: 'Обсуждение пакета правок OpenHistoricalMap #%{changeset_id}'
