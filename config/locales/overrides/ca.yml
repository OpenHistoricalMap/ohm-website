      heading: Tanca la sessió d'OpenHistoricalMap
  site:
    about:
      lede_text: OpenHistoricalMap està fet per una comunitat de cartògrafs que aporten i actualitzen dades sobre carreteres, senders, cafeteries, estacions de ferrocarril i molt més arreu del món.
    about_section:
      contribute_1_user_diaries: dietaris dels usuaris
      legal_1_aup: polítiques d'ús acceptable
      legal_1_html: "Aquest lloc web i molts altres serveis relacionats són operats formalment per la \n%{group_link} en nom de la comunitat. L'ús de tots els serveis operats per l'OSMF es troba subjecte a les nostres %{terms_of_use_link}, %{aup_link} i a les nostres %{privacy_policy_link}."
      legal_1_privacy_policy: polítiques de privadesa
      legal_1_terms_of_use: condicions d’ús
      legal_2_html: "%{contact_team_link} si teniu qüestions sobre la llicència, copyright o altres temes legals."
    copyright:
      legal_babble:
        contributors_footer_2_html: La inclusió de dades a l'OpenHistoricalMap no implica que el proveïdor original de les dades dona suport a l'OpenHistoricalMap, proporciona cap garantia o accepta cap responsabilitat.
        credit_1_html: 'Allà on utilitzeu les dades de l''OpenHistoricalMap, cal que feu les dues coses següents:'
        credit_2_this_copyright_page: aquesta pàgina de copyright
        credit_title_html: Com atribuir autoria a OpenHistoricalMap
        infringement_1_html: Recordem als col·laboradors de l'OHM que mai no s'han d'afegir dades de cap font amb drets d'autor registrats (com Google Maps o mapes impresos per exemple) sense tenir una autorització explícita dels titulars dels drets d'autor.
        introduction_4_creative_commons: Creative Commons Reconeixement-CompartirIgual 2.0
        more_title_html: Saber-ne més
    export:
      too_large:
        body: Aquesta zona és massa gran per a ser exportada com a dades XML d'OpenHistoricalMap. Feu zoom, seleccioneu una àrea més petita o useu una de les següents fonts per descarregar quantitats grans de dades.
        overpass:
          description: Descarrega aquest requadre delimitador des d'una rèplica de la base de dades d'OpenHistoricalMap
        planet:
          description: Còpies actualitzades regularment de la base de dades d'OpenHistoricalMap al complet
          title: Planeta OHM
    fixthemap:
      how_to_help:
        join_the_community:
          explanation_html: Si heu trobat un error en el mapa, com per exemple una carretera que falta o bé la vostra adreça, la millor forma d'arreglar-ho és unint-vos a la comunitat d'OpenHistoricalMap i afegir o bé corregir les dades vós mateix.
    help:
      introduction: OpenHistoricalMap té diversos recursos per conèixer el projecte, per plantejar i respondre preguntes, i per discutir i documentar temes de cartografia de manera col·laborativa.
      slack:
        title: IRC
      welcome:
        description: Comenceu amb aquesta guia ràpida sobre els aspectes bàsics de l'OpenHistoricalMap.
        title: Benvingut a OpenHistoricalMap
      wiki:
        description: Navegueu per la wiki per a trobar documentació detallada d'OHM.
    index:
      js_2: L'OpenHistoricalMap utilitza JavaScript per al mapa lliscant.
    potlatch:
      removed: El vostre editor d'OpenHistoricalMap per defecte és el Potlatch. Atès que s'ha discontinuat l'Adobe Flash Player, el Potlach deixarà d'estar disponible des del navegador web.
    welcome:
      basic_terms:
        paragraph_1: L'OpenHistoricalMap té un argot propi. Aquí tens unes quantes paraules clau que et poden venir bé.
      introduction: Us donem la benvinguda a l'OpenHistoricalMap, el mapamundi lliure i editable. Ara que ja us heu registrat, ja ho teniu tot a punt per començar a editar el mapa. Aquí hi ha una guia ràpida amb les coses més importants que cal saber
      rules:
        para_1_html: |-
          OpenHistoricalMap té poques regles formals, però esperem que tots els participants col·laboreu i us comuniqueu amb la comunitat. Si esteu considerant
          qualsevol altra activitat que no sigui l'edició manual, llegiu i seguiu les directrius sobre
          %{imports_link} i %{automated_edits_link}.
