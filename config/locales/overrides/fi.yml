    new:
      about:
        paragraph_1: Toisin kuin muut karttapalvelut, OpenHistoricalMap on täysin tavallisten ihmisten luoma. Kuka tahansa voi korjata, päivittää, ladata ja käyttää sitä ilmaiseksi.
