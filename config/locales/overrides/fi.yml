  site:
    about:
      lede_text: OpenHistoricalMapia rakentavat vapaaehtoiset yhteisön jäsenet, jotka tuottavat ja ylläpitävät karttatietoja teistä, rautateistä, kahviloista, rautatieasemista ja monista muista kohteista kaikkialla maailmassa.
    about_section:
      contribute_1_user_diaries: käyttäjien päiväkirjoja
      legal_1_aup: sallitun käytön käytäntöjä
      legal_1_html: Tämä sivusto ja monet siihen liittyvät palvelut ovat muodollisesti %{group_link} hallinnoimia OSM-yhteisön puolesta. Kaikkien OSMF:n hallinnoimien palveluiden käyttöön sovelletaan %{terms_of_use_link}, %{aup_link} ja %{privacy_policy_link} (saatavilla vain englanniksi).
      legal_1_privacy_policy: tietosuojakäytäntöä
      legal_1_terms_of_use: käyttöehtoja
      legal_2_html: Ota yhteyttä %{contact_team_link}, jos sinulla on kysymyksiä lisenssoinnista, tekijänoikeuksista tai muista oikeudellisista kysymyksistä.
    add_a_note:
      para_1: Jos huomaat kartalla virheen, muttet halua korjata sitä itse, tee siitä karttavirheilmoitus.
    communities:
      lede_text: Ihmiset ympäri maailmaa käyttävät ja täydentävät OpenHistoricalMapia. Vaikka monet osallistuvat yksilöinä, osa käyttäjistä on muodostanut yhteisöjä. Näiden ryhmien koko vaihtelee ja ryhmien jäsenet saattavat kattaa joko pienen kylän tai useita alueita eri maista. Ryhmät voivat olla muodollisia tai epävirallisia.
    copyright:
      legal_babble:
        attribution_example:
          title: Nimeämisesimerkki
        contributors_footer_2_html: |-
          Tietojen sisältyminen OpenHistoricalMapiin ei tarkoita, että tietojen antaja
          ottaa kantaa OpenHistoricalMapiin tai vastuuta tietojen oikeellisuudesta.
        contributors_intro_html: |-
          Tekijöinämme on tuhansia yksityishenkilöitä. Olemme myös sisällyttäneet
          vapaasti lisensoitua dataa kansallisilta kartoitustoimistoilta
          ja muista lähteistä, muun muassa:
        credit_1_html: 'Kun käytät OpenHistoricalMap-tietoja, sinun on tehtävä nämä kaksi asiaa:'
        credit_2_this_copyright_page: tälle tekijänoikeussivulle
        credit_title_html: OpenHistoricalMapin mainitseminen
        infringement_1_html: |-
          OHMin kartoittajia muistutetaan, että kopioiminen tekijänoikeuksien alaisista teoksista
          (esimerkiksi Google-kartoista tai paperikartoista) ilman tekijänoikeuden haltijan nimenomaista lupaa on kielletty.
        introduction_4_creative_commons: Creative Commons Nimeä-JaaSamoin 2.0
        more_2_1_api_usage_policy: API:n käyttöehtoihin
        more_2_1_html: Vaikka OpenHistoricalMap on avointa dataa, emme voi tarjota maksutonta karttarajapintaa (API) kolmannen osapuolen kehittäjille. Tutustu %{api_usage_policy_link}, %{tile_usage_policy_link} ja %{nominatim_usage_policy_link}.
        more_2_1_tile_usage_policy: kartta-aineiston käyttöehtoihin
        more_title_html: Lisätietoja
    export:
      too_large:
        body: 'Näin suurta aluetta ei voi viedä OpenHistoricalMap XML-tiedostona. Lähennä karttaa tai valitse pienempi alue, tai vaihtoehtoisesti lataa tiedosto joltakin seuraavista:'
        overpass:
          description: Lataa kartalle rajattu alue OpenHistoricalMapin varapalvelimelta
        planet:
          description: Säännöllisesti päivitettyjä kopioita täydellisestä OpenHistoricalMap-tietokannasta
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: "Klikkaa vain %{note_icon} tai samaa ikonia karttanäkymässä.\nTämä lisää merkin kartalle, jota voit liikuttaa \nraahaamalla. Lisää tekstisi, ja klikkaa Tallenna, ja muut voivat tutkia sitä."
        join_the_community:
          explanation_html: Jos olet huomannut ongelman kartassa, kuten puuttuvan tien tai puuttuvan osoitteesi, paras tapa toimia on liittyä OpenHistoricalMap-yhteisöön ja lisätä tai korjata kohta itse.
      other_concerns:
        contact: ota yhteyttä
    help:
      introduction: Ohjeita ja vinkkejä OpenHistoricalMapin käyttöön on saatavilla useista eri lähteistä.
      slack:
        title: IRC
      welcome:
        description: Opi OpenHistoricalMapin perusteet tällä helpolla aloitusoppaalla.
        title: Tervetuloa OpenHistoricalMapiin
      wiki:
        description: Tutustu syvällisemmin OHMiin wikikirjastossa. Osittain englanninkielinen.
    index:
      js_2: OpenHistoricalMap tarvitsee JavaScriptin liikuteltavaan karttaan.
      remote_failed: Muokkaus epäonnistui - varmista, että JOSM tai Merkaartor on ladattu ja etähallinta-asetus on käytössä
    potlatch:
      removed: OpenHistoricalMapin oletusmuokkausohjelmaksi on valittu Potlatch. Adoben Flash Player -lisäosan tuki on päättynyt, minkä vuoksi Potlatch ei ole enää saatavilla verkkoselaimessa.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMapissa käytetään paljon vain sille omaista termistöä. Kun nämä sanat ovat hallinnassa, olet jo voiton puolella!
      introduction: 'Tervetuloa OpenHistoricalMapiin: ilmaiseen ja vapaasti muokattavaan maailmankarttaan. Rekisteröityminen on nyt suoritettu, joten olet valmis aloittamaan kartan muokkaamisen. Tutustu ensin kuitenkin näihin perusasioihin.'
      rules:
        para_1_html: OpenHistoricalMapilla on joitakin muodollisia säännöksiä, mutta oletamme kaikkien käyttäjien tekevän yhteistyötä muiden kanssa. Jos harkitset muita toimintoja kuin perusmuokkausta, lue ohje %{imports_link} ja %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Kartta %{doesnt} sisällä mielipiteitä, kuten arvosteluja, historiallisia tai hypoteettisia ominaisuuksia, eikä tietoja tekijänoikeuksin suojatuista lähteistä. Ellei sinulla ole erityistä lupaa, älä kopioi verkko- tai paperikarttoja.
