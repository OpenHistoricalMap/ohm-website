      legal_1_privacy_policy: سياسة الخصوصية
      legal_1_terms_of_use: شروط الاستخدام
      legal_2_html: من فضلك %{contact_team_link} إذا كان لديك ترخيص أو حقوق طبع ونشر أو أسئلة قانونية أخرى.
    copyright:
      legal_babble:
        attribution_example:
          alt: رابط يحمل علامة OHM في الزاوية اليمنى السفلية لصفحة الويب، أسفل شريط تمرير الوقت.
          title: مثال على كيفية إسناد OpenHistoricalMap إلى صفحة ويب
        contributors_footer_2_html: |-
          إدراج البيانات في OpenHistoricalMap لا يعني أن الأصلي
          مزود البيانات يؤيد OpenHistoricalMap ، يوفر أي ضمان ، أو
          يقبل أي مسؤولية.
        contributors_intro_html: |-
          OpenHistoricalMap هو جهد تعاوني لآلاف الأفراد والمنظمات، الذين بدورهم يستفيدون من مجموعة كبيرة من المنح الدراسية والصحافة وحفظ السجلات.
          تشمل أهم مصادرنا ومساهمينا ما يلي:
        contributors_title_html: الشكر والتقدير
        credit_1_html: على الرغم من أن قانون حقوق النشر لا يقيد أو يضع أي شروط على استخدامك للمحتوى المتاح في المجال العام، فإننا نقدر بشدة أي رصيد تقدمه إلى OpenHistoricalMap عند إعادة استخدام أو تكييف أو استخدام خرائطنا أو بياناتنا بأي طريقة أخرى.
        credit_title_html: كيفية إضافة الفضل إلى OpenHistoricalMap
        infringement_1_html: |-
          يتم تذكير المساهمين OHM لا لإضافة البيانات من أي
          المصادر المحمية بحقوق الطبع والنشر (مثل خرائط Google أو الخرائط المطبوعة) بدون
          إذن صريح من أصحاب حقوق النشر.
        more_title_html: معرفة المزيد
      title: حقوق الطبع والنشر والإقرارات
    export:
      too_large:
        planet:
          title: كوكب أوم
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            انقر على %{note_icon} أو على نفس الرمز على شاشة الخريطة. سيُضاف هذا علامة إلى الخريطة، ويمكنك تحريكها
             بالسحب. أضف رسالتك، ثم انقر على "حفظ"، وسيقوم مصممو الخرائط الآخرون بالتحقق.
        join_the_community:
          explanation_html: إذا لاحظت وجود مشكلة في بيانات خريطتنا، على سبيل المثال طريق مفقود أو عنوانك، فإن أفضل طريقة للمتابعة هي الانضمام إلى مجتمع OpenHistoricalMap وإضافة البيانات أو إصلاحها بنفسك.
    help:
      discord:
        title: ديسكورد
      introduction: يحتوي OpenHistoricalMap على العديد من الموارد للتعرف على المشروع، وطرح الأسئلة والإجابة عليها، ومناقشة مواضيع رسم الخرائط وتوثيقها بشكل تعاوني.
      slack:
        title: سلاك
      welcome:
        description: ابدأ بهذا الدليل السريع الذي يغطي أساسيات OpenHistoricalMap.
        title: مرحباً بكم في OpenHistoricalMap
      welcomemat:
        title: مرحباً بكم في OHM
      wiki:
        description: تعليمات يتم صيانتها من قبل المجتمع لاستخدام OHM وإرشادات للمساهمة في المشروع.
        title: ويكي
    index:
      license:
        copyright: يُعد OpenHistoricalMap مخصصًا للملكية العامة ما لم يُذكر خلاف ذلك.
      remote_failed: فشل التعديل - تأكد من تحميل JOSM أو Merkaartor وتمكين خيار التحكم عن بعد
    welcome:
      basic_terms:
        paragraph_1: لدى OpenHistoricalMap لغة خاصة بها. إليك بعض الكلمات الرئيسية المفيدة.
      introduction: أهلاً بكم في OpenHistoricalMap، خريطة التاريخ العالمي المجانية والقابلة للتعديل. بعد تسجيلك، أنت جاهز لبدء رسم الخرائط. إليك دليل سريع بأهم المعلومات التي تحتاج لمعرفتها.
      rules:
        para_1_html: لدى OpenHistoricalMap قواعد رسمية قليلة، لكننا نتوقع من جميع المشاركين التعاون والتواصل مع مجتمعنا. إذا كنتم تفكرون في أي أنشطة أخرى غير التحرير اليدوي، يُرجى قراءة واتباع الإرشادات المتعلقة بـ %{imports_link} و%{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: "%{doesnt} OpenHistoricalMap تواريخ بديلة خيالية، وأخطاء معروفة من خرائط قديمة، وبيانات من مصادر محمية بحقوق الطبع والنشر. لا تنسخ من خرائط قديمة حديثة تجدها على الإنترنت أو مطبوعة، إلا بإذن خاص."
