    add_a_note:
      para_1: إذا كنت تريد إصلاح مجرد شيء صغير وليس لديك الوقت للتسجيل ومعرفة كيفية
        التحرير، فإنه من السهل أن تضيف ملاحظة.
    any_questions:
      ohm_paragraph_1_html: |-
        يحتوي OpenHistoricalMap على العديد من الموارد للتعرف على المشروع، وطرح الأسئلة والإجابة عليها
        ، ومناقشة مواضيع رسم الخرائط وتوثيقها بشكل تعاوني. %{help_link}.
    copyright:
      legal_babble:
        attribution_example:
          alt: رابط يحمل علامة OHM في الزاوية اليمنى السفلية لصفحة الويب، أسفل شريط
            تمرير الوقت.
          title: مثال على كيفية إسناد OpenHistoricalMap إلى صفحة ويب
        contributors_footer_2_html: |-
          إدراج البيانات في OpenHistoricalMap لا يعني أن الأصلي
          مزود البيانات يؤيد OpenHistoricalMap ، يوفر أي ضمان ، أو
          يقبل أي مسؤولية.
        contributors_intro_html: |-
          OpenHistoricalMap هو جهد تعاوني لآلاف الأفراد والمنظمات، الذين بدورهم يستفيدون من مجموعة كبيرة من المنح الدراسية والصحافة وحفظ السجلات.
          تشمل أهم مصادرنا ومساهمينا ما يلي:
        contributors_title_html: الشكر والتقدير
        credit_1_html: على الرغم من أن قانون حقوق النشر لا يقيد أو يضع أي شروط على
          استخدامك للمحتوى المتاح في المجال العام، فإننا نقدر بشدة أي رصيد تقدمه إلى
          OpenHistoricalMap عند إعادة استخدام أو تكييف أو استخدام خرائطنا أو بياناتنا
          بأي طريقة أخرى.
        credit_title_html: كيفية إضافة الفضل إلى OpenHistoricalMap
        infringement_1_html: |-
          يتم تذكير المساهمين OHM لا لإضافة البيانات من أي
          المصادر المحمية بحقوق الطبع والنشر (مثل خرائط Google أو الخرائط المطبوعة) بدون
          إذن صريح من أصحاب حقوق النشر.
        more_title_html: معرفة المزيد
      title: حقوق الطبع والنشر والإقرارات
