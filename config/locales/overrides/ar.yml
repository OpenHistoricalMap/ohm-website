  site:
    about:
      lede_text: OpenHistoricalMap هو مشروع طموح بقيادة المجتمع لرسم خرائط للتغيرات في الجغرافيا الطبيعية والبشرية في جميع أنحاء العالم... عبر العصور.
      used_by_html: استكشف العالم في أي فترة زمنية مع %{name}.
    about_section:
      contribute_1_user_diaries: يوميات المستخدم
