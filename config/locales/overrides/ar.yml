    index:
      js_2: خريطة الشارع المفتوحة تستخدم جافا سكريبت لخريطتها المنزلقة.
      license:
        copyright: يُعد OpenHistoricalMap مخصصًا للملكية العامة ما لم يُذكر خلاف ذلك.
    welcome:
      basic_terms:
        paragraph_1: لدى OpenHistoricalMap لغة خاصة بها. إليك بعض الكلمات الرئيسية
          المفيدة.
      introduction: أهلاً بكم في OpenHistoricalMap، خريطة التاريخ العالمي المجانية
        والقابلة للتعديل. بعد تسجيلك، أنت جاهز لبدء رسم الخرائط. إليك دليل سريع بأهم
        المعلومات التي تحتاج لمعرفتها.
      rules:
        para_1_html: لدى OpenHistoricalMap قواعد رسمية قليلة، لكننا نتوقع من جميع
          المشاركين التعاون والتواصل مع مجتمعنا. إذا كنتم تفكرون في أي أنشطة أخرى
          غير التحرير اليدوي، يُرجى قراءة واتباع الإرشادات المتعلقة بـ %{imports_link}
          و%{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: '%{doesnt} OpenHistoricalMap تواريخ بديلة خيالية، وأخطاء
          معروفة من خرائط قديمة، وبيانات من مصادر محمية بحقوق الطبع والنشر. لا تنسخ
          من خرائط قديمة حديثة تجدها على الإنترنت أو مطبوعة، إلا بإذن خاص.'
