  site:
    about:
      lede_text: Savet eo OpenHistoricalMap gant ur gumuniezh gartennerien a-youl vat a genlabour hag a gempenn roadennoù diwar-benn hentoù, gwenodennoù, kafedioù, tiez-gar, ha muioc'h c'hoazh, er bed a-bezh.
    about_section:
      contribute_1_user_diaries: deizlevrioù an implijer
      legal_1_html: |-
        Al lec'hienn-mañ ha kalz servijoù liammet ouzhpenn a vez oberataet gant %{group_link}
        en anv ar gumuniezh. Implijout hor servijoù oberataet gant OSMF a zo suj d'hon %{terms_of_use_link}, hon %{aup_link} hag hor %{privacy_policy_link}.
      legal_1_privacy_policy: Politikerezh prevezded
      legal_1_terms_of_use: Termenoù implij
    copyright:
      legal_babble:
        contributors_footer_2_html: Enlakaat roadennoù e OpenHistoricalMap ne empleg ket ez aprou ar bourchaserien orin a endalc'had OpenHistoricalMap, na ne bourchasont, na ne waratomp pe na ne zegemeront ne vern pe atebegezh e vefe.
        credit_1_html: 'Pa implijit titouroù OpenHistoricalMap e rankit ober an daou dra-mañ:'
        credit_2_this_copyright_page: ar bajenn gwirioù oberour-mañ
        credit_title_html: Penaos reiñ kred da OpenHistoricalMap
        infringement_1_html: |-
          Degas a reomp da soñj da genlabourerien OHM ne zleont morse lakaat roadennoù a zeu
          eus mammennoù dindan wirioù (da sk. : Google Maps pe kartennoù moullet) hep aotre
          ezpleg ar re zo ar gwirioù-aozer ganto.
        introduction_4_creative_commons: Aotre-implijout Creative Commons Attribution-ShareAlike 2.0
        more_2_1_api_usage_policy: Politikerezh implij an API
        more_2_1_tile_usage_policy: Politikerezh implij an teol
        more_title_html: Titouroù ouzhpenn
      title: Copyright hag aotre-implijout
    export:
      too_large:
        body: 'Re vras eo an takad-mañ evit bezañ ezporzhiet evel roadennoù XML OpenHistoricalMap. Zoumit, mar plij, pe diuzit un takad bihanoc''h pe immplijit unan eus an tarzhioù-mañ evit pellgargañ roadennoù a-yoc''h :'
        overpass:
          description: Pellgargañ ar voest engronnus-mañ diwar ur melezour eus diaz roadennoù OpenHistoricalMap
        planet:
          description: Eilennoù hizivaet ingal eus diaz roadennoù klok OpenHistoricalMap
          title: Planedenn OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Klikit war %{note_icon} pe war ar memes arlun war ar gartenn.
            Evel-se e vo ouzhpennet ur merker d'ar gartenn, ha gallout a reoc'h riklañ anezhañ. Ouzhpennit ho kemennadenn, neuze klikit war enrollañ, ha studiet e vo gant ar gartennaouerien all.
        join_the_community:
          explanation_html: M'ho peus merzet ez eus ur gudenn gant roadennoù hor c'hartennoù, da skouer un hent diank pe ho chomlec'h, an doare d'ober gwellañ eo mont d'ar gumuniezh OpenHistoricalMap hag ouzhpennañ pe dresañ ar roadennoù hoc'h-unan.
    help:
      forum:
        title: Forom
      introduction: OpenHistoricalMap zo gantañ meur a zoare da c'houzout hiroc'h diwar-benn ar raktres, d'ober goulennoù ha da respont da c'houlennoù, ha da gendivizout ha da deuliaduriñ sujedoù ar c'hartennoù.
      slack:
        title: IRC
      welcome:
        description: Krogit gant ar sturlevr-mañ evit deskiñ diazezoù OpenHistoricalMap
        title: Degemer mat e OpenHistoricalMap
      wiki:
        description: Furchal er wiki evit gouzout traoù resis diwar-benn OHM.
    index:
      js_2: OpenHistoricalMap a implij JavaScript evit e gartenn risklus.
      remote_failed: C'hwitet eo ar c'hemm - gwiriit hag-eñ eo karget JOSM or Merkaartor ha gweredekaet an dibarzh kontroll a-bell
    welcome:
      basic_terms:
        paragraph_1: E luc'haj dezhañ e-unan en deus OpenHistoricalMap. Setu amañ un nebeud gerioù-alc'hwez a c'hallo talvezout deoc'h.
      introduction: Degemer mat en OpenHistoricalMap, ar gartenn digoust eus ar bed hag a c'haller aozañ. Kevreet oc'h bremañ ha prest oc'h da gregiñ da gartennaouiñ. Setu amañ un nebeud displegadennoù diwar-benn an traoù pouezusañ da c'houzout.
      rules:
        para_1_html: OpenHistoricalMap en deus un nebeud reolennoù furmel, met gortoz a reomp ma vo kemeret perzh gant an holl berzhidi ha ma vo darempredoù gant ar gumuniezh. Ma vezit e-sell d'ober traoù all estreget ober cheñchamantoù gant an dorn, lennit ha heuilhit ar sturiadoù, mar plij, e %{imports_link} ha %{automated_edits_link}.
