      legal_babble:
        contributors_footer_2_html: Përfshirja e të dhënave në OpenHistoricalMap nuk thekson se të ofruesi origjinal i të dhënave përdor OpenHistoricalMap, ofron garancion, apo pranon çfarëdo anekse.
        contributors_intro_html: Licenca jonë CC BY-SA kërkon nga ju që &ldquo;të vlerësoni Autorin Origjinal përkatës të mediumit apo masave që jeni duke i shfrytëzuar &rdquo;. Hartuesit individual të OHM nuk kërkojnë një citim mbi dhe për atë që kontribuojnë për &ldquo;OpenHistoricalMap&rdquo;, por kur përfshihen në OHM, hartat nga një agjencion nacional i hartave apo faktor tjerë madhor burimor, është e arsyeshme të citohen drejtpërsëdrejti duke paraqitur emrin apo duke lidhur faqen e tyre me link.
        credit_1_html: Ne kërkojmë që ju të përdorni kreditet e &ldquo;&copy; OpenHistoricalMap contributors&rdquo;.
        credit_title_html: Si të citoni OpenHistoricalMap
        more_title_html: Zbulo më shumë
    export:
      too_large:
        body: Kjo zonë është shumë e madhe për të eksportuar të dhënat XML të OpenHistoricalMap. Të lutem zmadho (zoom) ose zgjidh një zonë më të vogël, ose përdor një nga burimet e listuara më poshtë për të shkarkuar pjesë të mëdha të të dhënave.
        overpass:
          description: Shkarkoni këtë kuti kufizimi nga një pasqyrim i të dhënave të OpenHistoricalMap
        planet:
          description: Kopje të plota të përditësuara rregullisht të bazës së të dhënave të OpenHistoricalMap
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: Klikoni %{note_icon} ose të njëjtën ikonë në ekranin e hartës. Kjo do të shtojë një shënues në hartë, të cilën ju mund ta lëvizni duke e tërhequr. Shtoni mesazhin tuaj, pastaj klikoni save dhe editues të tjerë do ta kontrollojnë.
    help:
      introduction: OpenHistoricalMap ka disa burime për të mësuar në lidhje me projektin, duke bërë pyetje dhe duke ju përgjigjur dhe duke diskutuar bashkërisht dhe duke dokumentuar temat e hartës.
      welcome:
        description: Filloni me këtë udhëzues të thjeshtë që mbulon bazat e OpenHistoricalMap.
        title: Mirësevini në OpenHistoricalMap
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap ka disa shprehje në zhargonin e vet. Këtu janë disa fjalë kyçe mund të jenë të dobishme.
