        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/deed.nl
        introduction_1_ohm_html: |-
          OpenHistoricalMap is een verzameling van open georuimtelijke gegevens.
          Tenzij anders vermeld zijn de gegevens van OpenHistoricalMap middels de licentie %{cc0_link} toegewezen aan het publieke domein.
          Voor zover wat u gebruikt zich in het publieke domein bevindt, mag u het zonder enige beperking en voor welk doel dan ook kopiëren, verspreiden, verzenden en aanpassen.
        introduction_2_cc_by: Creative Commons Naamsvermelding
