      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Klik op %{note_icon} of hetzelfde pictogram op de kaartweergave.
            Er wordt een markering toegevoegd aan de kaart die u kunt verplaatsen
            door deze te verslepen. Voeg uw bericht toe en klik op “Opslaan”, dan zullen andere kaartmakers uw melding nagaan.
        join_the_community:
          explanation_html: Als u een probleem met onze kaartgegevens hebt gevonden (er ontbreekt bijvoorbeeld een weg of uw adres staat er niet in) dan kunt u zich het best bij OpenHistoricalMap inschrijven en de gegevens zelf toevoegen of corrigeren.
      other_concerns:
        concerns_ohm_html: |-
          Als u vragen hebt over hoe onze gegevens worden gebruikt of over de inhoud, raadpleeg dan onze
          %{copyright_link} voor meer juridische informatie of %{contact_link}.
        contact: neem contact met ons op
        contact_url: https://wiki.openstreetmap.org/wiki/NL:OpenHistoricalMap/Communication
    help:
      discord:
        description: 'Sluit u aan bij de OpenStreetMap World Discord-server en krijg hulp in het kanaal #openhistoricalmap.'
        title: Discord
      forum:
        description: Neem deel aan langere discussies en informele chatrooms met uw OHM-account.
        title: Forum
      github:
        description: Dien een probleem in onze GitHub-opslagplaatsen in om een bug te melden of een nieuwe functie aan te vragen.
        title: Functieverzoeken en bugs
      introduction: Er zijn verschillende bronnen om meer te leren over OpenHistoricalMap, voor het stellen van vragen en het krijgen van antwoorden, en het samen overleggen en documenteren van onderwerpen die gaan over kaarten maken.
      mailing_list:
        description: Abonneer u op onze mailinglijst met een laag volume.
        title: Mailinglijsten
      slack:
        description: 'Nodig uzelf uit voor de OpenStreetMap US Slack-werkruimte en sluit u aan bij het kanaal #openhistoricalmap.'
        title: Slack
      welcome:
        description: Begin met deze korte handleiding die de basis van OpenHistoricalMap uitlegt.
        title: Welkom bij OpenHistoricalMap
      welcomemat:
        description: Begin met deze korte handleiding over de basisprincipes van OpenHistoricalMap.
      wiki:
        description: In de wiki kijken voor diepgaande documentatie over OHM.
        title: Wiki
    index:
      js_2: OpenHistoricalMap gebruikt JavaScript voor de slippykaart.
      license:
        copyright: OpenHistoricalMap is vrijgegeven aan het publieke domein, behalve waar anders is aangegeven.
      remote_failed: Bewerken is mislukt. Zorg dat JOSM of Merkaartor is geladen en dat de instelling voor afstandsbediening is ingeschakeld
    potlatch:
      removed: Uw standaard OpenHistoricalMap-bewerkingsprogramma staat ingesteld op Potlatch. Omdat Adobe Flash Player niet meer bestaat, kan Potlatch niet langer gebruikt worden in de webbrowser.
    welcome:
      basic_terms:
        a_tag_html: Een %{tag} is een gegeven over een knooppunt of weg, zoals de naam van een restaurant of het jaar waarin een brug is gebouwd.
        paragraph_1: OpenHistoricalMap heeft een eigen jargon. Hier zijn een paar handige trefwoorden.
      introduction: Welkom bij OpenHistoricalMap, de vrije en bewerkbare kaart van de wereldgeschiedenis. Nu u bent aangemeld, kunt u de kaarten gaan bewerken. Hier is een korte handleiding met de belangrijkste dingen die u moet weten.
      rules:
        para_1_html: OpenHistoricalMap heeft weinig formele regels. Wel verwachten we van alle deelnemers dat ze samenwerken en communiceren met de gemeenschap. Als u andere activiteiten overweegt dan handmatig bewerken, lees en volg dan de richtlijnen op %{imports_link} en %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: OpenHistoricalMap bevat %{doesnt} fictieve alternatieve geschiedenissen, bekende fouten in antieke kaarten of gegevens uit auteursrechtelijk beschermde bronnen. Kopieer geen moderne kaarten uit het verleden die u online of in gedrukte vorm vindt, tenzij u speciale toestemming hebt.
        on_the_map_ohm_html: |-
          OpenHistoricalMap houdt wijzigingen in de natuurlijke en menselijke geografie over de hele wereld bij.
          We hebben miljoenen items uit %{past_and_present}, van keizerrijken en gletsjers tot huizen en restaurants.
          U kunt alle werkelijke kenmerken in kaart brengen die u interessant vindt.
        past_and_present: zowel het verleden als het heden
