        contributors_intro_html: |-
          OpenHistoricalMap is de gezamenlijke inspanning van duizenden personen en organisaties, die op hun beurt putten uit een grote hoeveelheid aan wetenschappelijke kennis, journalistiek en archiefmateriaal.
          Onze belangrijkste bronnen en bijdragers zijn:
