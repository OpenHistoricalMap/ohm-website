  site:
    about:
      lede_text: OpenHistoricalMap is een ambitieus, door de gemeenschap geleid project om veranderingen in de natuurlijke en menselijke geografie over de hele wereld in kaart te brengen… door de eeuwen heen.
      used_by_html: Verken de wereld in elk tijdperk met %{name}.
    about_section:
      contribute_1_bluesky: Bluesky
      contribute_1_forum: ons discussieforum
      contribute_1_mastodon: Mastodon
      contribute_1_ohm_html: |-
        Onze groeiende gemeenschap van vrijwillige bijdragers bestaat uit amateur- en professionele historici, OpenStreetMap- en Wikipedia-bijdragers, GIS-specialisten en gewone mensen die veel weten over hun omgeving.
        Wij willen niets liever dan de wereld beschrijven en plaatselijke gemeenschappen helpen hun verhaal te vertellen.
        Meer weten over onze gemeenschap? Raadpleeg de %{wiki_link}, bezoek ons %{forum_link}, lees de %{user_diaries_link} en volg ons op %{mastodon_link} of %{bluesky_link}.
      contribute_1_user_diaries: gebruikersdagboeken
      contribute_1_wiki: onze uitgebreide wiki-documentatie
      contribute_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap
      contribute_2_create_account: gratis een account aan te maken
      contribute_2_donations: accepteren wij donaties
      contribute_2_html: |-
        U kunt vandaag nog bijdragen aan de kaart door %{create_account_link}.
        Ook %{donations_link} via %{osmus_link}, een 501(c)(3) non-profitorganisatie met belastingvrije status in de VS.
        Uw vrijgevige donatie wordt rechtstreeks gebruikt om OpenHistoricalMap voor iedereen soepel te laten lopen.
      contribute_2_osmus: OpenStreetMap VS
      contribute_title: U kunt helpen
      legal_1_1_terms_of_use_url: https://wiki.osmfoundation.org/wiki/Licence/Contributor_Terms
      legal_1_aup: beleid voor acceptabel gebruik
      legal_1_aup_url: https://wiki.openstreetmap.org/wiki/Acceptable_Use_Policy
      legal_1_group: een informele groep
      legal_1_group_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Governance
      legal_1_html: |-
        Deze site en gerelateerde diensten worden namens de gemeenschap beheerd door %{group_link}, wat geaffilieerd is met OpenStreetMap VS. Het gebruik van alle OpenHistoricalMap-diensten is onderworpen
        aan onze %{terms_of_use_link}, %{aup_link} en aan ons %{privacy_policy_link}.
      legal_1_privacy_policy: privacybeleid
      legal_1_privacy_policy_url: https://osmfoundation.org/wiki/Privacy_Policy
      legal_1_terms_of_use: gebruiksvoorwaarden
      legal_1_terms_of_use_url: https://osmfoundation.org/wiki/Terms_of_Use
      legal_2_contact_team: contact opnemen met het team van OpenHistoricalMap
      legal_2_html: |-
        %{contact_team_link}
        als u licentie-, copyright- of andere juridische vragen heeft.
      legal_3_html: |-
        OpenHistoricalMap® is een geregistreerd handelsmerk (US Reg. No. 90,019,364).
        OpenStreetMap en het vergrootglaslogo zijn %{osmf_trademarks_link}.
      legal_3_osmf_trademarks: geregistreerde handelsmerken van de OpenStreetMap Foundation
      legal_3_osmf_trademarks_url: https://osmfoundation.org/wiki/Trademark_Policy
      open_data_1_1_html: |-
        De kaart op onze startpagina is maar één van de vele manieren waarop u de door ons verzamelde historische informatie tot zich kunt nemen.
        De onderliggende gegevens zijn %{reuse_link} als download of via verschillende gratis API’s die compatibel zijn met opensourcesoftware.
      open_data_1_1_reuse: voor hergebruik beschikbaar
      open_data_1_1_reuse_url: https://wiki.openstreetmap.org/wiki/NL:OpenHistoricalMap/Reuse
      open_data_2_copyright_license: Auteursrecht en erkenningen
      open_data_2_html: |-
        Tenzij anders vermeld zijn de gegevens publiek domein.
        U mag ze voor elk doel gebruiken, zonder beperking.
        Toch stellen we het zeer op prijs als u OpenHistoricalMap vermeldt.
        Zie %{copyright_license_link} voor meer informatie en dankbetuigingen.
      scope_html: |-
        Rijken komen op en gaan ten onder. Gletsjers verdwijnen. Talen en godsdiensten verspreiden zich van streek tot streek.
        Eenvoudige onverharde paden worden drukke snelwegen en spoorwegen. Bescheiden gebouwen maken plaats voor torenhoge wolkenkrabbers.
        En u weet nog hoe uw buurt er ooit uitzag.
        Het hoort allemaal thuis op OpenHistoricalMap.
      scope_title: Groot en klein, toen en nu
    communities:
      lede_text: "Mensen van over de hele wereld dragen bij aan of gebruiken OpenHistoricalMap.\nHoewel velen als individu deelnemen, hebben anderen gemeenschappen gevormd.\nDeze groepen zijn er in verschillende groottes en vertegenwoordigen regio's van kleine steden tot grote regio's met meerdere landen. \nZe kunnen ook formeel of informeel zijn."
