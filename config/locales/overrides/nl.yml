        contributors_title_html: Dankbetuigingen
        credit_1_html: Hoewel de Amerikaanse auteurswet geen beperkingen of voorwaarden stelt aan het gebruik van inhoud in het publieke domein, stellen wij het zeer op prijs als u OpenHistoricalMap vermeldt bij het hergebruiken, aanpassen of anderszins gebruiken van onze kaarten of gegevens.
        credit_2_home: onze startpagina
        credit_2_ohm_html: |-
          U mag deze vermelding op elke redelijke manier weergeven.
          U kunt bijvoorbeeld op een digitale kaart OpenHistoricalMap in kleine lettertjes in de hoek vermelden, met een koppeling naar %{this_copyright_page_link} of %{home_link}:
        credit_2_this_copyright_page: deze auteursrechtpagina
        credit_3_credit_html: Kaartgegevens met dank aan het project %{project_link}; tenzij anders vermeld zijn deze gegevens in het publieke domein.
        credit_3_ohm_html: 'U kunt ook een duidelijkere vermelding opnemen op een aparte colofonpagina, waarin u ook andere bronnen vermeldt:'
        credit_4_ohm_html: |-
          Op een gedrukte kaart kunt u de dankbetuiging in de legenda plaatsen.
          In een boek kunt u uw gebruik van OpenHistoricalMap beschrijven in een voetnoot, bibliografie of colofon.
          In een wetenschappelijk artikel kunt u ons op verschillende manieren citeren, afhankelijk van wat u hebt gebruikt.
        credit_title_html: Hoe u OpenHistoricalMap kunt vermelden
        infringement_1_html: |-
          OHM-bijdragers horen nooit gegevens toe te voegen
          uit bronnen waarvan de licentie niet vrij is (bijvoorbeeld Google Maps of gedrukte kaarten)
          zonder expliciete toestemming van de auteursrechtenhouders.
        infringement_2_ohm_contact_team: neem dan contact op met het team van OpenHistoricalMap. Vermeld “TAKEDOWN REQUEST” in de onderwerpregel
        infringement_2_ohm_html: Als u van mening bent dat auteursrechtelijk beschermd materiaal op ongepaste wijze is toegevoegd aan de database van OpenHistoricalMap of aan deze site, %{contact_team_link}.
