        introduction_2_license_key_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Tags/Key/license
        introduction_2_ohm_html: |-
          De database van OpenHistoricalMap bevat enkele individuele kaartfuncties die onder het auteursrecht vallen.
          Deze functies zijn beschikbaar onder een open licentie, zoals %{cc_by_link} (CC BY) of %{cc_by_sa_link} (CC BY-SA), zoals aangegeven in de %{license_key_link}-tags op de individuele elementen.
          Voor zover u een aanzienlijk deel van de database gebruikt dat onder een “GelijkDelen”-licentie valt, dient u de voorwaarden van deze licentie in uw eigen aanpassing te respecteren.
