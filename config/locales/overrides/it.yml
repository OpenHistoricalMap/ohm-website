  site:
    about:
      lede_text: OpenHistoricalMap è un ambizioso progetto, guidato dalla comunità, che mira a mappare i cambiamenti nella geografia naturale e umana in tutto il mondo… nel corso dei secoli.
      used_by_html: Esplora il mondo in qualsiasi periodo storico con %{name}.
    about_section:
      contribute_1_forum: il nostro forum di discussione
      contribute_1_ohm_html: La nostra crescente comunità di collaboratori volontari è fatta da storici di professione e amatoriali, collaboratori di OpenStreetMap e di Wikipedia, specialisti di GIS e persone comuni che conoscono bene ciò che li circonda. Abbiamo la passione di documentare il mondo e aiutare le comunità del mondo reale a raccontare le proprie storie. Per saperne di più sulla comunità, consulta %{wiki_link}, visita %{forum_link}, leggi i %{user_diaries_link} e segui il nostro account %{mastodon_link} o %{bluesky_link}.
      contribute_1_user_diaries: diari degli utenti
      contribute_1_wiki: la nostra ampia documentazione wiki
      contribute_2_create_account: creazione di un account gratuito
      contribute_2_osmus: OpenStreetMap USA
      contribute_title: Puoi dare il tuo aiuto
      legal_1_aup: Politiche di utilizzo accettabile
      legal_1_group: un gruppo informale
      legal_1_html: "Questo sito e molti altri servizi correlati sono formalmente gestiti dalla \n%{group_link} \nper conto della comunità. L'uso di tutti i servizi gestiti dalla OSMF è soggetto \nalle nostre %{terms_of_use_link}, %{aup_link} ed alla nostra %{privacy_policy_link}."
      legal_1_privacy_policy: Informativa sulla privacy
      legal_1_terms_of_use: Condizioni d'uso
      legal_2_contact_team: contatta il team di OpenHistoricalMap
      legal_2_html: Puoi %{contact_team_link} per problemi di licenza, diritto d'autore o altre questioni legali.
      legal_3_html: OpenHistoricalMap® è un marchio registrato (USA Reg. n. 90,019,364). OpenStreetMap e il logo della lente di ingrandimento sono %{osmf_trademarks_link}.
      legal_3_osmf_trademarks: marchi registrati della OpenStreetMap Foundation
      open_data_1_1_reuse: disponibile per il riutilizzo
      open_data_2_copyright_license: Copyright e riconoscimenti
      open_data_2_html: I dati sono di pubblico dominio, salvo diversa indicazione. Puoi utilizzarli liberamente per qualsiasi scopo, senza alcuna restrizione. Tuttavia, apprezziamo molto qualsiasi riferimento o citazione che fornirai a OpenHistoricalMap. Per maggiori dettagli e riconoscimenti, vedi %{copyright_license_link}.
      scope_title: Grande e piccolo, ieri e oggi
    communities:
      lede_text: Persone da tutto il mondo contribuiscono o usano OpenHistoricalMap. Sebbene molti di questi partecipino in maniera individuale, altri hanno creato delle comunità. Questi gruppi hanno dimensioni diverse e rappresentano aree geografiche che spaziano dal piccolo paese a estese aree che coprono più nazioni. Queste comunità possono essere sia formali che informali.
    copyright:
      legal_babble:
        attribution_example:
          alt: Un collegamento denominato OHM nell'angolo inferiore destro di una pagina web, sotto un cursore temporale.
          title: Esempio di come attribuire ad OpenHistoricalMap su una pagina web
        contributors_2_ohm_html: 'Gli stili di mappa presenti nella pagina iniziale contengono dati OpenHistoricalMap e le seguenti fonti:'
        contributors_footer_2_html: |-
          L'inserimento dei dati in OpenHistoricalMap non implica che il fornitore
          originale dei dati appoggi OpenHistoricalMap, fornisca alcuna garanzia o
          accetti qualsiasi responsabilità.
        contributors_intro_html: 'OpenHistoricalMap è il frutto della collaborazione di migliaia di individui e organizzazioni, che a loro volta attingono a un vasto corpus di studi accademici, giornalistici e archivi. Tra le nostre fonti e i nostri collaboratori più significativi figurano:'
        contributors_natural_earth_html: "%{natural_earth_link} set di dati di pubblico dominio."
        contributors_osm: Contributori di OpenStreetMap
        contributors_osm_cc_by_sa: CC BY-SA 2.0
        contributors_title_html: Riconoscimenti
        credit_1_html: Sebbene la legge sul copyright non limiti o imponga alcuna condizione sull'uso del contenuto di dominio pubblico, apprezziamo molto qualsiasi riconoscimento che fornirai a OpenHistoricalMap quando riutilizzi, adatti o utilizzi in altro modo le nostre mappe o i nostri dati.
        credit_2_this_copyright_page: questa pagina del diritto d'autore
        credit_title_html: Come si attribuisce a OpenHistoricalMap
        infringement_1_html: Ai contributori OHM si ricorda di non aggiungere dati da qualsiasi fonte protetta da copyright (ad esempio Google Maps o mappe stampate) senza esplicita autorizzazione dei titolari del copyright.
        infringement_2_ohm_contact_team: contattare il team di OpenHistoricalMap con "RICHIESTA DI RIMOZIONE" nell'oggetto
        infringement_2_ohm_html: Se ritieni che del materiale protetto da copyright sia stato aggiunto in modo inappropriato al database OpenHistoricalMap o a questo sito, ti preghiamo di %{contact_team_link}.
        introduction_1_cc0: Creative Commons CC0
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/deed.it
        introduction_1_ohm_html: |-
          OpenHistoricalMap è una raccolta aperta di dati geospaziali.
          Salvo diversa indicazione, i dati di OpenHistoricalMap sono dedicati al pubblico dominio con una dedica %{cc0_link}.
          Nella misura in cui ciò che utilizzi è di pubblico dominio, sei libero di copiarlo, distribuirlo, trasmetterlo e adattarlo per qualsiasi scopo, senza alcuna restrizione.
        introduction_2_cc_by: Creative Commons Attribuzione
        introduction_4_creative_commons: Creative Commons Attribuzione-Condividi allo stesso modo 2.0
        introduction_4_ohm_html: La nostra documentazione è rilasciato con licenza %{creative_commons_link} (CC BY-SA 2.0).
        more_1_wiki: sulla Wiki di OpenStreetMap
        more_2_1_api_usage_policy: Normativa sull'utilizzo delle API
        more_2_1_html: |-
          Sebbene OpenHistoricalMap sia costituita interamente da dati aperti, non possiamo fornire un'API cartografica gratuita a terzi.
          Consulta la nostra %{api_usage_policy_link}, %{tile_usage_policy_link} e %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Normativa sull'utilizzo di Nominatim
        more_2_1_tile_usage_policy: Normativa sull'utilizzo dei tasselli
        more_title_html: Per saperne di più
        trademarks_1_ohm_contact_team: contatta il team di OpenHistoricalMap
        trademarks_1_ohm_html: Se hai domande sull'uso del nome OpenHistoricalMap, contatta %{contact_team_link}.
      title: Copyright e riconoscimenti
    export:
      cc0: Creative Commons CC0
      licence_details_ohm_html: Salvo diversa indicazione, i dati di OpenHistoricalMap sono dedicati al pubblico dominio sotto licenza %{cc0_link}. Per maggiori dettagli, consulta la pagina %{copyright_page_link}.
      too_large:
        body: 'Quest''area è troppo grande per essere esportata come Dati XML di OpenHistoricalMap. Si prega di zoomare, di selezionare un''area più piccola o di utilizzare una delle seguenti fonti per il download di massa dei dati:'
        overpass:
          description: Scarica questo riquadro di selezione da un mirror del database di OpenHistoricalMap
        planet:
          description: Copie aggiornate regolarmente del database OpenHistoricalMap completo
          title: Pianeta OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: Basta cliccare su %{note_icon} o sulla stessa icona visualizzata sulla mappa. Ciò aggiungerà un indicatore alla mappa che puoi spostare trascinandolo. Aggiungi un messaggio, poi fai clic su “Salva” e altri mappatori indagheranno.
        join_the_community:
          explanation_html: Se hai notato un problema con i dati della nostra mappa, ad esempio manca una strada o il tuo indirizzo, il modo migliore per procedere è unirti alla comunità OpenHistoricalMap e aggiungere o correggere i dati tu stesso.
      other_concerns:
        contact: Contattaci
    help:
      discord:
        description: 'Unisciti al server di OpenStreetMap su Discord e ottieni aiuto nel canale #openhistoricalmap.'
      forum:
        title: Forum
      introduction: OpenHistoricalMap ha diverse risorse per imparare a conoscere il progetto, chiedendo e rispondendo alle domande, discutendo collaborativamente e documentando gli argomenti di mappatura.
      slack:
        title: IRC
      welcome:
        description: Inizia con questa guida rapida che copre le basi di OpenHistoricalMap.
        title: Benvenuti in OpenHistoricalMap
      wiki:
        description: Sfoglia il wiki per la documentazione approfondita di OHM.
    index:
      js_2: OpenHistoricalMap utilizza JavaScript per le sua mappa.
      license:
        copyright: OpenHistoricalMap è dedicato al pubblico dominio, salvo quanto diversamente indicato.
      remote_failed: Modifica non riuscita - assicurarsi che JOSM o Merkaartor sia avviato e che l'opzione di controllo remoto sia abilitata
    potlatch:
      removed: Il tuo editor predefinito di OpenHistoricalMap è impostato su Potlatch. Dato che Adobe Flash Player è stato ritirato, Potlatch non è più disponibile per essere usato in un browser web.
    welcome:
      basic_terms:
        a_tag_html: Un’%{tag} sono delle informazioni associate a un nodo o a un percorso, come il nome di un ristorante o l'anno in cui è stato costruito un ponte.
        paragraph_1: OpenHistoricalMap ha un proprio "gergo". Eccoti qualche parola che potrebbe tornarti utile.
      introduction: Benvenuti in OpenHistoricalMap, la mappa storica del mondo libera e modificabile. Ora che ti sei registrato, sei pronto a iniziare ad editare la mappa. Ecco una guida rapida con le cose più importanti che dovresti sapere.
      rules:
        para_1_html: OpenHistoricalMap ha poche regole formali ma ci aspettiamo che tutti i partecipanti collaborino e dialoghino con la comunità. Se stai pensando di intraprendere delle attività che non siano la modifica manuale, leggi e segui le linee guida su %{imports_link} e %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: OpenHistoricalMap %{doesnt} include storie alternative fittizie, errori noti da mappe antiche e dati da fonti protette da copyright. A meno che tu non abbia un permesso speciale, non copiare dalle mappe moderne del passato che trovate online o stampate.
