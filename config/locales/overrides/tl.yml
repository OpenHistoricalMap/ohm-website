    intro_header: Maligayang pagdating sa OpenHistoricalMap!
    intro_text: Ang OpenHistoricalMap ay isang mapa ng mundo na nilikha ng mga taong katulad mo at malayang gamitin sa ilalim ng isang bukas na lisensya.
