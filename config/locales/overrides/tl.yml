        credit_title_html: Paano babanggitin ang OpenHistoricalMap
        infringement_1_html: Ang mga tagapag-ambag ng OHM ay pinaalalahanan na huwag magdagdag ng datos mula sa anumang mapagkukunan na may karapatang-sipi na nakalaan (halimbawa, Google Maps o naka-print na mga mapa) nang walang pahintulot mula sa mga may hawak ng karapatang-sipi.
