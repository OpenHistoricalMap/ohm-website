  site:
    about:
      lede_text: Ang OpenHistoricalMap ay nilikha ng isang komunidad ng mga nagmamapa na nag-aambag at nagpapanatili ng dato tungkol sa mga kalsada, mga daanan, mga kapihan, mga istasyon ng tren, at iba pa, sa buong mundo.
    copyright:
      legal_babble:
        contributors_footer_2_html: Ang pagsasama ng dato sa loob ng OpenHistoricalMap ay hindi nagpapahiwatig na ang orihinal na tagapagbigay ng dato ay tumatangkilik sa OpenHistoricalMap, nagbibigay ng anumang garantiya, o tumatanggap ng anumang pananagutan.
        credit_1_html: 'Kung saan mo ginagamit ang datos ng OpenHistoricalMap, kailangan mong gawin ang sumusunod na dalawang bagay:'
        credit_title_html: Paano babanggitin ang OpenHistoricalMap
        infringement_1_html: Ang mga tagapag-ambag ng OHM ay pinaalalahanan na huwag magdagdag ng datos mula sa anumang mapagkukunan na may karapatang-sipi na nakalaan (halimbawa, Google Maps o naka-print na mga mapa) nang walang pahintulot mula sa mga may hawak ng karapatang-sipi.
        more_title_html: Ang pagtuklas ng mas marami pang iba
      title: Karapatan sa Paglalathala at Lisensiya
    export:
      too_large:
        body: Masyadong malaki ang lugar na ito upang mailuwas bilang Dato ng XML ng OpenHistoricalMap. Mangyaring lumapit o pumili ng isang mas maliit na pook.
