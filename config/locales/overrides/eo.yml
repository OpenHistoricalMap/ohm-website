  site:
    about:
      lede_text: OpenHistoricalMap estas kreata de komunumo de mapigistoj kiuj aldonas kaj prizorgas datumojn pri vojoj, kursoj, kafejoj, stacidomoj kaj pli da aliaj, en la tuta mondo.
    about_section:
      contribute_1_user_diaries: taglibrojn de uzantoj
      legal_1_aup: politiko de akceptata uzado
      legal_1_html: Tiu ĉi retejo kaj aliaj servoj estas formale administrataj de la %{group_link} komisie de la komunumo. Uzado de ĉiuj OSMF‑servoj estas regulata per niaj %{terms_of_use_link}, %{aup_link} kaj %{privacy_policy_link}.
      legal_1_privacy_policy: privateca politiko
      legal_1_terms_of_use: kondiĉoj de uzado
      legal_2_html: Se vi havas demandojn pri permesiloj, aŭtorrajtoj aŭ aliaj leĝaj problemoj; %{contact_team_link}.
    communities:
      lede_text: Homoj de la tuta mondo kontribuas al aŭ uzas OpenHistoricalMap. Dum kiam multaj kontribuas individue, iuj homoj organizas komunumojn. Tiuj ĉi komunumoj estas je diversaj grandoj kaj reprezentas diversgrandajn geografiajn regionojn – de malgrandaj urboj al plurlandaj areoj. Ili ankaŭ povas esti formalaj aŭ neformalaj.
    copyright:
      legal_babble:
        contributors_footer_2_html: Inkludo de datumoj en OpenHistoricalMap ne indikas, ke la provizanto de datumoj apogas OpenHistoricalMap, garantias por iu aŭ respondumas por iu.
        credit_1_html: 'Kiam vi uzas OpenHistoricalMap-datumojn, vi devas fari la jenajn du agojn:'
        credit_2_this_copyright_page: tiu ĉi paĝo de aŭtorrajtoj
        infringement_1_html: OHM-kunlaborantoj memoru, por ke neniam aldonu datumojn el iuj ajn fontoj protektataj de aŭtorrajtoj (ekz. Google Maps aŭ paperaj mapoj) sen klara permeso de posedanto de aŭtorrajtoj.
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/deed.eo
        introduction_4_creative_commons: Krea Komunaĵo Atribuite-Samkondiĉe 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/deed.eo
        more_2_1_api_usage_policy: uzkondiĉoj de API
        more_2_1_html: Kvankam OpenHistoricalMap estas malfermaj datumoj, ni ne povas liveri senpagan API al triaj partioj. Ekkonu kun %{api_usage_policy_link}, %{tile_usage_policy_link} kaj %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: uzkondiĉoj de Nominatim
        more_2_1_tile_usage_policy: uzkondiĉoj de kaheloj
        more_title_html: Pliaj informoj
    export:
      too_large:
        body: La elektita areo estas tro granda por esti elportita kiel XML-datumojn de OpenHistoricalMap. Bonvolu pligrandigi aŭ elekti malpli grandan areon, aŭ uzi unu el sekvaj fontoj por amasa datum-elportado.
        overpass:
          description: Elŝutas ĉi tiun areon de spegulkopio de OpenHistoricalMap datumbazo
        planet:
          description: Ofte-ĝisdatigataj kopioj de plena OpenHistoricalMap datumbazo
          title: Planedo OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: Simple alklaku %{note_icon} aŭ la saman piktogramon sur la mapo. Ĉi tio aldonos moveblan markon, aldonu vian mesaĝon, konservu ĝin, kaj aliaj mapigistoj okupiĝos pri via rimarko.
        join_the_community:
          explanation_html: Se vi rimarkis iun problemon kun niaj map-datumoj, ekzemple strato aŭ adreso mankas, la plej bona rimedo estas aniĝi OpenHistoricalMap-komunumo kaj redakti kaj ripari datumojn mem.
    help:
      introduction: OpenHistoricalMap havas kelkajn ejojn por lerni pri la projekto, por demandi pri ion ajn kaj kune diskuti kaj dokumenti pri mapigado.
      slack:
        title: IRC
      welcome:
        description: Komencu ekde ĉi tiu manlibreto ampleksanta fundamentojn de OpenHistoricalMap.
        title: Bonvenon al OpenHistoricalMap
      wiki:
        description: Esploru la vikion por akiri detalan dokumentaron pri OHM.
        title: Vikio
    index:
      js_2: OpensStreetMap uzas Ĝavoskripton por montri ŝoveblan mapon.
      remote_failed: Redaktado malsukcesis - certigu ĉu JOSM aŭ Merkaartor estas startigita kaj ĉu defora aliro estas aktiva
    potlatch:
      removed: Via implicita OpenHistoricalMap‑reaktilo estas Potlatch. Pro la fakto, ke Adobe Flash Player estis eksigita, la redaktilo Potlatch ne estas plu uzebla per retfoliumilo.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap havas sian propran ĵargonon. Jen estas kelkaj utilaj terminoj.
      introduction: Bonvenon al OpenHistoricalMap, la libera kaj redaktebla mapo de la mondo. Nun kiam vi registriĝis, vi povas ekigi mapigadon. Jen estas mallonga manlibreto kun la plej gravaj aĵoj kiuj vi povas scii.
      rules:
        para_1_html: OpenHistoricalMap havas kelkajn formalajn regulojn, sed ni esperas, ke ĉiuj partoprenantoj kunlaboru kune kaj komunikiĝu ene la komunumo. Se vi konsideras kontribuon alian ol permana redakto, legu regulojn pri %{imports_link} kaj %{automated_edits_link}.
