    intro_header: Bonvenon al OpenHistoricalMap!
    intro_text: OpenHistoricalMap estas mapo de la mondo, kreata de homoj kiel vi, kaj libere uzebla laŭ malferma permesilo.
    logo:
      alt_text: Emblemo de OpenHistoricalMap
