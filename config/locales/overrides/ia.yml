  site:
    about:
      lede_text: OpenHistoricalMap es un projecto communitari ambitiose que visa a cartographar le cambiamentos in le geographia natural e human in tote le mundo… a transverso le seculos.
      used_by_html: Explora le mundo in qualcunque periodo historic con %{name}.
    about_section:
      contribute_1_bluesky: Bluesky
      contribute_1_forum: nostre foro de discussion
      contribute_1_mastodon: Mastodon
      contribute_1_ohm_html: |-
        Nostre communitate crescente de contributores voluntari include historicos amator e professional, contributores de OpenStreetMap e Wikipedia, specialistas de GIS, e personas ordinari qui cognosce ben lor ambiente.
        Nos es appassionate de documentar le mundo e adjutar le communitates del mundo real a contar lor historias.
        Pro apprender plus sur le communitate, consulta %{wiki_link}, visita %{forum_link}, lege le %{user_diaries_link} e seque nostre conto %{mastodon_link} o %{bluesky_link}.
      contribute_1_user_diaries: diarios de usatores
      contribute_1_wiki: nostre documentation extense sur le wiki
      contribute_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap
      contribute_2_create_account: crea un conto gratuite
      contribute_2_donations: accepta donationes de caritate
      contribute_2_html: |-
        Tu pote comenciar a contribuer al carta hodie si tu %{create_account_link}.
        Nos etiam %{donations_link} per medio de %{osmus_link}, un organisation sin scopo lucrative con stato de exoneration fiscal secundo le regulation statounitese 501(c)(3).
        Tu donation generose contribuera directemente a mantener OpenHistoricalMap in optime functionamento pro tote le mundo.
      contribute_2_osmus: OpenStreetMap Statos Unite
      contribute_title: Tu pote adjutar
      legal_1_aup: Politica de uso acceptabile
      legal_1_aup_url: https://wiki.openstreetmap.org/wiki/Acceptable_Use_Policy
      legal_1_group: un gruppo informal
      legal_1_group_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Governance
      legal_1_html: Iste sito e multe altere servicios associate es formalmente gerite per %{group_link} affiliate con OpenStreetMap U.S. in nomine del communitate. Le uso de tote le servicios de OpenHistoricalMap es subjecte a nostre %{terms_of_use_link}, a nostre %{aup_link} e a nostre %{privacy_policy_link}.
      legal_1_privacy_policy: Politica de confidentialitate
      legal_1_privacy_policy_url: https://osmfoundation.org/wiki/Privacy_Policy
      legal_1_terms_of_use: Conditiones de uso
      legal_1_terms_of_use_url: https://osmfoundation.org/wiki/Terms_of_Use
      legal_2_contact_team: contactar le equipa de OpenHistoricalMap
      legal_2_html: Per favor %{contact_team_link} si tu ha questiones sur le licentia o le derecto de autor o altere questiones juridic.
      legal_3_html: |-
        OpenHistoricalMap® es un marca registrate (U.S. Reg. No. 90,019,364).
        OpenStreetMap e le logo de lupa es %{osmf_trademarks_link}.
      legal_3_osmf_trademarks: marcas registrate del Fundation OpenStreetMap
      legal_3_osmf_trademarks_url: https://osmfoundation.org/wiki/Trademark_Policy
      open_data_1_1_html: |-
        Le carta sur nostre pagina principal es solmente un de multe manieras de discoperir le informationes historic que nos ha colligite.
        Le datos subjacente es %{reuse_link} como discargamento o per medio de varie APIs gratuite e compatibile con software a codice-fonte aperte.
      open_data_1_1_reuse: disponibile pro reuso
      open_data_1_1_reuse_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Reuse
      open_data_2_copyright_license: Derectos de autor e recognocimentos
      open_data_2_html: |-
        Le datos es in le dominio public salvo indication contrari.
        Tu es libere de usar los a qualcunque fin, sin restriction.
        Nonobstante, nos apprecia multo omne credito o citation que tu forni a OpenHistoricalMap. Pro plus detalios e recognoscimentos, vide %{copyright_license_link}.
      scope_html: |-
        Imperios surge e cade. Glacieros dispare. Linguas e religiones se diffunde de un region a un altere.
        Simple sentieros de terra deveni vias e ferrovias multo frequentate. Edificios modeste cede le loco a grattacelos imponente.
        E tu te rememora como tu quartiero esseva in le passato.
        Tote isto ha su loco in OpenHistoricalMap.
      scope_title: Grande e micre, alora e ora
    communities:
      lede_text: |-
        Personas de tote le mundo usa o contribue a OpenHistoricalMap. Benque multes participa como individuos, alteres ha formate communitates.
        Tal gruppos varia de grandor e representa areas geographic inter micre villages e grande regiones multinational.
        Illos pote tamben esser formal o informal.
    copyright:
      legal_babble:
        attribution_example:
          alt: Un ligamine intitulate “OHM” in le angulo inferior dextre de un pagina web, sub un glissator temporal.
          title: Exemplo de como recognoscer OpenHistoricalMap in un pagina web
        contributors_2_ohm_html: 'Le stilos de carta presentate sur le pagina principal contine datos de OpenHistoricalMap e del sequente fontes:'
        contributors_anr_communes_campop: Le gruppo Cambridge pro le Historia del Population e del Structuras Social
        contributors_anr_communes_html: Datos create per le projecto %{anr_communes_link} in collaboration con %{campop_link}.
        contributors_anr_communes_project: COMMUNAS ANR
        contributors_footer_2_html: Le inclusion de datos in OpenHistoricalMap non implica que le fornitor original del datos indorsa OpenHistoricalMap, forni alcun garantia, o accepta alcun responsabilitate.
        contributors_globcover: GlobCover
        contributors_globcover_html: Copertura de terra ab %{globcover_link}, © ESA 2010 e UCLouvain, disponibile pro reuso a scopos educative e/o scientific con attribution.
        contributors_gmted: Datos global de elevation de terrenos a plure resolutiones de 2010
        contributors_gmted_html: 'Datos de elevation de terrenos ab Danielson, J.J., e Gesch, D.B., 2011, %{gmted_link} (GMTED2010): U.S. Geological Survey Open-File Report 2011–1073, 26 p. Dominio public.'
        contributors_intro_html: |-
          OpenHistoricalMap es le effortio collaborative de milles de personas e organisationes, qui a lor torno se appoia sur un grande corpore academic, jornalistic e archival.
          Nostre fontes e contributores le plus importante es le sequentes:
        contributors_more_sources_html: "%{sources_link} es disponibile sur le wiki de OpenStreetMap."
        contributors_more_sources_page: Fontes e contributores additional
        contributors_more_sources_page_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Sources
        contributors_natural_earth: Natural Earth
        contributors_natural_earth_html: Insimules de datos de %{natural_earth_link} in le dominio public.
        contributors_newberry: le Bibliotheca Newberry
        contributors_newberry_ahcb: Atlas de frontieras historic de contatos
        contributors_newberry_ahcb_html: Datos del %{ahcb_link}, un projecto del Centro William M. Scholl pro Historia e Cultura Statounitese presso %{newberry_link}, que es disponibile pro reuso sin restriction.
        contributors_osm: Contributores de OpenStreetMap
        contributors_osm_cc_by_sa: CC BY-SA 2.0
        contributors_osm_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/2.0/
        contributors_osm_html: Datos sur litores, corpores de aqua e rivieras © %{osm_link}, %{cc_by_sa_link}.
        contributors_title_html: Recognoscimentos
        credit_1_html: Ben que le lege statounitese sur le derecto de autor non impone alcun restriction o condition sur tu uso de contento del dominio public, nos multo appreciarea omne recognoscimento que tu forni a OpenHistoricalMap quando tu reusa, adapta o alteremente usa nostre cartas o datos.
        credit_2_home: nostre pagina principal
        credit_2_ohm_html: |-
          Tu pote presentar iste recognoscimento de qualcunque maniera rationabile.
          Per exemplo, sur un carta digital, tu pote mentionar OpenHistoricalMap in micre litteras in le angulo, ligante a %{this_copyright_page_link} sur %{home_link}:
        credit_2_this_copyright_page: iste pagina de derectos de autor
        credit_3_credit_html: Datos cartographic fornite per le projecto %{project_link}, in le dominio public salvo indication contrari.
        credit_3_ohm_html: 'O tu pote includer un recognoscimento plus clar sur un pagina de mentiones separate ubi tu attribue altere fontes:'
        credit_4_ohm_html: |-
          Sur un carta imprimite, tu pote placiar le recognoscimento in le legenda.
          In un libro, tu pote describer tu uso de OpenHistoricalMap in un nota al pede, in le bibliographia, o in le colophon.
          In un articulo academic, tu pote citar nos de varie manieras dependente de lo que tu ha usate.
        credit_title_html: Como dar recognoscentia a OpenHistoricalMap
        infringement_1_html: Nos rememora al contributores de OHM de nunquam adder datos de alcun fonte sub derecto de autor (p.ex. Google Maps o cartas imprimite) sin explicite permission del titulares del derecto de autor.
        infringement_2_ohm_contact_team: contacta le equipa de OpenHistoricalMap con “TAKEDOWN REQUEST” in le linea de subjecto
        infringement_2_ohm_html: Si tu crede que material sub derecto de autor ha essite inappropriatemente addite al base de datos de OpenHistoricalMap o a iste sito, per favor %{contact_team_link}.
        introduction_1_cc0: Creative Commons CC0
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/
        introduction_1_ohm_html: |-
          OpenHistoricalMap es un collection de datos geospatial aperte.
          Salvo indication contrari, le datos de OpenHistoricalMap data es liberate al dominio public sub un dedication %{cc0_link}.
          In le mesura in le qual le datos que tu usa es in le dominio public, tu es libere de copiar, distribuer, transmitter e adaptar los a qualcunque fin, sin restriction.
        introduction_2_cc_by: Creative Commons Attribution
        introduction_2_cc_by_sa: Creative Commons Attribution-CompartiSimile
        introduction_2_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/4.0/
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/
        introduction_2_license_key_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Tags/Key/license
        introduction_2_ohm_html: |-
          Le base de datos de OpenHistoricalMap incorpora alcun elementos cartographic subjecte a derectos de autor.
          Iste elementos es disponibile sub un licentia aperte, como %{cc_by_link} (CC&nbsp;BY) o %{cc_by_sa_link} (CC&nbsp;BY-SA), como notate in le etiquettas %{license_key_link} sur elementos individual.
          In le mesura in que tu usa alcun parte significative del base de datos que es coperite per un licentia “comparti simile”, tu debe respectar le conditiones de iste licentia in tu proprie adaptation.
        introduction_3_ohm_html: Le stilos de carta presentate sur nostre pagina principal es dedicate al dominio public sub un licentia CC0. Tu es libere de copiar, distribuer, transmitter e adaptar los a qualcunque fin, sin restriction.
