        introduction_4_ohm_html: Nostre documentation es sub licentia %{creative_commons_link} (CC BY-SA 2.0).
        more_1_ohm_html: Lege plus sur le considerationes juridic ligate al uso de nostre datos, e como recognoscer nos, %{wiki_link}.
