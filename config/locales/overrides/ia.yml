        a_tag_html: Un %{tag} es un unitate de information sur un nodo o via, como le nomine de un restaurante o le anno in le qual un ponte ha essite construite.
        paragraph_1: OpenHistoricalMap ha un jargon proprie. Ecce alcun parolas clave que te essera utile.
      introduction: Bevenite a OpenHistoricalMap, le carta libere e modificabile del historia de tote le mundo. Ora que tu te ha inscribite, tu es preste a comenciar a cartographar. Ecce un guida curte con le cosas le plus importante a saper.
      rules:
        para_1_html: OpenHistoricalMap ha poc regulas formal, ma nos expecta que tote le participantes collabora e communica con le communitate. Si tu considera activitates altere que modificar per mano, per favor lege e seque le directivas sur %{imports_link} e %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: OpenHistoricalMap %{doesnt} include historias fictive o alternative, errores cognoscite de cartas antique, o datos de fontes sub derecto de autor. Si tu non ha permission special, non copia de cartas moderne del passato que tu trova in linea o sur papiro.
        on_the_map_ohm_html: |-
          OpenHistoricalMap tracia le cambiamentos de geographia natural e human in tote le mundo.
          Nos ha milliones de entratas %{past_and_present}, desde imperios e glacieros usque a casas e restaurantes.
          Tu pote cartographar qualcunque elemento del mundo real que te interessa.
        past_and_present: tanto del passato como del presente
