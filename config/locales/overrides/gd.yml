      heading: Clàraich a-mach à OpenHistoricalMap
  site:
    about:
      lede_text: Tha OpenHistoricalMap 'ga thogail le coimhearsnachd de luchd-mapachaidh a bheir dàta dhuinn mu rathaidean, slighean cafaidhean, stèiseanan-rèile agus mòran a bharrachd air feadh an t-saoghail agus a nì obair-càraidh air.
    copyright:
      legal_babble:
        contributors_footer_2_html: Ma thèid dàta a ghabhail a-steach ann an OpenHistoricalMap, chan eil e fillte a-staigh gun do chuir an solaraiche dàta tùsail aonta ri OpenHistoricalMap, gun toireadh e barantas sam bith seachad no gum biodh e fo fhiachanas sam bith.
        credit_1_html: |-
          Tha e riatanach gun chleachd thu &ldquo;&copy; OpenHistoricalMap
          contributors&rdquo; mar urram.
        credit_title_html: Mar a bheir thu urram dha OpenHistoricalMap
        infringement_1_html: Tha sinn a' cur an cuimhne nan co-thabhartaichean OHM nach cuir iad dàta o thùs fo chòir-lethbhreac ri OHM (can Google Maps no mapaichean clò-bhuailte) idir ach ma fhuair iad cead soilleir o shealbhadairean na còrach-lethbhreac.
        more_title_html: Barrachd fiosrachaidh
    export:
      too_large:
        body: Tha an raon seo ro mhòr ach an gabhadh às-phortadh 'na dhàta XML OpenHistoricalMap. Feuch an sùm thu a-steach no gun tagh thu raon nas lugha no gun cleachd thu aon dhe na tùsan gu h-ìosal airson tomad de dhàta a luchdadh a-nuas.
        overpass:
          description: Luchdaich a-nuas na tha sa bhogsa-iadhaidh seo o sgàthan dhen stòr-dàta OpenHistoricalMap
        planet:
          description: Lethbhreacan dhen stòr-dàta shlàn aig OpenHistoricalMap a thèid ùrachadh gu cunbhalach.
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: Cha leig thu leas ach briogadh air %{note_icon} no air an aon ìomhaigheag ann an sealladh a' mhapa. Cuiridh seo comharra ris a' mhapa as urrainn dhut gluasad 's tu 'ga shlaodadh. Cuir an teachdaireachd agad ris agus briog air "Sàbhail" an uairsin gus an dèan luchd-mapachaidh eile sgrùdadh air.
        join_the_community:
          explanation_html: Ma mhothaicheas tu duilgheadas leis an dàta mapa againn, can bu bheil rathad no an seòladh agad a dhìth, nach fhaigh thu ballrachd sa choimhearsnachd OpenHistoricalMap ach an càraich no an cuir thu fhèin an dàta ris. \
    help:
      introduction: Tha iomadh goireas aig OpenHistoricalMap gus faighinn a-mach mun phròiseact, ceistean a chur 's a fhreagairt agus deasbad a dhèanamh is cuspairean mun mhapa a chlàradh còmhla.
      welcome:
        description: Faigh toiseach tòiseachaidh air OpenHistoricalMap leis an stiùireadh luath seo.
        title: Fàilte gu OpenHistoricalMap
      wiki:
        description: Brabhsaich san uicidh airson docamaideadh mionaideach air OHM.
        title: Uicidh
    index:
      js_2: Cleachdaidh OpenHistoricalMap JavaScript gus am mapa a shealltainn.
      remote_failed: Dh'fhàillig leis an deasachadh - dèan cinnteach gun deach JOSM no Merkaartor a luchdadh agus gu bheil gleus an t-smachd chèin an comas
    welcome:
      basic_terms:
        paragraph_1: Tha cainnt shònraichte air OpenHistoricalMap. Seo facal no dhà cudromach a bhios feumail dhut.
      introduction: Fàilte gu OpenHistoricalMap, mapa saor an t-saoghail a ghabhas deasachadh. Nise on a tha thu air clàradh, tha thu ullamh gus tòiseachadh air an obair-mhapa. Seo treòir luath a bheir eòlas dhut air na rudan as cudromaiche.
      whats_on_the_map:
        off_the_map_html: "'S ann %{doesnt} dàta mu bheachdan a leithid rangachaidhean, feartan eachdraidheil no baralach no dàta o thùsan fo chòir-lethbhreac. Mur eil cead soilleir agad, na dèan lethbhreac o mhapaichean air loidhne no air pàipear."
