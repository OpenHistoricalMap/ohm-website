    intro_header: Fàilte gu OpenHistoricalMap!
    intro_text: "'S e mapa an t-saoghail a tha san OpenHistoricalMap a chaidh a chruthachadh le daoine mar thu fhèin 's a tha saor fo cheadachas fhosgailte."
