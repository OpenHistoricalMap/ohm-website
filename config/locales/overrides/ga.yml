          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: Cliceáil %{note_icon} nó an deilbhín céanna ar an léarscáil. Cuirfidh sé seo marcóir leis an léarscáil, agus is féidir leat é a bhogadh trí tharraingt. Cuir do theachtaireacht leis, ansin cliceáil sábháil, agus déanfaidh mapálaithe eile imscrúdú.
        join_the_community:
          explanation_html: Má thug tú faoi deara fadhb lenár sonraí léarscáile, mar shampla má tá bóthar ar iarraidh nó má tá do sheoladh ar iarraidh, is é an bealach is fearr le dul ar aghaidh ná dul isteach i bpobal OpenHistoricalMap agus na sonraí a chur leis nó a dheisiú tú féin.
      other_concerns:
        concerns_ohm_html: Má tá imní ort faoin gcaoi a bhfuil ár sonraí á n-úsáid nó faoin ábhar atá iontu, féach ar ár %{copyright_link} le haghaidh tuilleadh eolais dhlíthiúil, nó %{contact_link}.
        contact: déan teagmháil linn
        contact_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Communication
    help:
      discord:
        description: 'Bí linn ar fhreastalaí Discord OpenStreetMap World agus faigh cabhair sa chainéal #openhistoricalmap.'
        title: Discord
      forum:
