        contributors_anr_communes_project: ANR COMMUNES
        contributors_footer_2_html: Ní hionann sonraí a áireamh in OpenHistoricalMap agus a rá go dtacaíonn an soláthraí sonraí bunaidh le OpenHistoricalMap, go soláthraíonn sé aon bharántas, nó go nglacann sé le haon dliteanas.
