      copyright_page: Cóipcheart agus Admhálacha
      licence_details_ohm_html: Ach amháin mar a luaitear a mhalairt, tá sonraí OpenHistoricalMap tiomnaithe don fhearann ​​poiblí faoi thiomantas %{cc0_link}. Féach ar an leathanach %{copyright_page_link} le haghaidh sonraí.
      too_large:
        body: Tá an limistéar seo rómhór le heaspórtáil mar Sonraí XML OpenHistoricalMap. Zúmáil isteach nó roghnaigh limistéar níos lú, nó bain triail as ceann de na foinsí atá sa liosta thíos chun bulc-íoslódálacha sonraí a dhéanamh.
