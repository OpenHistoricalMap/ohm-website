        contributors_newberry_ahcb_html: Sonraí ón %{ahcb_link}, tionscadal de chuid Ionad William M. Scholl um Stair agus Cultúr Mheiriceá ag %{newberry_link}, atá ar fáil lena athúsáid gan srian.
        contributors_osm: Rannpháirtithe OpenStreetMap
        contributors_osm_cc_by_sa: CC BY-SA 2.0
        contributors_osm_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/2.0/
        contributors_osm_html: Sonraí faoi chóstaí, uiscebhealaí, agus srutháin © %{osm_link}, %{cc_by_sa_link}.
        contributors_title_html: Buíochas
        credit_1_html: Ceanglaímid ort an lua &ldquo;&copy;Rannchuiditheoirí OpenHistoricalMap&rdquo; a úsáid.
        credit_2_home: ár leathanach baile
        credit_2_ohm_html: |-
          Féadfaidh tú an admháil seo a chur i láthair ar aon bhealach réasúnta.
          Mar shampla, ar léarscáil dhigiteach, is féidir leat OpenHistoricalMap a lua i gcló beag sa chúinne, ag nascadh le %{this_copyright_page_link} nó %{home_link}:
        credit_2_this_copyright_page: an leathanach cóipchirt seo
        credit_3_credit_html: Sonraí léarscáile le caoinchead an tionscadail %{project_link}, sa réimse poiblí mura luaitear a mhalairt.
        credit_3_ohm_html: 'Nó is féidir leat aitheantas níos soiléire a chur ar leathanach creidmheasanna ar leithligh inar féidir leat creidiúint a thabhairt d’fhoinsí eile:'
        credit_4_ohm_html: |-
          Ar léarscáil chlóite, is féidir leat an admháil a chur san finscéal.
          I leabhar, is féidir leat cur síos a dhéanamh ar d’úsáid de OpenHistoricalMap i bhfonóta, i mbibleagrafaíocht, nó i gcolofon.
          I bpáipéar acadúil, is féidir leat sinn a lua ar bhealaí éagsúla ag brath ar a n-úsáid tú.
        credit_title_html: Conas creidiúint a thabhairt do OpenHistoricalMap
        infringement_1_html: Meabhraítear do rannchuiditheoirí OHM gan sonraí ó aon fhoinse atá faoi chóipcheart (m.sh. Google Maps nó léarscáileanna clóite) a chur leis riamh gan cead a fháil go sainráite ó na sealbhóirí cóipchirt.
        infringement_2_ohm_contact_team: déan teagmháil leis an bhfoireann OpenHistoricalMap agus "TAKEDOWN REQUEST" mar ábhar an ábhair.
        infringement_2_ohm_html: Má chreideann tú gur cuireadh ábhar cóipchirt leis an mbunachar sonraí OpenHistoricalMap nó leis an suíomh seo go míchuí, déan teagmháil %{contact_team_link} le do thoil.
        introduction_1_cc0: Creative Commons CC0
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/
        introduction_1_ohm_html: |-
          Is bailiúchán sonraí geospásúla oscailte é OpenHistoricalMap.
          Ach amháin mar a luaitear a mhalairt, tá sonraí OpenHistoricalMap tiomnaithe don fhearann ​​poiblí faoi thiomantas %{cc0_link}.
          A mhéid a bhfuil an rud a úsáideann tú sa fhearann ​​poiblí, tá cead agat é a chóipeáil, a dháileadh, a tharchur agus a oiriúnú chun aon chríche, gan aon srianta.
        introduction_2_cc_by: Attribution Creative Commons
        introduction_2_cc_by_sa: Creative Commons Attribution-ShareAlike
        introduction_2_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/4.0/
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/
        introduction_2_license_key_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Tags/Key/license
        introduction_2_ohm_html: |-
          Tá roinnt gnéithe léarscáile aonair faoi chóipcheart ionchorpraithe sa bhunachar sonraí OpenHistoricalMap.
          Tá na gnéithe seo ar fáil faoi cheadúnas oscailte, amhail %{cc_by_link} (CC&nbsp;BY) nó %{cc_by_sa_link} (CC&nbsp;BY-SA), mar a luaitear sna clibeanna %{license_key_link} ar eilimintí aonair.
          A mhéid a úsáideann tú aon chuid shuntasach den bhunachar sonraí atá clúdaithe ag ceadúnas “roinn go comhionann”, ba cheart duit téarmaí an cheadúnais seo a urramú i do chuid oiriúnaithe féin.
        introduction_3_ohm_html: Tá na stíleanna léarscáile atá le feiceáil ar ár leathanach baile tiomnaithe don fhearann ​​poiblí faoi thiomantas CC0. Tá cead agat iad a chóipeáil, a dháileadh, a tharchur agus a oiriúnú chun aon chríche, gan aon srianta.
        introduction_4_creative_commons: Creative Commons Attribution-ShareAlike 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/
        introduction_4_ohm_html: Tá ár ndoiciméadacht ceadúnaithe faoin gceadúnas %{creative_commons_link} (CC BY-SA 2.0).
        more_1_ohm_html: Faigh tuilleadh eolais faoi na cúinsí dlíthiúla agus ár sonraí á n-úsáid, agus conas creidiúint a thabhairt dúinn, %{wiki_link}.
        more_1_wiki: ar an Vicí OpenStreetMap
        more_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/License
        more_2_1_api_usage_policy: Polasaí Úsáide API
        more_2_1_api_usage_policy_url: https://operations.osmfoundation.org/policies/api/
        more_2_1_html: Cé gur sonraí oscailte é OpenHistoricalMap, ní féidir linn API léarscáile saor in aisce ná tíleanna léarscáile a sholáthar do thríú páirtithe. Féach ar ár %{api_usage_policy_link}, %{tile_usage_policy_link} agus %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Polasaí Úsáide Nominatim
        more_2_1_nominatim_usage_policy_url: https://operations.osmfoundation.org/policies/nominatim/
        more_2_1_tile_usage_policy: Polasaí Úsáide Tíleanna
        more_2_1_tile_usage_policy_url: https://operations.osmfoundation.org/policies/tiles/
