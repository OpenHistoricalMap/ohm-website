        contributors_gmted: Sonraí airde tír-raoin ilréitigh dhomhanda 2010
        contributors_gmted_html: 'Sonraí airde tír-raoin ó Danielson, J.J., agus Gesch, D.B., 2011, %{gmted_link} (GMTED2010): Tuarascáil Chomhaid Oscailte Suirbhéireacht Gheolaíochta na SA 2011–1073, 26 lch. Fearann ​​poiblí.'
        contributors_intro_html: |-
          Is comhoibriú idir na mílte duine aonair agus eagraíocht é OpenHistoricalMap, a bhaineann leas as corp mór scoláireachta, iriseoireachta agus coimeád taifead.
          Ár bhfoinsí agus ár rannpháirtithe is suntasaí tá:
