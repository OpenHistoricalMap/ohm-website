        trademarks_1_ohm_html: Má tá ceisteanna agat faoi d'úsáid den ainm OpenHistoricalMap, déan teagmháil %{contact_team_link} le do thoil.
      title: Cóipcheart agus Admhálacha
    export:
      cc0: Creative Commons CC0
