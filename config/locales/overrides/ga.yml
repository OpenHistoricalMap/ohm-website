        title: Iarratais ar Ghnéithe & Fabhtanna
      introduction: Tá roinnt acmhainní ag OpenHistoricalMap chun foghlaim faoin tionscadal, ceisteanna a chur agus a fhreagairt, agus ábhair mapála a phlé agus a dhoiciméadú go comhoibríoch.
      mailing_list:
        description: Liostáil lenár liosta poist ísealtoirte.
        title: Liosta Poist
      slack:
        description: 'Tabhair cuireadh duit féin chuig spás oibre OpenStreetMap U.S. Slack agus bí páirteach sa chainéal #openhistoricalmap.'
        title: IRC
      welcome:
        description: Tosaigh leis an treoir thapa seo a chlúdaíonn gnéithe bunúsacha OpenHistoricalMap.
        title: Fáilte go dtí OpenHistoricalMap
      welcomemat:
        description: Tosaigh leis an treoir thapa seo a chlúdaíonn bunghnéithe OpenHistoricalMap.
        title: Fáilte go dtí OHM
      wiki:
        description: Brabhsáil an vicí le haghaidh doiciméadú mionsonraithe OHM.
        title: Vicí
    index:
      js_2: Baineann OpenHistoricalMap úsáid as JavaScript dá léarscáil 'slippy' (léarscáil ghréasáin bunaithe ar thíleanna).
      license:
        copyright: Tá OpenHistoricalMap tiomnaithe don fhearann ​​poiblí mura luaitear a mhalairt.
      remote_failed: Theip ar eagarthóireacht - déan cinnte go bhfuil JOSM nó Merkaartor lódáilte agus go bhfuil an rogha 'cianrialú' cumasaithe
    potlatch:
      removed: Is é Potlatch an t-eagarthóir réamhshocraithe OpenHistoricalMap atá socraithe agat. Ós rud é gur tarraingíodh siar Adobe Flash Player, níl Potlatch ar fáil a thuilleadh le húsáid i mbrabhsálaí gréasáin.
    welcome:
      basic_terms:
        a_tag_html: Is píosa sonraí faoi nód nó bealach é %{tag}, amhail ainm bialainne nó an bhliain a tógadh droichead.
        paragraph_1: Tá roinnt béarlagair dá chuid féin ag baint le OpenHistoricalMap. Seo roinnt den na focail is tábhachtaí a bheidh úsáideach duit.
      introduction: Fáilte go OpenHistoricalMap, léarscáil den Domhan atá saor in aisce agus ar féidir eagarthóireacht a dhéanamh uirthi. Anois agus tú cláraithe, tá tú réidh chun léarscáiliú a dhéanamh. Seo treoir tosaigh leis an mbuneolas a bheidh ag teastáil uait.
      rules:
        para_1_html: Is beag riail fhoirmiúil atá ag OpenHistoricalMap ach bímid ag súil leis go mbeidh rannpháirtithe ag comhoibriú leis an bpobal agus go rachaidh siad i mbun cumarsáide leis. Má tá tú ag smaoineamh ar aon ghníomhaíocht eile a dhéanamh seachas eagarthóireacht a dhéanamh de láimh, léigh agus lean na treoirlínte maidir le h%{imports_link} agus %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: I measc na rudaí %{doesnt} bhfuil ann tá sonraí bunaithe ar thuairimí cosúil le rátálacha, gnéithe stairiúla nó teoiriciúla, agus sonraí ó fhoinsí faoi chóipcheart. Mura bhfuil cead speisialta agat, ná cóipeáil as léarscáileanna ar líne nó páipéir.
        on_the_map_ohm_html: |-
          Rianaíonn OpenHistoricalMap athruithe ar gheografaíocht nádúrtha agus dhaonna ar fud an domhain.
          Tá na milliúin iontrálacha againn ó %{past_and_present}, ó impireachtaí agus oighearshruthanna go tithe agus bialanna. Is féidir leat cibé gnéithe den saol fíor a bhfuil suim agat iontu a mhapáil.
        past_and_present: an am atá thart agus an lá inniu araon
