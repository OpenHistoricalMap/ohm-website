    intro_2_create_account: Izveidot lietotāja kontu
    intro_header: Laipni lūdzam OpenHistoricalMap!
    intro_text: OpenHistoricalMap ir pasaules karte, kuru veido cilvēki kā tu, un tā ir bezmaksas lietošanai zem atvērtas licences.
    logo:
      alt_text: OpenHistoricalMap logo
    logout: Iziet
    tag_line: Atvērtā Wiki pasaules karte
  sessions:
