      heading: Iziet no OpenHistoricalMap
  site:
    about:
      lede_text: OpenHistoricalMap būvē kartētāju kopiena, kuri iegulda un uztur datus par ceļiem, takām, kafejnīcām, dzelzceļa stacijām un daudz ko vairāk visā pasaulē.
      used_by_html: "%{name} darbina kartes datus simtiem mājaslapu, mobilajās aplikācijās un aparatūras ierīcēs"
    communities:
      lede_text: OpenHistoricalMap veido vai izmanto cilvēki no visas pasaules. Daudzi piedalās individuāli, bet citi ir izveidojuši kopienas. Šīs grupas ir dažāda lieluma un pārstāv dažādas ģeogrāfiskās teritorijas - no mazām pilsētām līdz lieliem daudzvalstu reģioniem. Tās var būt arī formālas vai neformālas.
    copyright:
      legal_babble:
        contributors_footer_2_html: Datu ievietošana OpenHistoricalMap nenozīmē ka oriģinālais datu avots sniedz atbalstu OpenHistoricalMap, dod garantiju, vai pieņem jebkādu atbildību.
        credit_1_html: |-
          Mēs pieprasām, ka tu izmanto atsauci &ldquo;&copy; OpenHistoricalMap
          veidotāji&rdquo;.
        credit_title_html: Kā atsaukties uz OpenHistoricalMap
        infringement_1_html: "OHM veidotājiem tiek atgādināts, nekad neizmantot datus no jebkuriem \nar autortiesībām aizsargātiem avotiem (piem. Google Maps vai drukātām kartēm), bez \nprecīzi formulētas atļaujas no autortiesību īpašniekiem."
        more_title_html: Uzzināt vairāk
    export:
      too_large:
        body: Šis apgabals ir pārāk liels, lai to eksportētu kā OpenHistoricalMap XML datus. Lūdzu tuvini vai izvēlies mazāku apgabalu.
        overpass:
          description: Lejupielādē šo apgabalu no OpenHistoricalMap datubāzes spoguļa
        planet:
          description: Regulāri atjauninātas kopijas no pilnās OpenHistoricalMap datubāzes
          title: OHM Planēta
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: Noklikšķiniet uz %{note_icon} vai arī uz tās pašas ikonas kartes displejā. Tādā veidā jūs pievienosiet marķieri šai kartei, kuru jūs varēsiet izkustināt, 'velkot'. Pievienojiet savu  ziņu un tad uzspiediet 'Saglabāt' un pārējie lietotāji to izpētīs.
        join_the_community:
          explanation_html: Konstatējot problēmas ar mūsu kartes datiem, piemēram trūkstošu ceļu vai adresi, labākais variants, kā rīkoties ir pievienoties OpenHistoricalMap kopienai un pievienot vai atjaunot datus jums pašam.
    help:
      introduction: OpenHistoricalMap ir vairāki resursi, lai uzzinātu par projektu, uzdotu un atbildētu uz jautājumiem, un diskutētu un dokumentētu kartēšanas tēmas.
      slack:
        title: IRC
      welcome:
        description: Sāc ar šo īso ceļvedi, kurš aptver OpenHistoricalMap pamatus.
        title: Laipni lūgti OpenHistoricalMap
      wiki:
        description: Pārlūkojiet wiki, lai iegūtu padziļinātu OHM dokumentāciju.
    index:
      js_2: OpenHistoricalMap kartes rādīšanai lieto JavaScript.
      remote_failed: Rediģēšana neizdevās - pārbaudi, ka JOSM vai Merkaartor ir ieslēgts un attālinātās vadības iespēja ir aktivizēta
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap ir pašai savs profesionālais žargons. Šeit ir daži atslēgvārdi, kas var noderēt.
      introduction: Sveicināts OpenHistoricalMap, bezmaksas un rediģējamā pasaules karte. Tagad, kad esi piereģistrējies, tu vari sākt kartēt. Šeit ir neliela pamācībā ar svarīgākajām lietām, kuras tev jāzina.
      rules:
        para_1_html: OpenHistoricalMap ir tikai daži formālie noteikumi, bet mēs ceram, ka visi dalībnieki sadarbosies un komunicēs ar mūsu kopienu un tās biedriem. Ja jūs apsverat citas iespējas, kas nav manuālā rediģēšana ar roku tad lūdzu izlasiet un sekojiet pamācībām %{imports_link} un %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Ko tā %{doesnt} ir viedokļa dati kā reitings, vēsture vai hipotētiskas īpašības, un datus no ar autortiesībām aizsargātiem avotiem. Ja vien tev nav speciāla atļauja, nekopē no tiešsaistes vai papīra kartēm.
