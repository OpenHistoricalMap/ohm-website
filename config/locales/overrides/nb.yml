      heading: Logg ut fra OpenHistoricalMap
  site:
    about:
      lede_text: OpenHistoricalMap er bygd av et fellesskap av kartleggere som oppretter og vedlikeholder data om veier, stier, kafeer, jernbanestasjoner og diverse annet, over hele verdien.
    communities:
      lede_text: Mennesker fra hele verden bidrar til eller bruker OpenHistoricalMap. Mens mange deltar individuelt, har andre dannet fellesskap. Disse gruppene fins i mange størrelser og representerer brukere fra små byer til store regioner som spenner over flere land. De kan også være formelle eller uformelle.
    copyright:
      legal_babble:
        contributors_footer_2_html: Inkludering av data i OpenHistoricalMap innebærer ikke at den opprinnelige dataleverandøren støtter OpenHistoricalMap, gir noen garanti eller godtar noe erstatningsansvar.
        credit_1_html: Vi krever at du bruker godskrivinga «© OpenHistoricalMap-bidragsyterene».
        credit_title_html: Hvordan kreditere OpenHistoricalMap
        infringement_1_html: OHM-bidragsytere blir minnet på aldri å legge til data fra opphavsrettsbeskyttede  kilder (f.eks. Google Maps eller utskrevne kart) uten uttrykkelig tillatelse fra rettighetshaverne.
        more_title_html: Finner ut mer
    export:
      too_large:
        body: Dette området er for stort for å bli eksportert som OpenHistoricalMap XML-data. Forstørr utvalg eller velg et mindre område. Eller bruke en av kildene angitt under for nedlasting av bulkdata.
        overpass:
          description: Last ned denne avgrensingsrammen fra et speil av OpenHistoricalMap-databasen
        planet:
          description: Regelmessig oppdaterte kopier av hele OpenHistoricalMap-databasen
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Bare klikk %{note_icon} eller det samme ikonet på kartvisningen.
            Dette vil legge en markør på kartet som du kan flytte rundt på. Legg så inn en melding og klikk lagre, og andre kartleggere kan følge opp informasjonen din.
        join_the_community:
          explanation_html: Hvis du har observert et problem med våre kartdata, for eksempel at det mangler en vei, anbefaler vi at du blir med i OpenHistoricalMap-fellesskapet for å kunne reparere dataene selv.
    help:
      introduction: OpenHistoricalMap har diverse ressurser for å lære om prosjektet, stille eller svare på spørsmål samt i fellesskap diskutere og dokumentere kartleggingsemner.
      slack:
        title: IRC
      welcome:
        description: Start med denne hurtigguiden som dekker det grunnleggende om OpenHistoricalMap.
        title: Velkommen til OpenHistoricalMap
      wiki:
        description: Se gjennom wikien for dyptgående OHM-dokumentasjon.
    index:
      js_2: OpenHistoricalMap bruker JavaScript på kartsidene.
      remote_failed: Klarte ikke redigere - forsikre deg at JOSM eller Merkaartor er lastet og fjernkontrollvalget er aktivert
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap har sin egen sjargong. Her er en ordliste som kan være nyttig.
      introduction: Velkommen til OpenHistoricalMap, det fri brukerredigerte verdenskartet. Nå som du er opprettet som bruker er du klar til å legge til og endre kartinformasjon. Her er en guide med den viktigste informasjonen for å komme hurtig i gang.
      rules:
        para_1_html: OpenHistoricalMap har få formelle regler, men vi forventer at alle deltagere samarbeider og kommuniserer med fellesskapet. Hvis du er interessert i andre aktiviteter enn manuell redigering, vennligst les og følg retningslinjene for %{imports_link} og %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Kartet inneholder %{doesnt} subjektiv informasjon (f.eks. anmeldelser), objekter som er er fiktive eller ikke lenger eksisterer, samt opphavsrettslig beskyttede data fra andre kart. Kopier aldri noe som helst informasjon fra andre digitale eller papirbaserte kart, med mindre det foreligger en særlig tillatelse.
