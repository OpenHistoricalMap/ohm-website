    intro_2_create_account: Buka akaun pengguna
    intro_header: Selamat datang ke OpenHistoricalMap!
    intro_text: OpenHistoricalMap ialah peta dunia yang diwujudkan oleh insan seperti anda, dan bebas digunakan dengan berlandaskan lesen terbuka.
    logo:
