        untuk mendaftar dan belajar menyunting, adalah lebih mudah untuk meletakkan
        nota.
    any_questions:
      ohm_paragraph_1_html: OpenHistoricalMap menyediakan kemudahan-kemudahan untuk
        mempelajari tentang projek ini, bersoal jawab, serta bekerjasama membincangkan
        dan mendokumenkan topik-topik pemetaan. %{help_link}.
    copyright:
      legal_babble:
        attribution_example:
          title: Contoh atribusi
        contributors_footer_2_html: Penyertaan data dalam OpenHistoricalMap tidak
          bermaksud bahawa pembekal data asal menyokong OpenHistoricalMap, menyediakan
          sebarang waranti, atau menerima sebarang tanggungan.
        contributors_intro_html: 'Penyumbang kami merupakan ribuan individu. Kami
          turut menyertakan data yang dilesenkan secara terbuka daripada lembaga-lembaga
          pemetaan kebangsaan dan sumber-sumber yang lain, antaranya:'
        contributors_title_html: Penyumbang kami
        credit_1_html: Kami memerlukan anda menggunakan dikenali sebagai &ldquo;&copy;
          penyumbang OpenHistoricalMap&rdquo; dalam penghargaan.
        credit_title_html: Cara memberikan penghargaan kepada OpenHistoricalMap
        infringement_1_html: Penyumbang OHM diingatkan supaya tidak sesekali menambah
          data daripada mana-mana sumber berhak cipta (cth. Peta Google atau peta
          cetakan) tanpa izin bersurat daripada pemegang hak cipta.
        more_title_html: Mengetahui lebih lanjut
      title: Hak Cipta dan Lesen
