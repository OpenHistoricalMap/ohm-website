  site:
    about:
      lede_text: OpenHistoricalMap dibina oleh sekumpulan pemeta yang menyumbangkan
        dan menyelenggarakan data tentang jalan raya, denai, kedai kopi, stesen keretapi,
        dan banyak lagi di seluruh dunia.
