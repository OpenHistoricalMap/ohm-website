  site:
    about:
      lede_text: OpenHistoricalMap dibina oleh sekumpulan pemeta yang menyumbangkan dan menyelenggarakan data tentang jalan raya, denai, kedai kopi, stesen keretapi, dan banyak lagi di seluruh dunia.
    copyright:
      legal_babble:
        contributors_footer_2_html: Penyertaan data dalam OpenHistoricalMap tidak bermaksud bahawa pembekal data asal menyokong OpenHistoricalMap, menyediakan sebarang waranti, atau menerima sebarang tanggungan.
        credit_1_html: Kami memerlukan anda menggunakan dikenali sebagai &ldquo;&copy; penyumbang OpenHistoricalMap&rdquo; dalam penghargaan.
        credit_title_html: Cara memberikan penghargaan kepada OpenHistoricalMap
        infringement_1_html: Penyumbang OHM diingatkan supaya tidak sesekali menambah data daripada mana-mana sumber berhak cipta (cth. Peta Google atau peta cetakan) tanpa izin bersurat daripada pemegang hak cipta.
        more_title_html: Mengetahui lebih lanjut
    export:
      too_large:
        body: 'Kawasan ini terlalu besar untuk dieksport dalam bentuk Data XML OpenHistoricalMap. Sila zum dekat atau pilih kawasan yang lebih kecil, atau gunakan mana-mana sumber yang berikut untuk memuat turun data secara pukal:'
        overpass:
          description: Muat turun petak sempadan ini dari cermin pangkalan data OpenHistoricalMap
        planet:
          description: Salinan pangkalan data lengkap OpenHistoricalMap yang sentiasa dikemaskinikan
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Hanya klik %{note_icon} atau ikon yang sama pada paparan peta.
            Ini akan menambah penanda pada peta yang boleh anda alihkan secara menyeret. Berikan pesanan anda, kemudian klik "simpan", barulah pemeta-pemeta lain akan menyiasat.
        join_the_community:
          explanation_html: Jika anda mendapati kemusykilan dengan data peta kami, misalnya jalan raya atau alamat anda tertinggal, cara penyelesaian yang terbaik ialah menyertai komuniti OpenHistoricalMap dan menambah atau membetulkan data sendiri.
    help:
      introduction: OpenHistoricalMap menyediakan kemudahan-kemudahan untuk mempelajari tentang projek ini, bersoal jawab, serta bekerjasama membincangkan dan mendokumenkan topik-topik pemetaan.
      slack:
        title: IRC
      welcome:
        description: Mulakan dengan panduan ringkas ini yang merangkumi asas-asas OpenHistoricalMap.
        title: Selamat datang ke OpenHistoricalMap
      wiki:
        description: Layari wiki untuk maklumat lanjut tentang OHM.
    index:
      js_2: OpenHistoricalMap menggunakan JavaScript untuk peta licinnya.
      remote_failed: Penyuntingan gagal - pastikan JOSM atau Merkaartor dimuatkan dan ciri kawalan jauh dihidupkan
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap mempunyai peristilahan tersendiri. Yang berikut ialah kata-kata kunci yang berguna.
      introduction: Selamat datang ke OpenHistoricalMap, peta dunia yang bebas disunting oleh orang awam. Kini setelah mendaftar, anda bersiap sedia untuk memeta. Yang berikut ialah panduan ringkas dengan maklumat-maklumat yang paling penting bagi anda.
      whats_on_the_map:
        off_the_map_html: Ia %{doesnt} mencakupi data pandangan peribadi seperti penilaian, ciri-ciri yang wujud zaman dahulu atau sekadar andaian, serta data dari sumber berhak cipta. Melainkan dengan izin khas, jangan salin dari peta Internet mahupun kertas.
