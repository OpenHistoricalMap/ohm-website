    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap има своје жаргоне. Ево пар кључних речи које могу да буду корисне.
      introduction: Добро дошли на OpenHistoricalMap, бесплатну изменљиву карту светске историје. Сада кад сте се пријавили, спремни сте да почнете са картографијом. Ево га брзи водич са најбитнијим стварима које је потребно знати.
      rules:
        para_1_html: OpenHistoricalMap има неколико формалних правила, али очекујемо од свих учесника да сарађују и комуницирају са заједницом. Ако разматрате било какве активности поред ручног уређивања, прочитајте и пратите смернице о %{imports_link} и %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Оно што се %{doesnt} су пристрасне оцене, историјски или хипотетички подаци, и подаци заштићени ауторским правима. Ако немаш изричиту дозволу, не умножавај папирне и оне са интернета мапе.
