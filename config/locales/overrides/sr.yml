      legal_1_html: |-
        Овим сајтом и многим другим сродним сервисима управља
        %{group_link}
        а у име заједнице. Коришћење OSMF сервиса предмет је наших %{terms_of_use_link}, %{aup_link} и %{privacy_policy_link}.
      legal_1_privacy_policy: политике приватности
      legal_1_terms_of_use: услова коришћења
      legal_3_html: |-
        OpenHistoricalMap® је регистрована робна марка (U.S. Reg. No. 90,019,364).
        OpenStreetMap и лупа логотип су %{osmf_trademarks_link}.
      legal_3_osmf_trademarks_url: https://osmfoundation.org/wiki/Trademark_Policy
      open_data_2_copyright_license: Ауторска права и лиценца
      scope_title: Велики и мали, некад и сад
    copyright:
      legal_babble:
        attribution_example:
          alt: Пример како да наведете OHM на некој страници
          title: Пример како да наведете OpenHistoricalMap на некој страници
        contributors_footer_2_html: Укључивањем података у OpenHistoricalMap не значи да изворни власник података подржава OpenHistoricalMap, обезбеђује било какву гаранцију или прихвата одговорност за исте.
        contributors_intro_html: |-
          OpenHistoricalMap is the collaborative effort of thousands of individuals and organizations, who in turn draw from a large body of scholarship, journalism, and recordkeeping.
          Our most substantial sources and contributors include:
        credit_1_html: Although copyright law does not restrict or place any conditions on your use of public domain content, we greatly appreciate any credit you provide to OpenHistoricalMap when reusing, adapting, or otherwise using our maps or data.
        credit_title_html: Како да наведете OpenHistoricalMap
        infringement_1_html: OHM сарадници се подсећају да никад не додају податке из извора заштићених ауторским правима (нпр. Гугл мапе или штампане карте) без изричите дозволе носиоца ауторских права.
