    about:
      lede_text: OpenHistoricalMap là dự án cộng đồng khát vọng lập bản đồ các thay đổi địa lý cả tự nhiên lẫn nhân tạo ở khắp mọi nơi, từ xưa đến nay.
      used_by_html: Thám hiểm thế giới vào bất kỳ thời đại trong %{name}.
    about_section:
      contribute_1_forum: diễn đàn thảo luận
      contribute_1_ohm_html: |-
        Cộng đồng tình nguyện viên chúng ta càng ngày càng lớn, bao gồm các nhà sử học nghiệp dư và chuyên nghiệp, những người đóng góp vào OpenStreetMap và Wikipedia, các chuyên gia hệ thống thông tin địa lý (GIS), và những người bình thường hiểu biết về môi trường chung quanh.
        Chúng ta ham thích ghi lại các chi tiết về thế giới và giúp các cộng đồng ngoài đời kể lại câu chuyện của họ.
        Để tìm hiểu thêm về cộng đồng, hãy tham khảo %{wiki_link}, ghé vào %{forum_link}, đọc các %{user_diaries_link}, và theo dõi tài khoản %{mastodon_link} hoặc %{bluesky_link} của chúng ta.
      contribute_1_user_diaries: nhật ký của người dùng
      contribute_1_wiki: tài liệu đầy đủ tại wiki
      contribute_1_wiki_url: https://wiki.openstreetmap.org/wiki/Vi:OpenHistoricalMap?uselang=vi
      contribute_2_create_account: tạo tài khoản miễn phí
      contribute_2_donations: chấp nhận khoản quyên góp từ thiện
      contribute_2_html: |-
        Bạn có thể bắt đầu đóng góp vào bản đồ ngay hôm nay bằng cách by %{create_account_link}.
        Chúng tôi cũng %{donations_link} qua %{osmus_link}, một tổ chức phi lợi nhuận 501(c)(3) có tình trạng miễn thuế.
        Khoản quyên góp hào phóng của bạn sẽ trực tiếp giúp OpenHistoricalMap hoạt động ổn định cho tất cả mọi người.
      contribute_2_osmus: OpenStreetMap Hoa Kỳ
      contribute_title: Bạn Có thể Giúp đỡ
      legal_1_aup: Quy định Sử dụng Đàng hoàng
      legal_1_aup_url: https://wiki.openstreetmap.org/wiki/Acceptable_Use_Policy?uselang=vi
      legal_1_group: một nhóm không nghi thức lắm
      legal_1_group_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Governance?uselang=vi
      legal_1_html: |-
        Trang này và các dịch vụ có liên quan được hoạt động bởi
        %{group_link} thuộc OpenStreetMap Hoa Kỳ thay mặt cho cộng đồng. Việc sử dụng tất cả các dịch vụ của OpenHistoricalMap phải tuân theo %{terms_of_use_link}, %{aup_link}, và %{privacy_policy_link} của chúng tôi.
      legal_1_privacy_policy: Quy định về Quyền riêng tư
      legal_1_privacy_policy_url: https://osmfoundation.org/wiki/Privacy_Policy?uselang=vi
      legal_1_terms_of_use: Điều khoản Sử dụng
      legal_1_terms_of_use_url: https://osmfoundation.org/wiki/Terms_of_Use?uselang=vi
      legal_2_contact_team: liên lạc với nhóm OpenHistoricalMap
      legal_2_html: |-
        Xin vui lòng %{contact_team_link}
        nếu có thắc mắc về giấy phép, bản quyền, hoặc vấn đề pháp lý khác.
      legal_3_html: |-
        OpenHistoricalMap® là nhãn hiệu đăng ký (Số đăng ký Hoa Kỳ 90.019.364).
        OpenStreetMap cũng như biểu hình kính lúp là %{osmf_trademarks_link}.
      legal_3_osmf_trademarks: nhãn hiệu đăng ký của Quỹ OpenStreetMap
      legal_3_osmf_trademarks_url: https://osmfoundation.org/wiki/Trademark_Policy?uselang=vi
      open_data_1_1_html: |-
        Bản đồ trên trang chủ chỉ là một trong nhiều cách để trải nghiệm các thông tin lịch sử mà chúng ta đã thu thập.
        Bạn có thể %{reuse_link} bằng cách tải về hoặc thông qua nhiều API miễn phí đều tương thích với phần mềm nguồn mở.
      open_data_1_1_reuse: tái sử dụng dữ liệu cơ sở
      open_data_1_1_reuse_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Reuse?uselang=vi
      open_data_2_copyright_license: Bản quyền và Ghi công
      open_data_2_html: |-
        Dữ liệu thuộc phạm vi công cộng trừ khi nêu rõ khác.
        Bạn được tự do sử dụng nó cho bất kỳ mục đích nào mà không có bất kỳ hạn chế nào.
        Tuy nhiên, chúng tôi rất trân trọng bất kỳ lời ghi công hoặc trích dẫn nào mà bạn cung cấp cho OpenHistoricalMap.
        Để biết thêm chi tiết và lời công nhận, xem %{copyright_license_link}.
      scope_html: Đế quốc nổi lên, sụp đổ. Băng hà biến mất. Ngôn ngữ, tôn giáo lan tràn từ miền này sang miền kia. Đường mòn đơn giản trở thành xa lộ, đường sắt huyết mạch. Tòa nhà bình dân được thay thế bằng tòa nhà chọc trời cao vút. Vả lại bạn vẫn còn nhớ khu phố mình như thế nào. Tất cả đều thuộc về OpenHistoricalMap.
      scope_title: Lớn nhỏ, Xưa nay
    communities:
      lede_text: |-
        Nhiều người đến với OpenHistoricalMap từ khắp mọi nơi để đóng góp vào dự án hoặc sử dụng bản đồ.
        Nhiều người cũng tụ tập vào đủ loại nhóm cộng đồng chính thức hoặc không chính thức ứng với hàng xóm, thành phố, tỉnh, quốc gia, lục địa, hoặc sở thích.
    copyright:
      legal_babble:
        attribution_example:
          alt: Liên kết đề OHM ở góc dưới bên phải của trang Web, bên dưới một con trượt thời gian.
          title: Ví dụ ghi công OpenHistoricalMap trên một trang Web
        contributors_2_ohm_html: 'Các kiểu bản đồ trên trang chủ chứa dữ liệu OpenHistoricalMap cùng với các nguồn sau:'
        contributors_anr_communes_campop: Nhóm Cambridge vì Lịch sử Dân cư và Cấu trúc Xã hội
        contributors_anr_communes_html: Dữ liệu do dự án %{anr_communes_link} tạo ra cùng với %{campop_link}.
        contributors_anr_communes_project: ANR COMMUNES
        contributors_footer_2_html: Việc bao gồm dữ liệu trong OpenHistoricalMap không ngụ ý rằng nhà cung cấp dữ liệu đầu tiên ủng hộ OpenHistoricalMap, biện hộ sự chính xác của nó, hoặc nhận trách nhiệm pháp lý nào.
        contributors_globcover: GlobCover
        contributors_globcover_html: Lớp phủ đất từ %{globcover_link}, © Cơ quan Vũ trụ châu Âu 2010 và UCLouvain, có sẵn để tái sử dụng cho mục đích giáo dục và/hoặc khoa học miễn là ghi công.
        contributors_gmted: Dữ liệu độ cao địa hình toàn cầu năm 2010
        contributors_gmted_html: 'Dữ liệu độ cao địa hình từ Danielson, J.J., và Gesch, D.B., 2011, %{gmted_link} (GMTED2010): Bản báo cáo Open-File của Cục Khảo sát Địa chất Hoa Kỳ 2011–1073, 26 tr. Phạm vi công cộng.'
        contributors_intro_html: |-
          OpenHistoricalMap nhờ công sức cộng tác của hàng ngàn cá nhân và tổ chức lần lượt tham khảo từ nhiều nguồn học thuật, báo chí, và lưu trữ hồ sơ.
          Các nguồn đóng góp đáng kể nhất bao gồm:
        contributors_more_sources_html: "%{sources_link} có sẵn tại Wiki OpenStreetMap."
        contributors_more_sources_page: Các nguồn gốc và người đóng góp khác
        contributors_more_sources_page_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Sources?uselang=vi
        contributors_natural_earth: Natural Earth
        contributors_natural_earth_html: Các tập hợp dữ liệu %{natural_earth_link} thuộc phạm vi công cộng.
        contributors_newberry: Thư viện Newberry
        contributors_newberry_ahcb: Tập bản đồ các Biên giới Quận Lịch sử
        contributors_newberry_ahcb_html: Dữ liệu từ dự án %{ahcb_link} của Trung tâm Bác sĩ William M. Scholl vì Lịch sử và Văn hóa Mỹ tại %{newberry_link}, có sẵn để tái sử dụng mà không có bất kỳ hạn chế nào.
        contributors_osm: những người đóng góp vào OpenStreetMap
        contributors_osm_cc_by_sa: CC BY-SA 2.0
        contributors_osm_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/2.0/deed.vi
        contributors_osm_html: Dữ liệu bờ biển, thủy vực, và dòng chảy © %{osm_link}, %{cc_by_sa_link}.
        contributors_title_html: Ghi công
        credit_1_html: Mặc dù luật bản quyền không có hạn chế hoặc đặt ra bất kỳ điều kiện nào đối với việc bạn sử dụng nội dung thuộc phạm vi công cộng, nhưng chúng tôi rất trân trọng mọi lời ghi công cho OpenHistoricalMap khi nào bạn tái sử dụng, dùng làm nguồn, hoặc sử dụng bản đồ hoặc dữ liệu của chúng tôi một cách khác.
        credit_2_home: trang chủ của chúng tôi
        credit_2_ohm_html: |-
          Bạn được phép trình bày lời ghi công này theo cách hợp lý nào đó.
          Ví dụ bản đồ kỹ thuật số có thể ghi tên OpenHistoricalMap chữ nhỏ ở góc bản đồ với liên kết đến %{this_copyright_page_link} hoặc %{home_link}:
        credit_2_this_copyright_page: trang bản quyền này
        credit_3_credit_html: Dữ liệu bản đồ do dự án %{project_link} cung cấp thuộc phạm vi công cộng trừ khi có ghi chú khác.
        credit_3_ohm_html: 'Hoặc bạn có thể bao gồm lời ghi công đầy đủ hơn trong trang ghi công riêng cùng với các nguồn gốc khác:'
        credit_4_ohm_html: |-
          Trên bản đồ in giấy, bạn có thể đặt lời ghi công vào bảng ghi chú bản đồ.
          Trong cuốn sách, bạn có thể miêu tả cách sử dụng OpenHistoricalMap trong cước chú, danh mục, hoặc lời thông tin in ấn ở cuối sách.
          Trong bài khoa học, bạn có thể dẫn nguồn chúng tôi nhiều cách tùy bạn sử dụng cái gì.
        credit_title_html: Cách ghi công OpenHistoricalMap
        infringement_1_html: Những người đóng góp vào OHM được khuyên không bao giờ bổ sung dữ liệu từ những nguồn có bản quyền (chẳng hạn Bản đồ Google hoặc các bản đồ trên giấy) trước khi các nhà giữ bản quyền cho phép rõ ràng.
        infringement_2_ohm_contact_team: liên lạc nhóm OpenHistoricalMap với chữ “TAKEDOWN REQUEST” (yêu cầu tháo gỡ) trong chủ đề
        infringement_2_ohm_html: Nếu bạn tin rằng tài liệu có bản quyền được thêm vào cơ sỡ dữ liệu hoặc trang của OpenHistoricalMap một cách không đàng hoàng, xin vui lòng liên lạc với %{contact_team_link}.
        introduction_1_cc0: Creative Commons CC0
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/
        introduction_1_ohm_html: |-
          OpenHistoricalMap là nơi sưu tập dữ liệu địa không gian mở.
          Trừ khi có ghi chú khác, các dữ liệu OpenHistoricalMap thuộc phạm vi công cộng theo bản công hiến %{cc0_link}.
          Miễn là bạn sử dụng các phần dữ liệu thuộc phạm vi công cộng, bạn được tự do sao chép, phân phối, chuyển giao, và sửa lại cho bất kỳ mục đích nào mà chẳng có bất kỳ hạn chế nào.
        introduction_2_cc_by: Creative Commons Ghi công
        introduction_2_cc_by_sa: Creative Commons Ghi công–Chia sẻ tương tự
        introduction_2_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/4.0/deed.vi
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/deed.vi
        introduction_2_license_key_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Tags/Key/license?uselang=vi
        introduction_2_ohm_html: |-
          Cơ sở dữ liệu OpenHistoricalMap bao gồm một số đối tượng bản đồ cụ thể có bản quyền.
          Các đối tượng này được phát hành theo một giấy phép nguồn mở chẳng hạn %{cc_by_link} (CC&nbsp;BY) hoặc %{cc_by_sa_link} (CC&nbsp;BY-SA), theo các thẻ %{license_key_link} được gắn vào phần tử cụ thể.
          Nếu bạn sử dụng một phần đáng kể của cơ sở dữ liệu mà áp dụng một giấy phép “chia sẻ tương tự”, bạn nên tuân theo các điều khoản của giấy phép này trong tác phẩm của bạn.
        introduction_3_ohm_html: Các kiểu bản đồ trên trang chủ của chúng tôi thuộc phạm vi công cộng theo bản công hiến CC0. Bạn được tự do sao chép, phân phối, chuyển giao, và sửa lại cho bất kỳ mục đích nào mà chẳng có bất kỳ hạn chế nào.
        introduction_4_creative_commons: Creative Commons Ghi công–Chia sẻ tương tự 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/deed.vi
        introduction_4_ohm_html: Tài liệu của chúng tôi được phát hành theo giấy phép %{creative_commons_link} (CC BY-SA 2.0).
        more_1_ohm_html: Tìm hiểu thêm về các vấn đề phải nghĩ đến khi sử dụng dữ liệu của chúng tôi, và cách ghi công chúng tôi làm sao, %{wiki_link}.
        more_1_wiki: tại Wiki OpenStreetMap
        more_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/License?uselang=vi
        more_2_1_api_usage_policy: Quy định Sử dụng API
        more_2_1_api_usage_policy_url: https://operations.osmfoundation.org/policies/api/
        more_2_1_html: |-
          Mặc dù OpenHistoricalMap là dữ liệu mở, nhưng chúng tôi không thể cung cấp API hoặc mảnh bản đồ miễn phí để bên thứ ba sử dụng.
          Xem %{api_usage_policy_link}, %{tile_usage_policy_link}, và %{nominatim_usage_policy_link} của chúng tôi.
        more_2_1_nominatim_usage_policy: Quy định Sử dụng Nominatim
        more_2_1_nominatim_usage_policy_url: https://operations.osmfoundation.org/policies/nominatim/
        more_2_1_tile_usage_policy: Quy định Sử dụng Mảnh bản đồ
        more_2_1_tile_usage_policy_url: https://operations.osmfoundation.org/policies/tiles/
        more_title_html: Tìm hiểu thêm
        trademarks_1_ohm_contact_team: liên lạc với nhóm OpenHistoricalMap
        trademarks_1_ohm_html: Nếu có thắc mắc về cách sử dụng tên OpenHistoricalMap, xin vui lòng %{contact_team_link}.
      title: Bản quyền và Ghi công
