    potlatch:
      removed: Bạn đã đặt trình vẽ OpenHistoricalMap mặc định là Potlatch. Vì Adobe Flash Player không còn được hỗ trợ, Potlatch không còn hoạt động trong trình duyệt Web.
    welcome:
      basic_terms:
        a_tag_html: "%{tag} là một chi tiết về một nốt hoặc lối, thí dụ tên của một nhà hàng hoặc năm xây dựng của cây cầu."
        paragraph_1: 'Đây là những thuật ngữ thường gặp khi sử dụng và đóng góp vào OpenHistoricalMap:'
      introduction: Chào mừng bạn đã đến OpenHistoricalMap, bản đồ thế giới có dữ liệu mở được xây dựng bởi những người như bạn. Bây giờ bạn đã mở tài khoản thì hãy cùng góp sức vẽ bản đồ. Đây là những căn bản cần biết để bắt đầu đóng góp.
      rules:
        para_1_html: OpenHistoricalMap có ít quy tắc chính thức nhưng yêu cầu mọi người muốn tham gia phải cộng tác và liên lạc với cộng đồng. Nếu bạn đang tính thực hiện tác vụ nào không phải sửa đổi thủ công, xin vui lòng đọc và tuân theo các hướng dẫn tại %{imports_link} và %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Nó %{doesnt} chứa các ý kiến như lịch sử thay thế giả tưởng, các lỗi rõ ràng xuất hiện trong bản đồ cổ điển, hoặc thông tin từ các nguồn giữ bản quyền. Nếu bạn khám phá bản đồ sử học hiện đại nào đó trên giấy hoặc trên mạng, bạn phải xin phép của nhà giữ bản quyền mới được sao chép từ bản đồ đó.
        on_the_map_ohm_html: OpenHistoricalMap theo dõi các thay đổi về địa lý thiên nhiên và nhân văn ở khắp thế giới. Chúng ta có hàng triệu mục từ %{past_and_present}, biết bao đế quốc, băng hà, căn nhà, nhà hàng… đủ mọi thứ. Mời bạn bổ sung bất cứ những gì thu hút sự quan tâm của bạn.
        past_and_present: cả quá khứ lẫn hiện tại
