          instructions_1_html: |-
            Chỉ việc bấm %{note_icon} hoặc hình tượng này trên bản đồ.
            Nút này sẽ thả một ghim vào bản đồ để bạn kéo thả vào vị trí đúng. Miêu tả vấn đề và bấm Lưu. Những người khác sẽ điều tra.
        join_the_community:
          explanation_html: Nếu bạn nhận thấy một vấn đề trong dữ liệu bản đồ của chúng tôi, chẳng hạn thiếu con đường hoặc địa chỉ của bạn, cách xử lý tốt nhất là tham gia cộng đồng OpenHistoricalMap để thêm hoặc sửa dữ liệu lấy.
