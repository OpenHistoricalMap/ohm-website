    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Apenas clique em %{note_icon} ou no mesmo ícone na interface do mapa.
            Isto incluirá um marcador ao mapa, que você pode mover arrastando. Adicione a sua mensagem, clique em salvar, e outros utilizadores como você vão investigar.
        join_the_community:
          explanation_html: Se você achou um problema nos dados do nosso mapa, como por exemplo uma estrada ou o seu endereço em falta, o melhor a fazer é juntar-se à comunidade do OpenHistoricalMap e incluir ou reparar os dados você mesmo.
    help:
      introduction: O OpenHistoricalMap oferece vários recursos para você saber mais sobre o projeto, perguntar e responder a questões, e colaborativamente discutir e documentar vários tópicos sobre o mapa.
