        title: Bem-vindo(a) ao OpenHistoricalMap
      wiki:
        description: Navegue no wiki para ver a documentação do OpenHistoricalMap com mais detalhes.
    index:
      js_2: O OpenHistoricalMap usa JavaScript para a navegação dos mapas.
      license:
        copyright: Direitos autorais do OpenHistoricalMap e contribuidores sob uma licença aberta
      remote_failed: Falha ao editar - certifique-se de que o JOSM ou o Merkaartor estão carregados e que o Controle Remoto está ativado
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap tem seus próprios jargões. Aqui estão algumas palavras-chave úteis.
      introduction: Bem-vindo(a) ao OpenHistoricalMap, o mapa livre e editável do mundo. Agora que você se inscreveu, você está pronto para começar a mapear. Aqui está um guia rápido com as coisas mais importantes que você precisa saber.
      rules:
        para_1_html: O OpenHistoricalMap tem poucas regras formais mas espera-se que todos os participantes colaborem e comuniquem com a comunidade. Se pretender realizar ações em massa como importação de dados através de programas por favor siga as instruções presentes em %{imports_link} e %{automated_edits_link}.
