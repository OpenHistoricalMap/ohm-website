    index:
      js_2: OpenHistoricalMap лелайо JavaScript шен карта хьагайта.
      remote_failed: Нийсдар ца дадела.  JOSM йа Merkaartor чуйиллина хиларх а, генар лелоран опци дӀахӀоттийна хиларх а хьовса
    potlatch:
      removed: Хьан стандартан OpenHistoricalMap редактор йу Potlatch. Adobe Flash Player-на гӀо дар сацийна дера, Potlatch кхин лело йиш йац веб-браузерехь.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap-ан шен меттигер сленг кхоллайела. Кхузахь масех коьрта дош ду, вайна пайдехьа хир долу.
      introduction: Марша вогӀийла хьо OpenHistoricalMap, маьрша а, хийца йиш йолу а дуьненан карта. ХӀинца регистраци чаккха йалча, карта хӀотто волавала мегар ду. ХӀара жимма хьехам бу уггаре а коьртачу хаадеза хӀуманех лаьцна.
      rules:
        para_1_html: OpenHistoricalMap формалан бакъонаш йу, амма оха сатуьйсу массо а декъашхочо юкъараллица цхьаьнаболхбаре, цуьнца зӀе латторе. Нагахь санна хьо куьйгаца хийцар доцург кхин гӀуллакх дан дагахь велахь, дехар ду %{imports_link} а, %{automated_edits_link} а тӀера низам деша а, лелада а.
