    help:
      introduction: OpenHistoricalMap-ехь масех ресурс йу проектах лаьцна хаа, хаттарш дан йа царна жоьпаш дала, цхьаьна картографин теманаш йийцаре йан а.
      slack:
        title: IRC
      welcome:
