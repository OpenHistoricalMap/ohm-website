    about:
      lede_text: OpenHistoricalMap йина картографин юкъаралло, цара дӀало а, латтадо а некъаш, качнаш, кафеш, цӀерпоштнекъан вокзалш, кхин а дуккха а хӀуманаш, дерриг а дуьнентӀехь.
    about_section:
      contribute_1_user_diaries: декъашхошна тептарш
      legal_1_aup: Къобал йина лелоран политика
      legal_1_html: ХӀара сайт а, кхин дуккха а цуьнца йоьзна сервисаш а формалан кепара лелайо %{group_link} йукъараллин цӀарах. OSMF-о лелочу массо а сервисех пайдаэцар вай %{terms_of_use_link}, %{aup_link} а, вай %{privacy_policy_link} а хьаьжжина ду.
      legal_1_privacy_policy: Къайлаха политика
      legal_1_terms_of_use: Лелоран биллам
      legal_2_html: Дехар ду %{contact_team_link} нагахь санна хьан лицензех, авторан бакъонашех, йа кхин юристийн хаттарш делахь.
    communities:
      lede_text: |-
        Дерриг а дуьнентӀера наха дакъа лоцу йа лелайо OpenHistoricalMap. Дукхачара цхьацца дакъалоцуш хилча, вукхара йукъараллаш кхоьллина.
        И тобанаш тайп-тайпана барамашкахь йу, ткъа географин регионаш гойту кегийчу гӀаланашкара масех пачхьалкх йолчу яккхийчу регионашка кхаччалц. Уьш формалан а, формалан йоцу а хила тарло.
    copyright:
      legal_babble:
        contributors_footer_2_html: OpenHistoricalMap чу хаамаш юкъабахар бохург дац, хьалхара хаамаш луш волчо OpenHistoricalMap къобалйо, цхьа а гарантии ло, йа цхьа а жоьпалла тӀеоьцу.
        credit_1_html: 'OpenHistoricalMap-ан хаамашехь пайдаоьцучохь, ахь дан деза хӀара ши хӀума:'
        credit_2_this_copyright_page: хӀара авторан бакъонаш йолу агӀо
        credit_title_html: OpenHistoricalMap-на тIехьажа муха ло
        infringement_1_html: OHM-н декъашхошна дагадоуьйту, авторийн бакъонаш йолчу нехан билгал бакъо йоцуш, цхьана а авторан бакъонаш йолчу хьостанашкара (масала, Google Maps йа зорбане даьхна карташ) хаамаш тӀетоха ца безий.
        introduction_4_creative_commons: Creative Commons Attribution Share Alike
        more_2_1_api_usage_policy: API лелоран политика
        more_2_1_html: OpenHistoricalMap биллина хаамаш балахь а, тхан йиш йац мах боцуш картан API кхоалгӀачу агӀонна дӀадала. Хьажа вай %{api_usage_policy_link}, %{tile_usage_policy_link} а, %{nominatim_usage_policy_link} а.
        more_2_1_nominatim_usage_policy: Номиналан лелоран политика
        more_2_1_tile_usage_policy: Плитка лелоран политика
        more_title_html: Кхин алсам довза
