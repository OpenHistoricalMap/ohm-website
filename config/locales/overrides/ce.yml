        body: 'И меттиг тӀех йоккха йу, OpenHistoricalMap XML хаамаш санна экспорт ян йиш йоцуш. Дехар ду, масштаб совъяккха я жима меттиг схьахаржа, йа лахахь хьахийначу хьостанех цхьаъ леладе:'
