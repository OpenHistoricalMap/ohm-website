  site:
    about:
      lede_text: OpenHistoricalMap tvorí komunita používateľov, ktorí pridávajú a udržiavajú údaje o cestách, turistických trasách, kaviarňach, železničných staniciach a mnohých ďalších miestach na celom svete.
      used_by_html: Preskúmajte svet v ktoromkoľvek časovom období s %{name}.
    about_section:
      contribute_1_bluesky: Bluesky
      contribute_1_forum: naše diskusné fórum
      contribute_1_mastodon: Mastodon
      contribute_1_ohm_html: |-
        Naša rastúca komunita dobrovoľných prispievateľov zahŕňa amatérskych aj profesionálnych historikov, prispievateľov OpenStreetMap a Wikipédie, špecialistov na GIS a bežných ľudí, ktorí poznajú svoje okolie.
        S nadšením dokumentujeme svet a pomáhame skutočným komunitám rozprávať ich príbehy.
        Ak sa chcete o komunite dozvedieť viac, pozrite si %{wiki_link}, navštívte %{forum_link}, čítajte %{user_diaries_link} a sledujte náš účet %{mastodon_link} alebo %{bluesky_link}.
      contribute_1_user_diaries: denníky používateľov
      contribute_1_wiki: našu rozsiahlu wiki dokumentáciu
      contribute_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap
      contribute_2_create_account: vytvoriť si bezplatný účet
      contribute_2_donations: prijímame charitatívne dary
      contribute_2_html: |-
        K mape môžete začať prispievať už dnes – stačí %{create_account_link}.
        Tiež %{donations_link} prostredníctvom %{osmus_link}, neziskovej organizácie 501(c)(3) s oslobodením od daní.
        Váš štedrý dar pôjde priamo na zabezpečenie bezproblémového chodu OpenHistoricalMap pre všetkých.
      contribute_2_osmus: OpenStreetMap U.S.
      contribute_title: Môžete pomôcť
      legal_1_1_terms_of_use_url: https://wiki.osmfoundation.org/wiki/Licence/Contributor_Terms
      legal_1_aup: Pravidlám prijateľného používania
      legal_1_aup_url: https://wiki.openstreetmap.org/wiki/Acceptable_Use_Policy
      legal_1_group: neformálna skupina
      legal_1_group_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Governance
      legal_1_html: |-
        Túto stránku a súvisiace služby prevádzkuje %{group_link} pridružená k OpenStreetMap U.S. v mene komunity.
        Používanie všetkých služieb OpenHistoricalMap podlieha našim %{terms_of_use_link}, %{aup_link} a %{privacy_policy_link}.
      legal_1_privacy_policy: Pravidlám ochrany osobných údajov
      legal_1_privacy_policy_url: https://osmfoundation.org/wiki/Privacy_Policy
      legal_1_terms_of_use: Podmienkam použitia
      legal_1_terms_of_use_url: https://osmfoundation.org/wiki/Terms_of_Use
      legal_2_contact_team: kontaktovať tím OpenHistoricalMap
      legal_2_html: |-
        Prosím, %{contact_team_link}
        ak máte otázky týkajúce sa licencií, autorských práv alebo iné právne otázky.
      legal_3_html: |-
        OpenHistoricalMap® je registrovaná ochranná známka (U.S. Reg. č. 90,019,364).
        OpenStreetMap a logo lupy sú %{osmf_trademarks_link}.
      legal_3_osmf_trademarks: registrované ochranné známky OpenStreetMap Foundation
      legal_3_osmf_trademarks_url: https://osmfoundation.org/wiki/Trademark_Policy
      open_data_1_1_html: |-
        Mapa na našej domovskej stránke je len jedným z mnohých spôsobov, ako spoznať historické informácie, ktoré sme zhromaždili.
        Podkladové údaje sú %{reuse_link} na stiahnutie alebo prostredníctvom rôznych bezplatných API kompatibilných s open source softvérom.
      open_data_1_1_reuse: dostupné na ďalšie použitie
      open_data_1_1_reuse_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Reuse
      open_data_2_copyright_license: Autorské práva a poďakovania
      open_data_2_html: |-
        Údaje sú voľným dielom (public domain), pokiaľ nie je uvedené inak.
        Môžete ich voľne použiť na akýkoľvek účel, bez akýchkoľvek obmedzení.
        Napriek tomu veľmi oceníme akékoľvek uvedenie zdroja alebo citáciu OpenHistoricalMap.
        Viac podrobností a poďakovaní nájdete v %{copyright_license_link}.
      scope_html: |-
        Ríše vznikajú a zanikajú. Ľadovce miznú. Jazyky a náboženstvá sa šíria z jedného regiónu do druhého.
        Z jednoduchých poľných ciest sa stávajú rušné cesty a železnice. Skromné budovy ustupujú týčiacim sa mrakodrapom.
        A vy si pamätáte, ako kedysi vyzerala vaša štvrť.
        Toto všetko patrí na OpenHistoricalMap.
      scope_title: Veľké aj malé, kedysi aj dnes
    communities:
      lede_text: Ľudia z celého sveta prispievajú do alebo používajú OpenHistoricalMap. Zatiaľ čo mnohí sa zúčastňujú ako jednotlivci, iní vytvorili komunity. Tieto skupiny majú rôznu veľkosť a predstavujú geografické oblasti od malých miest až po veľké regióny s viacerými krajinami. Môžu byť aj formálne alebo neformálne.
    copyright:
      legal_babble:
        attribution_example:
          alt: Odkaz s označením OHM v pravom dolnom rohu webovej stránky, pod časovým posuvníkom.
          title: Príklad, ako uviesť OpenHistoricalMap ako zdroj na webovej stránke
        contributors_2_ohm_html: 'Mapové štýly uvedené na domovskej stránke obsahujú údaje OpenHistoricalMap a nasledujúce zdroje:'
        contributors_anr_communes_campop: The Cambridge Group for the History of Population and Social Structures
        contributors_anr_communes_html: Údaje vytvorené projektom %{anr_communes_link} v spolupráci s %{campop_link}.
        contributors_anr_communes_project: ANR COMMUNES
        contributors_footer_2_html: Zahrnutie dát do OpenHistoricalMap neznamená, že pôvodný poskytovateľ dát podporuje OpenHistoricalMap, ponúka akúkoľvek záruku, alebo prijíma akúkoľvek zodpovednosť.
        contributors_globcover: GlobCover
        contributors_globcover_html: Krajinná pokrývka z %{globcover_link}, © ESA 2010 a UCLouvain, dostupná na ďalšie použitie na vzdelávacie a/alebo vedecké účely s uvedením zdroja.
        contributors_gmted: Globálne údaje o nadmorskej výške terénu s viacerými rozlíšeniami 2010
        contributors_gmted_html: 'Údaje o nadmorskej výške terénu z Danielson, J.J., a Gesch, D.B., 2011, %{gmted_link} (GMTED2010): U.S. Geological Survey Open-File Report 2011–1073, 26 s. Voľné dielo (public domain).'
        contributors_intro_html: |-
          OpenHistoricalMap je výsledkom spoločného úsilia tisícok jednotlivcov a organizácií, ktoré zase čerpajú z rozsiahleho súboru vedeckých prác, žurnalistiky a archívnych záznamov.
          Medzi naše najvýznamnejšie zdroje a prispievateľov patria:
        contributors_more_sources_html: "%{sources_link} sú dostupné na wiki OpenStreetMap."
        contributors_more_sources_page: Ďalšie zdroje a prispievatelia
        contributors_more_sources_page_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Sources
        contributors_natural_earth: Natural Earth
        contributors_natural_earth_html: Súbory údajov %{natural_earth_link} vo voľnom diele (public domain).
        contributors_newberry: The Newberry Library
        contributors_newberry_ahcb: Atlas historických hraníc okresov
        contributors_newberry_ahcb_html: Údaje z %{ahcb_link}, projektu centra William M. Scholl Center for American History and Culture pri %{newberry_link}, ktoré sú dostupné na ďalšie použitie bez obmedzení.
        contributors_osm: prispievatelia OpenStreetMap
        contributors_osm_cc_by_sa: CC BY-SA 2.0
        contributors_osm_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/2.0/
        contributors_osm_html: Údaje o pobrežiach, vodných plochách a tokoch © %{osm_link}, %{cc_by_sa_link}.
        contributors_title_html: Poďakovania
        credit_1_html: 'Kde používate údaje OpenHistoricalMap, musíte urobiť nasledujúce dve veci:'
        credit_2_home: našu domovskú stránku
        credit_2_ohm_html: |-
          Toto poďakovanie môžete uviesť akýmkoľvek primeraným spôsobom.
          Napríklad na digitálnej mape môžete OpenHistoricalMap spomenúť drobným písmom v rohu s odkazom na %{this_copyright_page_link} alebo %{home_link}:
        credit_2_this_copyright_page: túto stránku o autorských právach
        credit_3_credit_html: Mapové údaje láskavo poskytol projekt %{project_link}, voľné dielo (public domain), pokiaľ nie je uvedené inak.
        credit_3_ohm_html: 'Alebo môžete uviesť jasnejšie poďakovanie na samostatnej stránke s poďakovaniami, kde uvádzate aj ďalšie zdroje:'
        credit_3_project: OpenHistoricalMap
        credit_4_ohm_html: |-
          Na tlačenej mape môžete poďakovanie umiestniť do legendy.
          V knihe môžete použitie OpenHistoricalMap opísať v poznámke pod čiarou, v bibliografii alebo v tiráži.
          V akademickej práci nás môžete citovať rôznymi spôsobmi v závislosti od toho, čo ste použili.
        credit_title_html: Ako uviesť OpenHistoricalMap ako zdroj
        infringement_1_html: Prispievateľom OHM pripomíname, že by nikdy nemali pridávať dáta zo zdrojov chránených autorským právom (napr. Google Maps či tlačené mapy) bez výslovného súhlasu držiteľov práv.
        infringement_2_ohm_contact_team: kontaktujte tím OpenHistoricalMap s textom „TAKEDOWN REQUEST“ v predmete správy
        infringement_2_ohm_html: |-
          Ak sa domnievate, že materiál chránený autorským právom bol nevhodne
          pridaný do databázy OpenHistoricalMap alebo na túto stránku, %{contact_team_link}.
        introduction_1_cc0: Creative Commons CC0
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/
        introduction_1_ohm_html: |-
          OpenHistoricalMap je zbierka otvorených geopriestorových údajov.
          Pokiaľ nie je uvedené inak, údaje OpenHistoricalMap sú venované do voľného diela (public domain) na základe vyhlásenia %{cc0_link}.
          V rozsahu, v akom je to, čo používate, voľným dielom, ho môžete voľne kopírovať, šíriť, prenášať a upravovať na akýkoľvek účel, bez akýchkoľvek obmedzení.
        introduction_2_cc_by: Creative Commons Attribution
        introduction_2_cc_by_sa: Creative Commons Attribution-ShareAlike
        introduction_2_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/4.0/
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/
        introduction_2_license_key_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Tags/Key/license
        introduction_2_ohm_html: |-
          Databáza OpenHistoricalMap obsahuje niektoré jednotlivé mapové prvky chránené autorským právom.
          Tieto prvky sú dostupné pod otvorenou licenciou, ako napríklad %{cc_by_link} (CC&nbsp;BY) alebo %{cc_by_sa_link} (CC&nbsp;BY-SA), ako je uvedené v značkách %{license_key_link} na jednotlivých prvkoch.
          V rozsahu, v akom použijete akúkoľvek významnú časť databázy, na ktorú sa vzťahuje licencia „share alike“ (rovnakým spôsobom), mali by ste rešpektovať podmienky tejto licencie vo svojej vlastnej úprave.
        introduction_3_ohm_html: Mapové štýly uvedené na našej domovskej stránke sú venované do voľného diela (public domain) na základe vyhlásenia CC0. Môžete ich voľne kopírovať, šíriť, prenášať a upravovať na akýkoľvek účel, bez akýchkoľvek obmedzení.
        introduction_4_creative_commons: Creative Commons Attribution-ShareAlike 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/
        introduction_4_ohm_html: Naša dokumentácia je licencovaná pod licenciou %{creative_commons_link} (CC BY-SA 2.0).
        more_1_ohm_html: Viac o právnych aspektoch pri používaní našich údajov a o tom, ako nás uviesť ako zdroj, sa dozviete %{wiki_link}.
