        more_2_1_html: Hoci OpenHistoricalMap sú otvorené údaje, nemôžeme tretím stranám poskytnúť bezplatné mapové API. Pozrite si naše stránky %{api_usage_policy_link}, %{tile_usage_policy_link} a %{nominatim_usage_policy_link}.
