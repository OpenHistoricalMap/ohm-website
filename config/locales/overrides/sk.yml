    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: Stačí kliknúť na %{note_icon} alebo na rovnakú ikonu na zobrazení mapy. Tým sa na mapu pridá značka, ktorú môžete presúvať ťahaním. Pridajte svoju správu, potom kliknite na uložiť a ostatní mapujúci to preskúmajú.
        join_the_community:
          explanation_html: Ak ste si všimli problém s našimi mapovými údajmi, napríklad chýba cesta alebo vaša adresa, najlepší spôsob, ako postupovať, je pripojiť sa ku komunite OpenHistoricalMap a pridať alebo opraviť údaje sami.
      other_concerns:
        concerns_ohm_html: Ak máte obavy o to, ako sa naše údaje používajú, alebo o ich obsah, prečítajte si naše %{copyright_link} pre viac právnych informácií, alebo %{contact_link}.
        contact: nás kontaktujte
        contact_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Communication
    help:
      discord:
        description: 'Pripojte sa na server OpenStreetMap World na Discorde a získajte pomoc v kanáli #openhistoricalmap.'
        title: Discord
      forum:
        description: Zapojte sa do dlhších diskusií a neformálnych chatovacích miestností pomocou svojho účtu OHM.
        title: Fórum
      github:
        description: Nahláste problém v našich repozitároch na GitHube, aby ste oznámili chybu alebo požiadali o novú funkciu.
        title: Žiadosti o funkcie a chyby
      introduction: OpenHistoricalMap ponúka niekoľko zdrojov, kde je možné získať informácie o projekte, spýtať sa rôzne otázky a spoločne diskutovať a dokumentovať témy týkajúce sa mapovania.
      mailing_list:
        description: Prihláste sa na odber našej málo frekventovanej mailingovej konferencie.
        title: Mailingová konferencia
      slack:
        description: 'Pozvite sa do pracovného priestoru OpenStreetMap U.S. na Slacku a pripojte sa do kanála #openhistoricalmap.'
        title: IRC
      welcome:
        description: Začnite týmto rýchlym sprievodcom popisujúcim základy OpenHistoricalMap.
        title: Vitajte v OpenHistoricalMap
      welcomemat:
        description: Začnite týmto stručným sprievodcom so základmi OpenHistoricalMap.
      wiki:
        description: Podrobnú dokumentáciu OHM nájdete na wiki.
        title: Wiki
    index:
      js_2: OpenHistoricalMap používa pre interaktívnu mapu JavaScript.
      license:
        copyright: OpenHistoricalMap je venovaný do voľného diela (public domain), pokiaľ nie je uvedené inak.
      remote_failed: Editácia sa nepodarila – skontrolujte, či je JOSM alebo Merkaartor spustený a je v ňom zapnutá funkcia Diaľkové ovládanie (Remote control)
    potlatch:
      removed: Váš prednastavená OpenHistoricalMap editor je nastavený na Potlatch. Pretože však Adobe Flash Player bol už stiahnutý z používania, Potlatch už nie je možné používať vo webovom prehliadači.
    welcome:
      basic_terms:
        a_tag_html: "%{tag} je údaj o uzle alebo ceste, napríklad názov reštaurácie alebo rok postavenia mosta."
        paragraph_1: OpenHistoricalMap má svoj vlastný žargón. Tu je niekoľko kľúčových slov, ktoré vám prídu vhod.
      introduction: Vitajte na OpenHistoricalMap, slobodnej a upravovateľnej mape sveta. Teraz, keď ste zaregistrovaný, môžete začať mapovať. Tu je stručný prehľad najdôležitejších, ktoré potrebujete vedieť.
      rules:
        para_1_html: OpenHistoricalMap má len niekoľko formálnych pravidiel, ale očakávame, že všetci účastníci budú spolupracovať s komunitou a komunikovať s ňou. Ak zvažujete akékoľvek iné aktivity ako ručné úpravy, prečítajte si a dodržiavajte pokyny na %{imports_link} a %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: |-
          OpenHistoricalMap %{doesnt} fiktívne alternatívne dejiny,
          známe chyby zo starých máp ani údaje zo zdrojov chránených autorským právom. Pokiaľ nemáte osobitné povolenie, nekopírujte z moderných máp minulosti, ktoré nájdete online alebo v tlači.
        on_the_map_ohm_html: |-
          OpenHistoricalMap sleduje zmeny v prírodnej a ľudskej geografii po celom svete.
          Máme milióny záznamov z %{past_and_present}, od ríš a ľadovcov až po domy a reštaurácie. Mapovať môžete akékoľvek skutočné prvky, ktoré vás zaujímajú.
        past_and_present: minulosti aj súčasnosti
