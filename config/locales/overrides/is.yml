    about:
      lede_text: OpenHistoricalMap er byggt upp af heilu samfélagi kortagerðarfólks sem leggur inn og viðheldur gögnum um vegi, stíga, kaffihús, járnbrautir og margt, margt fleira, út um víða veröld.
      used_by_html: Kannaðu heiminn á mismunandi tímabilum með%{name}.
    about_section:
      contribute_1_bluesky: Bluesky
      contribute_1_mastodon: Mastodon
      contribute_1_user_diaries: blogg notenda
      legal_1_aup: Stefnu varðandi ásættanlega notkun
      legal_1_aup_url: https://wiki.openstreetmap.org/wiki/Acceptable_Use_Policy
      legal_1_html: |-
        Þetta vefsvæði og margar aðrar tengdar þjónustur eru formlega reknar af
        %{group_link}
        fyrir hönd þátttakendanna í verkerfninu. Öll notkun á þjónustum sem OSMF rekur falla undir
        %{terms_of_use_link}, %{aup_link} and our %{privacy_policy_link} okkar.
      legal_1_privacy_policy: Persónuverndarstefnu
      legal_1_privacy_policy_url: https://osmfoundation.org/wiki/Privacy_Policy
      legal_1_terms_of_use: Notkunarskilmála
      legal_1_terms_of_use_url: https://osmfoundation.org/wiki/Terms_of_Use
      legal_2_html: |-
        Endilega %{contact_team_link}
        ef þú ert með spurningar eða beiðnir varðandi notkunarleyfi, höfundarrétt eða önnur lögfræðileg málefni.
      legal_3_osmf_trademarks_url: https://osmfoundation.org/wiki/Trademark_Policy
      open_data_2_copyright_license: Höfundarréttur og þakkir fyrir framlög
    communities:
      lede_text: "Fólk alls staðar að úr heiminum leggur sitt af mörkum til OpenHistoricalMap eða notar OpenHistoricalMap.\nÞó að margir taki þátt sem einstaklingar, hafa aðrir myndað samfélög.\nÞessir hópar eru af ýmsum stærðum og gerðum og geta haft á sinni könnu tiltekin landsvæði allt frá smábæjum til stórra fjölþjóðlegra svæða. \nÞau geta líka verið formleg eða óformleg."
    copyright:
      legal_babble:
        attribution_example:
          title: Dæmi um hvernig eigi að vísa til OpenHistoricalMap á vefsíðu
        contributors_footer_2_html: |-
          Samþætting gagna inn í OpenHistoricalMap hefur ekki sjálfkrafa í för með sér að
          upprunaleg gagnaþjónusta taki þátt í OpenHistoricalMap, taki neina ábyrgð á gögnum, eða
          samþykki skaðabótaskyldu vegna þeirra.
        contributors_osm: Þátttakendur í OpenStreetMap-verkefninu
        contributors_osm_cc_by_sa: CC BY-SA 2.0
        contributors_osm_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/2.0/
        credit_1_html: 'Þegar þú notar gögn úr OpenHistoricalMap, þarft þú að gera tvennt:'
        credit_2_this_copyright_page: þessa höfundarréttarsíðu
        credit_title_html: Hvernig á að vísa til OpenHistoricalMap
        infringement_1_html: |-
          Þátttakendur í OHM eru minntir á að þeir megi aldrei bæta inn gögnum frá neinum
          höfundarréttarvörðum upptökum (t.d. Google Maps eða prentuðum kortum) án
          sérstakrar heimildar frá handhöfum höfundarréttarins.
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/
        introduction_4_creative_commons: Creative Commons HöfundarGetið-DeilistEinsÁfram 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/
        more_2_1_api_usage_policy: Stefna varðandi notkun API-kerfisviðmóts
        more_2_1_api_usage_policy_url: https://operations.osmfoundation.org/policies/api/
        more_2_1_html: |-
          Þrátt fyrir að OpenHistoricalMap séu opin gögn, getum við ekki veitt
          ókeypis óheftan aðgang að API-viðmóti kortagrunnsins fyrir utanaðkomandi aðila.
          Skoðaðu síðurnar %{api_usage_policy_link}, %{tile_usage_policy_link} og %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Stefna varðandi notkun Nominatim
        more_2_1_nominatim_usage_policy_url: https://operations.osmfoundation.org/policies/nominatim/
        more_2_1_tile_usage_policy: Stefna varðandi notkun kortatígla
        more_2_1_tile_usage_policy_url: https://operations.osmfoundation.org/policies/tiles/
        more_title_html: Finna út meira
      title: Höfundarréttur og þakkir fyrir framlög
