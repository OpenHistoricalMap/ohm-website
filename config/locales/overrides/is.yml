        body: Svæðið sem þú ert að reyna að flytja út á OpenHistoricalMap á XML-sniði er of stórt. Auktu aðdráttinn eða veldu smærra svæði, nú eða notaðu eina af eftirfarandi leiðum til að flytja inn mikið magn gagna.
        overpass:
          description: Sæktu þennan gagnaramma frá spegli af OpenHistoricalMap gagnagrunninum
        planet:
          description: Reglulega uppfærð afrit af öllum OpenHistoricalMap gagnagrunninum
          title: OHM-plánetan
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Smelltu á %{note_icon} eða sama táknið í kortaglugganum.
            Þetta mun bæta merki á kortið, sem þú getur fært til
            með því að draga það. Bættu við skilaboðunum þínum, smelltu síðan á að vista, og annað kortagerðarfólk mun væntanlega rannsaka málið.
        join_the_community:
          explanation_html: Ef þú hefur rekist á vandamál í kortagögnunum, til dæmis ef það vantar götu eða húsnúmer, er besta leiðin að ganga til liðs við OpenHistoricalMap og bæta við eða laga gögnin sjálfur.
    help:
      forum:
        title: Vefspjall
      github:
        title: Beiðnir um nýja eiginleika og tilkynningar um villur
      introduction: |-
        OpenHistoricalMap er með ýmsar leiðir til að læra meira um verkefnið, spyrja og svara
        spurningum, og ræða í hópum um málefni tengd kortagerð.
      mailing_list:
        title: Póstlisti
      slack:
        title: IRC
      welcome:
        description: Byrjaðu með þessum fljótlega leiðarvísi með helstu grunnatriðum varðandi OpenHistoricalMap.
        title: Velkomin í OpenHistoricalMap
      wiki:
        description: Vafraðu um wiki/kvikuna til að sjá greinargóðar leiðbeiningar varðandi OHM.
        title: Wiki-vefur
    index:
      js_2: OpenHistoricalMap notar JavaScript til að útfæra gagnvirk kort.
      remote_failed: Breytingar mistókust - gakktu úr skugga um að JOSM eða Merkaartor sé hlaðið inn og að fjarstjórnunarvalkosturinn sé virkur
    potlatch:
      removed: Sjálfgefinn OpenHistoricalMap ritill þinn er stilltur sem Potlatch. Þar sem Adobe Flash Player er ekki til lengur, er Potlatch ekki lengur hægt að nota í vafra.
    welcome:
      basic_terms:
        a_tag_html: "%{tag} er dálítill gagnabútur varðandi leið eða annað atriði, til dæmis nafn á veitingastað eða árið sem brú var byggð."
        paragraph_1: OpenHistoricalMap inniheldur svolítið af eigin slangurorðum. Hér eru nokkur algeng orð sem gott er að hafa á bak við eyrað.
      introduction: |-
        Velkomin í OpenHistoricalMap, frjálsa heimskortinu sem þú getur breytt og lagað. Núna þegar þú ert
        búin(n) að skrá þig, geturðu farið að setja atriði inn á kortið. Hér er fljótlegur leiðarvísir
        með því helsta sem þú þarft að vita.
      rules:
        para_1_html: |-
          OpenHistoricalMap er með fáar formlegar reglur en við væntum þess og gerum kröfu um
          að allir þáttakendur starfi með og eigi samskipti við OSM-samfélagið Ef þú ert að íhuga aðgerðir
          aðrar en handvirkar breytingar, ættirðu að lesa og fylgja leiðbeiningunum á síðunum
          %{imports_link} og %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Það sem OpenHistoricalMap %{doesnt} eru gögn sem byggjast á skoðunum eintaklinga, sagnfræðilegar tilgátur eða möguleikar, að ógleymdum gögnum frá höfundarréttarvörðum upptökum. Ef þú ert ekki með sérstakt leyfi til slíks, skaltu ekki afrita eftir landakortum á pappír eða á netinu.
