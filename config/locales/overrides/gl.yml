          o permiso explícito dos posuidores deses dereitos.
        infringement_2_ohm_contact_team: ponte en contacto co equipo do OpenHistoricalMap poñendo "TAKEDOWN REQUEST" na liña do asunto
        infringement_2_ohm_html: Se cres que se engadiu material protexido por dereitos de autoría de forma inapropiada á base de datos do OpenHistoricalMap ou a este sitio, %{contact_team_link}.
        introduction_1_cc0: Creative Commons CC0
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/deed.gl
        introduction_1_ohm_html: |-
          O OpenHistoricalMap é unha colección de datos xeoespaciais abertos.
          Agás onde se indique o contrario, os datos do OpenHistoricalMap pertencen ao dominio público baixo unha licenza %{cc0_link}.
          Na medida en que o que usas sexa de dominio público, es libre de copialo, distribuílo, transmitilo e adaptalo para calquera propósito, sen ningunha restrición.
        introduction_2_cc_by: Creative Commons recoñecemento
