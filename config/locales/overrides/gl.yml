        contributors_gmted: Datos globais de elevación do terreo en multirresolución de 2010
        contributors_gmted_html: 'Datos de elevación do terreo de Danielson, J. J. e Gesch, D. B., 2011, %{gmted_link} (GMTED2010): U.S. Geological Survey Open-File Report 2011–1073, páx. 26, dominio público.'
        contributors_intro_html: |-
          O OpenHistoricalMap é o esforzo colaborativo de miles de persoas e organizacións, que á súa vez se basean nun gran conxunto de estudos académicos, xornalismo e mantemento de rexistros.
          As nosas fontes e colaboradores máis importantes inclúen:
