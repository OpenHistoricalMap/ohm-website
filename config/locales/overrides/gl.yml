          Na medida en que empregues calquera parte significativa da base de datos que estea cuberta por unha licenza de "compartir igual", debes respectar os termos desa licenza na túa adaptación.
        introduction_3_ohm_html: Os estilos de mapa que aparecen na nosa páxina de inicio pertencen ao dominio público baixo unha licenza CC0. Es libre de copialos, distribuílos, transmitilos e adaptalos para calquera propósito, sen ningunha restrición.
