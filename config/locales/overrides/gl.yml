  site:
    about:
      lede_text: O OpenHistoricalMap é un proxecto ambicioso liderado pola comunidade co obxectivo de rexistrar nun mapa os cambios na xeografía natural e humana en todo o mundo… ao longo do tempo.
      used_by_html: Explora o mundo en calquera período de tempo co %{name}.
    about_section:
      contribute_1_bluesky: Bluesky
      contribute_1_forum: o noso foro de debate
      contribute_1_mastodon: Mastodon
      contribute_1_ohm_html: |-
        A nosa crecente comunidade de colaboradores voluntarios inclúe historiadores afeccionados e profesionais, colaboradores do OpenStreetMap e da Wikipedia, especialistas en SIG e persoas normais coñecedoras da súa contorna.
        Nós somos persoas cuxa paixón é documentar o mundo e axudar ás comunidades do mundo real a contar as súas historias.
        Para obter máis información sobre a comunidade, consulta %{wiki_link}, visita %{forum_link}, le os %{user_diaries_link} e sigue as nosas contas de %{mastodon_link} e %{bluesky_link}.
      contribute_1_user_diaries: diarios de usuario
      contribute_1_wiki: a nosa extensa documentación no wiki
      contribute_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap
      contribute_2_create_account: creando unha conta gratuíta
      contribute_2_donations: aceptamos doazóns benéficas
      contribute_2_html: |-
        Podes comezar a contribuír ao mapa hoxe %{create_account_link}.
        Tamén %{donations_link} a través de %{osmus_link}, unha organización sen ánimo de lucro con execión de impostos.
        A túa xenerosa doazón irá directamente para que o OpenHistoricalMap funcione sen problemas.
      contribute_2_osmus: OpenStreetMap EUA
      contribute_title: Podes axudar
      legal_1_1_terms_of_use_url: https://wiki.osmfoundation.org/wiki/Licence/Contributor_Terms
      legal_1_aup: políticas de uso aceptable
      legal_1_aup_url: https://wiki.openstreetmap.org/wiki/Acceptable_Use_Policy
      legal_1_group: un grupo informal
      legal_1_group_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Governance
      legal_1_html: |-
        Este sitio e moitos outros servizos relacionados están operados por %{group_link} afiliado a OpenStreetMap EUA en nome da comunidade.
        O uso de todos os servizos operados polo OpenHistoricalMap está suxeito aos nosos %{terms_of_use_link}, ás nosas %{aup_link} e á nosa %{privacy_policy_link}.
      legal_1_privacy_policy: política de protección de datos
      legal_1_privacy_policy_url: https://osmfoundation.org/wiki/Privacy_Policy
      legal_1_terms_of_use: termos de uso
      legal_1_terms_of_use_url: https://osmfoundation.org/wiki/Terms_of_Use
      legal_2_contact_team: ponte en contacto co equipo do OpenHistoricalMap
      legal_2_html: Por favor, %{contact_team_link} se tes dúbidas sobre as licenzas, os dereitos de autoría ou outras cuestións legais.
      legal_3_html: |-
        OpenHistoricalMap® é unha marca rexistrada (número de rexistro dos EUA 90.019.364).
        OpenStreetMap e o logotipo da lupa son %{osmf_trademarks_link}.
      legal_3_osmf_trademarks: marcas rexistradas da Fundación OpenStreetMap
      legal_3_osmf_trademarks_url: https://osmfoundation.org/wiki/Trademark_Policy
      open_data_1_1_html: |-
        O mapa da nosa páxina de inicio é só unha das moitas formas de experimentar a información histórica que recompilamos.
        Os datos subxacentes están %{reuse_link} en forma de descarga ou a través de varias API gratuítas compatibles con software de código aberto.
      open_data_1_1_reuse: dispoñibles para seren reutilizados
      open_data_1_1_reuse_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Reuse
      open_data_2_copyright_license: Dereitos de autoría e recoñecementos
      open_data_2_html: |-
        Os datos son de dominio público a menos que se indique o contrario.
        Podes usalos para calquera propósito, sen ningunha restrición.
        Non obstante, agradecemos moito calquera crédito ou cita que proporciones ao OpenHistoricalMap.
        Para obter máis detalles e ollar os agradecementos, consulta %{copyright_license_link}.
      scope_html: |-
        Os imperios nacen e decaen. Os glaciares desaparecen. As linguas e as relixións esténdense dunha rexión a outra.
        Os camiños de terra convértense en autoestradas e vías de ferrocarril. Os edificios modestos dan paso aos rañaceos.
        E ti lembras como era o teu barrio.
        Todo isto pertence ao OpenHistoricalMap.
      scope_title: Grandes e pequenos, antes e agora
    communities:
      lede_text: "Persoas de todo o mundo contribúen ou usan OpenHistoricalMap.\nAínda que moitos participan individualmente, outros formaron comunidades.\nEstes grupos teñen varios tamaños e representan xeografías de cidades pequenas ou grandes rexións de varios países. \nTamén poden ser formais ou informais."
