        credit_1_html: Aínda que as leis de dereitos de autoría non restrinxen nin impoñen ningunha condición sobre o uso de contido de dominio público, agradecemos moito calquera recoñecemento que lle deas ao OpenHistoricalMap ao reutilizares, adaptares ou utilizares doutro xeito os nosos mapas ou datos.
        credit_2_home: á nosa páxina de inicio
        credit_2_ohm_html: |-
          Podes presentar este recoñecemento de calquera xeito razoable.
          Por exemplo, nun mapa dixital, podes mencionar o OpenHistoricalMap en letra pequena no recuncho, incluíndo unha ligazón %{this_copyright_page_link} ou %{home_link}:
        credit_2_this_copyright_page: a esta páxina de dereitos de autoría
        credit_3_credit_html: Os datos do mapa son cortesía do proxecto %{project_link}, de dominio público agás que se indique o contrario.
        credit_3_ohm_html: 'Ou podes incluír un recoñecemento máis claro nunha páxina de créditos separada onde recoñezas outras fontes:'
        credit_4_ohm_html: |-
          Nun mapa impreso, podes colocar o recoñecemento na lenda.
          Nun libro, podes describir o teu uso do OpenHistoricalMap nunha nota ao pé, na bibliografía ou no colofón.
          Nun artigo académico, podes citarnos de varias maneiras dependendo do que empregases.
        credit_title_html: De que xeito acreditar o OpenHistoricalMap
