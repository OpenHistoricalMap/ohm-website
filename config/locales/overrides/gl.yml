          title: Planeta OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Preme na %{note_icon} ou na mesma icona na visualización do mapa.
            Isto ha engadir unha marcaxe ó mapa que podes mover
            arrastrando. Engade a túa mensaxe, preme en "Gardar" e outras persoas pescudarán iso.
        join_the_community:
          explanation_html: |-
            Se atopas algún problema cos datos dos nosos mapas (por exemplo, se falta algunha estrada), o mellor é
            unirse á comunidade do OpenHistoricalMap e engadir ou corrixir os datos directamente.
      other_concerns:
        concerns_ohm_html: |-
          Se tes dúbidas sobre como se usan os nosos datos ou sobre os contidos, consulta a nosa
          %{copyright_link} para obter máis información legal ou %{contact_link}.
        contact: ponte en contacto con nós
        contact_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Communication
    help:
      discord:
        description: 'Únete ao servidor de Discord mundial do OpenStreetMap e recibe axuda na canle #openhistoricalmap.'
        title: Discord
      forum:
        description: Participa en debates máis longos e salas de conversa informais usando a túa conta do OHM.
        title: Foro
      github:
        description: Envía un informe de erro nos nosos repositorios de GitHub para avisar dun erro ou solicitar unha nova característica.
        title: Erros e solicitudes de características
      introduction: |-
        O OpenHistoricalMap dispón de varios recursos para aprender sobre o proxecto, para formular e responder preguntas,
        así como para debater e documentar colaborativamente sobre temas de cartografía.
      mailing_list:
        description: Subscríbete á nosa lista de correo de baixo volume.
        title: Lista de correo
      slack:
        description: 'Entra no espazo de traballo en Slack do OpenStreetMap dos EUA e únete á canle #openhistoricalmap.'
        title: Slack
      welcome:
        description: Comeza con esta guía rápida cos principios básicos do OpenHistoricalMap.
        title: Dámosche a benvida ó OpenHistoricalMap
      welcomemat:
        description: Comeza con esta guía rápida cos principios básicos do OpenHistoricalMap.
      wiki:
        description: Instrucións mantidas pola comunidade para usar o OHM e normas para contribuír ao proxecto.
        title: Wiki
    index:
      js_2: O OpenHistoricalMap emprega JavaScript para o seu mapa estático e dinámico.
      license:
        copyright: O OpenHistoricalMap pertence ao dominio público agás onde se indique o contrario.
      remote_failed: Erro ao editar; comproba que ou ben o JOSM ou ben o Merkaartor estea cargado e que a opción do control remoto estea activada
    potlatch:
      removed: O teu editor predeterminado do OpenHistoricalMap é o Potlatch. Debido a que o Adobe Flash Player xa non é compatíbel, Potlatch xa non está dispoñíbel para o seu uso nun navegador web.
    welcome:
      basic_terms:
        a_tag_html: Unha %{tag} é un anaco de datos sobre un nó ou unha vía, como o nome dun restaurante ou o ano de construción dunha ponte.
        paragraph_1: O OpenHistoricalMap ten unha xerga propia. Velaquí hai unhas palabras clave que son de utilidade.
      introduction: Dámosche a benvida ó OpenHistoricalMap, o mapa da historia do mundo libre e editábel. Agora que completaches o rexistro, xa podes comezar a cartografar. Velaquí hai unha guía rápida das cousas máis importantes que precisas saber.
      rules:
        para_1_html: |-
          O OpenHistoricalMap ten poucas regras formais, pero agardamos que todos os participantes colaboren
          coa comunidade e se comuniquen coa mesma. Se estás considerando facer
          calquera actividade que non sexa unha edición manual, le e sigue as directrices sobre as
          %{imports_link} e as %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: |-
          O OpenHistoricalMap %{doesnt} inclúe historias alternativas ficticias,
          erros coñecidos de mapas antigos e datos de fontes protexidas por dereitos de autoría. A menos que teñas permisos
          especiais, non copies de mapas modernos dos pasado que atopes en liña ou en papel.
        on_the_map_ohm_html: |-
          O OpenHistoricalMap leva conta dos cambios na xeografía natural e humana en todo o mundo.
          Temos millóns de entradas %{past_and_present}, desde imperios e glaciares ata casas e restaurantes.
          Podes cartografar calquera característica do mundo real que che interese.
        past_and_present: tanto do pasado coma do presente
