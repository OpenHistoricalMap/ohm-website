  sessions:
    destroy:
      heading: Ofmelde by OpenHistoricalMap
  site:
    about:
      lede_text: OpenHistoricalMap wurdt makke troch in mienskip fan kaartmakkers, dy't gegevens bydrage en ûnderhâlde oer diken, rûtes, kafees, spoarweistasjons en folle mear, oer de hiele wrâld.
    copyright:
      legal_babble:
        contributors_footer_2_html: |-
          It opnimmen fan data yn OpenHistoricalMap betsjut net dat de oanbieder fan 'e oarspronklike
          data efter OpenHistoricalMap stiet, ien of oare garânsje jout, of
          oanspraaklikens oanfurdiget.
        credit_1_html: 'Dêr wêr''t jo OpenHistoricalMap-data brûke, binne jo ferplichte en doch de neikommende twa dingen:'
        credit_title_html: Hoe moat OpenHistoricalMap neamd wurde
        infringement_1_html: OHM-bydragers wurde derop wiisd nea data ta te heakjen fan boarnen mei auteursrjochten (bgl. Google Maps as printe kaarten) sûnder de útdruklike tastimming fan 'e auteursrjochthawwers.
        more_title_html: Mear te witten komme
    export:
      too_large:
        body: Dit gebiet is te grut foar eksport as OpenHistoricalMap-XML-data. Sûm yn of selektearje in lytser gebiet. Brûk oars ien fan 'e boarnen dy't hjirûnder steane foar it ynladen fan bulkdata.
        overpass:
          description: It seleksjeramt ynlade fan in spegel fan 'e OpenHistoricalMap-databank
        planet:
          description: Geregeldwei bywurke kopyen fan 'e hiele OpenHistoricalMap-databank
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Klik gewoan op %{note_icon} of itselde ikoan yn 'e kaartwerjefte.
            Der komt in markearder op 'e kaart dy't jo
            ferslepe kinne. Heakje jo berjocht ta, klik bewarje, en oare kaartmakkers sille it dan besjen.
        join_the_community:
          explanation_html: At jo in probleem yn ús kaartdata opmerke, bygelyks in strjitte mist of jo adres, dan kinne jo jo it bêst oanslute by de OpenHistoricalMap-mienskip, en de data sels tafoegje of reparearje.
    help:
      introduction: |-
        OpenHistoricalMap hat ferskate middels om oer it projekt te learen, foar it stellen en beäntwurdzjen fan fragen,
        en yn gearwurking bepraten en fêstlizzen fan kartearringssaken.
      slack:
        title: Slack
      welcome:
        description: Begjin mei dizze koarte útlis oer OpenHistoricalMap-basisdingen.
        title: Wolkom by OpenHistoricalMap
      wiki:
        description: De wiki trochsjen foar wiidweidige dokumintaasje oer OHM.
    index:
      js_2: OpenHistoricalMap brûkt JavaScript foar de ferskobere kaart.
      remote_failed: Bewurkjen mislearre - soargje dat JOSM of Merkaartor laden is, en de ôfstânsbetsjinningsopsje ynskeakele
    potlatch:
      removed: Jo standertbewurker foar OpenHistoricalMap is ynsteld op Potlatch. Om't Adobe Flash Player weifallen is, is Potlatch net mear beskikber foar gebrûk yn in webblêder.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap hat in eigen taaltsje. Hjir binne in pear kaaiwurden dy't fan pas komme sille.
      introduction: |-
        Wolkom by OpenHistoricalMap, de frije en bewurkbere wrâldkaart. No't jo ynskreaun binne,
        binne jo hielendal klear foar jo earste bewurking. Hjir is in koarte útlis mei de wichtichste
        dingen dy't jo witte moatte.
      rules:
        para_1_html: |-
          OpenHistoricalMap hat net folle formele regels, mar wy ferwachtsje fan alle dielnimmers dat hja gearwurkje
          en kommunisearje mei de mienskip, mei fatsoen en respekt.
      whats_on_the_map:
        off_the_map_html: "Wat it %{doesnt} befettet is subjektive data lykas beoardielings, en data \nút boarnen mei auteursrjocht."
