    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Preprosto kliknite %{note_icon} ali isto ikono na prikazu zemljevida.
            To bo na zemljevid dodalo označevalec, ki ga lahko premikate z vlečenjem. Dodajte svojo sporočilo in nato kliknite »Shrani«, drugi kartografi pa bodo to pregledali.
        join_the_community:
          explanation_html: Če ste opazili težavo z našimi kartografskimi podatki, na primer manjkajočo cesto ali naslov, boste najbolje ravnali, če se boste pridružili skupnosti OpenHistoricalMap in boste podatke dodali ali popravili sami.
    help:
      github:
        description: Odprite težavo v naših repozitorijih GitHub, da prijavite napako ali zahtevate izboljšavo.
        title: Zahtevki za izboljšavo, hrošči
      introduction: OpenHistoricalMap ima več virov za učenje o projektu, postavljanje vprašanj in odgovarjanje nanja, sodelovanje v pogovorih in dokumentiranje kartografskih tem.
      mailing_list:
        title: Dopisni seznam
      slack:
        description: 'Povabite se v delovni prostor OpenStreetMap US Slack in se pridružite kanalu #openhistoricalmap.'
        title: IRC
      welcome:
        description: Začnite s tem hitrim vodnikom, ki obravnava osnove OpenHistoricalMap.
        title: Pozdravljeni v OpenHistoricalMap
      wiki:
        description: Prebrskajte viki za poglobljeno dokumentacijo OHM.
        title: Viki
    index:
      js_2: OpenHistoricalMap za prikaz zemljevida uporablja Javascript.
      remote_failed: Urejanje ni uspelo - poskrbite da je JOSM ali Merkaartor naložen in je možnost daljinskega upravljanja omogočena
    potlatch:
      removed: Vaš privzeti urejevalnik OpenHistoricalMap je Potlatch. Ker Adobe Flash Player ni več na voljo, Potlatch ni več na voljo za uporabo v spletnem brskalniku.
    welcome:
      basic_terms:
        a_tag_html: "%{tag} je delček podatkov o vozlišču ali poti, na primer ime restavracije ali leto izgradnje mostu."
        paragraph_1: OpenHistoricalMap ima tudi svoj žargon. Tukaj je nekaj ključnih besed, ki vam bodo prišle prav.
      introduction: Pozdravljeni v OpenHistoricalMap, brezplačnem zemljevidu sveta, ki ga je mogoče tudi urejati. Zdaj, ko ste vpisani, ste pripravljeni za začetek kartiranja. Tu je hitri vodnik z najpomembnejšim, kar morate vedeti.
      rules:
        para_1_html: |-
          OpenHistoricalMap ima nekaj formalnih pravil, vendar pričakujemo, da vsi udeleženci sodelujejo
          s skupnostjo in komunicirajo z njo. Če razmišljate o kateri koli dejavnosti razen ročnega urejanja, preberite in sledite smernicam na %{imports_link} in %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: OpenHistoricalMap %{doesnt} vključuje izmišljenih/prirejenih zgodovin, znanih napak na zgodovinskih zemljevidih in avtorsko zaščitenih virov. Ne kopirajte podatkov s sodobnih zemljevidov preteklosti, ki jih najdete na spletu ali natisnjene, razen če imate za to posebno dovoljenje.
        on_the_map_ohm_html: OpenHistoricalMap spremlja spremembe naravnega in človeškega zemljepisa po vsem svetu. Imamo milijone vnosov iz %{past_and_present}, od imperijev in ledenikov do hiš in restavracij. Na zemljevid lahko vnesete vse gradnike resničnega sveta, ki vas zanimajo.
        past_and_present: tako preteklost kot sedanjost
