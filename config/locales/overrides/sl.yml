  site:
    about:
      lede_text: OpenHistoricalMap je velikopotezen projekt, ki ga vodi skupnost, za kartiranje sprememb naravnega in človeškega zemljepisa po vsem svetu ... skozi stoletja.
      used_by_html: Raziščite svet v kateremkoli časovnem obdobju z %{name}.
    about_section:
      contribute_1_forum: naš forum za razpravo
      contribute_1_ohm_html: Naša rastoča skupnost prostovoljnih sodelavcev vključuje amaterske in poklicne zgodovinarje, sodelavce OpenStreetMap in Wikipedije, strokovnjake za GIS in običajne ljudi, ki poznajo svojo okolico. Strastno dokumentiramo svet in pomagamo skupnosti v resničnem svetu povedati njihove zgodbe. Če želite izvedeti več o skupnosti, si oglejte %{wiki_link}, obiščite %{forum_link} , preberite %{user_diaries_link} in nas spremljajte na %{mastodon_link} ali %{bluesky_link}.
      contribute_1_user_diaries: Uporabniški dnevniki
      contribute_1_wiki: naša obsežna viki dokumentacija
      contribute_2_create_account: ustvarjanje brezplačnega računa
      contribute_2_donations: sprejmi dobrodelne darove
      contribute_2_html: Danes lahko začnete prispevati k zemljevidu z %{create_account_link}. Tudi %{donations_link} preko %{osmus_link}, 501 (c) (3) nepridobitne organizacije z statusom davčne osvobojenosti. Vaš velikodušen dar bo šel neposredno v podporo ohranjanju brezhibnega delovanja OpenHistoricalMap za vse.
      contribute_2_osmus: OpenStreetMap ZDA
      contribute_title: Lahko pomagaš
      legal_1_aup: Politika sprejemljive uporabe
      legal_1_group: neuradna skupina
      legal_1_html: "To spletno mesto in povezane storitve \nv imenu skupnosti upravlja %{group_link}, ki je povezan z OpenStreetMap U.S. Za uporabo vseh storitev OpenHistoricalMap veljajo naši %{terms_of_use_link}, %{aup_link} in %{privacy_policy_link}."
      legal_1_privacy_policy: Pravilnik o zasebnosti
      legal_1_terms_of_use: Pogoji uporabe
      legal_2_html: |-
        Če imate vprašanja o licenci, avtorskih pravicah ali druga pravna vprašanja,
        prosimo, %{contact_team_link}.
      scope_html: Cesarstva vstajajo in padajo. Ledeniki izginjajo. Jeziki in religije se širijo iz ene regije v drugo. Preproste makadamske poti postanejo prometne avtoceste in železnice. Skromne stavbe se umaknejo visokim nebotičnikom. In spomniš se, kako je bila nekoč videti tvoja soseska. Vse to spada na OpenHistoricalMap.
      scope_title: Veliko in majhno, nekoč in danes
    communities:
      lede_text: K OpenHistoricalMap prispevajo in ga uporabljajo ljudje z vsega sveta. Medtem ko številni sodelujejo kot posamezniki, so drugi oblikovali skupnosti. Te skupine so različnih velikosti in predstavljajo geografska območja od majhnih mest do velikih regij z več državami. Lahko so tudi formalne ali neformalne.
    copyright:
      legal_babble:
        attribution_example:
          alt: Povezava z oznako OHM v spodnjem desnem kotu spletne strani, pod časovnim drsnikom.
          title: Primer navajanja OpenHistoricalMap na spletni strani
        contributors_2_ohm_html: 'Slogi zemljevidov, predstavljeni na domači strani, vsebujejo podatke OpenHistoricalMap in naslednje vire:'
        contributors_anr_communes_html: Podatki, ustvarjeni v okviru projekta %{anr_communes_link} v sodelovanju z %{campop_link}.
        contributors_footer_2_html: |-
          Vključitev podatkov v OpenHistoricalMap ne pomeni, da izvorni ponudnik podatkov podpira OpenHistoricalMap, daje kakršno koli jamstvo ali
          prevzema kakršno koli odgovornost.
        contributors_intro_html: |-
          OpenHistoricalMap je skupni napor tisočev posameznikov in organizacij, ki črpajo iz obsežnega nabora znanstvenih del, novinarstva in vodenja evidenc.
          Med našimi najpomembnejšimi viri in sodelavci so:
        contributors_osm: Sodelavci OpenStreetMap
        contributors_title_html: Priznanja
        credit_1_html: Čeprav zakon o avtorskih pravicah ne omejuje ali postavlja nobenih pogojev za vašo uporabo vsebin v javni domeni, smo zelo hvaležni za vsako priznanje, ki ga navedete OpenHistoricalMap pri ponovni uporabi, prilagajanju ali drugi uporabi naših zemljevidov ali podatkov.
        credit_2_home: naša domača stran
        credit_2_this_copyright_page: ta stran o avtorskih pravicah
        credit_title_html: Kako pripisati zasluge projektu OpenHistoricalMap
        infringement_1_html: Sodelavce OHM opozarjamo, naj nikoli ne dodajajo podatkov iz nobenega avtorsko varovanega vira (npr. Zemljevidov Google ali tiskanih zemljevidov) brez izrecnega dovoljenja imetnikov avtorskih pravic.
        introduction_2_ohm_html: Podatkovna zbirka OpenHistoricalMap vključuje nekatere posamezne gradnike zemljevida, ki so avtorsko zaščiteni. Ti gradniki so na voljo pod odprto licenco, kot je %{cc_by_link} (CC BY) ali %{cc_by_sa_link} (CC BY-SA), kot je navedeno v oznakah %{license_key_link} na posameznih gradnikih. V kolikor uporabljate katerikoli pomemben del podatkovne zbirke, ki je zajet z licenco »deljenje pod enakimi pogoji«, morate pri svoji priredbi upoštevati pogoje te licence.
        introduction_3_ohm_html: Slogi zemljevidov, predstavljeni na naši domači strani, so javno dostopni pod licenco CC0. Lahko jih prosto kopirate, delite, prenašate in prilagajate za kakršen koli namen brez kakršnih koli omejitev.
        introduction_4_creative_commons: Creative Commons Priznanje avtorstva-Deljenje pod enakimi pogoji 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/deed.sl
        more_2_1_api_usage_policy: Politika uporabe API-ja
        more_2_1_html: Čeprav so OpenHistoricalMap prostodostopni podatki, tretjim osebam ne moremo zagotoviti brezplačnega API-ja za zemljevide ali ploščic zemljevidov. Glejte naše %{api_usage_policy_link}, %{tile_usage_policy_link} in %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Politika uporabe Nominatim
        more_2_1_tile_usage_policy: Politika uporabe ploščic
        more_title_html: Več o tem
      title: Avtorske pravice in Potrdila
    export:
      too_large:
        body: To območje je preveliko za izvoz podatkov OpenHistoricalMap v formatu XML. Prosimo, da ga približate ali izberete manjše območje ali pa uporabite enega od naslednjih virov za obsežne prenose podatkov.
        overpass:
          description: Prenos izbranega omejevalnega polja iz zrcalnega strežnika podatkovne zbirke OpenHistoricalMap
        planet:
