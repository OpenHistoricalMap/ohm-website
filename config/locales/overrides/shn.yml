      about:
        paragraph_1: ဢမ်ႇမိူၼ်ၼင်ႇ ၽႅၼ်ႇလိၼ်တၢင်ႇဢၼ်၊ ဢၼ်ပဵၼ် OpenHistoricalMap ၼႆႉ ပဵၼ်ၵူၼ်းမိူၼ်ၸဝ်ႈၵဝ်ႇ ႁဵတ်းဢွၵ်ႇမႃး တဵမ်ထူၼ်ႈသေ တႃႇၽႂ်သေဢမ်ႇဝႃႈ မႄးလႆႈ၊ ဢၢပ်ႉတဵတ်ႉလႆႈ၊ လူတ်ႇလူင်း လႄႈ ၸႂ်ႉလႆႈ ၾရီး။
