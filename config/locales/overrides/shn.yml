  site:
    about:
      lede_text: OpenHistoricalMap ၼႆႉ ပဵၼ်ၸုမ်းၽူႈႁဵတ်းၽႅၼ်ႇလိၼ် ဢၼ်ၸွႆႈထႅမ် လႄႈ ထိင်းသိမ်း ၶေႃႈမုၼ်း ၵဵဝ်ႇလူၺ်ႈ သဵၼ်ႈတၢင်း၊ တၢင်း၊ ၵၾႄး၊ တႃႈလူတ်ႉလဵၼ်း၊ လႄႈ ထႅင်ႈတင်းၼမ်၊ တီႈၼႂ်း ၵမ်ႇၽႃႇပတ်ႉပိုၼ်ႉ။
    communities:
      lede_text: "ၵူၼ်းၸိူဝ်းလုၵ်ႉတၢင်းလုမ်ႈၾႃႉ ၸွႆႈသၢင်ႈ ဢမ်ႇၼၼ် ၸႂ်ႉတိုဝ်း OpenHistoricalMap။ \nၽွင်းမိူဝ်ႈၵူၼ်းတင်းၼမ် ၶဝ်ႈႁူမ်ႈၸွမ်းၼင်ႇ ၵူၼ်းၵေႃႉလဵဝ်ၵၼ်ၼၼ်ႉ၊ တၢင်ႇၸိူဝ်းၵေႃႈ လႆႈၵေႃႇသၢင်ႈမႃး တူင်ႇဝူင်း။\nၸုမ်းၸိူဝ်းၼႆႉ မီးတၢင်းၼမ် လႄႈ တၢင်တူဝ်ၼႃႈလိၼ်ၵႂၢင်ႈၵႂၢင်ႈ ၸဵမ်ဝဵင်းဢွၼ်ႇ တေႃႇထိုင် ၼႃႈလိၼ်မိူင်းတၢင်းၼမ်။ \nၶဝ်ၵေႃႈၸၢင်ႈပဵၼ် ဢၼ်ပဵၼ်တၢင်းၵၢၼ် ဢမ်ႇၼၼ် ဢၼ်ဢမ်ႇပဵၼ်တၢင်းၵၢၼ်။"
    copyright:
      legal_babble:
        attribution_example:
          alt: တူဝ်ယၢင်ႇ လၢႆးပၼ်ၶေႃႈမုၼ်း OHM တီႈၼိူဝ်ၼႃႈလိၵ်ႈဝႅပ်ႉသၢႆႉ
        contributors_footer_2_html: |-
          လွင်ႈဢဝ်ၶေႃႈမုၼ်း သႂ်ႇၼႂ်း OpenHistoricalMap ၼၼ်ႉ ဢမ်ႇလႆႈမၢႆထိုင်ဝႃႈ ၽူႈပၼ်ၶေႃႈမုၼ်း
           ဢၼ်ပဵၼ် ငဝ်ႈငႃႇမၼ်းၼၼ်ႉ ပၼ်ၶေႃႈမၵ်းမၼ်ႈ OpenHistoricalMap၊ ၵမ်ႉထႅမ်ပၼ် လွင်ႈမၼ်ႈၸႂ် သေဢၼ်ဢၼ်၊ ဢမ်ႇၼၼ် ႁပ်ႉႁွင်းပၼ် လွင်ႈဢဝ်ပုၼ်ႈၽွၼ်းသင်သေဢမ်ႇဝႃႈ။
        credit_1_html: တီႈဢၼ်ၸႂ်ႉတိုဝ်းၶေႃႈမုၼ်း OpenHistoricalMap ၼၼ်ႉ တေလႆႈႁဵတ်းၸွမ်း သွင်လွင်ႈ ၼင်ႇပႃႈတႂ်ႈၼႆႉ-
        credit_title_html: လၢႆးပၼ် ၶရႅတ်ႉတိတ်ႉ OpenHistoricalMap
        infringement_1_html: |-
          ၽူႈၸွႆႈထႅမ် OHM ၶဝ် လႆႈထုၵ်ႇၾၢင်ႉတိုၼ်ႇဝႃႈ ယႃႇပေဢဝ်သႂ်ႇ ၶေႃႈမုၼ်း တီႈလႂ်သေဢမ်ႇဝႃႈ ၸိူဝ်းပဵၼ်
          ၶေႃႈမုၼ်းဢၼ်မီးသုၼ်ႇၶွင်ၽူႈတႅမ်ႈလိၵ်ႈ (တူဝ်ယၢင်ႇ ၽႅၼ်ႇလိၼ် Google ဢမ်ႇၼၼ် ၽႅၼ်ႇလိၼ်ဢၼ်ဢိတ်ႇဢွၵ်ႇ) ဢၼ်ဢမ်ႇပႃး
          လႆႈၶႂၢင်ႉၸႅင်ႈလႅင်း တီႈၽူႈမီးသုၼ်ႇၶွင်။
    export:
      too_large:
        body: တႃႇဢဝ် ၽိုၼ်တီႈၼႆႉ သူင်ႇဢွၵ်ႇၼင်ႇ ၶေႃႈမုၼ်း XML ၶွင် OpenHistoricalMap ၼႆႉ မၼ်းယႂ်ႇႁႅင်းၼႃႇဢႃးလႃး။ ၶႅၼ်းတေႃႈ ၸုမ်းၶဝ်း ဢမ်ႇၼၼ် လိူၵ်ႈပၼ် ၽိုၼ်တီႈ ဢၼ်တိူဝ်း လဵၵ်ႉလိူဝ် ဢမ်ႇၼၼ် တွၼ်ႈတႃႇ လူတ်ႇလူင်း ၶေႃႈမုၼ်း ပဵၼ်သွႆႉ ၸႂ်ႉပၼ် ငဝ်ႈငႃႇ ဢၼ်မီးဝႆႉၼင်ႇ သဵၼ်ႈမၢႆႇၽၢႆႇတႂ်ႈ။
        overpass:
          description: လူတ်ႇလူင်း ၶွပ်ႇမၵ်းၶႅၼ်ႈၼႆႉ ၵႃႈတီႈငဝ်းၶေႃႈမုၼ်း OpenHistoricalMap
        planet:
          description: ၶေႃႈမုၼ်း OpenHistoricalMap ဢၼ်တဵမ်ထူၼ်ႈ ဢၼ်ႁဵတ်းႁႂ်ႈမႂ်ႇသုင်မႃးတႃႇသေႇ
          title: ၵျူဝ်ႇ OHM
    fixthemap:
      how_to_help:
        join_the_community:
          explanation_html: |-
            သင်ဝႃႈ ၸဝ်ႈၵဝ်ႇ လႆႈႁၼ် ပၼ်ႁႃ တီႈၶေႃႈမုၼ်း ၽႅၼ်ႇလိၼ်ႁဝ်း မိူၼ်ၼင်ႇ သဵၼ်ႈတၢင်း ဢမ်ႇၼၼ် တီႈယူႇ ၸဝ်ႈၵဝ်ႇ ဢမ်ႇမီးၼႆၸိုင် လၢႆးတၢင်း ဢၼ်လီသုတ်း တႃႇတေ
            သိုပ်ႇႁဵတ်းၵႂႃႇ ၼၼ်ႉ တေလႆႈ ၶဝ်ႈႁူမ်ႈၸွမ်း တူင်ႇဝူင်း OpenHistoricalMap သေ သႂ်ႇ ဢမ်ႇၼၼ် မႄးၶေႃႈမုၼ်း ႁင်းၵူၺ်း။
    help:
      introduction: |-
        OpenHistoricalMap ၼႆႉ မီးဝႆႉ ငိူၼ်ႈတိုၼ်းလၢႆလၢႆဢၼ် တႃႇလဵပ်ႈႁဵၼ်း လွင်ႈၶူင်းၵၢၼ်၊ လွင်ႈတွင်ႈထၢမ် လႄႈ လွင်ႈတွပ်ႇၶေႃႈထၢမ်
        လႄႈ ႁူမ်ႈၵၼ်ဢုပ်ႇၵုမ် လႄႈ တႅမ်ႈမၢႆဝႆႉ ႁူဝ်ၶေႃႈ ၵၢၼ်ႁဵတ်းၽႅၼ်ႇလိၼ်။
      welcome:
        description: တႄႇဢဝ် ၶေႃႈၼႄတၢင်း ဢၼ်လႅတ်းသႅဝ်း ဢၼ်ႁူမ်ႇငမ်း ပိုၼ်ႉထၢၼ် OpenHistoricalMap ၼႆႉတႃႉ။
        title: ႁူမ်ၸူမ်းႁပ်ႉတွၼ်ႈထိုင် OpenHistoricalMap ယူႇ
      welcomemat:
        description: လူၺ်ႈၸုမ်းဢၼ်ႁဵတ်းၽႅၼ်ၵၢၼ် တႃႇ OpenHistoricalMap ၼၼ်ႉႁိုဝ်? ႁႃတူၺ်း ဢၼ်လူဝ်ႇႁူႉ တီႈၼႂ်း ၽႅၼ်ႇႁပ်ႉတွၼ်ႈ ၼၼ်ႉတႃႉ။
      wiki:
        description: တူၺ်းတီႈ ဝီႇၶီႇ တႃႇႁႃ ၽိုၼ်လိၵ်ႈ OHM ဢၼ်လိုၵ်ႉလမ်ႇ။
        title: ဝီႇၶီ
    index:
      js_2: OpenHistoricalMap ၼႆႉ ၸႂ်ႉတိုဝ်း JavaScript တႃႇၽႅၼ်ႇလိၼ်မိုၼ်ႈ မၼ်းၼၼ်ႉယဝ်ႉ။
      license:
        copyright: သုၼ်ႇၶွင် OpenHistoricalMap လႄႈ ၽူႈႁူမ်ႈသၢင်ႈၶဝ် မီးၽၢႆႇတႂ်ႈ ဝႂ်လွတ်ႈလႅဝ်းထၢင်ႇႁၢင်ႈ
    potlatch:
      removed: ၽူႈတတ်းတေႃႇ OpenHistoricalMap ဢၼ်ပဵၼ် ပိူင်ၵႅဝ်ႈ ၸဝ်ႈၵဝ်ႇၼၼ်ႉ လႆႈတမ်းဝၢင်းဝႆႉ ပဵၼ် Potlatch ယဝ်ႉ။ ယွၼ်ႉဝႃႈ Adobe Flash Player ၼႆႉ လႆႈထွၼ်ဢွၵ်ႇပႅတ်ႈယဝ်ႉလႄႈ Potlatch ၼႆႉ ဢမ်ႇၸႂ်ႉလႆႈၼႂ်း ပရၢဝ်ႇသႃႇဝႅပ်ႉ ယဝ်ႉ။
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap ၼႆႉ မၼ်းမီးဝႆႉ ၽႃႇသႃႇႁင်းမၼ်း ၵမ်ႈၽွင်ႈ။ ၶေႃႈၵႂၢမ်းလမ်ႇလွင်ႈ ဢၼ်တေၸွႆႈထႅမ်လႆႈ ၵမ်ႈၽွင်ႈ။
      introduction: ႁူမ်ၸူမ်းႁပ်ႉတွၼ်ႈထိုင် OpenHistoricalMap ဢၼ်ပဵၼ်ၽႅၼ်ႇလိၼ်လုမ်ႈၾႃႉ ဢၼ်ဢမ်ႇလႆႈသဵင်ႈငိုၼ်းသင်သေ မႄးလႆႈၼၼ်ႉယူႇ။ ယၢမ်းလဵဝ် ၸဝ်ႈၵဝ်ႇ လႆႈလူင်းသဵၼ်ႈမၢႆဝႆႉယဝ်ႉလႄႈ ၸဝ်ႈၵဝ်ႇ တႄႇႁဵတ်းလႆႈ ၽႅၼ်ႇလိၼ် တင်းမူတ်းယဝ်ႉ။ ၼႆႉပဵၼ် ၶေႃႈၼႄတၢင်း ဢၼ်လမ်ႇလွင်ႈသေပိူၼ်ႈ ဢၼ်လူဝ်ႇႁူႉ။
      rules:
        para_1_html: |-
          OpenHistoricalMap ၼႆႉ မၼ်းမီးပၵ်းပိူင် ဢၼ်ပဵၼ်တၢင်းၵၢၼ် ဢိတ်းဢွတ်းၵူၺ်းသေတႃႉ ႁဝ်းၶႃႈ မုင်ႈမွင်းဝႃႈ ၽူႈၶဝ်ႈႁူမ်ႈ တင်းသဵင်ႈ တေလႆႈႁူမ်ႈမိုဝ်းၸွမ်းၵၼ် လႄႈ ၵပ်းသိုပ်ႇၵၼ် တင်း တူင်ႇဝူင်းၵူၼ်း ၼႆယဝ်ႉ။ သင်ၸိူဝ်ႉဝႃႈ ၸဝ်ႈၵဝ်ႇ ဝူၼ်ႉတႃႇ
          ႁဵတ်းၵၢၼ်တၢင်ႇဢၼ် လိူဝ်သေ မႄးထတ်း လူၺ်ႈမိုဝ်းၼႆၸိုင် ၶႅၼ်းတေႃႈ လူဢၢၼ်ႇ လႄႈ ႁဵတ်းၸွမ်း ၶေႃႈၸီႉသင်ႇ ဢၼ်မီးတီႈ
          %{imports_link} လႄႈ %{automated_edits_link} ၼၼ်ႉတႃႉ။
      whats_on_the_map:
        off_the_map_html: |-
          ဢၼ်မၼ်း %{doesnt} ၼၼ်ႉ ပဵၼ်ၶေႃႈမုၼ်း ဢၼ်ၶေႃႈႁၼ် မိူၼ်ၼင်ႇ လွင်ႈပၼ်ၸၼ်ႉထၢၼ်ႈ၊ ၽၢင်ႁၢင်ႈပိုၼ်း ဢမ်ႇၼၼ်
          ၶေႃႈႁၼ် လႄႈ ၶေႃႈမုၼ်း ဢၼ်လုၵ်ႉတီႈ ၶေႃႈမုၼ်း ဢၼ်မီးသုၼ်ႇၶွင်ၽူႈတႅမ်ႈလိၵ်ႈၼၼ်ႉယဝ်ႉ။ သင်ဝႃႈ ဢမ်ႇမီးၶႂၢင်ႉ
          ၶိုၵ်ႉတွၼ်းၼႆၸိုင် ယႃႇပေထုတ်ႇဢဝ် ၽႅၼ်ႇလိၼ် ဢၼ်မီးၼိူဝ်ဢွၼ်ႇလၢႆး ဢမ်ႇၼၼ် ၽႅၼ်ႇလိၼ် ဢၼ်ပဵၼ်ၽိုၼ်လိၵ်ႈၼၼ်ႉ။
