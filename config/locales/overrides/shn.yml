      osm_offline: ယၢမ်းလဵဝ် ၶေႃႈမုၼ်း OpenHistoricalMap ၼႆႉ ဢမ်ႇလႆႈႁဵတ်းၵၢၼ်၊ ပဵၼ်ၽွင်းမိူဝ်ႈ တိုၵ်ႉႁဵတ်းၵၢၼ်မႄးၵုမ်းလုမ်းလႃး ဢၼ်လမ်ႇလွင်ႈၼၼ်ႉယူႇ။
