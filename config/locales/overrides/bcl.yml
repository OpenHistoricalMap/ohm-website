  site:
    about:
      lede_text: |-
        An OpenHistoricalMap pigtogdok kan sarong komunidad nin mga paramapa na nag-aarambag asin nagmamantenir nin datos
        manungod sa mga tinampo, agihan, kapehan, istasyon nin tren, asin kadakol pang iba, sa bilog na kinaban.
    communities:
      lede_text: |-
        An mga tawo hali sa bilog na kinaban nag-aambag o naggagamit kan OpenHistoricalMap.
        Mantang an dakol nakikikabtang bilang mga indibiduwal, an iba nagbilog nin mga komunidad.
        An mga grupong ini igwa nin manlain-lain na kadakulaan asin nagrerepresentar nin mga heograpiya poon sa saradit na banwaan sagkod sa darakulang rona na may manlain-lain na nasyon.
        Pwede man sindang magin pormal o impormal.
    copyright:
      legal_babble:
        attribution_example:
          alt: Halimbawa kun pano iaatribwir an OHM sa sarong pahina nin web
        contributors_footer_2_html: |-
          An paglaog kan datos sa OpenHistoricalMap dai nangangahulugan na an orihinal
          an paratao nin datos nag-eendorso sa OpenHistoricalMap, nagtatao nin anuman na garantiya, o
          inaako an anuman na paninimbagan.
        credit_1_html: 'Kun sain ka naggagamit nin datos kan OpenHistoricalMap, kaipuhan mong gibohon an minasunod na duwang bagay:'
        credit_title_html: Pano ikredito an OpenHistoricalMap
        infringement_1_html: |-
          An mga nag-aambag sa OHM pinapagirumdom na dai nanggad magdugang nin datos gikan sa arin man
          mga pinagkukuanan na may deretso sa pagkopya (halimbawa, Google Maps o mga nakaimprentang mapa) na mayong
          malinaw na pagtugot gikan sa mga kagsadiri nin deretso sa pagkopya.
    export:
      too_large:
        body: An lugar na ini dakulaon na gayo tanganing ipaluwas bilang OpenHistoricalMap XML Data. Mag-zoom in o magpili nin mas sadit na lugar, o gamiton an saro sa mga pinagkukuanan na nakalista sa ibaba para sa mga pag-download nin bulto nin datos.
        overpass:
          description: I-download an kahon na nagbubugkos na ini gikan sa sarong salming kan database kan OpenHistoricalMap
        planet:
          description: Mga regular na pig-a-update na mga kopya kan kumpletong database kan OpenHistoricalMap
          title: Planet OHM
    fixthemap:
      how_to_help:
        join_the_community:
          explanation_html: |-
            Kun may nariparo kang problema sa datos kan samong mapa, halimbawa may nawawarang tinampo o an saimong address, an pinakamarahay na paagi tanganing
            an pagpadagos iyo an mag-ayon sa komunidad kan OpenHistoricalMap asin magdugang o maghirahay kan datos sa sadiri mo.
    help:
      introduction: |-
        An OpenHistoricalMap igwa nin nagkapirang rekurso para sa pag-adal manungod sa proyekto, paghapot asin pagsimbag nin mga kahaputan,
        asin magkasararong pag-orolay asin pagdokumento kan mga topiko sa pagmapa.
      welcome:
        description: Magpoon sa marikas na giya na ini na nagtatakop kan mga pundamental na OpenHistoricalMap.
        title: Maugmang pag-abot sa OpenHistoricalMap
      welcomemat:
        description: Sa sarong organisasyon na naggigibo nin mga plano para sa OpenHistoricalMap? Hanapon an kaipuhan mong maaraman sa Welcome Mat.
      wiki:
        description: Mag-browse sa wiki para sa detalyadong dokumentasyon kan OHM.
    index:
      js_2: An OpenHistoricalMap naggagamit nin JavaScript para sa saiyang mahalnas na mapa.
      license:
        copyright: Copyright OpenHistoricalMap asin mga nag-ambag, sa irarom nin sarong bukas na lisensya
    potlatch:
      removed: An saimong default na editor kan OpenHistoricalMap nakabugtak bilang Potlatch. Nin huli ta an Adobe Flash Player hinale na, an Potlatch dai na magagamit sa sarong web browser.
    welcome:
      basic_terms:
        paragraph_1: An OpenHistoricalMap igwa nin sadiring tataramon. Uya an nagkapirang panginot na taga na magigin kapaki-pakinabang.
      introduction: |-
        Maogmang pag-abot sa OpenHistoricalMap, an libre asin pwedeng liwaton na mapa kan kinaban. Ngunyan na nakapag-sign up ka na, andam ka nang magpoon sa pagmapa. Uya an sarong marikas na giya sa pinaka-importante
        mga bagay na kaipuhan mong maaraman.
      rules:
        para_1_html: |-
          An OpenHistoricalMap igwa nin dikit na pormal na mga regulasyon alagad naglalaom kami na an gabos na partisipante makikipagtabangan
          sa, asin makipag-ulay sa, komunidad. Kun ika nag-iisip
          ano man na aktibidad apwera sa pagliwat gamit an kamot, pakibasa asin sunudon an mga giya sa
          %{imports_link} asin %{automated_edits_link}.
