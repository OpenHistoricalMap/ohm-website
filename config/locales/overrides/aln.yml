        contributors_footer_2_html: Përfshirja e të dhënave në OpenHistoricalMap nuk do të thotë që origjinal dhënave miraton ofrues OpenHistoricalMap, ofron çdo garanci ose pranon ndonjë përgjegjësi.
        contributors_intro_html: licencë CC BY-SA jonë kërkon që ju të "japin origjinal Author kredi të arsyeshme për të mesëm ose të thotë Ti je shfrytëzuar". Individuale mappers OHM nuk kërkojnë një kreditit mbi dhe më lart që të "OpenHistoricalMap kontribuesit ", por kur të dhënat nga një hartës kombëtare agjenci ose burim kryesor ka qenë i përfshirë në  OpenHistoricalMap, ai mund të jetë e arsyeshme për kredi nga ana e tyre direkt riprodhimin e kreditit e tyre apo duke i lidhur me të në këtë faqe.
        credit_1_html: |-
          Nëse jeni duke përdorur harta imazhe OpenHistoricalMap, ne kërkojmë që
            kreditit tuaj lexon të paktën "© OpenHistoricalMap
            kontribuesit, CC BY-SA ". Nëse jeni duke përdorur të dhëna vetëm në hartë,
            ne kerkojme "Organizimi i të dhënave © kontribuesit OpenHistoricalMap,
            CC BY-SA ".
        credit_title_html: Si të kreditit OpenHistoricalMap
        more_title_html: Gjetja më shumë
