      legal_babble:
        contributors_footer_2_html: |-
          Улучэньне зьвестак у OpenHistoricalMap не азначае, што правайдэры арыґінальных зьвестак
          якім-небудзь чынам дапамагаюць OpenHistoricalMap, даюць гарантыі, ці
          прымаюць на сябе якую-небудзь адказнасьць.
        contributors_intro_html: |-
          OpenHistoricalMap — гэта супольны праект тысячаў асобаў і арганізацый, якія ў сваю чаргу зьвяртаюцца да вялікага аб’ёму навуковых, журналісцкіх і дакумэнтальных працаў.
          Сярод нашых найзначнейшых крыніцаў і аўтараў:
        contributors_title_html: Падзякі
        credit_1_html: Хоць закон аб аўтарскім праве не забараняе і не стварае ніякіх умоваў што да вашага ужываньня зьместу з грамадзкага набытку, мы вельмі ўдзячныя за кожную згадку пра OpenHistoricalMap пры выкарыстаньні, адаптацыі ці іншым карыстаньні нашых мапаў або зьвестак.
        credit_title_html: Як спасылацца на OpenHistoricalMap
        more_title_html: Даведацца болей
      title: Аўтарскія правы і падзякі
