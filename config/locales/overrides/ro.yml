  site:
    about:
      lede_text: |-
        OpenHistoricalMap este construit de o comunitate de cartografi care contribuie și întrețin datele
        despre drumuri, trasee, cafenele, stații de cale ferată și multe altele din întreaga lume.
      used_by_html: "%{name} furnizează date de hărți pentru mii de site-uri web, aplicații mobile și dispozitive hardware"
    about_section:
      contribute_1_user_diaries: jurnale utilizatori
      legal_1_aup: Politica de Utilizare Acceptabilă
      legal_1_html: |-
        Acest site și multe alte servicii conexe sunt operate oficial de către
        %{group_link}
        în numele comunității. Utilizarea tuturor serviciilor operate de OSMF este supusă
        la %{terms_of_use_link}, %{aup_link} și %{privacy_policy_link}.
        ​Căutați detalii
      legal_1_privacy_policy: Politica de Confidențialitate
      legal_1_terms_of_use: Termeni de Utilizare
      legal_2_html: |-
        Vă rugăm %{contact_team_link}
        dacă aveți întrebări legate de licență, drepturi de autor sau alte întrebări legale.
    communities:
      lede_text: Oameni din întreaga lume contribuie sau folosesc OpenHistoricalMap. În timp ce mulți participă ca indivizi, alții au format comunități. Aceste grupuri au o gamă largă de dimensiuni și reprezintă zone geografice de la orașe mici până la regiuni mari cu mai multe țări. De asemenea, pot fi formale sau informale.
    copyright:
      legal_babble:
        contributors_footer_2_html: Includerea datelor în OpenHistoricalMap nu implică faptul că originalul furnizor de date acceptă OpenHistoricalMap, oferă orice garanție sau acceptă orice răspundere.
        contributors_intro_html: |-
          Contribuitorii noștri sunt mii de indivizi. De asemenea, includem
          date cu licență de la agențiile naționale de cartografiere
          și alte surse, printre care:
        credit_1_html: 'Acolo unde utilizați datele OpenHistoricalMap, vi se cere să faceți următoarele două lucruri:'
        credit_2_this_copyright_page: această pagină de drepturi de autor
        credit_title_html: Cum se creditează OpenHistoricalMap
        infringement_1_html: Responsabilii OHM sunt reamintiți să nu adauge niciodată date de la nici una dintre sursele protejate de drepturi de autor (de ex., Hărți Google sau hărți tipărite) fără permisiunea explicită din partea deținătorilor drepturilor de autor.
        introduction_4_creative_commons: Creative Commons Attribution-ShareAlike 2.0
        more_2_1_api_usage_policy: Politica de utilizare API
        more_2_1_html: Deși OpenHistoricalMap este date deschise, nu putem oferi o API gratuit pentru hărți pentru terți. Consultați %{api_usage_policy_link}, %{tile_usage_policy_link} și %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Politica Utilizare Nominatim
        more_2_1_tile_usage_policy: Politica de Utilizare a Plăcilor
        more_title_html: Aflați mai multe.
    export:
      too_large:
        body: Această zonă este prea mare pentru a fi exportată ca date XML OpenHistoricalMap. Vă rugăm să măriți sau să selectați o zonă mai mică sau să utilizați una dintre sursele enumerate mai jos pentru descărcarea de date în bloc.
        overpass:
          description: Descărcați această casetă de restricționare dintr-o oglindă a bazei de date OpenHistoricalMap
        planet:
          description: Copii actualizate periodic ale bazei de date complete OpenHistoricalMap
          title: Planeta OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Doar faceți clic pe %{note_icon} sau pe aceeași pictogramă pe hartă.
            Acest lucru va adăuga un marcator pe hartă, pe care îl puteți muta
            prin tragere. Adăugați mesajul dvs., apoi faceți clic pe Salvați, iar alți cartografi vor investiga.
        join_the_community:
          explanation_html: Dacă ați observat o problemă cu datele noastre de pe hartă, de exemplu un drum care lipsește sau adresa dvs., cel mai bun mod de a rezolva această problemă este să vă alăturați comunității OpenHistoricalMap și să adăugați sau să reparați singuri datele.
    help:
      introduction: OpenHistoricalMap are mai multe resurse pentru a învăța despre proiect, pentru a răspunde și pune întrebări și pentru a colaborara și documenta subiectele legate de cartografiere.
      slack:
        title: IRC
      welcome:
        description: Începeți cu acest ghid rapid care acoperă elementele de bază OpenHistoricalMap.
        title: Bine ați venit la OpenHistoricalMap
      wiki:
        description: Caută pe wiki pentru o documentație OHM detaliată.
    index:
      js_2: OpenHistoricalMap folosește JavaScript pentru hărțile goale.
      remote_failed: Editarea a eșuat - asigurați-vă că JOSM sau Merkaartor este încărcat și că opțiunea de control de la distanță este activată
    potlatch:
      removed: Editorul dvs. implicit OpenHistoricalMap este setat ca Potlatch. Deoarece Adobe Flash Player a fost retras, Potlatch nu mai este disponibil pentru utilizare într-un browser web.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap are propriul jargon. Iată câteva cuvinte cheie care vă vor veni în ajutor.
      introduction: Bun-venit la OpenHistoricalMap, harta liberă și editabilă a lumii. Acum că v-ați autentificat, sunteți gata să începeți cartografierea. Iată un ghid rapid cu cele mai importante lucruri pe care trebuie să le cunoașteți.
      rules:
        para_1_html: |-
          OpenHistoricalMap are puține reguli formale, dar ne așteptăm ca toți participanții să colaboreze și să comunice cu comunitatea. Dacă vă gândiți la
          orice activități, altele decât editarea manuală, vă rugăm să citiți și să urmați instrucțiunile de pe
          %{imports_link} și %{automated_edits_link}.
