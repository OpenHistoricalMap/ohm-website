    new:
      about:
        paragraph_1: Ao contrário de outros mapas, o OpenHistoricalMap é completamente criado por pessoas como tu, e qualquer pessoa o pode corrigir, transferir e usar de forma gratuita.
        welcome: Bem-vind@ ao OpenHistoricalMap
