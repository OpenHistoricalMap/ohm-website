    destroy:
      heading: Encerrar sessão no OpenHistoricalMap
    new:
      login_to_authorize_html: Iniciar a sessão de OpenHistoricalMap para aceder a %{client_app_name}.
  site:
    about:
      lede_text: O OpenHistoricalMap é desenvolvido por uma comunidade de mapeadores voluntários que contribuem e mantêm atualizados os dados sobre estradas, trilhos, cafés, estações ferroviárias e muito mais por todo o mundo.
    about_section:
      contribute_1_user_diaries: diários dos utilizadores
      legal_1_aup: Políticas de Uso Aceitável
      legal_1_html: Este sítio e muitos outros serviços relacionados são formalmente geridos pela %{group_link} em nome da comunidade. A utilização de todos os serviços operados pela OSMF estão sujeitos aos nossos %{terms_of_use_link}, às %{aup_link} e à nossa %{privacy_policy_link}.
      legal_1_privacy_policy: Política de Privacidade
      legal_1_terms_of_use: Termos de Utilização
      legal_2_html: Por favor, %{contact_team_link} se tiver dúvidas de licenciamento, direitos de autor ou de outro teor.
    communities:
      lede_text: "O OpenHistoricalMap tem o contributo de pessoas de todo o mundo e é usado por muitas mais.\nEnquanto muitos participam como indivíduos, outros formaram comunidades.\nEsses grupos têm vários tamanhos e representam geografias desde pequenas povoações a grandes regiões de vários países. \nAlém disso, podem ser formais ou informais."
    copyright:
      legal_babble:
        contributors_footer_2_html: A inclusão de dados no OpenHistoricalMap não implica que o fornecedor de dados originais apoie o OpenHistoricalMap, forneça qualquer garantia ou aceite algum tipo de responsabilidade.
        contributors_intro_html: 'O OpenHistoricalMap tem milhares de contribuidores. Também são utilizados dados de agências cartográficas nacionais e outras fontes, entre elas:'
        credit_1_html: 'Onde usar dados do OpenHistoricalMap, é necessário fazer as duas coisas seguintes:'
        credit_2_this_copyright_page: esta página de direitos de autor
        credit_title_html: Como creditar o OpenHistoricalMap
        infringement_1_html: Os colaboreadores do OHM são informados regularmente para nunca adicionarem dados de fontes protegidas por direitos de autor (por exemplo o Google Maps ou mapas comerciais impressos) sem permissão explícita dos detentores dos direitos de autor.
        introduction_2_license_key_url: https://wiki.openstreetmap.org/wiki/Pt:OpenHistoricalMap/Tags/Key/license
        introduction_4_creative_commons: Creative Commons Atribuição-CompartilhaIgual 2.0
        more_2_1_api_usage_policy: Política de Uso da API
        more_2_1_html: Embora o OpenHistoricalMap seja composto por dados abertos, não podemos fornecer API gratuitamente a terceiros. Veja a nossa %{api_usage_policy_link}, %{tile_usage_policy_link} e %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: Política de Uso do Nominatim
        more_2_1_tile_usage_policy: Política de Uso de Mosaicos
        more_title_html: Mais informação
    export:
      too_large:
        body: Esta área é demasiado grande para exportar em dados XML do OpenHistoricalMap. Por favor, amplia a vista ou seleciona uma área mais pequena. Para transferir dados em massa, usa uma das seguintes fontes.
        overpass:
          description: Transferir dados desta caixa delimitadora através de um espelho da base de dados do OpenHistoricalMap
        planet:
          description: Cópias atualizadas regularmente da base de dados completa do OpenHistoricalMap
          title: Planeta OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Basta clicar em %{note_icon} ou no mesmo ícone na exibição do mapa.
            Isto irá adicionar um marcador no mapa, que pode mover arrastando-o. Adicione a sua mensagem, depois clique em guardar, e os outros mapeadores irão investigar.
        join_the_community:
          explanation_html: Se reparou num problema com os nossos dados do mapa, como a falta de uma estrada ou do seu endereço, a melhor coisa a fazer é juntar-se à comunidade do OpenHistoricalMap e adicionar ou corrigir os dados você mesm@.
    help:
      forum:
        description: Participe em debates mais prolongados e salas de conversa informais usando a sua conta do OHM.
        title: Fórum
      introduction: O OpenHistoricalMap tem vários recursos para aprender mais sobre o projeto, perguntar e responder a perguntas, e discutir e documentar assuntos sobre mapeamento de forma colaborativa.
      mailing_list:
        description: Subscreva a nossa lista de correio de baixo volume.
        title: Lista de correio
      slack:
        description: 'Convide-se para o espaço de trabalho Slack do OpenStreetMap U.S. e junte-se ao canal #openhistoricalmap.'
        title: IRC
      welcome:
        description: Começa com este guia rápido sobre os princípios básicos do OpenHistoricalMap.
        title: Bem-vind@ ao OpenHistoricalMap
      welcomemat:
        description: Começa com este guia rápido sobre os princípios básicos do OpenHistoricalMap.
      wiki:
        description: Instruções mantidas pela comunidade para a utilização de OHM e as linhas diretrizes para contribuir para o projeto.
    index:
      js_2: É necessário ter o JavaScript ativado para visualizar mapas no OpenHistoricalMap.
      remote_failed: Erro ao editar - confirma se o JOSM ou o Merkaartor está carregado e se a opção de controlo remoto está ativada
    potlatch:
      removed: O seu editor predefinido do OpenHistoricalMap está definido como Potlatch. Como o Adobe Flash Player foi retirado, Potlatch já não se encontra disponível para utilizar num navegador da Web.
    welcome:
      basic_terms:
        paragraph_1: O OpenHistoricalMap tem os seus próprios conceitos. Aqui tens a explicação de algumas palavras úteis.
      introduction: Bem-vindo(a) ao OpenHistoricalMap, o mapa do mundo, grátis e editável. Agora que te inscreveste, podes começar a mapear. Apresentamos-te aqui um guia rápido com as coisas mais importantes que precisas de saber.
      rules:
        para_1_html: O OpenHistoricalMap tem poucas regras formais, mas esperamos que todos os participantes colaborem e se comuniquem com a comunidade. Se estiveres a considerar alguma atividade além de editar manualmente, lê e segue as diretrizes em %{imports_link} e %{automated_edits_link}.
