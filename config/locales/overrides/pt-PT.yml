  layouts:
    intro_2_create_account: Cria uma conta de utilizador
    intro_header: Bem-vind@ ao OpenHistoricalMap!
    intro_text: O OpenHistoricalMap é um mapa interativo do mundo ao longo da história, criado por pessoas como tu e dedicado ao domínio público.
    logo:
      alt_text: Logótipo do OpenHistoricalMap
    logout: Terminar sessão
    partners_osmf: Fundação OpenStreetMap
    tag_line: O mapa mundial livre e editável
