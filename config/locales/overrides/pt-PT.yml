      please_contact_support_html: Por favor, contacta %{support_link} para pedir a criação de uma conta - tentaremos tratar do pedido o mais rapidamente possível.
      signup_to_authorize_html: Inicia sessão no OpenHistoricalMap para acederes a %{client_app_name}.
