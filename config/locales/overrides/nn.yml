  site:
    about:
      lede_text: OpenHistoricalMap er bygd av eit fellesskap av kartleggjarar som bidreg og held ved like data om vegar, stigar, kafear, jarnbanestasjonar og mykje meir kring verda.
    about_section:
      contribute_1_user_diaries: brukardagbøker
      legal_1_aup: vilkåra for akseptabel bruk
      legal_1_html: Denne nettstaden og fleira andre tilknytte tenester er formelt drivne av %{group_link} på vegner av fellesskapet. Bruk av alle tenester som OSMF driv er underlagd %{terms_of_use_link}, %{aup_link} og %{privacy_policy_link}.
      legal_1_privacy_policy: personvernspolitikken
      legal_1_terms_of_use: bruksvilkåra
      legal_2_html: Kontakt %{contact_team_link} om du har spørsmål knytte til lisens, opphavsrett eller andre juridiske emne.
    copyright:
      legal_babble:
        contributors_footer_2_html: Inkludering av data i OpenHistoricalMap inneber ikkje at den opphavlege dataleverandøren støttar OpenHistoricalMap, gjev nokon garanti elle godtek noko erstatningsansvar.
        contributors_intro_html: 'Me har tusenvis av individuelle bidragsytarar. Me inkluderer óg åpne datasett frå nasjonale karttjenester og andre kjelder, bland anna frå:'
        credit_1_html: 'Når du bruker data frå OpenHistoricalMap, krevst to ting av deg:'
        credit_2_this_copyright_page: denne sida om opphavsrett
        credit_title_html: Korleis kreditere OpenHistoricalMap
        infringement_1_html: OHM-bidragsytarar vert minna på å aldri leggje til data frå opphavsrettsbeskytta kjelder (t.d. Google Maps eller utskrivne kart) utan uttrykkeleg løyve frå rettighetshavere.
        introduction_4_creative_commons: Creative Commons Navngiving-DelPåSameVilkår 2.0
        more_2_1_api_usage_policy: Retningslina for bruk av API
        more_2_1_html: |-
          Enda OpenHistoricalMap er ope data, kan vi ikkje levera eit gratis kart-API til tredje partar.
          Sjå %{api_usage_policy_link}, %{tile_usage_policy_link} og %{nominatim_usage_policy_link}.
        more_2_1_nominatim_usage_policy: REtningslina for bruk av Nominatim
        more_2_1_tile_usage_policy: Retningslina for bruk av kartfliser
        more_title_html: Finn ut meir
