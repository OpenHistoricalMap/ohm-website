      remote_failed: Уредувањето не успеа - проверете дали е вчитан JOSM или Merkaartor и дали е овозможено далечинското управување
    potlatch:
      removed: Вашиот стандарден уредник на OpenHistoricalMap е наместен да биде Potlatch. Поради укинувањето на Adobe Flash Player, Potlatch повеќе не е достапен за употреба во прелистувач.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap има свој жаргон. Еве некои корисни поими.
      introduction: Добре дојдовте на OpenHistoricalMap — слободна и уредлива карта на светот. Сега веќе сте зачленети, што значи дека можете да почнете со работа. Еве мала помош за најважните работи што треба да ги знаете.
      rules:
        para_1_html: |-
          OpenHistoricalMap има малку формални правила, но од сите учесници се очекува да соработуваат и општат со заедницата. Ако размислувате за други активности освен рачно уредување, прочитајте и следете ги напатствијата за
          %{imports_link} и %{automated_edits_link}.
