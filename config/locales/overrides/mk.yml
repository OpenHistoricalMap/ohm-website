          instructions_1_html: |-
            Просто стиснете на %{note_icon} или пак на истата икона од приказникот на картата.
            Со ова на неа ќе ставите бележник, кој можете да го преместувате со влечење. Ставете ја пораката, па стиснете да зачувате. Потоа другите картографи ќе го иследат проблемот.
        join_the_community:
          explanation_html: Ако имате забележано проблем со податоците на нашите карти (на пр. недостасува пат или адреса), најдобро е да се приклучите на заедницата на OpenHistoricalMap или пак самите да ги исправите податоците.
