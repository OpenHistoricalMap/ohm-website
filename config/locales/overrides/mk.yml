  site:
    about:
      lede_text: |-
        OpenHistoricalMap ја гради заедница од учесници што придонесуваат со свои содржини и ги одржуваат податоците
        за патишта, патеки, кафеани, железнички станици и многу друго ширум светот.
      used_by_html: '%{name} обезбедува картографски податоци на илјадници мрежни
        места, мобилни прилози и сметачки уреди'
    about_section:
      contribute_1_user_diaries: кориснички дневници
      legal_1_aup: Правила за прифатлива употреба
      legal_1_html: "Со ова мрежно место и многу други поврзани услуги формално раководи
        %{group_link} \nво име на заедницата. Употребата на сите услуги што ги нуди
        OSMF подлежи на нашите %{terms_of_use_link}, %{aup_link} и our %{privacy_policy_link}."
      legal_1_privacy_policy: Правила за личните податоци
      legal_1_terms_of_use: Услови на употреба
      legal_2_html: |-
        %{contact_team_link}
        ако имате прашања во врска со лиценцирање, авторски права или други правни работи.
    add_a_note:
      para_1: Ако сакате да направите само поситна поправка и немате време да се зачленувате
        и обучувате, тогаш просто ставете белешка.
    any_questions:
      ohm_paragraph_1_html: |-
        OpenHistoricalMap има неколку извори од кои можете да научите за проектот, поставување и одговарање на прашања и соработна дискусија за и документирање на картографски теми.
        %{help_link}.
    copyright:
      legal_babble:
        attribution_example:
          title: Пример за наведување
        contributors_footer_2_html: |-
          Употребата на податоците на OpenHistoricalMap не подразбира дека добавувачот
          на изворните податоци го застапува или рекламира OpenHistoricalMap, дава каква било гаранција, или
          дека прифаќа каква било одговорност.
        contributors_intro_html: |-
          Во нашиот проект учествуваат илјадници поединци. Користиме и
          податоци со отворена лиценца од државни картографски установи
          и други извори, меѓу кои се:
        contributors_title_html: Нашите учесници
        credit_1_html: 'Кога користите податоци од OpenHistoricalMap, задолжително
          треба да ги направите следниве две нешта:'
        credit_2_this_copyright_page: оваа авторскоправна страница
        credit_title_html: Како да ја наведете OpenHistoricalMap
        infringement_1_html: |-
          Би сакале да ги потсетиме учесниците на OHM дека никогаш не смеат да ставаат
          податоци од извори заштитени со авторски права (на пр. Google Карти или печатени карти) без
          изречна дозвола од нивните праводршци.
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/deed.mk
        introduction_4_creative_commons: Криејтив комонс Наведи извор-Сподели под
          исти услови 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/deed.mk
        more_title_html: Повеќе информации
      title: Авторски права и лиценца
