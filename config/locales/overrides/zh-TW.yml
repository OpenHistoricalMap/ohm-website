          title: 如何在網頁上署名 OpenHistoricalMap 的範例
        contributors_2_ohm_html: 首頁上呈現的地圖樣式有包含 OpenHistoricalMap 資料與以下來源：
        contributors_anr_communes_campop: 劍橋人口與社會結構歷史小組
        contributors_anr_communes_html: 資料由%{anr_communes_link}專案與%{campop_link}合作建立。
        contributors_anr_communes_project: ANR 公社
        contributors_footer_2_html: OpenHistoricalMap 收錄一項資料，並不意味原本的資料提供者認可 OpenHistoricalMap、提供任何保證或承擔任何法律責任。
        contributors_globcover: GlobCover
        contributors_globcover_html: 土地覆蓋來自 %{globcover_link}, © ESA 2010 與 UCLouvain，可在註明出處的情況下重新使用於教育和/或科學目的。
        contributors_gmted: 2010 全球多解析度地形海拔資料
        contributors_gmted_html: 地形海拔資料來自 Danielson, J.J., 與 Gesch, D.B., 2011，%{gmted_link}（GMTED2010）：美國地質調查局公開檔案報告 2011–1073, 26 頁。屬於公眾領域。
        contributors_intro_html: OpenHistoricalMap 是數千名個人與組織共同合作的成果，他們從大量的學術、新聞和記錄中製作。我們最重要的來源和貢獻者包括：
        contributors_more_sources_html: "%{sources_link} 在 OpenStreetMap Wiki 上可用。"
