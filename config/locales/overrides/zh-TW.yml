    welcome:
      basic_terms:
        a_tag_html: "%{tag}是關於節點或路徑的資料，例如餐廳的名字或是橋梁的建造年份。"
        paragraph_1: OpenHistoricalMap 擁有一些自己的術語。以下是一些可能派上用場的關鍵字。
      introduction: 歡迎來到 OpenHistoricalMap，自由和可編輯的世界地圖。你目前已經登入，可以開始繪製地圖。這裡有一份你必須知道的最重要事項的快速指南。
      rules:
        para_1_html: OpenHistoricalMap 幾乎沒有一定要遵照的規則，但我們希望所有參與者都能與社群合作與溝通。如果您正在考慮進行手動編輯之外的任何活動，請閱讀並遵循%{imports_link}和%{automated_edits_link}指南。
      whats_on_the_map:
        off_the_map_html: OpenHistoricalMap %{doesnt}包含虛構的架空歷史、古代地圖中已知的錯誤，以及受版權保護的資料。除非您獲得特殊許可，否則請不要複製您在網上或印刷品中找到的古老現代地圖。
        on_the_map_ohm_html: |-
          OpenHistoricalMap 追蹤世界各地的自然與人文地理變化。
          我們擁有來自%{past_and_present}的數百萬個項目，囊括從帝國與冰河到住家與餐廳等內容。
          您可以繪製任何您感興趣的現實世界面貌。
        past_and_present: 過去與現在
