  site:
    about:
      lede_text: OpenHistoricalMap 是一個由社群主導的遠大目標專案，旨在繪製出世界各地自然與人文地理在不同時代的地圖變化。
      used_by_html: 與%{name}一起探索任何時間點的世界。
    about_section:
      contribute_1_bluesky: Bluesky
      contribute_1_forum: 我們的討論論壇
      contribute_1_mastodon: Mastodon
      contribute_1_ohm_html: "我們不斷成長的志工貢獻者社群包括業餘與專業歷史學家、OpenStreetMap 和維基百科貢獻者、GIS 專家、以及熟悉周圍環境的一般民眾。 \n我們熱衷於記錄世界，並協助現實世界各地講述他們的故事。 \n要了解有關社群的更多資訊，請查閱%{wiki_link}、參訪%{forum_link}、閱讀%{user_diaries_link}，並關注我們的%{mastodon_link}或%{bluesky_link}帳號。"
      contribute_1_user_diaries: 使用者日記
      contribute_1_wiki: 我們的豐富 wiki 文件
      contribute_1_wiki_url: https://wiki.openstreetmap.org/wiki/Zh-hant:OpenHistoricalMap
      contribute_2_create_account: 建立免費帳號
      contribute_2_donations: 接受慈善捐款
      contribute_2_html: "您今天就可以透過%{create_account_link}開始為地圖做出貢獻。 \n我們也透過%{osmus_link}%{donations_link}，這是一個免稅的 501(c)(3) 非營利組織。 \n您的慷慨捐款，將直接用來維持 OpenHistoricalMap 順利運作。"
      contribute_2_osmus: OpenStreetMap U.S.
      contribute_title: 您可以幫忙
      legal_1_aup: 可接受使用方針
      legal_1_aup_url: https://wiki.openstreetmap.org/wiki/Acceptable_Use_Policy
      legal_1_group: 非正式團體
      legal_1_group_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Governance
      legal_1_html: 本站以及許多相關的服務正式由%{group_link}代表社群所營運。所有使用的 OSMF 運行服務皆符合我們的%{terms_of_use_link}、%{aup_link}、和%{privacy_policy_link}。
      legal_1_privacy_policy: 隱私權政策
      legal_1_privacy_policy_url: https://osmfoundation.org/wiki/Privacy_Policy
      legal_1_terms_of_use: 使用條款
      legal_1_terms_of_use_url: https://osmfoundation.org/wiki/Terms_of_Use
      legal_2_contact_team: 聯絡 OpenHistoricalMap 團隊
      legal_2_html: 若你有授權、版權、或其他法律上的問題，請%{contact_team_link}。
      legal_3_html: "OpenHistoricalMap® 是註冊商標（美國註冊號碼：90,019,364）。 \nOpenStreetMap 與放大鏡標誌是%{osmf_trademarks_link}。"
      legal_3_osmf_trademarks: OpenStreetMap 基金會的註冊商標
      legal_3_osmf_trademarks_url: https://osmfoundation.org/wiki/Trademark_Policy
      open_data_1_1_html: |-
        我們首頁上的地圖只是體驗我們所收集到歷史資訊的眾多方式之一。
        底層資料是可下載的%{reuse_link}或透過與開放原始碼軟體相容的各種免費 API 取得。
      open_data_1_1_reuse: 可重複使用
      open_data_1_1_reuse_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Reuse
      open_data_2_copyright_license: 版權與致謝
      open_data_2_html: |-
        除非另有說明，否則資料屬於公眾領域。
        您可以不受任何限制，自由地將其用於任何目的。
        若您能提供任何對 OpenHistoricalMap 的表彰或引用，我們會非常感謝。
        如需更多詳細資訊和致謝，請參閱%{copyright_license_link}。
      scope_html: |-
        帝國的興衰，冰河的消失，語言與宗教從一個地區傳播到另一個地區。
        簡陋的塵土道路變成了繁忙的公路和鐵路。樸素的建物被高聳的摩天大樓替換。
        而您還記得您家附近過去的模樣。
        這一切都在 OpenHistoricalMap。
      scope_title: 大與小，過去與現在
    communities:
      lede_text: |-
        來自世界各地的人們都在貢獻或使用 OpenHistoricalMap。
        雖然許多人以個人身份參與，但其他人則組成了社群。
        這些團體的規模各不相同，代表了小到城鎮大到大型多國地區的地域。
        他們也可以是正式的或非正式團體。
    copyright:
