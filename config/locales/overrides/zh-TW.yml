        contributors_newberry: 紐伯利圖書館
        contributors_newberry_ahcb: 歷史縣界地圖集
        contributors_newberry_ahcb_html: 資料來自於%{ahcb_link}，是%{newberry_link}的美國歷史與文化中心 William M. Scholl Center 一個專案，可不受限制重複使用。
        contributors_osm: OpenStreetMap 貢獻者
        contributors_osm_cc_by_sa: CC 姓名標示-相同方式分享 2.0
        contributors_osm_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/2.0/deed.zh-hant
        contributors_osm_html: 海岸線、水體與溪流的資料：© %{osm_link}、%{cc_by_sa_link}。
        contributors_title_html: 銘謝
        credit_1_html: 雖然著作權法不限制或對您使用公眾領域內容設定任何條件，若您能在重複使用、改編或以其他方式使用我們的地圖或資料時提供對 OpenHistoricalMap 的表彰，我們會非常感謝。
        credit_2_home: 我們的首頁
        credit_2_ohm_html: |-
          您可以用任何合理的方式來表達鳴謝。
          例如在數位地圖上，您可以在角落以小字體形式來提及  OpenHistoricalMap，並連結到%{this_copyright_page_link}或%{home_link}：
        credit_2_this_copyright_page: 此版權頁面
        credit_3_credit_html: 地圖資料受惠於 %{project_link} 專案，除非另有說明，否則屬於公眾領域。
        credit_3_ohm_html: 或者，您可以在單獨的鳴謝表彰頁面上更清楚地表彰其他來源：
        credit_4_ohm_html: |-
          在印刷地圖上，您可以將銘謝放在圖例中。
          在書中，您可以在註腳、參考書目或是版權頁中描述您用在 OpenHistoricalMap 的使用。
          在學術論文中，您可以根據所使用的內容以各種方式引用我們。
        credit_title_html: 如何表彰出處來自 OpenHistoricalMap
        infringement_1_html: OHM 的貢獻者會被提醒，絕不要在沒有版權所有人的明確淮許下，加入來自任何有版權的來源的資料 (如 Google 地圖或印刷地圖)。
        infringement_2_ohm_contact_team: 聯絡 OpenHistoricalMap 團隊，並在主旨中註明「TAKEDOWN REQUEST」（刪除請求）
        infringement_2_ohm_html: 如果您認為受版權保護的資料被不當添加到 OpenHistoricalMap 資料庫或本網站，請聯絡 %{contact_team_link}。
        introduction_1_cc0: 創用 CC 公眾領域貢獻宣告
        introduction_1_cc0_url: https://creativecommons.org/publicdomain/zero/1.0/deed.zh-hant
        introduction_1_ohm_html: "OpenHistoricalMap 是一個開放地理空間資料的集合。 \n除非另有說明，OpenHistoricalMap 資料均依據%{cc0_link}之下奉獻於公眾領域。 \n在您的使用是屬於公眾領域範圍內，您可以不受任何限制自由地複製、分發、傳和改編用於任何目的。"
        introduction_2_cc_by: 創用 CC 姓名標示
        introduction_2_cc_by_sa: 創用 CC 姓名標示-相同方式分享
        introduction_2_cc_by_sa_url: https://creativecommons.org/licenses/by-sa/4.0/deed.zh-hant
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/deed.zh_TW
        introduction_2_license_key_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/Tags/Key/license
        introduction_2_ohm_html: "OpenHistoricalMap 資料庫收錄一些受版權保護的單獨地圖功能。 \n這些功能可在開放授權下使用，例如%{cc_by_link}（CC&nbsp;BY）或%{cc_by_sa_link}（CC&nbsp;BY-SA），如單獨元素上的%{license_key_link}標籤中所述。 \n如果您某種程度上使用到資料庫裡涵蓋「相同方式共享」許可協議的任何重要部分，您應在自己的改編內容中同樣遵守該許可協議的條款。"
        introduction_3_ohm_html: 我們首頁上展現的地圖樣式已根據 CC0 協議授權屬於公眾領域。您可以自由地複製、分發、傳播與改編，且不受任何限制用於任何用途。
