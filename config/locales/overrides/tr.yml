        copyright: OpenHistoricalMap, aksi belirtilmedikçe kamu malı olmaya adanmıştır.
    potlatch:
      removed: Varsayılan OpenHistoricalMapdüzenleyiciniz Potlatch olarak ayarlanmıştır.
        Adobe Flash Player geri çekildiğinden, Potlatch artık bir web tarayıcısında
        kullanılamaz.
    welcome:
      basic_terms:
        a_tag_html: |-
          %{tag} bir düğüm veya yol hakkında veri parçasıdır, örneğin bir
          restoranın adı veya bir köprünün inşa edildiği yıl gibi.
        paragraph_1: OpenHistoricalMap'in kendine ait bazı argoları vardır. İşte kullanışlı
          gelecek birkaç anahtar kelime.
      introduction: Dünyanın düzenlenebilir ve ücretsiz haritası OpenHistoricalMap'e
        hoş geldiniz. Şu an kaydoldunuz ve bütün haritalama işlemlerine başlamanız
        için her şey hazır. İşte bilmeniz gereken en önemli şeylerin hızlı bir kılavuzu.
      rules:
        para_1_html: OpenHistoricalMap'in birkaç resmî kuralı olmasına rağmen tüm
          katılımcıların toplulukla iş birliği yapmasını ve iletişim kurmasını bekliyoruz.
          Elle düzenleme dışında herhangi bir işlem yapmayı düşünüyorsanız lütfen%{imports_link}
          ve %{automated_edits_link} kılavuzlarını okuyup uygulayın.
      whats_on_the_map:
        off_the_map_html: |-
          OpenHistoricalMap, kurgusal alternatif tarihler, antik haritalardaki
          bilinen hatalar ve telif hakkıyla korunan kaynaklardan gelen verileri
          %{doesnt}. Özel izniniz olmadığı sürece, internette veya basılı olarak
          bulduğunuz geçmişe ait modern haritalardan kopyalamayın.
        past_and_present: geçmiş ve şimdiki zaman aynı anda
