    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Sadece %{note_icon} ikonuna tıklayın veya harita görünümü üzerinde aynı ikona tıklayın.
            Bu haritaya daha sonra sürükleyerek taşıyabileceğiniz bir işaretleyici ekleyecek. Mesajınızı ekleyin ve kaydedin, diğer haritacılar bunu araştıracaklar.
        join_the_community:
          explanation_html: |-
            Harita verilerinde bir sorun fark ettiyseniz, örneğin bir yol veya adresinizin eksik olması gibi,
            devam etmenin en iyi yolu OpenHistoricalMap topluluğuna katılmak ve verileri kendiniz eklemeniz veya düzeltmenizdir.
    help:
      introduction: |-
        OpenHistoricalMap; proje hakkında bilgilenmek, soru sormak ve
        soruları cevaplamak
        ve haritalama konularını ortaklaşa tartışmak ve belgelemek için çeşitli kaynaklara sahiptir.
      slack:
        title: IRC
