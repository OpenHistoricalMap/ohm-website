    about_section:
      contribute_1_user_diaries: kullanıcı günlükleri
      contribute_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap
      legal_1_aup: Kabul Edilebilir Kullanım Politikaları
      legal_1_html: Bu site ve diğer birçok ilgili hizmet, topluluk adına %{group_link} tarafından resmî olarak işletilmektedir. OSMF tarafından işletilen tüm hizmetlerin kullanımı %{terms_of_use_link}, %{aup_link} ve %{privacy_policy_link}na tabidir.
      legal_1_privacy_policy: Gizlilik Politikası
      legal_1_terms_of_use: Kullanım Şartları
      legal_2_html: Lisanslama, telif hakkı veya diğer yasal sorularınız varsa lütfen %{contact_team_link}
      legal_3_osmf_trademarks_url: https://osmfoundation.org/wiki/Trademark_Policy
    communities:
      lede_text: |-
        Dünyanın dört bir yanından insanlar OpenHistoricalMap'e katkıda bulunuyor veya onu kullanıyor.
        Birçoğu bireysel olarak katılırken, diğerleri topluluklar oluşturmuştur.
        Bu gruplar çeşitli boyutlarda olabilir ve küçük kasabalardan büyük çok
        uluslu bölgelere kadar çeşitli coğrafyaları temsil edebilir.
        Resmi veya gayriresmi de olabilirler.
    copyright:
      legal_babble:
        attribution_example:
          alt: Bir web sayfasının sağ alt köşesinde, zaman kaydırıcısının altında OHM etiketli bir bağlantı.
          title: Bir web sayfasında OpenHistoricalMap'in nasıl nitelendirileceğine dair örnek
        contributors_footer_2_html: |-
          Verilerin OpenHistoricalMap'e dahil edilmesi, orijinal veri sağlayıcının OpenHistoricalMap'i onayladığını, herhangi bir garanti verdiğini ya da
          herhangi bir yükümlülüğü kabul ettiğini ima etmez.
        contributors_intro_html: |-
          OpenHistoricalMap, binlerce kişi ve kuruluşun ortak çalışmasıdır ve bu
          kişiler de geniş bir akademik birikim, gazetecilik ve kayıt tutma
          birikiminden yararlanmaktadır.
          En önemli kaynaklarımız ve katkıda bulunanlarımız şunlardır:
        contributors_title_html: Onaylamalar
        credit_1_html: 'OpenHistoricalMap verilerini kullandığınız yerde aşağıdaki iki şeyi yapmanız gerekiyor:'
        credit_2_home: ana sayfamız
        credit_2_this_copyright_page: bu telif hakkı sayfası
        credit_title_html: OpenHistoricalMap'e nasıl atıfta bulunulur
        infringement_1_html: OHM'ye katkıda bulunanların telif hakkı sahiplerinin açık izni olmadan telif hakkıyla korunan kaynaklardan (ör. Google Haritalar veya basılı haritalar) hiçbir zaman veri eklememeleri hatırlatılır.
        introduction_2_cc_by_url: https://creativecommons.org/licenses/by/4.0/
        introduction_4_creative_commons: Creative Commons Attribution-ShareAlike 2.0
        more_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/License
        more_2_1_api_usage_policy: API Kullanım Politikası
        more_2_1_api_usage_policy_url: https://operations.osmfoundation.org/policies/api/
        more_2_1_html: |-
