          ücretsiz bir harita API'si veya harita döşemeleri sağlayamıyoruz. %{api_usage_policy_link}, %{tile_usage_policy_link} ve %{nominatim_usage_policy_link} sayfalarına bakınız.
        more_2_1_nominatim_usage_policy: İsmen Kullanım Politikası
        more_2_1_tile_usage_policy: Karo Kullanım Politikası
        more_2_1_tile_usage_policy_url: https://operations.osmfoundation.org/policies/tiles/
        more_title_html: Daha fazlasını öğrenin
