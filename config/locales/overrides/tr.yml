            Harita verilerinde bir sorun fark ettiyseniz, örneğin bir yol veya adresinizin eksik olması gibi,
            devam etmenin en iyi yolu OpenHistoricalMap topluluğuna katılmak ve verileri kendiniz eklemeniz veya düzeltmenizdir.
      other_concerns:
        contact: bize ulaşın
