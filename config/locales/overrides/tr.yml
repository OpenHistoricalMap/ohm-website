    about:
      lede_text: OpenHistoricalMap; tüm dünyada yollar, patikalar, kafeler, tren istasyonları
        ve çok daha fazlası hakkında veri sağlayan ve bunları koruyan bir haritacılar
        topluluğu tarafından oluşturulmuştur.
      used_by_html: '%{name} ile dünyayı herhangi bir zaman diliminde keşfedin.'
    about_section:
      contribute_1_forum: tartışma forumumuz
      contribute_1_user_diaries: kullanıcı günlükleri
      contribute_1_wiki: kapsamlı viki kayıtlarımız
      contribute_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap
      contribute_2_create_account: ücretsiz hesap oluşturma
      contribute_title: Yardım Edebilirsiniz
      legal_1_aup: Kabul Edilebilir Kullanım Politikaları
      legal_1_group: gayri-resmi bir grup
      legal_1_html: Bu site ve diğer birçok ilgili hizmet, topluluk adına %{group_link}
        tarafından resmî olarak işletilmektedir. OSMF tarafından işletilen tüm hizmetlerin
        kullanımı %{terms_of_use_link}, %{aup_link} ve %{privacy_policy_link}na tabidir.
      legal_1_privacy_policy: Gizlilik Politikası
      legal_1_terms_of_use: Kullanım Şartları
      legal_2_contact_team: OpenHistoricalMap ekibiyle iletişime geçin
      legal_2_html: Lisanslama, telif hakkı veya diğer yasal sorularınız varsa lütfen
        %{contact_team_link}
      open_data_1_1_reuse: yeniden kullanıma uygun
      open_data_2_copyright_license: Telif Hakkı ve Teşekkürler
      open_data_2_html: |-
        Aksi belirtilmedikçe verilerimiz herkese açıktır.
        Herhangi bir kısıtlama olmaksızın, dilediğiniz amaçla kullanabilirsiniz.
        Bununla birlikte, OpenHistoricalMap'e yapacağınız her türlü atıf veya kaynak gösterimi için minnettarız.
        Daha fazla ayrıntı ve teşekkürler için %{copyright_license_link} adresine bakın.
      scope_html: İmparatorluklar yükselir ve düşer. Buzullar erir. Diller ve dinler
        bir bölgeden diğerine yayılır. Basit toprak yollar işlek otoyollara ve demiryollarına
        dönüşür. Mütevazı binalar yerini yükselen gökdelenlere bırakır, siz, mahallenizin
        eskiden nasıl göründüğünü hatırlarsınız; OpenHistoricalMap ise  hepsini.
      scope_title: Büyük ve Küçük, O Zaman ve Şimdi
    add_a_note:
      para_1: |-
        Küçük bir değişikliğin sabit kalmasını istiyor fakat üye olacak ve
        nasıl düzenleneceğini öğrenecek zamanınız yoksa
        not eklemeniz yeterlidir.
    any_questions:
      ohm_paragraph_1_html: OpenHistoricalMap'in; proje hakkında bilgi edinmek, soru
        sormak ve yanıtlamak ve haritalama konularını iş birliği içinde tartışmak
        ve belgelemek için çeşitli kaynakları vardır. %{help_link}.
    copyright:
      legal_babble:
        attribution_example:
          alt: Bir web sayfasının sağ alt köşesinde, zaman kaydırıcısının altında
            OHM etiketli bir bağlantı.
          title: Bir web sayfasında OpenHistoricalMap'in nasıl nitelendirileceğine
            dair örnek
        contributors_footer_2_html: |-
          Verilerin OpenHistoricalMap'e dahil edilmesi, orijinal veri sağlayıcının OpenHistoricalMap'i onayladığını, herhangi bir garanti verdiğini ya da
          herhangi bir yükümlülüğü kabul ettiğini ima etmez.
        contributors_intro_html: |-
          OpenHistoricalMap, binlerce kişi ve kuruluşun ortak çalışmasıdır ve bu
          kişiler de geniş bir akademik birikim, gazetecilik ve kayıt tutma
          birikiminden yararlanmaktadır.
          En önemli kaynaklarımız ve katkıda bulunanlarımız şunlardır:
        contributors_title_html: Onaylamalar
        credit_1_html: 'OpenHistoricalMap verilerini kullandığınız yerde aşağıdaki
          iki şeyi yapmanız gerekiyor:'
        credit_2_home: ana sayfamız
        credit_2_this_copyright_page: bu telif hakkı sayfası
        credit_title_html: OpenHistoricalMap'e nasıl atıfta bulunulur
        infringement_1_html: OHM'ye katkıda bulunanların telif hakkı sahiplerinin
          açık izni olmadan telif hakkıyla korunan kaynaklardan (ör. Google Haritalar
          veya basılı haritalar) hiçbir zaman veri eklememeleri hatırlatılır.
        introduction_4_creative_commons: Creative Commons Attribution-ShareAlike 2.0
        more_1_wiki_url: https://wiki.openstreetmap.org/wiki/OpenHistoricalMap/License
        more_title_html: Daha fazlasını öğrenin
      title: Telif Hakkı ve Onaylar
