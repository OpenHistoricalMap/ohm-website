      lede_text: OpenHistoricalMap je izgradila zajednica kartografa koji donose i održavaju podatke o cestama, stazama, kafićima, željezničkim postajama i još mnogo čemu drugom diljem cijelog svijeta.
      used_by_html: "%{name} snabdijeva geografskim podacima tisuće internetskih stranica, mobilnih aplikacija i uređaja"
    add_a_note:
      para_1: Ako želiš samo napraviti malu doradu i nemaš vremena za registraciju i učenje pravila uređivanja, možeš jednostavno dodati bilješku na kartu.
    copyright:
      legal_babble:
        contributors_footer_2_html: Uvrštavanje podataka u OpenHistoricalMap ne podrazumijeva da izvorni davatelj podataka podržava OpenHistoricalMap, pruža bilo kakvo jamstvo, ili prihvaća bilo kakve obveze.
        contributors_intro_html: 'Sudionici projekta su tisuće individualaca. Projekt također uključuje podatke pod slobodnim licencama od nacionalnih kartografskih agencija i drugih izvora, među kojima su:'
        credit_1_html: 'Tamo gdje koristite OpenHistoricalMap podatke, morate učiniti sljedeće dvije stvari:'
        credit_title_html: Kako iskazati zasluge OpenHistoricalMap-a
        infringement_1_html: Suradnike OHM-a podsjećamo da nikada ne dodaju podatke iz bilo kakvih izvora zaštićenih autorskim pravima (npr. Google karte ili tiskane karte) bez izričitog dopuštenja nositelja autorskih prava.
        more_title_html: Saznaj više
      title: Autorska prava i Dozvola
    export:
      too_large:
        body: Ovo područje je preveliko da bi se izvezlo u OpenHistoricalMap XML formatu. Molim približi prikaz ili odaberi manje područje ili odaberi jedan od izvora navedenih ispod za preuzimanje velike količine podataka.
        overpass:
          description: Preuzmi iznad odabrano granično područje sa drugog servera na kojem je identična kopija baze podataka OpenHistoricalMap-a
