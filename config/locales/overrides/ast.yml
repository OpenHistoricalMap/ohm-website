    intro_header: "¡Afáyate n'OpenHistoricalMap!"
    intro_text: OpenHistoricalMap ye un mapa del mundu, creáu por persones como tu y d'usu llibre baxo una llicencia abierta.
    logo:
      alt_text: Logo d'OpenHistoricalMap
    logout: Salir
    tag_line: El Wiki Mapamundi llibre
