      heading: Colar d'OpenHistoricalMap
  site:
    about:
      lede_text: OpenHistoricalMap ta construíu por una comunidá de cartógrafos que contribuyen y caltienen datos de carreteres, senderos, cafeteríes, estaciones de ferrocarril, y muncho más, pel mundu enteru.
    copyright:
      legal_babble:
        contributors_footer_2_html: La inclusión de datos n'OpenHistoricalMap nun significa que'l fornidor de los datos orixinales sofite OpenHistoricalMap, ufra garantía dala o aceute dalguna responsabilidá.
        credit_1_html: Riquimos qu'uses el créditu &ldquo;&copy; Collaboradores d'OpenHistoricalMap&rdquo;.
        credit_title_html: Cómo dar reconocimientu a OpenHistoricalMap
        infringement_1_html: Recordamos a los collaboradores d'OHM qu'enxamás amiesten datos que vengan d'una fonte con drechos d'autor acutaos (p. ex. de Google Maps o mapes impresos) ensin el permisu esplícitu de los dueños de los drechos d'autor.
        more_title_html: Pa saber más
    export:
      too_large:
        body: Esti área ye abondo grande pa esportase como Datos XML d'OpenHistoricalMap. Acerca'l mapa o esbilla un área menor, o usa una de les fontes siguientes pa descargar cantidaes grandes de datos.
        overpass:
          description: Descargar esti cuadru de llendes dende un espeyu de la base de datos d'OpenHistoricalMap
        planet:
          description: Copies anovaes regularmente de la base de datos completa d'OpenHistoricalMap
          title: Planeta OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Namái faiga clic en %{note_icon} o nel mesmu iconu na vista del mapa.
            Esto pondrá un marcador nel mapa, que puede mover
            abasnando. Escriba'l so mensaxe, faiga clic en guardar, y otros mapeadores investigarán.
        join_the_community:
          explanation_html: Si atopó un problema colos datos del nuesu mapa; por exemplu una carretera que falta, o la so direición, lo meyor que pue facer ye xunise a la comunidá d'OpenHistoricalMap y amestar o reparar los datos vusté mesmu.
    help:
      introduction: OpenHistoricalMap tien dellos recursos p'aprender sobro'l proyeutu, entrugar y contestar preguntes, y discutir y documentar en collaboración cuestiones de cartografía.
      slack:
        title: IRC
      welcome:
        description: Principie con esta guía rápida que cubre lo básico d'OpenHistoricalMap.
        title: Bienveníos a OpenHistoricalMap
      wiki:
        description: Mirar na wiki la documentación d'OHM más a fondu.
    index:
      js_2: OpenHistoricalMap usa JavaScript pal so mapa eslizante.
      remote_failed: Falló la edición - asegúrate de tener cargáu JOSM o Merkaartor y de que tea activada la opción de control remotu
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap tien cierta xíriga de so. Estes son delles pallabres importantes que puen ser afayadices.
      introduction: |-
        Afáyate n'OpenHistoricalMap, el mapa del mundu llibre y editable. Agora
        qu'aniciasti sesión, yá puedes editar mapes. Esta ye una guía rápida
        de les coses más importantes que necesites saber.
      rules:
        para_1_html: OpenHistoricalMap tien poques regles formales, pero esperamos que tolos participantes collaboren y se comuniquen cola comunidá. Si tas considerando cualquier actividá distinta de la edición manual, llei y sigui les instrucciones sobro %{imports_link} y %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: |-
          Lo que %{doesnt} incluye son datos suxetivos como calificaciones, carauterístiques históriques o hipotétiques, y datos de fontes con drechos d'autor. Si nun tienes
          un permisu especial, nun copies de mapes en llinia o en papel.
