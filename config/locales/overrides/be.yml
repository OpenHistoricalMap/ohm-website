    index:
      js_2: OpenHistoricalMap выкарыстоўвае JavaScript для адлюстравання карты на
        сайце.
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap мае свой ​​уласны жаргон. Вось некалькі ключавых
          слоў, якія могуць быць карыснымі.
      introduction: Вітаем у OpenHistoricalMap, свабоднай і даступнай для рэдагавання
        карце свету. Зараз, калі вы ўвайшлі, усё гатова для пачатку рэдагавання. Вось
        кароткае кіраўніцтва па найважнейшым рэчам, якія вы павінны ведаць.
      rules:
        para_1_html: У OpenHistoricalMap есьць некалькі фармальных правілаў, але мы
          чакаем, што ўсе ўдзельнікі будуць супрацоўнічаць і мець зносіны з супольнасцю.
          Калі вы плануеце нейкія дзеянні, па-за рэдагаваннем ўручную, калі ласка,
          прачытайце і выконвайце рэкамендацыі па %{imports_link} і %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Карта %{doesnt} ўключае суб'ектыўныя дадзеныя накшталт ацэнак,
          гістарычных або гіпатэтычных характарыстык і дадзеныя з крыніц, якія абаронены
          аўтарскім правам. Калі вы не маеце спецыяльнага дазволу, не капіюйце з папяровых
          карт або карт у Інтэрнэце.
