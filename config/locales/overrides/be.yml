  site:
    about:
      lede_text: OpenHistoricalMap створаны супольнасцю картографаў, якія дадаюць і падтрымліваюць даныя аб дарогах, сцежках, кафэ, вакзалах і многіх іншых аб'ектах па ўсім свеце.
    about_section:
      contribute_1_user_diaries: дзённікі карыстальнікаў
      legal_1_privacy_policy: Палітыка прыватнасці
      legal_1_terms_of_use: Умовы карыстання
      legal_2_html: Калі ласка, %{contact_team_link}, калі ў вас ёсць пытанні адносна ліцэнзавання, аўтарскіх правоў або іншых юрыдычных пытаннях.
    communities:
      lede_text: |-
        Людзі з усяго свету ўносяць свой уклад у OpenHistoricalMap або выкарыстоўваюць яго.
        Многія ўдзельнічаюць паасобку, іншыя стварылі свае супольнасці. Супольнасці бываюць розных памераў і могуць прадстаўляць як невялікія гарады, так і цэлыя рэгіёны з некалькімі краінамі. Яны таксама могуць быць афіцыйнымі і неафіцыйнымі.
    copyright:
      legal_babble:
        contributors_footer_2_html: |-
          Уключэнне даных у OpenHistoricalMap не азначае, што пастаўшчыкі пачатковых даных
          якім-небудзь чынам падтрымліваюць OpenHistoricalMap, прадстаўляюць гарантыі, ці
          прымаюць на сябе якую-небудзь адказнасць.
        credit_1_html: 'Там, дзе вы выкарыстоўваеце даныя OpenHistoricalMap, вы павінны выканаць наступныя дзве рэчы:'
        credit_2_this_copyright_page: гэтую старонку
        credit_title_html: Як спасылацца на OpenHistoricalMap
        infringement_1_html: Удзельнікі супольнасці OHM павінны заўсёды памятаць пра тое, што забараняецца дадаваць даныя з любых абароненых аўтарскім правам крыніц (напрыклад, з Google Maps або з друкаваных карт) без дазволу праваўладальнікаў.
        introduction_4_creative_commons: Creative Commons Attribution-ShareAlike 2.0
        more_title_html: Даведацца больш
    export:
      too_large:
        body: Гэтая вобласць занадта вялікая, каб быць экспартаванай у фармаце OpenHistoricalMap XML. Калі ласка, павялічце або абярыце меншую вобласць, альбо скарыстайцеся адной з крыніц, пералічаных ніжэй, для загрузкі вялікага аб'ему даных.
        overpass:
          description: Спампаваць абмежаваную гэтым прастакутнікам вобласць з люстэрка базы даных OpenHistoricalMap
        planet:
          description: Рэгулярна абнаўляемыя копіі поўнай базы даных OpenHistoricalMap
          title: Планета OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: "Проста націсніце %{note_icon} або падобны значок на карце. \nУ выніку на карце з'явіцца маркер, які вы зможаце перамяшчаць шляхам перацягвання. Дадайце ваша паведамленне, націсніце кнопку Захаваць і іншыя ўдзельнікі змогуць гэта убачыць."
        join_the_community:
          explanation_html: Калі вы заўважылі недакладнасці ў нашых картаграфічных даных, напрыклад, калі не пазначана дарога ці ваш адрас, лепшы спосаб гэта выправіць - далучыцца да супольнасці OpenHistoricalMap і дадаць або выправіць даныя самастойна.
    help:
      introduction: OpenHistoricalMap мае розныя рэсурсы для атрымання інфармацыі аб праекце, для задавання пытанняў і атрымання адказаў, для сумеснага абмеркавання і стварэння дакументацыі па картаграфаванні.
      slack:
        title: IRC
      welcome:
        description: Пачніце з гэтага кароткага кіраўніцтва, што ахоплівае асновы OpenHistoricalMap.
        title: Вітаем у OpenHistoricalMap
      wiki:
        description: Паглядзець вікі з падрабязнай дакументацыяй па OHM
        title: Вікі
    index:
      js_2: OpenHistoricalMap выкарыстоўвае JavaScript для адлюстравання карты на сайце.
      remote_failed: Памылка рэдагавання. Упэўніцеся, што JOSM ці Merkaartor загружаныя і дазволеная магчымасць аддаленага кіравання
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap мае свой ​​уласны жаргон. Вось некалькі ключавых слоў, якія могуць быць карыснымі.
      introduction: Вітаем у OpenHistoricalMap, свабоднай і даступнай для рэдагавання карце свету. Зараз, калі вы ўвайшлі, усё гатова для пачатку рэдагавання. Вось кароткае кіраўніцтва па найважнейшым рэчам, якія вы павінны ведаць.
      rules:
        para_1_html: У OpenHistoricalMap есьць некалькі фармальных правілаў, але мы чакаем, што ўсе ўдзельнікі будуць супрацоўнічаць і мець зносіны з супольнасцю. Калі вы плануеце нейкія дзеянні, па-за рэдагаваннем ўручную, калі ласка, прачытайце і выконвайце рэкамендацыі па %{imports_link} і %{automated_edits_link}.
      whats_on_the_map:
        off_the_map_html: Карта %{doesnt} ўключае суб'ектыўныя дадзеныя накшталт ацэнак, гістарычных або гіпатэтычных характарыстык і дадзеныя з крыніц, якія абаронены аўтарскім правам. Калі вы не маеце спецыяльнага дазволу, не капіюйце з папяровых карт або карт у Інтэрнэце.
