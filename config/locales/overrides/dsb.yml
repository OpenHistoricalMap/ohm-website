  site:
    about:
      lede_text: OpenHistoricalMap twóri se wót zgromaźeństwa kartěrowarjow, kótarež pśinosuju a woplěwaju daty wó drogach, puśach, kafejownjach, dwórnišćach a wjele wěcej na cełem swěśe.
    copyright:
      legal_babble:
        contributors_footer_2_html: Zapśimowanje datow do OpenHistoricalMap njegroni, až póbitowaŕ originalnych datow pśipóznawa OpenHistoricalMap, dawa někaku garantiju abo pśewzejo rukowanje.
        credit_1_html: Pominamy se, až  pódawaš sobustatkujucych &ldquo;&copy; OpenHistoricalMap&rdquo;.
        credit_title_html: Kak naspomnjeś awtorstwo OpenHistoricalMap
        infringement_1_html: Sobustatkujucych OHM napominamy, až njedodawaju nigda daty ze žrědłow, kótarež su pśez awtorske pšawo šćitane (na pś. z Google Maps abo z wuśišćanych kórtow) bźez wurazneje dowólnosći awtorow.
        more_title_html: Dalšne informacije
    export:
      too_large:
        body: 'Toś ten wobcerk jo pśewjeliki za eksportěrowanje ako XML-daty OpenHistoricalMap. Pšosym pówětš abo wubjeŕ mjeńšy wobcerk abo wužyj jadno ze slědujucych žrědłow za ześěgnjenje wjelikich kopicow datow:'
        overpass:
          description: Toś ten wobłuk z glědałkowego serwera datoweje banki OpenHistoricalMap ześěgnuś
        planet:
          description: Pšawidłownje zaktualizěrowane kopije dopołneje datoweje banki OpenHistoricalMap
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: |-
            Klikni jadnorje na %{note_icon} abo na ten samski symbol w zwobraznjenju kórty.
            To pśidajo kórśe marku, kótaruž móžoš pśez śěgnjenje pśesunuś.
            Pśidaj swóju powěsć, klikni pon na Składowaś a druge kartěrowarje budu pó tom slěźiś.
        join_the_community:
          explanation_html: Jolic sy problem z našymi kórtowymi datami zawuputnuł, na pśikład droga abo twója adresa felujo, jo nejlěpša wašnja, z tym pókšacowaś, se zgromaźeństwoju OpenHistoricalMap pśizamknuś a sam daty pśidaś abo korigěrowaś.
    help:
      introduction: OpenHistoricalMap ma wšake resurse za zeznaśe projekta, pšašanja a wótegrona wó něcom a zgromadnu diskusiju a dokumentěrowanje kartěrowańskich temow.
      welcome:
        description: Zachop z toś tym spěšnym rozpokazanim, kótarež wopsímujo zakłady OpenHistoricalMap.
        title: Witaj k OpenHistoricalMap
      wiki:
        description: Pśepytaj wiki za nadrobneju OHM-dokumentaciju
    index:
      js_2: OpenHistoricalMap wužywa JavaScript za suwatu kórtu.
      remote_failed: Wobźěłowanje njejo se raźiło - pśeznań se, lěc JOSM jo zacytany a opcija zdalokawóźenje jo zmóžnjona
    welcome:
      basic_terms:
        paragraph_1: OpenHistoricalMap wužywa někotare wósebne zapśimjeśa. How su někotare z nich, kótarež by mógli śi wužytne byś.
      introduction: Witaj k OpenHistoricalMap, lichej a wobźěłujobnej kórśe swěta. Něnto, za tym až sy se zregistrěrował, móžoš se do kartěrowanja pušćiś. How jo krotke zapokazanje z nejwažnjejšymi informacijami, kótarež musyš wěźeś.
      whats_on_the_map:
        off_the_map_html: Což %{doesnt}ma wopśimjeś, su subjektiwne daty kaž pogódnośenja, historiske abo hypotetiske funkcije a daty z pśez awtorske pšawo šćitanych žrědłow. Njekopěruj z online- abo papjernych kórtow, snaźkuli maš wósebnu dowólnosć.
