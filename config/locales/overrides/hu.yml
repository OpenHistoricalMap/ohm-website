  site:
    about:
      lede_text: Az OpenHistoricalMapet egy térképszerkesztő-közösség építi, akik hozzáadnak és karbantartanak adatokat világszerte utakról, ösvényekről, kávézókról, vasútállomásokról és még sok mindenről.
    about_section:
      contribute_1_user_diaries: felhasználók naplói
      legal_1_aup: Elfogadható felhasználási szabályzat
      legal_1_html: 'Ezt a webhelyet és sok más kapcsolódó szolgáltatást hivatalosan az %{group_link} üzemelteti a közösség nevében. Az összes OSMF által üzemeltetett szolgáltatás igénybevételére irányadók a következők: %{terms_of_use_link}, %{aup_link} és %{privacy_policy_link}.'
      legal_1_privacy_policy: Adatvédelmi irányelvek
      legal_1_terms_of_use: Felhasználási feltételek
      legal_2_html: Kérjük, %{contact_team_link}, ha licencekkel kapcsolatos, szerzői jogi vagy egyéb jogi kérdései vannak.
    communities:
      lede_text: Az emberek a világ minden tájáról szerkesztik vagy használják az OpenHistoricalMap nyújtotta lehetőségeket. Eközben sokak magánszemélyként, míg mások közösségként vesznek ebben részt. Ezek a csoportok különböző méretűek, és különböző földrajzi területeket képviselnek a kisvárosoktól a nagy, több országon átívelő régiókig. Lehetnek formálisak vagy informálisak.
    copyright:
      legal_babble:
        attribution_example:
          title: Példa egy hivatkozásra
        contributors_footer_2_html: Az adatok befoglalása az OpenHistoricalMapbe nem jelenti azt, hogy az eredeti adatszolgáltató támogatja az OpenHistoricalMapet, garanciát nyújt vagy felelősséget vállal rá.
        contributors_intro_html: 'Több ezer egyéni közreműködőnk van. További, szabadon elérhető adatokat is felhasználunk nemzeti térkép intézetektől és más forrásokból, többek között:'
        contributors_title_html: Köszönetnyilvánítás
        credit_1_html: 'Ahol az OpenHistoricalMap adatait használod, ott kérjük, tüntesd fel az alább felsoroltakat:'
        credit_2_this_copyright_page: erre a szerzői jogi oldalra
        credit_title_html: Hogyan kell feltüntetned az OpenHistoricalMapet?
        infringement_1_html: Az OHM közreműködői emlékeztetve lettek arra, hogy soha ne adjanak hozzá adatokat egyetlen szerzői jogvédett forrásból se (pl. Google Térkép vagy nyomtatott térképek) a szerzői jog tulajdonosának kifejezett engedélye nélkül.
        introduction_4_creative_commons: Creative Commons „Nevezd meg! – Így add tovább!” 2.0
        introduction_4_creative_commons_url: https://creativecommons.org/licenses/by-sa/2.0/deed.hu
        more_2_1_api_usage_policy: API-felhasználási irányelvek
        more_2_1_html: 'Bár az OpenHistoricalMap nyílt adat, harmadik feleknek nem tudunk ingyenes térkép-API-t biztosítani. A részleteket megtekintheted a következő oldalakon: %{api_usage_policy_link}, %{tile_usage_policy_link} és %{nominatim_usage_policy_link}.'
        more_2_1_nominatim_usage_policy: a Nominatim felhasználási irányelvei
        more_2_1_tile_usage_policy: csempefelhasználási irányelvek
        more_title_html: Tudj meg többet!
      title: Szerzői jog és licenc
    export:
      too_large:
        body: Ez a terület túl nagy ahhoz, hogy OpenHistoricalMap XML adatként exportálni lehessen. Közelíts, vagy jelölj ki kisebb területet. Esetleg az alábbi listából használd valamelyik nagy adatmennyiség letöltését támogató módszert.
        overpass:
          description: A megjelenített befoglaló keret letöltése egy OpenHistoricalMap tükörszerverről
        planet:
          description: A teljes OpenHistoricalMap adatbázis rendszeresen frissített másolatai
          title: Planet OHM
    fixthemap:
      how_to_help:
        add_a_note:
          instructions_1_html: Csak kattints a %{note_icon} ikonra vagy ugyanerre az ikonra a térképmegjelenítőben. Ez felrak egy helyjelölőt a térképre, amelyet húzással mozgathatsz. Írj hozzá egy üzenetet, majd kattints a mentésre, és a többi térképész meg fogja vizsgálni.
        join_the_community:
          explanation_html: Ha bármilyen hibát találtál a térképadatokban, például hiányzik egy út vagy cím, a legjobb, ha csatlakozol az OpenHistoricalMap közösséghez és kijavítod az adatot saját magad.
    help:
      introduction: Az OpenHistoricalMap számos anyagot kínál fel ahhoz, hogy ismerkedj a projekttel, kérdéseket tégy fel vagy válaszolj meg, vagy térképezési témákat beszélj meg a közösség tagjaival.
      slack:
        title: IRC
      welcome:
        description: Ez a gyors útmutató megismertet az OpenHistoricalMap alapjaival.
        title: Üdvözlünk az OpenHistoricalMapen
      wiki:
        description: Böngészd a wikit mélyreható OHM dokumentációért.
    index:
      js_2: Az OpenHistoricalMap JavaScriptet használ a slippy maphoz.
      remote_failed: A szerkesztés nem sikerült. Győződj meg róla, hogy a JOSM vagy a Merkaartor be van töltve, és a távirányító opció engedélyezve van
    potlatch:
      removed: Az alapértelmezett OpenHistoricalMap szerkesztőd a Potlatch. Mivel az Adobe Flash Playert visszavonták, ezért webböngészőben már nem futtatható.
    welcome:
      introduction: Üdvözöl az OpenHistoricalMap - a szabad és szerkeszthető világtérkép - közössége. Most, hogy regisztráltál, máris elkezdheted a térképezést. Itt elérhető egy gyors összefoglaló a legfontosabb tudnivalókkal.
      rules:
        para_1_html: Az OpenHistoricalMapnek kevés hivatalos szabálya van, de minden résztvevőtől elvárjuk, hogy együttműködjék a közösséggel, és kommunikáljon vele. Ha a kézi szerkesztésen kívül bármilyen más tevékenységet fontolgatsz, kérjük, olvasd el és kövesd az %{imports_link} és %{automated_edits_link} irányelveit.
